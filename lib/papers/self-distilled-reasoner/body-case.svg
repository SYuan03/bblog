<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="816" viewBox="0 0 1050 816" role="img" aria-labelledby="title"><title id="title">Figure 2 的真实输入示例：导数代入得到 14</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="816" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">Figure 2 的真实输入示例：导数代入得到 14</tspan></text><text x="38" y="116.69999999999999" fill="#465363" font-size="25" font-weight="400"><tspan x="38" dy="0">这是 prompt 构造示例，不是 benchmark 逐题成绩日志。</tspan></text><rect x="38" y="153.2" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="181.2" r="18" fill="#245e99"/><text x="69" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">student 看到问题</tspan></text><text x="60" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">求 f(x)=3x²+2x−5 的导数，再计</tspan><tspan x="60" dy="35.5">算 x=2 处的导数值。</tspan></text><rect x="549" y="153.2" width="463" height="167.34" rx="6" fill="#f1f7f5" stroke="#dce2e8"/><circle cx="580" cy="181.2" r="18" fill="#317e6a"/><text x="580" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">参考解答给计算步骤</tspan></text><text x="571" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">f′(x)=6x+2，所以 f′(2)</tspan><tspan x="571" dy="35.5">=6×2+2=14。</tspan></text><path d="M507 236.87h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 236.87h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="358.53999999999996" width="463" height="238.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="386.53999999999996" r="18" fill="#245e99"/><text x="69" y="393.53999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="392.53999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">teacher 多看参考解答</tspan></text><text x="60" y="438.87999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">参考解答与过渡指令只供 teacher</tspan><tspan x="60" dy="35.5">计算 student 当前前缀后的概率。</tspan></text><rect x="549" y="358.53999999999996" width="463" height="238.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="386.53999999999996" r="18" fill="#245e99"/><text x="580" y="393.53999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="392.53999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">不要混淆训练预算</tspan></text><text x="571" y="438.87999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">主训练每题 1 条、最长 1,024</tspan><tspan x="571" dy="35.5">tokens、最多 100 更新；GRPO 对</tspan><tspan x="571" dy="35.5">照 8 条、16,384 tokens、500 更</tspan><tspan x="571" dy="35.5">新。</tspan></text><path d="M507 477.71h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="634.88" width="974" height="104" fill="#fff" stroke="#dce2e8"/><path d="M38 634.88v104" stroke="#a96238" stroke-width="5"/><text x="55" y="660.88" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">评测另有 12 次、最长 38K token 的预算。参考解答不是 teacher 重新生成的答</tspan><tspan x="55" dy="35.5">案，不能称所有实验同成本。</tspan></text><path d="M38 755.88h974" stroke="#dce2e8"/><text x="38" y="780.88" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 Figure 2 与主训练 / 评测设置重绘；导数计算经本文核对。</tspan></text></g></svg>
