<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="823" viewBox="0 0 1050 823" role="img" aria-labelledby="title"><title id="title">OPCD：student 生成，teacher 读经验重评同一回答</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="823" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">OPCD：student 生成，teacher 读经验重评同一回答</tspan></text><rect x="38" y="115.69999999999999" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="143.7" r="18" fill="#245e99"/><text x="69" y="150.7" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="149.7" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">student 不带经验生成</tspan></text><text x="60" y="196.04" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">只读任务或当前历史，产生一次尝试</tspan><tspan x="60" dy="35.5">y。</tspan></text><rect x="549" y="115.69999999999999" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="143.7" r="18" fill="#245e99"/><text x="580" y="150.7" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="149.7" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">保存当前回答前缀</tspan></text><text x="571" y="196.04" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">把 y 固定下来，保持两分支评价的位</tspan><tspan x="571" dy="35.5">置一致。</tspan></text><path d="M507 199.37h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 199.37h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="321.03999999999996" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="349.03999999999996" r="18" fill="#245e99"/><text x="69" y="356.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="355.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">构造带经验的输入</tspan></text><text x="60" y="401.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">student 仍读任务；teacher 额外</tspan><tspan x="60" dy="35.5">读经验 c。</tspan></text><rect x="549" y="321.03999999999996" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="349.03999999999996" r="18" fill="#245e99"/><text x="580" y="356.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="355.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">批量计算两份概率</tspan></text><text x="571" y="401.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">相同位置得到 student 的 p 与</tspan><tspan x="571" dy="35.5">teacher 的 q，不换成 teacher 新</tspan><tspan x="571" dy="35.5">答案。</tspan></text><path d="M507 422.46h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 422.46h16v115.42H21v127.42h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="561.88" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="589.88" r="18" fill="#245e99"/><text x="69" y="596.88" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">5</text><text x="107" y="595.88" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">算 reverse KL：p‖q</tspan></text><text x="60" y="642.22" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">训练参照是 teacher 的下一词概率；</tspan><tspan x="60" dy="35.5">环境成败仍需另判。</tspan></text><rect x="549" y="561.88" width="463" height="167.34" rx="6" fill="#f1f7f5" stroke="#dce2e8"/><circle cx="580" cy="589.88" r="18" fill="#317e6a"/><text x="580" y="596.88" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">6</text><text x="618" y="595.88" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">只更新 student</tspan></text><text x="571" y="642.22" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">主实验 teacher 参数冻结；部署时</tspan><tspan x="571" dy="35.5">不读取经验。</tspan></text><path d="M507 645.55h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M38 762.22h974" stroke="#dce2e8"/><text x="38" y="787.22" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 v2 Figure 1 与 Algorithm 1 重绘。</tspan></text></g></svg>
