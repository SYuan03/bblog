<g font-size="24"><text x="54" y="214" font-weight="600">Table 1 · Math 主测试</text><text x="54" y="250" fill="#536171">Qwen3-8B</text><text x="374" y="228">75.0 → 79.7 ± 0.5%</text><text x="724" y="214" fill="#536171">随机选择三份经验</text><text x="724" y="250" fill="#536171">± 的类型未说明</text>
<text x="54" y="304" font-weight="600">Table 1 · Frozen Lake</text><text x="54" y="340" fill="#536171">Qwen3-1.7B 主测试</text><text x="374" y="318">6.3 → 26.5 ± 6.4%</text><text x="724" y="304" fill="#536171">同组随机经验比较</text><text x="724" y="340" fill="#536171">测试时不查经验</text>
<text x="54" y="397" font-weight="600">Table 6 · Math 验证</text><text x="54" y="435" fill="#536171">积累至十步期间的平均</text><text x="374" y="414">75.1 / 70.5 / 77.4%</text><text x="724" y="397" fill="#536171">无经验 / 原始记录</text><text x="724" y="435" fill="#536171">/ 总结经验</text>
<text x="54" y="490" font-weight="600">Table 5 · Sokoban</text><text x="54" y="526" fill="#536171">teacher 更新方式消融</text><text x="374" y="505">53.9 / 18.8%</text><text x="724" y="490" fill="#536171">冻结 teacher</text><text x="724" y="526" fill="#536171">/ 两分支共同更新</text></g>
<rect x="38" y="572" width="974" height="116" rx="4" fill="#f5f7f9" stroke="#dce2e8"/>
<g font-size="24" fill="#536171"><text x="55" y="605">验证后选经验（Table 2）：Math 80.9%，Frozen Lake 38.3%，Sokoban 53.9%。</text><text x="55" y="643">经验实验每两次更新保存并选择最高测试成绩，存在 checkpoint 选择偏差。</text><text x="55" y="678">Table 6 不是第十步的终点分，也不是蒸馏后主测试。</text></g>
