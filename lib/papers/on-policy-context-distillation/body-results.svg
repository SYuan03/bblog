<title id="title">OPCD：主测试、验证平均与 teacher 消融分开读</title>
<desc id="desc">Table 1 使用三份积累到第十步的经验；Table 6 是积累至十步期间的验证平均，不是第十步终点。Table 5 比较冻结与共同更新的 teacher。</desc>
<rect width="1050" height="760" fill="#fff"/>
<g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#24292f">
<text x="38" y="60" font-size="34" font-weight="700">主测试、验证平均与 teacher 消融分开读</text>
<text x="38" y="99" font-size="23" fill="#536171">数字的来源、样本和模型不同，不是一条统一测试曲线。</text>
<g stroke="#dce2e8"><rect x="38" y="122" width="974" height="424" fill="#fff"/><rect x="38" y="122" width="974" height="58" fill="#edf2f6"/><rect x="38" y="180" width="974" height="90" fill="#f8fafb"/><rect x="38" y="360" width="974" height="96" fill="#f8fafb"/><path d="M38 180h974 M38 270h974 M38 360h974 M38 456h974 M358 122v424 M708 122v424" fill="none"/></g>
