<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
<title id="title">Sampling SFT 数学新能力与旧能力保持</title><desc id="desc">普通监督微调MATH从0.315降到0.243。采样改写的四个数学测试均分0.534，旧能力保持率0.420除0.422，后接GRPO为0.567。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.title{font-size:33px;font-weight:750}.head{font-size:28px;font-weight:700}.body{font-size:25px;fill:#46545d}.small{font-size:23px;fill:#56646d}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:29px;font-weight:650}</style>
<rect width="1000" height="800" fill="#fff"/>
<text x="40" y="53" class="title">普通 SFT 会退步；改写后，新能力与保持率改善</text>
<text x="40" y="95" class="body">Qwen2.5-3B；单次作答准确率，不是多次作答选最好。</text>
<rect x="40" y="127" width="920" height="118" fill="#fbf3f2" stroke="#d8bfbb"/>
<text x="64" y="170" class="head">MATH(3,4,5) 同分布测试</text>
<text x="64" y="217" class="num">Base 0.315 → 普通 SFT 0.243</text>
<rect x="40" y="272" width="920" height="153" fill="#f1f5f8" stroke="#c4d3dd"/>
<text x="64" y="315" class="head" fill="#245f87">四个数学测试的平均准确率</text>
<text x="64" y="361" class="num">GRPO 0.457 / UFT 0.452 / Sampling SFT 0.534</text>
<text x="64" y="408" class="small">0.534 是四项均分，不是 MATH 单项；后者为 0.495。</text>
<rect x="40" y="452" width="920" height="119" fill="#f2f6f4" stroke="#c6d8cf"/>
<text x="64" y="495" class="head" fill="#356954">旧能力均分：Chemistry、MMLU、GPQA</text>
<text x="64" y="542" class="num">0.420 / 0.422 = 99.5% 保持率</text>
<rect x="40" y="598" width="920" height="117" fill="#f7f8f8" stroke="#ccd4d9"/>
<text x="64" y="641" class="head">Sampling SFT 后再接 GRPO</text>
<text x="64" y="688" class="num">四项数学均分 0.534 → 0.567</text>
<text x="40" y="767" class="small">根据 Table 1 重绘；保持率为本文复算，未报告多训练种子误差。</text>
</svg>
