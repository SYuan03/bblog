<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
  <title id="t">Finetuning with Sampling 跨任务结果</title>
  <desc id="d">Sampling SFT 提升了化学和数学任务，但没有在所有任务或模型上胜出。医疗任务和 Olmo 化学任务都低于同策略自蒸馏基线 OPSD。</desc>
  <rect width="1200" height="650" fill="#fbfbf8"/>
  <text x="70" y="60" font-family="Arial,sans-serif" font-size="18" fill="#69737c">单次作答准确率 · 不同基础模型与任务</text>
  <text x="70" y="108" font-family="Georgia,serif" font-size="36" fill="#172028">化学和数学较强，其他任务结果不一致</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="166" width="505" height="174" fill="#f1f4f3" stroke="#d0d7d9"/>
    <text x="94" y="204" font-size="18" font-weight="700" fill="#172028">Qwen 化学</text>
    <text x="94" y="250" font-size="16" fill="#69737c">SFT / 自蒸馏 OPSD</text><text x="260" y="250" font-size="24" fill="#7b8991">61.8 / 61.8</text>
    <text x="94" y="301" font-size="16" fill="#2f6f98">Sampling SFT</text><text x="260" y="301" font-size="29" font-weight="700" fill="#2f6f98">66.0</text>

    <rect x="625" y="166" width="505" height="174" fill="#f1f4f3" stroke="#d0d7d9"/>
    <text x="649" y="204" font-size="18" font-weight="700" fill="#172028">Qwen 数学平均分</text>
    <text x="649" y="250" font-size="16" fill="#69737c">同策略基线 GRPO / UFT</text><text x="815" y="250" font-size="24" fill="#7b8991">45.7 / 45.2</text>
    <text x="649" y="301" font-size="16" fill="#2f6f98">Sampling SFT</text><text x="815" y="301" font-size="29" font-weight="700" fill="#2f6f98">53.4</text>

    <rect x="70" y="380" width="505" height="174" fill="#f5efea" stroke="#d8c2b3"/>
    <text x="94" y="418" font-size="18" font-weight="700" fill="#172028">Qwen 医疗</text>
    <text x="94" y="464" font-size="16" fill="#b86538">Sampling SFT</text><text x="260" y="464" font-size="24" fill="#b86538">45.8</text>
    <text x="94" y="515" font-size="16" fill="#69737c">自蒸馏 OPSD</text><text x="260" y="515" font-size="29" font-weight="700" fill="#34414a">46.6</text>

    <rect x="625" y="380" width="505" height="174" fill="#f5efea" stroke="#d8c2b3"/>
    <text x="649" y="418" font-size="18" font-weight="700" fill="#172028">Olmo 化学</text>
    <text x="649" y="464" font-size="16" fill="#b86538">Sampling SFT</text><text x="815" y="464" font-size="24" fill="#b86538">58.3</text>
    <text x="649" y="515" font-size="16" fill="#69737c">自蒸馏 OPSD</text><text x="815" y="515" font-size="29" font-weight="700" fill="#34414a">59.7</text>

    <text x="70" y="604" font-size="14" fill="#69737c">来源：论文表 1-2。数值为百分比准确率；论文没有报告多随机种子误差条。</text>
  </g>
</svg>
