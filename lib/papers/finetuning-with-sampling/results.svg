<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
  <title id="t">Finetuning with Sampling results across tasks</title>
  <desc id="d">Sampling SFT improves chemistry and math but does not win every task or model family. Medical performance is below OPSD and Olmo chemistry performance is also below OPSD.</desc>
  <rect width="1200" height="650" fill="#fbfbf8"/>
  <text x="70" y="60" font-family="Arial,sans-serif" font-size="18" fill="#69737c">SINGLE-SHOT ACCURACY · DIFFERENT BASE MODELS AND TASKS</text>
  <text x="70" y="108" font-family="Georgia,serif" font-size="36" fill="#172028">Strong on chemistry and math; mixed elsewhere</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="166" width="505" height="174" fill="#f1f4f3" stroke="#d0d7d9"/>
    <text x="94" y="204" font-size="18" font-weight="700" fill="#172028">Qwen chemistry</text>
    <text x="94" y="250" font-size="16" fill="#69737c">SFT / OPSD</text><text x="260" y="250" font-size="24" fill="#7b8991">61.8 / 61.8</text>
    <text x="94" y="301" font-size="16" fill="#2f6f98">Sampling SFT</text><text x="260" y="301" font-size="29" font-weight="700" fill="#2f6f98">66.0</text>

    <rect x="625" y="166" width="505" height="174" fill="#f1f4f3" stroke="#d0d7d9"/>
    <text x="649" y="204" font-size="18" font-weight="700" fill="#172028">Qwen math average</text>
    <text x="649" y="250" font-size="16" fill="#69737c">GRPO / UFT</text><text x="815" y="250" font-size="24" fill="#7b8991">45.7 / 45.2</text>
    <text x="649" y="301" font-size="16" fill="#2f6f98">Sampling SFT</text><text x="815" y="301" font-size="29" font-weight="700" fill="#2f6f98">53.4</text>

    <rect x="70" y="380" width="505" height="174" fill="#f5efea" stroke="#d8c2b3"/>
    <text x="94" y="418" font-size="18" font-weight="700" fill="#172028">Qwen medical</text>
    <text x="94" y="464" font-size="16" fill="#b86538">Sampling SFT</text><text x="260" y="464" font-size="24" fill="#b86538">45.8</text>
    <text x="94" y="515" font-size="16" fill="#69737c">OPSD</text><text x="260" y="515" font-size="29" font-weight="700" fill="#34414a">46.6</text>

    <rect x="625" y="380" width="505" height="174" fill="#f5efea" stroke="#d8c2b3"/>
    <text x="649" y="418" font-size="18" font-weight="700" fill="#172028">Olmo chemistry</text>
    <text x="649" y="464" font-size="16" fill="#b86538">Sampling SFT</text><text x="815" y="464" font-size="24" fill="#b86538">58.3</text>
    <text x="649" y="515" font-size="16" fill="#69737c">OPSD</text><text x="815" y="515" font-size="29" font-weight="700" fill="#34414a">59.7</text>

    <text x="70" y="604" font-size="14" fill="#69737c">Source: paper Tables 1–2. Numbers are percentage accuracy. The paper reports no multi-seed error bars.</text>
  </g>
</svg>
