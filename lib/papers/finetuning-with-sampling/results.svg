<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
  <title id="t">Finetuning with Sampling 数学结果与边界</title>
  <desc id="d">普通 SFT 让 MATH 三四五级测试准确率从 0.315 降到 0.243；Sampling SFT 的数学新任务均分为 0.534，旧能力保持率为 99.5%，再接 GRPO 后达到 0.567。</desc>
  <rect width="1200" height="650" fill="#fbfbf8"/>
  <text x="70" y="60" font-family="Arial,sans-serif" font-size="18" fill="#69737c">Qwen2.5-3B · single-shot accuracy · 论文未报告多随机种子误差</text>
  <text x="70" y="108" font-family="Georgia,serif" font-size="36" fill="#172028">直接 SFT 会退步，采样改写后反超同策略训练</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="166" width="505" height="174" fill="#f5efea" stroke="#d8c2b3"/>
    <text x="94" y="204" font-size="18" font-weight="700" fill="#172028">MATH(3,4,5) 同分布测试</text>
    <text x="94" y="252" font-size="16" fill="#69737c">Base</text><text x="260" y="252" font-size="25" fill="#34414a">0.315</text>
    <text x="94" y="302" font-size="16" fill="#b86538">普通 SFT</text><text x="260" y="302" font-size="29" font-weight="700" fill="#b86538">0.243</text>

    <rect x="625" y="166" width="505" height="174" fill="#eaf2f7" stroke="#a8becd"/>
    <text x="649" y="204" font-size="18" font-weight="700" fill="#172028">数学新任务平均准确率</text>
    <text x="649" y="252" font-size="16" fill="#69737c">GRPO / UFT</text><text x="815" y="252" font-size="24" fill="#7b8991">0.457 / 0.452</text>
    <text x="649" y="302" font-size="16" fill="#2f6f98">Sampling SFT</text><text x="815" y="302" font-size="29" font-weight="700" fill="#2f6f98">0.534</text>

    <rect x="70" y="380" width="505" height="174" fill="#e7f1ed" stroke="#9bb9ae"/>
    <text x="94" y="418" font-size="18" font-weight="700" fill="#172028">旧能力平均保持率</text>
    <text x="94" y="466" font-size="16" fill="#69737c">Base / Sampling SFT</text><text x="295" y="466" font-size="24" fill="#34414a">0.422 / 0.420</text>
    <text x="94" y="516" font-size="16" fill="#2f7d6b">0.420 ÷ 0.422</text><text x="295" y="516" font-size="29" font-weight="700" fill="#2f7d6b">99.5%</text>

    <rect x="625" y="380" width="505" height="174" fill="#f1f4f3" stroke="#d0d7d9"/>
    <text x="649" y="418" font-size="18" font-weight="700" fill="#172028">Sampling SFT 再接 GRPO</text>
    <text x="649" y="466" font-size="16" fill="#69737c">Sampling SFT</text><text x="815" y="466" font-size="24" fill="#7b8991">0.534</text>
    <text x="649" y="516" font-size="16" fill="#2f6f98">Sampling SFT + RL</text><text x="850" y="516" font-size="29" font-weight="700" fill="#2f6f98">0.567</text>

    <text x="70" y="604" font-size="14" fill="#69737c">来源：论文 Table 1。旧能力均分覆盖 Chemistry、MMLU、GPQA；保持率为本文复算。</text>
  </g>
</svg>
