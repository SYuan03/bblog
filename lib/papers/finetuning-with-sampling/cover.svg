<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Finetuning with Sampling method overview</title>
  <desc id="d">An expert trajectory is repeatedly rewritten from random prefix cuts, and candidates with higher average likelihood under the base model are kept before supervised finetuning.</desc>
  <rect width="1200" height="675" fill="#f7f4ec"/>
  <text x="70" y="68" font-family="Arial,sans-serif" font-size="18" fill="#69737c">DATA SHAPING FOR SUPERVISED FINETUNING</text>
  <text x="70" y="120" font-family="Georgia,serif" font-size="43" fill="#172028">Make expert traces easier for the student model to imitate</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="202" width="245" height="220" fill="#f4e9e2" stroke="#c49b82"/>
    <text x="94" y="240" font-size="19" font-weight="700" fill="#b86538">Off-policy expert</text>
    <text x="94" y="284" font-size="15" fill="#34414a">correct solution</text>
    <text x="94" y="316" font-size="15" fill="#34414a">different wording / policy</text>
    <text x="94" y="366" font-size="14" fill="#69737c">privileged information</text>
    <path d="M325 313H395" stroke="#54758a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="405" y="184" width="390" height="256" fill="#fff" stroke="#8999a2"/>
    <text x="431" y="225" font-size="19" font-weight="700" fill="#172028">Projection sampling</text>
    <text x="431" y="270" font-size="15" fill="#34414a">1. choose a random cut</text>
    <text x="431" y="303" font-size="15" fill="#34414a">2. show prefix + expert solution</text>
    <text x="431" y="336" font-size="15" fill="#34414a">3. regenerate the suffix</text>
    <text x="431" y="369" font-size="15" fill="#34414a">4. score under the base model</text>
    <text x="431" y="410" font-size="14" fill="#a84b47">released code accepts only likelihood improvements</text>
    <path d="M805 313H875" stroke="#54758a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="885" y="202" width="245" height="220" fill="#e7f1ed" stroke="#7ba494"/>
    <text x="909" y="240" font-size="19" font-weight="700" fill="#2f7d6b">Sampling SFT</text>
    <text x="909" y="284" font-size="15" fill="#34414a">same task answer</text>
    <text x="909" y="316" font-size="15" fill="#34414a">higher base likelihood</text>
    <text x="909" y="366" font-size="14" fill="#69737c">standard SFT objective</text>

    <rect x="70" y="493" width="1060" height="102" fill="#fff" stroke="#d1d7da"/>
    <text x="94" y="530" font-size="17" font-weight="700" fill="#172028">Theory / implementation boundary</text>
    <text x="94" y="562" font-size="15" fill="#34414a">The paper derives Metropolis–Hastings. The released code omits proposal ratios and stochastic acceptance.</text>
    <text x="94" y="585" font-size="15" fill="#a84b47">The released algorithm is a greedy likelihood ascent approximation, so the MH stationary-distribution guarantee does not transfer directly.</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#54758a"/></marker></defs>
</svg>
