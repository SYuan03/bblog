<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Finetuning with Sampling 方法概览</title>
  <desc id="d">系统从随机前缀切分点反复重写专家轨迹，保留基础模型平均对数概率更高的候选，再用改写后的数据做监督微调。</desc>
  <rect width="1200" height="675" fill="#f7f4ec"/>
  <text x="70" y="68" font-family="Arial,sans-serif" font-size="18" fill="#69737c">为监督微调改造训练数据</text>
  <text x="70" y="120" font-family="Georgia,serif" font-size="43" fill="#172028">让专家轨迹更容易被学生模型模仿</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="202" width="245" height="220" fill="#f4e9e2" stroke="#c49b82"/>
    <text x="94" y="240" font-size="19" font-weight="700" fill="#b86538">分布外专家答案</text>
    <text x="94" y="284" font-size="15" fill="#34414a">答案正确</text>
    <text x="94" y="316" font-size="15" fill="#34414a">表达方式不同</text>
    <text x="94" y="366" font-size="14" fill="#69737c">提供额外解题信息</text>
    <path d="M325 313H395" stroke="#54758a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="405" y="184" width="390" height="256" fill="#fff" stroke="#8999a2"/>
    <text x="431" y="225" font-size="19" font-weight="700" fill="#172028">投影式采样</text>
    <text x="431" y="270" font-size="15" fill="#34414a">1. 随机选择切分点</text>
    <text x="431" y="303" font-size="15" fill="#34414a">2. 提供前缀与专家解答</text>
    <text x="431" y="336" font-size="15" fill="#34414a">3. 重新生成后缀</text>
    <text x="431" y="369" font-size="15" fill="#34414a">4. 用基础模型计算概率</text>
    <text x="431" y="410" font-size="14" fill="#a84b47">公开代码只接受平均对数概率提高的候选</text>
    <path d="M805 313H875" stroke="#54758a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="885" y="202" width="245" height="220" fill="#e7f1ed" stroke="#7ba494"/>
    <text x="909" y="240" font-size="19" font-weight="700" fill="#2f7d6b">Sampling SFT</text>
    <text x="909" y="284" font-size="15" fill="#34414a">同一道题、答案不变</text>
    <text x="909" y="316" font-size="15" fill="#34414a">基础模型给出的概率更高</text>
    <text x="909" y="366" font-size="14" fill="#69737c">使用标准监督微调（SFT）目标</text>

    <rect x="70" y="493" width="1060" height="102" fill="#fff" stroke="#d1d7da"/>
    <text x="94" y="530" font-size="17" font-weight="700" fill="#172028">理论与实现的边界</text>
    <text x="94" y="562" font-size="15" fill="#34414a">论文推导 Metropolis-Hastings；公开代码省略正反向提议概率之比和随机接受步骤。</text>
    <text x="94" y="585" font-size="15" fill="#a84b47">公开算法只接受平均对数概率上升的候选，因此 MH 关于稳定分布的保证不能直接套用。</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#54758a"/></marker></defs>
</svg>
