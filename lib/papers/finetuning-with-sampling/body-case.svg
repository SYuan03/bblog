<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" role="img" aria-labelledby="title desc">
<title id="title">Sampling SFT 附录配平案例和环结构错误</title><desc id="desc">原解答和改写解答的配平系数都正确，但另一条解答将六元环说成五元环。算术校验是本文写的，不是官方逐轮检查。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.title{font-size:33px;font-weight:750}.head{font-size:28px;font-weight:700}.body{font-size:25px;fill:#46545d}.small{font-size:23px;fill:#56646d}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:27px;fill:#35424b}</style>
<rect width="1000" height="880" fill="#fff"/>
<text x="40" y="53" class="title">配平保留了，但不保证改写的每句解释都正确</text>
<text x="40" y="97" class="body">附录原题：CO₂ + H₂O → C₃H₆O₃ + O₂，按原顺序给系数。</text>
<rect x="40" y="130" width="920" height="213" fill="#f1f5f8" stroke="#c4d3dd"/>
<text x="64" y="174" class="head" fill="#245f87">公开原解答与改写解答，均给出 (3, 3, 1, 3)</text>
<text x="64" y="220" class="code">3 CO₂ + 3 H₂O → C₃H₆O₃ + 3 O₂</text>
<text x="64" y="266" class="body">官方 checker 比较有序系数/分子式，匹配 reference。</text>
<text x="64" y="308" class="body">(6, 6, 2, 6) 也守恒，但与 reference 不同，判 FAIL。</text>
<rect x="40" y="375" width="920" height="176" fill="#f7f8f8" stroke="#ccd4d9"/>
<text x="64" y="419" class="head">如何选择改写</text>
<text x="64" y="461" class="body">生成模型看原题、完整专家答案和前缀，重写后缀。</text>
<text x="64" y="502" class="body">打分模型只看原题；平均 logprob 提高才接受。</text>
<text x="64" y="537" class="small">论文未给该例逐轮候选概率与接受记录。</text>
<rect x="40" y="583" width="920" height="191" fill="#fbf3f2" stroke="#d8bfbb"/>
<text x="64" y="627" class="head" fill="#85413b">同一附录的反例：答案对了，过程仍有事实错误</text>
<text x="64" y="669" class="body">改写答对 150.130 g/mol，却将 oxane 说成五元环。</text>
<text x="64" y="710" class="body">实际是六元环：五个碳 + 一个氧，即氧杂环己烷。</text>
<text x="64" y="751" class="small">最终答案正确，不足以证明整段改写信息等价。</text>
<text x="40" y="834" class="small">来源：Appendix A/C.1/C.2；boost_sci.py（aa708088）。</text>
<text x="40" y="865" class="small">配平 FAIL 为本文构造；环结构错误来自原论文输出。</text>
</svg>
