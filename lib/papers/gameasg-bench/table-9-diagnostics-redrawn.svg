<svg xmlns="http://www.w3.org/2000/svg" width="1382" height="447.68" viewBox="0 0 1382 447.68" role="img" aria-label="检查怎样暴露真实失败">
  <rect width="1382" height="447.68" fill="#fbfaf7"/>
  <text x="36" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="30" font-weight="700" fill="#20262b" text-anchor="start"><tspan x="36" dy="0">检查怎样暴露真实失败</tspan></text><text x="36" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#6e7882" text-anchor="start"><tspan x="36" dy="0">两个案例都说明：接口能返回状态或程序不报错，仍不足以证明玩家交互成立。</tspan></text><rect x="36" y="128" width="1310" height="45.760000000000005" fill="#e8f1f7"/><text x="48" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#20262b" text-anchor="start"><tspan x="48" dy="0">Artifact / stack</tspan></text><text x="338" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#20262b" text-anchor="start"><tspan x="338" dy="0">Observed evidence</tspan></text><text x="858" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#20262b" text-anchor="start"><tspan x="858" dy="0">Role of the checks</tspan></text><line x1="36" y1="173.76" x2="1346" y2="173.76" stroke="#2f6f9f" stroke-width="2"/><rect x="36" y="173.76" width="1310" height="96.96000000000001" fill="#ffffff"/><text x="48" y="204.76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#44505b" text-anchor="start"><tspan x="48" dy="0">Diner Dasher</tspan><tspan x="48" dy="24.32">GPT-6-Astra</tspan></text><text x="338" y="204.76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19" font-weight="400" fill="#44505b" text-anchor="start"><tspan x="338" dy="0">L1 与 L2 P0/P2 通过；</tspan><tspan x="338" dy="24.32">真实 mouse / touch drag 后</tspan><tspan x="338" dy="24.32">服务进度仍不增加。</tspan></text><text x="858" y="204.76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19" font-weight="400" fill="#44505b" text-anchor="start"><tspan x="858" dy="0">真实输入检查暴露核心交互失败；</tspan><tspan x="858" dy="24.32">其他检查通过没有掩盖这个 verdict。</tspan></text><line x1="36" y1="270.72" x2="1346" y2="270.72" stroke="#c8ced3"/><rect x="36" y="270.72" width="1310" height="96.96000000000001" fill="#f3f5f6"/><text x="48" y="301.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#44505b" text-anchor="start"><tspan x="48" dy="0">Turbo Smash Beast</tspan><tspan x="48" dy="24.32">DeepSeek-V4-Flash</tspan></text><text x="338" y="301.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19" font-weight="400" fill="#44505b" text-anchor="start"><tspan x="338" dy="0">reset 或 loadScenario 后</tspan><tspan x="338" dy="24.32">natural-time simulation 停止；</tspan><tspan x="338" dy="24.32">驾驶、coasting 等 real-input checks 失败。</tspan></text><text x="858" y="301.72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19" font-weight="400" fill="#44505b" text-anchor="start"><tspan x="858" dy="0">scenario preparation 与真实输入组合后，</tspan><tspan x="858" dy="24.32">才暴露两个机制之间的冲突。</tspan></text><line x1="36" y1="367.68000000000006" x2="1346" y2="367.68000000000006" stroke="#c8ced3"/><line x1="326" y1="128" x2="326" y2="367.68" stroke="#c8ced3"/><line x1="846" y1="128" x2="846" y2="367.68" stroke="#c8ced3"/>
  <line x1="34" y1="405.68" x2="1348" y2="405.68" stroke="#c8ced3"/>
  <text x="36" y="430.68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#6e7882" text-anchor="start"><tspan x="36" dy="0">根据 GameASG-Bench 原论文对应 Figure/Table 数据重绘</tspan></text>
</svg>