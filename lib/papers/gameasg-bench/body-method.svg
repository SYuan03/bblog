<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="GameASG-Bench 的任务作者、生成 Agent 与隐藏浏览器检查之间的信息边界">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#456c93"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#263445}.title{font-size:36px;font-weight:700}.head{font-size:29px;font-weight:700}.body{font-size:27px}.small{font-size:23px;fill:#526276}.mono{font-family:Menlo,Consolas,monospace;font-size:24px}.blue{fill:#365f85}.red{fill:#9a4b46}.rule{stroke:#ccd5df;stroke-width:2}.flow{stroke:#456c93;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="1200" height="820" fill="#fff"/>
<text x="44" y="58" class="title">GameASG-Bench：谁写任务，谁写游戏，谁来判分</text>
<text x="44" y="105" class="small">规则在生成前固定；公开文档与隐藏检查各有职责。</text>
<rect x="44" y="140" width="342" height="300" rx="5" fill="#f5f7fa" stroke="#ccd5df" stroke-width="2"/><text x="64" y="184" class="head">1  人类任务作者</text>
<text x="64" y="233" class="body">写 target / game-spec</text>
<text x="64" y="275" class="body">写 tdd：评测接口要求</text>
<text x="64" y="317" class="body">写隐藏 checks 与优先级</text>
<text x="64" y="359" class="body">先验证参考游戏可用</text>
<rect x="429" y="140" width="342" height="300" rx="5" fill="#f5f7fa" stroke="#ccd5df" stroke-width="2"/><text x="449" y="184" class="head">2  被测 Agent</text>
<text x="449" y="233" class="body">读公开文档与接口规范</text>
<text x="449" y="275" class="body">用 harness 的工具写代码</text>
<text x="449" y="317" class="body">可自行启动与测试浏览器</text>
<text x="449" y="359" class="body">交付 index.html</text>
<rect x="814" y="140" width="342" height="300" rx="5" fill="#f5f7fa" stroke="#ccd5df" stroke-width="2"/><text x="834" y="184" class="head">3  评测程序</text>
<text x="834" y="233" class="body">加载同一份隐藏 checks</text>
<text x="834" y="275" class="body">L1：源码、语法、接口</text>
<text x="834" y="317" class="body">L2：准备合法玩法场景</text>
<text x="834" y="359" class="body">执行键鼠并读取状态</text>
<path d="M386 290H426" class="flow"/><path d="M771 290H811" class="flow"/>
<path d="M215 440V483H982V440" stroke="#8b99a9" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
<text x="430" y="514" class="small">隐藏检查不交给被测 Agent</text>
<rect x="44" y="556" width="1112" height="149" rx="5" fill="#eef4f9" stroke="#ccd5df" stroke-width="2"/>
<text x="64" y="598" class="head">严格任务成功：所有必选项都通过</text>
<text x="64" y="644" class="body">有效交付  ×  完成评测  ×  全部 L1  ×  适用的 L2 P0 / P1</text>
<text x="64" y="686" class="body">47 道题都在分母内；P2 不决定严格成功。</text>
<text x="44" y="756" class="small">L1 失败仍会执行 L2；每条 L2 在新页面上单独运行。</text>
<text x="44" y="790" class="small">本文根据论文 §2–3 与固定版本 runner 整理，非论文原图。</text>
</svg>
