<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
<title id="title">Table 1 和 Table 5 的模型选择方式及不同结论</title><desc id="desc">主表每个测试集独立选最好 checkpoint，PS-OPSD 平均都高于 OPSD。Table 5 每个方法选一个 checkpoint，PS-OPSD 相对 OPSD 平均变化负0.68、0、正0.68。两者都使用被报告的测试成绩选模型。</desc><rect width="900" height="320" fill="#fff"/>
<g font-family="Arial,PingFang SC,sans-serif" font-size="18" fill="#24292f">
<text x="24" y="32" font-size="21" font-weight="700">“每项挑最好再平均”与“一个模型测所有项”，结论不同</text>
<path d="M24 52H876M454 66V269" stroke="#dce2e8"/>
<text x="24" y="82" font-weight="700">Table 1：每个测试集各选一个 checkpoint</text><text x="24" y="111" fill="#536171">三项平均可能来自三个参数版本</text>
<text x="24" y="148">规模</text><text x="147" y="148">OPSD Avg</text><text x="303" y="148">PS-OPSD Avg</text>
<text x="24" y="181">1.7B</text><text x="147" y="181">41.08</text><text x="303" y="181" fill="#245e99">43.12</text>
<text x="24" y="214">4B</text><text x="147" y="214">61.70</text><text x="303" y="214" fill="#245e99">64.32</text>
<text x="24" y="247">8B</text><text x="147" y="247">63.58</text><text x="303" y="247" fill="#245e99">65.40</text>
<text x="479" y="82" font-weight="700">Table 5：每个方法选自己的一个 checkpoint</text><text x="479" y="111" fill="#536171">取三项 Avg 最高版本；PS-OPSD 减 OPSD</text>
<text x="479" y="148">规模</text><text x="597" y="148">ΔAvg（点）</text><text x="739" y="148">Δpass@12（点）</text>
<text x="479" y="181">1.7B</text><text x="597" y="181" fill="#a64b47">−0.68</text><text x="739" y="181" fill="#a64b47">−4.44</text>
<text x="479" y="214">4B</text><text x="597" y="214">0.00</text><text x="739" y="214" fill="#245e99">+1.11</text>
<text x="479" y="247">8B</text><text x="597" y="247" fill="#245e99">+0.68</text><text x="739" y="247" fill="#245e99">+4.44</text>
<text x="24" y="296" fill="#536171">两者都按所报告的测试成绩挑模型，不是先在独立验证集选好再部署评测。</text>
</g></svg>
