<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc"><title id="title">固定教师提示，学生只看问题</title><desc id="desc">离线提取四字段提示，训练时固定教师重评学生回答，测试没有额外模块。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#245e99"/></marker></defs><rect width="980" height="420" fill="#fff"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" fill="#24292f"><text x="30" y="39" font-size="25" font-weight="700">PS-OPSD：改教师上下文，不改学生输入和蒸馏目标</text><g fill="#f4f7fa" stroke="#d3dde7"><rect x="30" y="67" width="285" height="132" rx="9"/><rect x="367" y="67" width="280" height="132" rx="9"/><rect x="700" y="67" width="250" height="132" rx="9"/></g><text x="47" y="101" font-size="20" font-weight="700">问题 + 一份验证过的解</text><text x="47" y="134" font-size="18">OpenThoughts 数学子集</text><text x="47" y="169" font-size="18">离线提取：Qwen3.6-35B-A3B</text><text x="384" y="101" font-size="20" font-weight="700">缓存提示：四字段</text><text x="384" y="134" font-size="18">已知、目标、约束、选定变换</text><text x="384" y="169" font-size="18">不直接写本题最终数值</text><text x="717" y="101" font-size="20" font-weight="700">固定初始教师</text><text x="717" y="134" font-size="18">只在评分输入中看到提示</text><text x="717" y="169" font-size="18">LoRA 关闭、不更新参数</text><path d="M319 133H359M651 133H692" stroke="#245e99" stroke-width="2.5" marker-end="url(#a)"/><g fill="#f4f7fa" stroke="#d3dde7"><rect x="30" y="235" width="390" height="143" rx="9"/><rect x="472" y="235" width="478" height="143" rx="9"/></g><text x="47" y="271" font-size="20" font-weight="700">学生只看问题 → 生成自己的回答</text><text x="47" y="307" font-size="18">两个分支使用相同学生前文</text><text x="47" y="344" font-size="18">只更新学生 LoRA；主体参数保持不变</text><text x="489" y="271" font-size="20" font-weight="700">全词表贡献截断 → 回答位置平均</text><text x="489" y="307" font-size="18">教师给概率，学生匹配；提示训练前已缓存</text><text x="489" y="344" font-size="18">测试：学生仅看问题，无教师、提取器或参考解</text><path d="M424 302H464" stroke="#245e99" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="406" font-size="16" fill="#536171">Figure 1、Algorithm 1、§4；提示与教师固定不等于“无需离线提取模型”。</text></g></svg>
