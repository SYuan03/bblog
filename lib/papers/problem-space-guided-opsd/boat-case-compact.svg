<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">论文船速示例的变换和本文补算</title><desc id="desc">顺逆流方程通过倒数变量变成二元线性方程，解出 p 和 q，再求回静水和水流速度。具体数值为文章补充，不是论文测试日志。</desc><rect width="900" height="300" fill="#fff"/>
<g font-family="Arial,PingFang SC,sans-serif" font-size="18" fill="#24292f">
<text x="24" y="31" font-size="21" font-weight="700">同一个题目：保留变换关系，省去实例化最终答案</text>
<text x="24" y="63">论文 Figure 2：a/(v+u) + b/(v−u) = T₁；c/(v+u) + d/(v−u) = T₂</text>
<path d="M24 83H876M303 102V213M610 102V213" stroke="#dce2e8"/>
<text x="24" y="112" font-weight="700">1. 倒数代换</text><text x="24" y="145">p=1/(v+u)，q=1/(v−u)</text><text x="24" y="177">ap+bq=T₁，cp+dq=T₂</text><text x="24" y="207" fill="#536171">前提：v+u、v−u 不为零</text>
<text x="326" y="112" font-weight="700">2. 解线性方程</text><text x="326" y="145">p=(dT₁−bT₂)/Δ</text><text x="326" y="177">q=(aT₂−cT₁)/Δ</text><text x="326" y="207" fill="#536171">前提：Δ=ad−bc≠0</text>
<text x="634" y="112" font-weight="700">3. 求回速度并验算</text><text x="634" y="145">v=(1/p+1/q)/2</text><text x="634" y="177">u=(1/p−1/q)/2</text><text x="634" y="207" fill="#536171">前提：p、q≠0；代回两式</text>
<text x="277" y="161" fill="#245e99">→</text><text x="583" y="161" fill="#245e99">→</text>
<rect x="24" y="230" width="852" height="47" fill="#eef4fa"/>
<text x="38" y="260" font-weight="700">本文数值补算：a=12,b=8,c=6,d=12,T₁=T₂=2 → p=1/12,q=1/8 → v=10,u=2</text>
</g></svg>
