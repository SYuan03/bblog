<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
<title id="title">90 道题中新增成功覆盖与原成功覆盖的保留</title><desc id="desc">按 Base 每题十二条回答分类，二十三题全错，六十七题至少对一次。OPSD 救回二题丢失二题，净增长零；PS-OPSD 救回三题丢失一题，净增长二。分母由论文 Table 4 公开比例反算。</desc><rect width="900" height="240" fill="#fff"/>
<g font-family="Arial,PingFang SC,sans-serif" font-size="18" fill="#24292f">
<text x="24" y="32" font-size="21" font-weight="700">“更多回答答对”与“新增能做的题”，用不同分母</text>
<rect x="24" y="53" width="260" height="143" fill="#f4f7fa" stroke="#dce2e8"/>
<text x="39" y="81" font-weight="700">Base 的 90 道题</text><text x="39" y="116">23 题：12 次全错</text><text x="39" y="150">67 题：至少一次答对</text><text x="39" y="181" fill="#536171">不是人工按难度分组</text>
<path d="M284 99H310M310 80V173M310 80H337M310 173H337" stroke="#245e99" fill="none"/>
<text x="355" y="82" font-weight="700">全错 23 题中救回</text><text x="606" y="82">OPSD 2/23 = 8.70%</text><text x="606" y="113" fill="#245e99">PS-OPSD 3/23 = 13.04%</text>
<text x="355" y="155" font-weight="700">已会 67 题中保留</text><text x="606" y="155">OPSD 65/67 = 97.01%</text><text x="606" y="186" fill="#245e99">PS-OPSD 66/67 = 98.51%</text>
<text x="24" y="225" fill="#536171">净覆盖增长：OPSD 2−2=0；PS-OPSD 3−1=+2。由 Table 4 比例补算；GRPO 同为 +2。</text>
</g></svg>
