<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">船速题的三个变换</title><desc id="desc">倒数线性化，解二元方程，反变换并验算；具体数值为本文教学补充。</desc><rect width="1000" height="450" fill="#fff"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" fill="#24292f"><text x="30" y="39" font-size="25" font-weight="700">Figure 2：顺流速度 v+u，逆流速度 v−u</text><text x="30" y="78" font-size="21">a/(v+u) + b/(v−u) = T₁　　c/(v+u) + d/(v−u) = T₂</text><g fill="#f4f7fa" stroke="#d3dde7"><rect x="30" y="109" width="294" height="204" rx="9"/><rect x="353" y="109" width="294" height="204" rx="9"/><rect x="676" y="109" width="294" height="204" rx="9"/></g><text x="47" y="144" font-size="21" font-weight="700">① 倒数线性化</text><text x="47" y="178" font-size="18">前提：v+u、v−u 非零</text><text x="47" y="217" font-size="20">p = 1/(v+u)</text><text x="47" y="251" font-size="20">q = 1/(v−u)</text><text x="47" y="290" font-size="18">得到 ap+bq=T₁、cp+dq=T₂</text><text x="370" y="144" font-size="21" font-weight="700">② 解二元方程</text><text x="370" y="178" font-size="18">前提：Δ = ad−bc 非零</text><text x="370" y="217" font-size="20">p = (dT₁−bT₂) / Δ</text><text x="370" y="251" font-size="20">q = (aT₂−cT₁) / Δ</text><text x="370" y="290" font-size="18">p、q 被唯一确定</text><text x="693" y="144" font-size="21" font-weight="700">③ 反变换与检查</text><text x="693" y="178" font-size="18">前提：p、q 非零</text><text x="693" y="217" font-size="20">v = (1/p + 1/q) / 2</text><text x="693" y="251" font-size="20">u = (1/p − 1/q) / 2</text><text x="693" y="290" font-size="18">代回两式；确认 v &gt; u &gt; 0</text><text x="329" y="225" font-size="23" fill="#245e99">→</text><text x="652" y="225" font-size="23" fill="#245e99">→</text><rect x="30" y="339" width="940" height="72" fill="#eef4fa" rx="9"/><text x="47" y="366" font-size="19">教学数值（本文补充，非论文测试样本）：a=12，b=8，c=6，d=12，T₁=T₂=2</text><text x="47" y="397" font-size="21" fill="#245e99" font-weight="700">Δ=96 → p=1/12、q=1/8 → v=10、u=2 → 两次耗时均为 2 小时</text><text x="30" y="439" font-size="16" fill="#536171">提示保留变换关系，而不直接写实例化最终答案；不能等同于完整枚举所有解法。</text></g></svg>
