<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">两种checkpoint比较不是同一结果</title><desc id="desc">Table1分别在测试集选最佳checkpoint三项平均均领先，Table5每个方法选统一checkpoint相对OPSD为减0.68、0、加0.68。</desc><rect width="1000" height="450" fill="#fff"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" fill="#24292f"><text x="30" y="39" font-size="25" font-weight="700">主表的“最高平均分”不等于一个统一部署模型都领先</text><g fill="#f4f7fa" stroke="#d3dde7"><rect x="30" y="69" width="453" height="316" rx="9"/><rect x="513" y="69" width="457" height="316" rx="9"/></g><text x="49" y="108" font-size="22" font-weight="700">Table 1：每个测试集独立选最好</text><text x="49" y="148" font-size="18">每个方法、每个 benchmark 挑 checkpoint</text><text x="49" y="180" font-size="18">按三个种子平均分选；再将三项平均</text><text x="49" y="224" font-size="20">规模　　 OPSD　→　PS-OPSD</text><text x="49" y="261" font-size="21">1.7B　　 41.08　→　43.12</text><text x="49" y="296" font-size="21">4B　　　 61.70　→　64.32</text><text x="49" y="331" font-size="21">8B　　　 63.58　→　65.40</text><text x="49" y="365" font-size="17" fill="#536171">可能拼接不同 checkpoint；作者称 oracle envelope</text><text x="532" y="108" font-size="22" font-weight="700">Table 5：每个方法选同一模型</text><text x="532" y="148" font-size="18">取各自三项平均最高的一个 checkpoint</text><text x="532" y="180" font-size="18">PS-OPSD − OPSD（百分点）</text><text x="532" y="224" font-size="20">规模　　 平均准确率　至少一次 pass@12</text><text x="532" y="261" font-size="21">1.7B　　　 −0.68　　　 −4.44</text><text x="532" y="296" font-size="21">4B　　　　 +0.00　　　 +1.11</text><text x="532" y="331" font-size="21">8B　　　　 +0.68　　　 +4.44</text><text x="532" y="365" font-size="17" fill="#536171">统一模型优势并不跨三个规模都成立</text><text x="30" y="426" font-size="18" fill="#536171">两者都根据测试结果选模型；更严格的部署评价应先在独立验证集选一个，再固定报告。</text></g></svg>
