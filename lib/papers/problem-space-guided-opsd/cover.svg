<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">PS-OPSD: Problem-Space-Guided On-Policy Self-Distillation</title><desc id="desc">Only the teacher receives a cached problem-solving guide extracted from a verified solution. The student generates from the question and alone receives updates.</desc><rect width="1600" height="900" fill="#f5f7f9"/><path d="M90 175H1510M90 748H1510M890 235V650" stroke="#ccd6df" stroke-width="2"/><g font-family="Arial,PingFang SC,sans-serif" fill="#24292f"><text x="90" y="123" font-size="28" fill="#536171">PAPER NOTES · ON-POLICY SELF-DISTILLATION</text><text x="90" y="321" font-size="94" font-weight="700">PS-OPSD</text><text x="90" y="415" font-size="46">正确解怎样给，才适合训练？</text><text x="90" y="503" font-size="30" fill="#536171">从完整答案，到解题关系</text><text x="90" y="554" font-size="30" fill="#536171">同一模型版本的结果，也要一起看</text><text x="90" y="812" font-size="26" fill="#536171">arXiv:2608.01589 · 2026-08-03 · 兴趣 8/10</text><rect x="970" y="270" width="540" height="100" fill="#fff" stroke="#ccd6df"/><text x="1000" y="312" font-size="30" font-weight="700">题目 + 验证过的参考解</text><text x="1000" y="348" font-size="24" fill="#536171">离线提取：起点、目标、约束、步骤</text><path d="M1240 370V410M1229 397l11 13 11-13" fill="none" stroke="#245e99" stroke-width="3"/><rect x="970" y="415" width="540" height="90" fill="#eef4fa" stroke="#ccd6df"/><text x="1000" y="452" font-size="29" font-weight="700">教师看提示，评分同一学生前文</text><text x="1000" y="486" font-size="24" fill="#536171">教师保持固定，不另写新答案</text><path d="M1240 505V545M1229 532l11 13 11-13" fill="none" stroke="#245e99" stroke-width="3"/><rect x="970" y="550" width="540" height="86" fill="#fff" stroke="#ccd6df"/><text x="1000" y="586" font-size="29" font-weight="700">学生只看题目，匹配概率后更新</text><text x="1000" y="620" font-size="24" fill="#536171">部署时没有提示与教师</text></g></svg>
