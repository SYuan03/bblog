<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">图例遮挡与语句权重的示意计算</title><desc id="desc">论文Figure1显示图例遮挡曲线。本图补充教学参数alpha3、IoU0.5、严重性1，图例语句权重2，其他语句仍1。非真实模型输出或作者超参数。</desc>
<rect width="1000" height="500" fill="#fff"/><g font-family="Arial, PingFang SC, sans-serif" fill="#24292f">
<text x="30" y="41" font-size="27" font-weight="700">“代码能运行”，仍可能把图例放错位置</text>
<rect x="30" y="74" width="432" height="282" rx="5" fill="#f5f7f9" stroke="#dce2e8"/>
<text x="50" y="105" font-size="22" font-weight="700">论文 Figure 1 的缺陷类型</text>
<path d="M63 322 H429 M64 323 V134" fill="none" stroke="#8d9ba8" stroke-width="2"/>
<path d="M69 299 L132 245 L190 266 L246 201 L315 214 L412 148" fill="none" stroke="#245e99" stroke-width="5"/>
<rect x="262" y="170" width="165" height="75" rx="3" fill="#fff" stroke="#a64b47" stroke-width="3"/>
<text x="283" y="215" font-size="23" fill="#a64b47">图例遮住曲线</text>
<text x="51" y="347" font-size="18" fill="#536171">示意重绘；位置不来自真实执行坐标</text>
<rect x="500" y="74" width="470" height="282" rx="5" fill="#fff" stroke="#245e99"/>
<text x="522" y="109" font-size="24" font-weight="700">沿缺陷位置提高语句权重</text>
<text x="522" y="151" font-size="22">假设 α=3，IoU=0.5，严重性=1</text>
<text x="522" y="195" font-size="23">resp = 0.5 × 1 = 0.5</text>
<text x="522" y="239" font-size="25" font-weight="700" fill="#245e99">w = 1 + (3−1) × 0.5 = 2</text>
<text x="522" y="283" font-size="21">只给该语句内的 token 使用这个权重</text>
<text x="522" y="324" font-size="21">其他未对应缺陷的语句仍取 1</text>
<rect x="30" y="386" width="940" height="64" rx="4" fill="#f5f7f9"/>
<text x="49" y="425" font-size="21">损失除以权重总和；提高局部权重，不等于删除其他代码的训练信号。</text>
<text x="30" y="477" font-size="18" fill="#536171">类型依据 Figure 1、§2.4；数值为本文演算，非作者配置、实测日志或已验证修复。</text>
</g></svg>
