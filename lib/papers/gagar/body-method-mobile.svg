<svg xmlns="http://www.w3.org/2000/svg" width="360" height="498" viewBox="0 0 360 498" role="img" aria-labelledby="title desc">
<title id="title">GAGAR 机制</title>
<desc id="desc">同题尝试经过测试；固定 grader 调查全部轨迹并排序通过者；质量系数改变成功样本的正优势。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">
<rect width="360" height="498" fill="#fff"/>
<text x="14" y="27" font-size="17" font-weight="700" fill="#24313a">测试 → 判分 → 重新分配优势</text>
<rect x="14" y="44" width="332" height="126" rx="6" fill="#f6f8fa" stroke="#ccd6db"/>
<text x="27" y="69" font-size="16" font-weight="700" fill="#24313a">1 · 同题 16 次尝试</text>
<text x="27" y="93" font-size="14.5" font-weight="400" fill="#24313a">测试标记通过 / 失败；</text>
<text x="27" y="115" font-size="14.5" font-weight="400" fill="#24313a">训练保留两种结果并存的组。</text>
<text x="27" y="149" font-size="13" font-weight="400" fill="#53636d">失败轨迹仍可供判分者调查。</text>
<rect x="14" y="191" width="332" height="133" rx="6" fill="#f1f5f8" stroke="#bfd2de"/>
<text x="27" y="216" font-size="16" font-weight="700" fill="#24313a">2 · 固定 grader 调查</text>
<text x="27" y="240" font-size="14.5" font-weight="400" fill="#24313a">MiMo-V2.6-Pro 读仓库、轨迹、</text>
<text x="27" y="262" font-size="14.5" font-weight="400" fill="#24313a">补丁与测试，必要时运行检查。</text>
<text x="27" y="303" font-size="13" font-weight="400" fill="#53636d">只给成功实现排 T1 / T2 / T3。</text>
<rect x="14" y="345" width="332" height="121" rx="6" fill="#f1f7f3" stroke="#bed5c5"/>
<text x="27" y="370" font-size="16" font-weight="700" fill="#24313a">3 · 重新分配正优势</text>
<text x="27" y="394" font-size="14.5" font-weight="400" fill="#24313a">成功样本先乘质量系数 f，</text>
<text x="27" y="416" font-size="14.5" font-weight="400" fill="#24313a">再共同乘 λ；优者分得更多。</text>
<text x="27" y="445" font-size="13" font-weight="400" fill="#53636d">λ 触发上限时还会重新居中。</text>
<path d="M180 174V187m-5-5 5 5 5-5" fill="none" stroke="#71818b" stroke-width="2.2"/>
<path d="M180 328V341m-5-5 5 5 5-5" fill="none" stroke="#71818b" stroke-width="2.2"/>
<text x="14" y="489" font-size="13" font-weight="400" fill="#53636d">据论文 Figure 1 与附录 A.2 重绘。</text>
</g>
</svg>
