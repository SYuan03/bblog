<svg xmlns="http://www.w3.org/2000/svg" width="360" height="514" viewBox="0 0 360 514" role="img" aria-labelledby="title desc">
<title id="title">GAGAR 构造例中的训练权重</title>
<desc id="desc">四条构造轨迹中两条通过测试；展示原始、无上限重分配、带上限居中三种权重。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">
<rect width="360" height="514" fill="#fff"/>
<text x="14" y="24" font-size="17" font-weight="700" fill="#24313a">四次尝试：正权重怎样分配</text>
<text x="14" y="44" font-size="12.5" font-weight="400" fill="#53636d">A、B 成功；C、D 失败。本文构造，非训练日志。</text>
<rect x="14" y="58" width="332" height="135" rx="6" fill="#f6f8fa" stroke="#ccd6db"/>
<text x="29" y="86" font-size="16" font-weight="700" fill="#24313a">二元结果优势</text>
<text x="30" y="111" font-size="13.5" font-weight="400" fill="#24313a">成功 A</text>
<rect x="89" y="98" width="67.5" height="16" rx="2" fill="#2d759e"/>
<text x="330" y="111" font-size="13.5" font-weight="700" fill="#24313a" text-anchor="end">+0.5</text>
<text x="30" y="139" font-size="13.5" font-weight="400" fill="#24313a">成功 B</text>
<rect x="89" y="126" width="67.5" height="16" rx="2" fill="#81a9bf"/>
<text x="330" y="139" font-size="13.5" font-weight="700" fill="#24313a" text-anchor="end">+0.5</text>
<text x="30" y="158" font-size="13" font-weight="400" fill="#53636d">失败 C、D：−0.5 / −0.5</text>
<text x="30" y="179" font-size="13.5" font-weight="700" fill="#24313a">成功正权重合计：1.00</text>
<rect x="14" y="209" width="332" height="135" rx="6" fill="#f6f8fa" stroke="#ccd6db"/>
<text x="29" y="237" font-size="16" font-weight="700" fill="#24313a">无上限公式 · λ≈1.667</text>
<text x="30" y="262" font-size="13.5" font-weight="400" fill="#24313a">成功 A</text>
<rect x="89" y="249" width="112.5" height="16" rx="2" fill="#2d759e"/>
<text x="330" y="262" font-size="13.5" font-weight="700" fill="#24313a" text-anchor="end">+0.833</text>
<text x="30" y="290" font-size="13.5" font-weight="400" fill="#24313a">成功 B</text>
<rect x="89" y="277" width="22.5" height="16" rx="2" fill="#81a9bf"/>
<text x="330" y="290" font-size="13.5" font-weight="700" fill="#24313a" text-anchor="end">+0.167</text>
<text x="30" y="309" font-size="13" font-weight="400" fill="#53636d">失败 C、D：−0.5 / −0.5</text>
<text x="30" y="330" font-size="13.5" font-weight="700" fill="#24313a">成功正权重合计：1.00</text>
<rect x="14" y="360" width="332" height="135" rx="6" fill="#f6f8fa" stroke="#ccd6db"/>
<text x="29" y="388" font-size="16" font-weight="700" fill="#24313a">上限 1.5 + 重新居中</text>
<text x="30" y="413" font-size="13.5" font-weight="400" fill="#24313a">成功 A</text>
<rect x="89" y="400" width="104.6" height="16" rx="2" fill="#2d759e"/>
<text x="330" y="413" font-size="13.5" font-weight="700" fill="#24313a" text-anchor="end">+0.775</text>
<text x="30" y="441" font-size="13.5" font-weight="400" fill="#24313a">成功 B</text>
<rect x="89" y="428" width="23.6" height="16" rx="2" fill="#81a9bf"/>
<text x="330" y="441" font-size="13.5" font-weight="700" fill="#24313a" text-anchor="end">+0.175</text>
<text x="30" y="460" font-size="13" font-weight="400" fill="#53636d">失败 C、D：−0.475 / −0.475</text>
<text x="30" y="481" font-size="13.5" font-weight="700" fill="#24313a">成功正权重合计：0.95</text>
<text x="14" y="510" font-size="12.5" font-weight="400" fill="#53636d">条长表示成功轨迹的正优势。</text>
</g>
</svg>
