<svg xmlns="http://www.w3.org/2000/svg" width="900" height="304" viewBox="0 0 900 304" role="img" aria-labelledby="title desc">
<title id="title">GAGAR 构造例中的训练权重</title>
<desc id="desc">四条构造轨迹中两条通过测试；初始正优势均为0.5，无上限后是0.833和0.167，触发上限并居中后是0.775和0.175。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">
<rect width="900" height="304" fill="#fff"/>
<text x="18" y="31" font-size="20" font-weight="700" fill="#24313a">同题四次尝试：质量排序如何改变训练权重</text>
<text x="18" y="55" font-size="14" font-weight="400" fill="#53636d">本文按论文公式构造；A、B 通过测试，C、D 失败，不是真实训练记录。</text>
<rect x="18" y="76" width="268" height="211" rx="6" fill="#f6f8fa" stroke="#ccd6db"/>
<text x="33" y="104" font-size="17" font-weight="700" fill="#24313a">二元结果优势</text>
<text x="33" y="124" font-size="13" font-weight="400" fill="#53636d">两份成功代码得到相同权重</text>
<text x="34" y="162" font-size="13.5" font-weight="400" fill="#24313a">成功 A</text>
<rect x="80" y="149" width="71.0" height="16" rx="2" fill="#2d759e"/>
<text x="270" y="162" font-size="13.5" font-weight="700" fill="#24313a" text-anchor="end">+0.5</text>
<text x="34" y="190" font-size="13.5" font-weight="400" fill="#24313a">成功 B</text>
<rect x="80" y="177" width="71.0" height="16" rx="2" fill="#81a9bf"/>
<text x="270" y="190" font-size="13.5" font-weight="700" fill="#24313a" text-anchor="end">+0.5</text>
<text x="34" y="252" font-size="13" font-weight="400" fill="#53636d">失败 C、D：−0.5 / −0.5</text>
<text x="34" y="273" font-size="13.5" font-weight="700" fill="#24313a">成功正权重合计：1.00</text>
<rect x="316" y="76" width="268" height="211" rx="6" fill="#f6f8fa" stroke="#ccd6db"/>
<text x="331" y="104" font-size="17" font-weight="700" fill="#24313a">无上限公式</text>
<text x="331" y="124" font-size="13" font-weight="400" fill="#53636d">f=[1.0,0.2]，λ≈1.667</text>
<text x="332" y="162" font-size="13.5" font-weight="400" fill="#24313a">成功 A</text>
<rect x="378" y="149" width="118.3" height="16" rx="2" fill="#2d759e"/>
<text x="568" y="162" font-size="13.5" font-weight="700" fill="#24313a" text-anchor="end">+0.833</text>
<text x="332" y="190" font-size="13.5" font-weight="400" fill="#24313a">成功 B</text>
<rect x="378" y="177" width="23.7" height="16" rx="2" fill="#81a9bf"/>
<text x="568" y="190" font-size="13.5" font-weight="700" fill="#24313a" text-anchor="end">+0.167</text>
<text x="332" y="252" font-size="13" font-weight="400" fill="#53636d">失败 C、D：−0.5 / −0.5</text>
<text x="332" y="273" font-size="13.5" font-weight="700" fill="#24313a">成功正权重合计：1.00</text>
<rect x="614" y="76" width="268" height="211" rx="6" fill="#f6f8fa" stroke="#ccd6db"/>
<text x="629" y="104" font-size="17" font-weight="700" fill="#24313a">上限 + 重新居中</text>
<text x="629" y="124" font-size="13" font-weight="400" fill="#53636d">λ 上限 1.5，减去组均值</text>
<text x="630" y="162" font-size="13.5" font-weight="400" fill="#24313a">成功 A</text>
<rect x="676" y="149" width="110.0" height="16" rx="2" fill="#2d759e"/>
<text x="866" y="162" font-size="13.5" font-weight="700" fill="#24313a" text-anchor="end">+0.775</text>
<text x="630" y="190" font-size="13.5" font-weight="400" fill="#24313a">成功 B</text>
<rect x="676" y="177" width="24.8" height="16" rx="2" fill="#81a9bf"/>
<text x="866" y="190" font-size="13.5" font-weight="700" fill="#24313a" text-anchor="end">+0.175</text>
<text x="630" y="252" font-size="13" font-weight="400" fill="#53636d">失败 C、D：−0.475 / −0.475</text>
<text x="630" y="273" font-size="13.5" font-weight="700" fill="#24313a">成功正权重合计：0.95</text>
</g>
</svg>
