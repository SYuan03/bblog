<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc">
<title id="title">DeepSWE 共同训练步数的通过率</title>
<desc id="desc">第28步三次采样平均通过率：二元奖励基线50.2%，只降权消融56.2%，完整GAGAR62.2%。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">
<rect width="360" height="320" fill="#fff"/>
<text x="14" y="27" font-size="17" font-weight="700" fill="#24313a">DeepSWE：共同第 28 步</text>
<text x="14" y="49" font-size="13.5" font-weight="400" fill="#53636d">avg@3：每题采样 3 次的平均通过率</text>
<text x="17" y="76" font-size="15" font-weight="400" fill="#24313a">二元奖励基线</text>
<text x="337" y="76" font-size="15" font-weight="700" fill="#24313a" text-anchor="end">50.2%</text>
<rect x="17" y="86" width="245.6" height="20" rx="3" fill="#aebdc7"/>
<text x="17" y="143" font-size="15" font-weight="400" fill="#24313a">只降权消融</text>
<text x="337" y="143" font-size="15" font-weight="700" fill="#24313a" text-anchor="end">56.2%</text>
<rect x="17" y="153" width="274.9" height="20" rx="3" fill="#d5a478"/>
<text x="17" y="210" font-size="15" font-weight="400" fill="#24313a">完整 GAGAR</text>
<text x="337" y="210" font-size="15" font-weight="700" fill="#24313a" text-anchor="end">62.2%</text>
<rect x="17" y="220" width="304.3" height="20" rx="3" fill="#2d759e"/>
<text x="14" y="292" font-size="13.5" font-weight="400" fill="#53636d">只降权是独立消融，且未重新居中。</text>
<text x="14" y="312" font-size="13" font-weight="400" fill="#53636d">据论文 Figures 2、4 重绘。</text>
</g>
</svg>
