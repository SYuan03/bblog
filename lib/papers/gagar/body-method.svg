<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
<title id="title">GAGAR 的测试、组内判分和优势重分配</title>
<desc id="desc">一题十六次尝试先由测试标记成功失败；固定判分 Agent 检查全部轨迹，但只给成功实现排序；质量系数调整正优势。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">
<rect width="900" height="310" fill="#fff"/>
<text x="18" y="34" font-size="21" font-weight="700" fill="#24313a">同题尝试组 → 仓库级判分 → 重新分配成功样本的训练权重</text>
<text x="18" y="59" font-size="14" font-weight="400" fill="#53636d">测试给正确性；grader 给通过测试的代码排相对质量。</text>
<rect x="18" y="78" width="268" height="181" rx="6" fill="#f6f8fa" stroke="#ccd6db"/>
<text x="35" y="110" font-size="18" font-weight="700" fill="#24313a">1 · 生成并验证</text>
<text x="35" y="143" font-size="15.5" font-weight="400" fill="#24313a">policy 对一题生成 16 条完整轨迹。</text>
<text x="35" y="172" font-size="15.5" font-weight="400" fill="#24313a">可执行测试标记通过 / 失败。</text>
<text x="35" y="201" font-size="15.5" font-weight="400" fill="#24313a">只保留成功与失败并存的组。</text>
<text x="35" y="234" font-size="14" font-weight="400" fill="#53636d">失败轨迹仍可供 grader 调查。</text>
<rect x="316" y="78" width="268" height="181" rx="6" fill="#f1f5f8" stroke="#bfd2de"/>
<text x="333" y="110" font-size="18" font-weight="700" fill="#24313a">2 · 调查成功实现</text>
<text x="333" y="143" font-size="15.5" font-weight="400" fill="#24313a">固定的 MiMo-V2.6-Pro grader</text>
<text x="333" y="172" font-size="15.5" font-weight="400" fill="#24313a">读仓库、轨迹、补丁与测试；</text>
<text x="333" y="201" font-size="15.5" font-weight="400" fill="#24313a">必要时运行针对性检查。</text>
<text x="333" y="234" font-size="14" font-weight="400" fill="#53636d">只给通过测试者排 T1 / T2 / T3。</text>
<rect x="614" y="78" width="268" height="181" rx="6" fill="#f1f7f3" stroke="#bed5c5"/>
<text x="631" y="110" font-size="18" font-weight="700" fill="#24313a">3 · 调整正优势</text>
<text x="631" y="143" font-size="15.5" font-weight="400" fill="#24313a">成功样本先乘质量系数 f，</text>
<text x="631" y="172" font-size="15.5" font-weight="400" fill="#24313a">再共同乘 λ；优者分得更多。</text>
<text x="631" y="201" font-size="15.5" font-weight="400" fill="#24313a">序列优势用于 policy 更新。</text>
<text x="631" y="234" font-size="14" font-weight="400" fill="#53636d">λ 触发上限时还会重新居中。</text>
<path d="M293 169H309m-6-6 6 6-6 6" fill="none" stroke="#71818b" stroke-width="2.2"/>
<path d="M591 169H607m-6-6 6 6-6 6" fill="none" stroke="#71818b" stroke-width="2.2"/>
<text x="18" y="291" font-size="14" font-weight="400" fill="#53636d">据论文 Figure 1、第 3 节与附录 A.2 重绘；在线 grader 保持固定。</text>
</g>
</svg>
