<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">GAGAR shared checkpoint results</title>
  <desc id="d">At training step 28 on DeepSWE, GAGAR reaches 62.2 percent pass rate versus 50.2 for the binary baseline, while using fewer turns and tokens. Quality audit scores are based on 30 tasks and Claude Opus 5.</desc>
  <rect width="1200" height="620" fill="#fbfbf8"/>
  <text x="68" y="58" font-family="Arial,sans-serif" font-size="18" fill="#69737c">DEEPSWE V1.1 · SHARED CHECKPOINT AT STEP 28</text>
  <text x="68" y="102" font-family="Georgia,serif" font-size="36" fill="#172028">The controlled comparison is strongest at the shared step</text>
  <g font-family="Arial,sans-serif">
    <text x="92" y="178" font-size="17" font-weight="700" fill="#172028">Pass rate avg@3</text>
    <rect x="92" y="205" width="390" height="44" fill="#dfe4e6"/><rect x="92" y="205" width="315" height="44" fill="#8a969d"/>
    <text x="418" y="234" font-size="20" font-weight="700" fill="#172028">50.2</text>
    <rect x="92" y="266" width="390" height="44" fill="#dfe4e6"/><rect x="92" y="266" width="390" height="44" fill="#2f6f98"/>
    <text x="494" y="295" font-size="20" font-weight="700" fill="#2f6f98">62.2</text>
    <text x="92" y="341" font-size="14" fill="#69737c">binary baseline / GAGAR</text>

    <rect x="560" y="164" width="254" height="174" fill="#f1f4f3" stroke="#d0d7d9"/>
    <text x="584" y="201" font-size="16" fill="#69737c">Mean turns</text>
    <text x="584" y="248" font-size="29" fill="#8a969d">132.3</text>
    <text x="690" y="248" font-size="22" fill="#69737c">→</text>
    <text x="730" y="248" font-size="29" font-weight="700" fill="#2f7d6b">111.6</text>
    <text x="584" y="299" font-size="16" fill="#2f7d6b">−15.6%</text>

    <rect x="846" y="164" width="286" height="174" fill="#f1f4f3" stroke="#d0d7d9"/>
    <text x="870" y="201" font-size="16" fill="#69737c">Mean tokens</text>
    <text x="870" y="248" font-size="29" fill="#8a969d">191.9k</text>
    <text x="980" y="248" font-size="22" fill="#69737c">→</text>
    <text x="1020" y="248" font-size="29" font-weight="700" fill="#2f7d6b">172.9k</text>
    <text x="870" y="299" font-size="16" fill="#2f7d6b">−9.9%</text>

    <line x1="68" y1="388" x2="1132" y2="388" stroke="#cfd5d8"/>
    <text x="68" y="432" font-size="17" font-weight="700" fill="#172028">Separate quality audit</text>
    <text x="68" y="470" font-size="16" fill="#34414a">30 randomly sampled DeepSWE tasks · up to 3 rollouts per method · Claude Opus 5 as judge</text>
    <text x="68" y="521" font-size="24" font-weight="700" fill="#2f6f98">4.03 vs 3.70</text>
    <text x="282" y="521" font-size="16" fill="#34414a">rubric-weighted quality score</text>
    <text x="648" y="521" font-size="24" font-weight="700" fill="#2f6f98">69.8%</text>
    <text x="756" y="521" font-size="16" fill="#34414a">average win rate among passing candidates</text>
    <text x="68" y="573" font-size="14" fill="#a84b47">No multi-seed uncertainty or human code-review study is reported.</text>
  </g>
</svg>
