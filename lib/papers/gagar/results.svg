<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">GAGAR 同训练步数的结果与质量审计</title>
  <desc id="d">DeepSWE 第 28 步，GAGAR 三次采样平均通过率为 62.2%，二元奖励基线为 50.2%。交互轮数和文本量下降。单独的 30 任务代码审计质量分为 4.03 对 3.70。</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.title{font-size:32px;font-weight:750}.p{font-size:18px;fill:#53616b}.label{font-size:19px;font-weight:700}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:25px;font-weight:700}.small{font-size:16px;fill:#65717a}</style>
  <rect width="1200" height="620" fill="#fff"/>
  <text x="52" y="45" class="small">DeepSWE v1.1 · 两种方法共同到达的第 28 个训练步骤</text>
  <text x="52" y="91" class="title">通过率提高，同时少用一些交互轮数与文本</text>
  <text x="52" y="138" class="label">三次采样平均通过率 · 0-100% 共同刻度</text>
  <g stroke="#dde3e6"><path d="M174 171V319M256 171V319M338 171V319M420 171V319M502 171V319M584 171V319"/></g>
  <g class="small" text-anchor="middle"><text x="174" y="340">0</text><text x="256" y="340">20</text><text x="338" y="340">40</text><text x="420" y="340">60</text><text x="502" y="340">80</text><text x="584" y="340">100%</text></g>
  <text x="52" y="211" class="p">二元奖励</text><rect x="174" y="180" width="205.82" height="45" fill="#8e9aa3"/><text x="393" y="211" class="num">50.2</text>
  <text x="52" y="283" class="p">GAGAR</text><rect x="174" y="252" width="255.02" height="45" fill="#33749b"/><text x="442" y="283" class="num" fill="#245f87">62.2</text>
  <rect x="638" y="128" width="242" height="219" fill="#f5f7f8" stroke="#d5dce0"/>
  <text x="658" y="163" class="label">平均交互轮数</text><text x="658" y="205" class="p">二元奖励</text><text x="860" y="205" class="num" text-anchor="end">132.3</text><text x="658" y="251" class="p">GAGAR</text><text x="860" y="251" class="num" text-anchor="end" fill="#2f7d6b">111.6</text><text x="658" y="315" class="label" fill="#2f7d6b">下降 15.6%</text>
  <rect x="900" y="128" width="248" height="219" fill="#f5f7f8" stroke="#d5dce0"/>
  <text x="920" y="163" class="label">平均文本量 · tokens</text><text x="920" y="205" class="p">二元奖励</text><text x="1128" y="205" class="num" text-anchor="end">191.9k</text><text x="920" y="251" class="p">GAGAR</text><text x="1128" y="251" class="num" text-anchor="end" fill="#2f7d6b">172.9k</text><text x="920" y="315" class="label" fill="#2f7d6b">下降 9.9%</text>
  <path d="M52 381H1148" stroke="#d5dce0"/>
  <text x="52" y="422" class="label">另外抽取 30 个任务，独立审查代码质量</text>
  <text x="52" y="457" class="p">每种方法最多三次尝试；由 Claude Opus 5 评分，与训练时的评分模型不同。</text>
  <text x="52" y="511" class="num" fill="#245f87">4.03 / 3.70</text><text x="261" y="511" class="p">GAGAR / 基线质量分</text>
  <text x="615" y="511" class="num" fill="#245f87">69.8%</text><text x="743" y="511" class="p">成功候选中的平均胜率</text>
  <text x="52" y="552" class="p">在 65.0% 的组中排名第一（平局均分）；69.8% 胜率只计算通过测试的候选。</text>
  <text x="52" y="590" class="small">根据论文 §4 与 Figures 2-3 重绘。没有多个训练随机种子或人工代码审查实验。</text>
</svg>
