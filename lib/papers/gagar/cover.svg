<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">GAGAR 方法概览</title>
  <desc id="d">同一道编程任务生成十六次尝试。测试先筛出成功实现，能检查代码的判分 Agent 再比较质量，并在成功实现之间重新分配正训练权重。</desc>
  <rect width="1200" height="675" fill="#f7f4ec"/>
  <text x="72" y="70" font-family="Arial,sans-serif" font-size="18" fill="#69737c">代码 Agent（能读写代码仓库的模型系统）强化学习 · 组内质量归因</text>
  <text x="72" y="122" font-family="Georgia,serif" font-size="43" fill="#172028">测试先判断成功或失败；</text>
  <text x="72" y="172" font-family="Georgia,serif" font-size="43" fill="#172028">判分 Agent 再区分好代码和差代码</text>
  <g font-family="Arial,sans-serif">
    <rect x="72" y="236" width="240" height="230" fill="#e7eef2" stroke="#9babb5"/>
    <text x="94" y="275" font-size="20" font-weight="700" fill="#235f86">每题 16 次完整尝试</text>
    <text x="94" y="316" font-size="16" fill="#34414a">✓ 精准修复</text>
    <text x="94" y="348" font-size="16" fill="#34414a">✓ 通过测试但绕过问题</text>
    <text x="94" y="380" font-size="16" fill="#34414a">✓ 大范围重写</text>
    <text x="94" y="412" font-size="16" fill="#a84b47">✕ 测试失败</text>
    <text x="94" y="448" font-size="14" fill="#69737c">保留成功与失败并存的组</text>
    <path d="M322 351H406" stroke="#50758d" stroke-width="3" marker-end="url(#a)"/>
    <rect x="416" y="220" width="346" height="262" fill="#fff" stroke="#788b97" stroke-width="2"/>
    <text x="442" y="258" font-size="20" font-weight="700" fill="#172028">判分 Agent</text>
    <text x="442" y="294" font-size="15" fill="#34414a">任务 + 仓库 + 轨迹 + 代码改动 + 测试</text>
    <line x1="442" y1="315" x2="736" y2="315" stroke="#d3d8da"/>
    <text x="442" y="346" font-size="15" fill="#34414a">方案 · 准确性 · 改动是否精简</text>
    <text x="442" y="376" font-size="15" fill="#34414a">副作用 · 是否符合现有代码约定</text>
    <text x="442" y="420" font-size="18" font-weight="700" fill="#2f7d6b">T1 1.0 / 0.9</text>
    <text x="585" y="420" font-size="18" font-weight="700" fill="#b86538">T2 0.85…0.4</text>
    <text x="442" y="452" font-size="18" font-weight="700" fill="#a84b47">T3 0.2</text>
    <path d="M772 351H854" stroke="#50758d" stroke-width="3" marker-end="url(#a)"/>
    <rect x="864" y="236" width="264" height="230" fill="#e7f1ed" stroke="#7aa496"/>
    <text x="890" y="275" font-size="20" font-weight="700" fill="#2f7d6b">重新分配</text>
    <text x="890" y="316" font-size="16" fill="#34414a">原先奖励相同</text>
    <text x="890" y="346" font-size="16" fill="#34414a">→ 正训练权重不同</text>
    <text x="890" y="389" font-size="15" fill="#34414a">保留质量比例</text>
    <text x="890" y="419" font-size="15" fill="#34414a">恢复正权重总量*</text>
    <text x="890" y="449" font-size="13" fill="#a84b47">*触发 λ 上限时例外</text>
    <text x="72" y="575" font-size="17" font-weight="700" fill="#172028">证据边界</text>
    <text x="72" y="607" font-size="15" fill="#34414a">论文未公开判分提示词、执行轨迹、训练任务或实现，因此无法复原一个真实判分案例。</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#50758d"/></marker></defs>
</svg>
