<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">GAGAR method overview</title>
  <desc id="d">Sixteen coding-agent rollouts are tested, passing implementations are ranked by an agentic grader, and positive advantages are redistributed while the failed trajectories keep their original signal.</desc>
  <rect width="1200" height="675" fill="#f7f4ec"/>
  <text x="72" y="70" font-family="Arial,sans-serif" font-size="18" fill="#69737c">CODE AGENT RL · GROUPWISE QUALITY CREDIT</text>
  <text x="72" y="122" font-family="Georgia,serif" font-size="43" fill="#172028">GAGAR: tests decide pass or fail;</text>
  <text x="72" y="172" font-family="Georgia,serif" font-size="43" fill="#172028">the grader separates good passes from bad passes</text>
  <g font-family="Arial,sans-serif">
    <rect x="72" y="236" width="240" height="230" fill="#e7eef2" stroke="#9babb5"/>
    <text x="94" y="275" font-size="20" font-weight="700" fill="#235f86">16 rollouts / prompt</text>
    <text x="94" y="316" font-size="16" fill="#34414a">✓ focused patch</text>
    <text x="94" y="348" font-size="16" fill="#34414a">✓ passing workaround</text>
    <text x="94" y="380" font-size="16" fill="#34414a">✓ broad rewrite</text>
    <text x="94" y="412" font-size="16" fill="#a84b47">✕ failed tests</text>
    <text x="94" y="448" font-size="14" fill="#69737c">keep mixed-outcome groups</text>
    <path d="M322 351H406" stroke="#50758d" stroke-width="3" marker-end="url(#a)"/>
    <rect x="416" y="220" width="346" height="262" fill="#fff" stroke="#788b97" stroke-width="2"/>
    <text x="442" y="258" font-size="20" font-weight="700" fill="#172028">Agentic grader</text>
    <text x="442" y="294" font-size="15" fill="#34414a">task + repo + trajectory + patch + tests</text>
    <line x1="442" y1="315" x2="736" y2="315" stroke="#d3d8da"/>
    <text x="442" y="346" font-size="15" fill="#34414a">approach · precision · minimality</text>
    <text x="442" y="376" font-size="15" fill="#34414a">side effects · codebase consistency</text>
    <text x="442" y="420" font-size="18" font-weight="700" fill="#2f7d6b">T1 1.0 / 0.9</text>
    <text x="585" y="420" font-size="18" font-weight="700" fill="#b86538">T2 0.85…0.4</text>
    <text x="442" y="452" font-size="18" font-weight="700" fill="#a84b47">T3 0.2</text>
    <path d="M772 351H854" stroke="#50758d" stroke-width="3" marker-end="url(#a)"/>
    <rect x="864" y="236" width="264" height="230" fill="#e7f1ed" stroke="#7aa496"/>
    <text x="890" y="275" font-size="20" font-weight="700" fill="#2f7d6b">Redistribute</text>
    <text x="890" y="316" font-size="16" fill="#34414a">same pass reward</text>
    <text x="890" y="346" font-size="16" fill="#34414a">→ different advantage</text>
    <text x="890" y="389" font-size="15" fill="#34414a">quality ratio retained</text>
    <text x="890" y="419" font-size="15" fill="#34414a">positive sum restored*</text>
    <text x="890" y="449" font-size="13" fill="#a84b47">*unless λ cap is active</text>
    <text x="72" y="575" font-size="17" font-weight="700" fill="#172028">Evidence boundary</text>
    <text x="72" y="607" font-size="15" fill="#34414a">The paper releases no grader prompt, trajectories, training tasks, or implementation. A real grading case cannot be reconstructed.</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#50758d"/></marker></defs>
</svg>
