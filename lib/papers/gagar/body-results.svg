<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">DeepSWE 共同训练步数的通过率</title>
<desc id="desc">第28步三次采样平均通过率：二元奖励基线50.2%，只降权消融56.2%，完整GAGAR62.2%。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">
<rect width="900" height="300" fill="#fff"/>
<text x="18" y="32" font-size="20" font-weight="700" fill="#24313a">共同第 28 步：GAGAR 在 DeepSWE v1.1 的 avg@3 最高</text>
<text x="18" y="57" font-size="14" font-weight="400" fill="#53636d">每题独立采样 3 次后的平均通过率；不是 3 次训练随机种子的均值。</text>
<text x="24" y="111" font-size="16" font-weight="400" fill="#24313a">二元奖励基线</text>
<rect x="173" y="93" width="438.7" height="27" rx="3" fill="#aebdc7"/>
<text x="781" y="113" font-size="17" font-weight="700" fill="#24313a">50.2%</text>
<text x="24" y="168" font-size="16" font-weight="400" fill="#24313a">只降权消融</text>
<rect x="173" y="150" width="491.1" height="27" rx="3" fill="#d5a478"/>
<text x="781" y="170" font-size="17" font-weight="700" fill="#24313a">56.2%</text>
<text x="24" y="225" font-size="16" font-weight="400" fill="#24313a">完整 GAGAR</text>
<rect x="173" y="207" width="543.5" height="27" rx="3" fill="#2d759e"/>
<text x="781" y="227" font-size="17" font-weight="700" fill="#24313a">62.2%</text>
<text x="18" y="282" font-size="14" font-weight="400" fill="#53636d">完整方法与二元基线同起点；只降权是独立消融，且未重新居中。</text>
</g>
</svg>
