<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="785" viewBox="0 0 1000 785" role="img" aria-labelledby="title desc">
<title id="title">GAGAR 第 28 步结果与独立代码质量审计</title><desc id="desc">同训练步数比较，通过率提升，交互轮数和文本量下降。另有三十任务代码审计，胜率只统计成功候选；没有多个训练随机种子。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.title{font-size:33px;font-weight:750}.head{font-size:27px;font-weight:700}.body{font-size:25px;fill:#46545d}.small{font-size:23px;fill:#56646d}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:28px;font-weight:650}</style>
<rect width="1000" height="785" fill="#fff"/>
<text x="40" y="53" class="title">共同到达第 28 步：通过率提高，轮数与文本量下降</text>
<text x="40" y="95" class="body">DeepSWE v1.1；三次采样平均，不等于三次训练的平均。</text>
<rect x="40" y="126" width="920" height="60" fill="#f1f4f6"/>
<g class="head"><text x="64" y="165">指标</text><text x="495" y="165" text-anchor="middle">二元奖励</text><text x="708" y="165" text-anchor="middle">GAGAR</text><text x="880" y="165" text-anchor="middle">变化</text></g>
<g class="body"><text x="64" y="238">通过率</text><text x="64" y="303">平均交互轮数</text><text x="64" y="368">平均文本量（tokens）</text></g>
<g class="num" text-anchor="middle"><text x="495" y="238">50.2%</text><text x="708" y="238" fill="#245f87">62.2%</text><text x="495" y="303">132.3</text><text x="708" y="303">111.6</text><text x="495" y="368">191.9k</text><text x="708" y="368">172.9k</text></g>
<g class="small" text-anchor="middle"><text x="880" y="238">+12.0 pp</text><text x="880" y="303">−15.6%</text><text x="880" y="368">−9.9%</text></g>
<path d="M40 262H960M40 327H960M40 392H960" stroke="#d2dade"/>
<rect x="40" y="424" width="920" height="218" fill="#f2f6f4" stroke="#c6d8cf"/>
<text x="64" y="468" class="head" fill="#356954">另抽 30 个任务，独立审查代码质量</text>
<text x="64" y="510" class="body">每方法最多三次尝试，由 Claude Opus 5 评分。</text>
<text x="64" y="553" class="body">质量分：GAGAR 4.03，基线 3.70；审计包含失败尝试。</text>
<text x="64" y="595" class="body">成功候选中的平均胜率为 69.8%；65.0% 的组排名第一。</text>
<text x="64" y="628" class="small">第一名平局均分；69.8% 的分母排除了测试失败候选。</text>
<text x="40" y="696" class="body">代码质量审计的评分模型与训练判分模型不同。</text>
<text x="40" y="736" class="small">根据 §4 与 Figures 2–3 重绘；未报告多训练种子或人工审查实验。</text>
<text x="40" y="767" class="small">pp 表示百分点；下降比例由显示值复算，不是模型推理总成本。</text>
</svg>
