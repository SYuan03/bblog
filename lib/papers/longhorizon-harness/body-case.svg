<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="980" viewBox="0 0 1000 980" role="img" aria-labelledby="title desc">
  <title id="title">LongHorizon-Harness：WEB_task_16 的证据缺口与恢复</title>
  <desc id="desc">任务要求用浏览器图表、JSON与Wireshark抓包交叉核查WebRTC视频层。Baseline识别Decode As无响应后仍重试400多步，只解码一条流，得0.59。LongHorizon保存已核验进度与未解决阻碍，继续补缺失证据，得0.92。评分者是WeaveBench最终judge，不是内部Auditor。</desc>
  <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#20252d;font-size:25px}.heading{font-size:32px;font-weight:750}.label{font-size:27px;font-weight:700;fill:#365f85}.muted{fill:#596575;font-size:22px}.box{fill:#f5f7fa;stroke:#d7dee7;stroke-width:2}.line{stroke:#d7dee7;stroke-width:2}.bad{fill:#8c4646}.good{fill:#357067}.number{font-size:32px;font-weight:750}</style>
  <rect width="1000" height="980" fill="#fff"/>
  <text class="heading" x="40" y="56">已知道界面卡住，接下来怎样继续任务？</text>
  <text class="muted" x="40" y="97">论文 WEB_task_16；依据 §3.4、Figures 7 / 14 整理，不是 UI 截图。</text>
  <rect class="box" x="40" y="131" width="920" height="138"/>
  <text class="label" x="62" y="176">任务：交叉核查 WebRTC 同时发送的多层视频</text>
  <text x="62" y="217">所需证据：浏览器图表、JSON 状态、Wireshark 抓包。</text>
  <text class="muted" x="62" y="254">发现卡顿不是终点；最终交付仍要覆盖这些要求。</text>
  <text class="label bad" x="40" y="321">Baseline：诊断没有改变后续动作</text>
  <text x="40" y="363">已判断 Decode As 对话框无响应，仍重试同一个交互 400 多步。</text>
  <text x="40" y="404">只解码一个数据流，剩余证据没有完成。</text>
  <line class="line" x1="40" y1="432" x2="960" y2="432"/>
  <text class="label good" x="40" y="481">LongHorizon：把已核验进度与未解决阻碍分开保存</text>
  <rect class="box" x="40" y="512" width="920" height="108"/>
  <text x="62" y="553">Auditor：记录已验证的浏览器结果，以及 Wireshark 的阻碍。</text>
  <text class="muted" x="62" y="594">写进 task state 后，下一轮不必重做已确认的部分。</text>
  <path d="M500 632v27m-8-9 8 9 8-9" fill="none" stroke="#365f85" stroke-width="3"/>
  <rect class="box" x="40" y="677" width="920" height="110"/>
  <text x="62" y="719">Manager：只派缺失证据；Executor 继续补图表、JSON 和抓包。</text>
  <text class="muted" x="62" y="760">内部 Auditor 核验进度；它不负责论文里的最终分数。</text>
  <text class="label" x="40" y="841">最终由 WeaveBench judge 核对要求、文件和完整轨迹</text>
  <text class="number bad" x="40" y="893">Baseline 0.59</text>
  <text class="number good" x="470" y="893">LongHorizon 0.92</text>
  <text class="muted" x="40" y="950">这是同题的细粒度评分；不是二值成功率，也不说明每次恢复都能奏效。</text>
</svg>
