<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1280" viewBox="0 0 600 1280" role="img" aria-labelledby="title desc">
<title id="title">一个真实症状分类输入怎样得分</title>
<desc id="desc">官方测试数据第一行的症状文本与标准标签；本文编写的两个输出经格式归一化，标签相同得一分，标签不同得零分。它们不是模型执行记录。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52677b"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#24292f}.muted{fill:#536171}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.box{fill:#f5f7f9;stroke:#dce2e8}.line{stroke:#52677b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="600" height="1280" fill="#fff"/>
<text x="32" y="48" font-size="27" font-weight="700">真实输入 → 提取标签 → 精确匹配</text>
<text x="32" y="78" font-size="18" class="muted">Symptom2Disease · 发布测试集第一行</text>
<rect x="32" y="105" width="536" height="220" rx="4" class="box"/>
<text x="50" y="138" font-size="21" font-weight="700">模型看到的症状</text>
<text x="50" y="174" font-size="19"><tspan x="50">I have a burning sensation in my stomach</tspan><tspan x="50" dy="29">that comes and goes. It's worse when I eat</tspan><tspan x="50" dy="29">and when I lie down. I also have heartburn</tspan><tspan x="50" dy="29">and indigestion.</tspan></text>
<text x="50" y="303" font-size="17" class="muted">历史样例可由 harness 提供；当前题标签用于判分。</text>
<path d="M300 329V364" class="line"/>
<rect x="32" y="380" width="536" height="153" rx="4" class="box"/>
<text x="50" y="416" font-size="21" font-weight="700">两条待评分输出（本文编写）</text>
<text x="50" y="455" font-size="19" class="mono">A: Peptic ulcer disease.</text>
<text x="50" y="489" font-size="19" class="mono">B: gastritis</text>
<text x="50" y="519" font-size="17" class="muted">可放在 JSON final_answer 或 DIAGNOSIS 标签中。</text>
<path d="M300 537V572" class="line"/>
<rect x="32" y="588" width="536" height="216" rx="4" class="box"/>
<text x="50" y="625" font-size="21" font-weight="700">官方 judge 做什么</text>
<text x="50" y="666" font-size="20"><tspan x="50">1. 提取答案字段或疾病标签内容。</tspan><tspan x="50" dy="33">2. 转小写，整理空白，去掉末尾 . ! ?。</tspan><tspan x="50" dy="33">3. 与标准标签逐字符比较。</tspan></text>
<text x="50" y="785" font-size="18" class="muted">这一步不调用另一个语言模型，也不判医学合理性。</text>
<path d="M300 808V843" class="line"/>
<rect x="32" y="859" width="536" height="201" rx="4" class="box"/>
<text x="50" y="897" font-size="20" font-weight="700">文件中的标准标签</text>
<text x="50" y="933" font-size="21" class="mono">peptic ulcer disease</text>
<text x="50" y="975" font-size="21" fill="#2f7d6b">A 归一化后相同 → 得 1</text>
<text x="50" y="1015" font-size="21" fill="#a84b47">B 仍是 gastritis → 得 0</text>
<text x="32" y="1110" font-size="19" font-weight="700">分数再怎样汇总？</text>
<text x="32" y="1146" font-size="19"><tspan x="32">数据集准确率 = 答对数 ÷ 测试样例数。</tspan><tspan x="32" dy="31">Table 2 再等权平均三个数据集的准确率。</tspan></text>
<text x="32" y="1220" font-size="16" class="muted"><tspan x="32">来源：meta-harness@0cbc31e · data/evaluators.py:79–99</tspan><tspan x="32" dy="25">输入来自上游 MCE 数据；本文不提供医疗建议。</tspan></text>
</svg>
