<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110" role="img" aria-labelledby="title desc">
<title id="title">Video2World 主结果：复合分与任务成功分开</title><desc id="desc">39类任务等权的十套系统主结果。人类辅助74.24复合58.8成功，Fable48.52和25.5，GPT43.55和10.7，其他系统列出。HAR正文57.3冲突保留，模型工具权限不同。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.title{font-size:33px;font-weight:750}.head{font-size:27px;font-weight:700}.body{font-size:25px;fill:#46545d}.small{font-size:23px;fill:#56646d}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:28px;font-weight:650}</style>
<rect width="1000" height="1110" fill="#fff"/>
<text x="40" y="53" class="title">复合分领先，不等于每个任务都完成了</text>
<text x="40" y="95" class="body">V2WScore 与 Task Success 均先类内平均，再对 39 类任务等权。</text>
<rect x="40" y="127" width="920" height="61" fill="#f1f4f6"/>
<g class="head"><text x="64" y="167">系统</text><text x="614" y="167" text-anchor="middle">V2WScore</text><text x="846" y="167" text-anchor="middle">Task Success</text></g>
<g class="body"><text x="64" y="232">HAR 人类辅助重建</text><text x="64" y="290">Fable-5.1</text><text x="64" y="348">GPT-6 Astra</text><text x="64" y="406">Claude Opus 5</text><text x="64" y="464">Kimi K3</text><text x="64" y="522">GPT-5.6 Sol</text><text x="64" y="580">DeepSeek V4.1 Flash</text><text x="64" y="638">Gemini 3.8 Flash</text><text x="64" y="696">Qwen3.8 Max</text><text x="64" y="754">GLM-5.3 Flash</text></g>
<g class="num" text-anchor="middle"><text x="614" y="232">74.24</text><text x="846" y="232">58.8%</text><text x="614" y="290" fill="#245f87">48.52</text><text x="846" y="290" fill="#245f87">25.5%</text><text x="614" y="348">43.55</text><text x="846" y="348">10.7%</text><text x="614" y="406">41.56</text><text x="846" y="406">16.0%</text><text x="614" y="464">33.19</text><text x="846" y="464">4.8%</text><text x="614" y="522">31.00</text><text x="846" y="522">2.5%</text><text x="614" y="580">30.54</text><text x="846" y="580">4.1%</text><text x="614" y="638">30.11</text><text x="846" y="638">2.0%</text><text x="614" y="696">26.55</text><text x="846" y="696">1.5%</text><text x="614" y="754">25.69</text><text x="846" y="754">2.0%</text></g>
<path d="M40 250H960M40 308H960M40 366H960M40 424H960M40 482H960M40 540H960M40 598H960M40 656H960M40 714H960M40 772H960" stroke="#d2dade"/>
<rect x="40" y="807" width="920" height="150" fill="#f7f8f8" stroke="#ccd4d9"/>
<text x="64" y="851" class="head">这些数字的比较条件</text>
<text x="64" y="893" class="body">评测的是九套完整 Agent 系统，执行框架与权限并不完全一样。</text>
<text x="64" y="935" class="body">HAR 58.8 来自 Table 2；§9.5 另写 57.3，本文不替作者消除冲突。</text>
<text x="40" y="1017" class="body">更小几何误差不一定带来更高 Task Success，二者分别检查。</text>
<text x="40" y="1065" class="small">根据 Table 2 重绘；HAR 是人类辅助重建，不是完全自动模型。</text>
<text x="40" y="1095" class="small">完整模型表、预算、适用指标与缺失测量处理见相邻正文。</text>
</svg>
