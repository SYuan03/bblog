<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
<title id="title">Video2World protocol</title><desc id="desc">Visible inputs, hidden references, submission package, simulator execution and evaluator outputs.</desc>
<style>.t{font:700 27px Arial;fill:#17242b}.s{font:21px Arial;fill:#41505a}.k{font:700 17px Arial;fill:#2d7297;letter-spacing:1px}.box{fill:#fff;stroke:#c7d0d3;stroke-width:2}.a{stroke:#2d7297;stroke-width:5;fill:none}.h{fill:#f8f4e8;stroke:#bd6a39;stroke-width:2}</style>
<rect width="1400" height="680" fill="#f7f6f1"/>
<rect x="36" y="52" width="300" height="480" rx="8" class="box"/><text x="66" y="96" class="k">AGENT CAN SEE</text><text x="66" y="142" class="t">公开输入</text><text x="66" y="190" class="s">RGB 视频、尺寸、帧数</text><text x="66" y="229" class="s">robot assets 与关节限制</text><text x="66" y="268" class="s">simulator / control 说明</text><text x="66" y="307" class="s">文件、shell、图像工具</text><text x="66" y="346" class="s">自己 candidate 的执行诊断</text>
<rect x="36" y="555" width="300" height="88" rx="8" class="h"/><text x="60" y="590" class="k" style="fill:#a85631">HIDDEN</text><text x="60" y="622" class="s">reference scene、轨迹、相机、judge</text>
<path d="M358 292h100" class="a"/><path d="M447 276l24 16-24 16" fill="#2d7297"/>
<rect x="480" y="82" width="390" height="430" rx="8" class="box"/><text x="512" y="126" class="k">SUBMISSION PACKAGE</text><text x="512" y="175" class="t">可执行交付物</text><text x="512" y="228" class="s">protocol.json</text><text x="512" y="270" class="s">actions.npy</text><text x="512" y="312" class="s">scene.json 或 scene.xml</text><text x="512" y="354" class="s">本地 meshes / textures / assets</text><text x="512" y="396" class="s">可选 expected/obj_poses.npy</text><text x="512" y="438" class="s">source/ 与 report.md</text><text x="512" y="482" class="s" font-weight="700">物体必须由机器人和 physics 推动</text>
<path d="M892 292h100" class="a"/><path d="M981 276l24 16-24 16" fill="#2d7297"/>
<rect x="1014" y="52" width="350" height="590" rx="8" class="box"/><text x="1046" y="96" class="k">EVALUATOR</text><text x="1046" y="142" class="t">执行与评分</text><text x="1046" y="194" class="s">1. 构建并校验 package</text><text x="1046" y="233" class="s">2. 在指定 simulator 执行</text><text x="1046" y="272" class="s">3. 记录 object / robot states</text><text x="1046" y="311" class="s">4. task judge 判定功能</text><text x="1046" y="350" class="s">5. 对齐 reference 算几何与轨迹</text><text x="1046" y="408" class="k">OUTPUTS</text><text x="1046" y="451" class="s">Build · Success · Progress</text><text x="1046" y="490" class="s">Scene / Shape / Size</text><text x="1046" y="529" class="s">T-APE · R-APE · T-RPE</text><text x="1046" y="583" class="s" font-weight="700">先 instance，再 family 等权平均</text>
</svg>
