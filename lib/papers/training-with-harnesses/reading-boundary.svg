<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1080" viewBox="0 0 600 1080" role="img" aria-labelledby="title desc">
<title id="title">什么能够学，什么仍须实时执行</title><desc id="desc">论文讨论三类 harness：重新组织已有输入，处理动态检索内容，访问实时外部事实或执行程序。仅前两类有实验。对代码生成的启发是学会何时执行怎样读反馈，不能提前内化尚未发生的执行结果。</desc>
<defs><style>text{font-family:"PingFang SC",Arial,sans-serif;fill:#24292f}.title{font-size:32px;font-weight:700}.h{font-size:29px;font-weight:700}.b{font-size:28px}.s{font-size:24px;fill:#536171}</style></defs>
<rect width="600" height="1080" fill="#fff"/>
<text class="title" x="28" y="50">什么可学，什么仍需执行？</text>
<text class="s" x="28" y="91">Appendix C 的讨论 · 不是三类都做了实验</text>
<rect x="28" y="126" width="544" height="184" rx="8" fill="#eef4fa" stroke="#a9c5df" stroke-width="2"/>
<text class="h" x="48" y="168">① 重新组织已有输入</text>
<text class="b" x="48" y="212">先规划再计算、检查常见错误。</text>
<text class="s" x="48" y="254">论文用 Plan-Solve 验证了部分收益，</text>
<text class="s" x="48" y="290">不能推出任意规划流程都能被内化。</text>
<rect x="28" y="346" width="544" height="220" rx="8" fill="#f5f7f9" stroke="#d1dbe4" stroke-width="2"/>
<text class="h" x="48" y="388">② 处理动态检索内容</text>
<text class="b" x="48" y="432">比较案例、修订初步标签的做法</text>
<text class="b" x="48" y="472">可以学；新的案例不能提前存入。</text>
<text class="s" x="48" y="515">Draft-Verify 实验展示比较句式增加，</text>
<text class="s" x="48" y="550">没有验证模型回忆的案例一定真实。</text>
<rect x="28" y="602" width="544" height="226" rx="8" fill="#f5f7f9" stroke="#d1dbe4" stroke-width="2"/>
<text class="h" x="48" y="644">③ 当前外部事实／执行结果</text>
<text class="b" x="48" y="688">网页、编译报错、游戏运行状态。</text>
<text class="b" x="48" y="730">这些结果仍需要真实访问或执行。</text>
<text class="s" x="48" y="774">论文没有这类实验；能否学会更好地</text>
<text class="s" x="48" y="810">调用工具，需要另行验证。</text>
<text class="h" x="28" y="889">对 game coding 的启发（本文推论）</text>
<text class="b" x="28" y="933">训练何时运行、怎样读反馈、修哪里。</text>
<text class="b" x="28" y="974">不把未知的执行结果当成已知事实。</text>
<text class="s" x="28" y="1040">根据 Appendix C 改编 · 游戏部分非论文实验</text>
</svg>
