<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
  <title id="title">Math internalization groups</title>
  <desc id="desc">Math questions are grouped by whether the base student and its harness can solve them. OPHSD preserves 98.10 percent of jointly solvable questions and solves 84.62 percent of questions that only the harness could originally solve.</desc>
  <defs><style>.t{font-family:Inter,"PingFang SC",Arial,sans-serif;fill:#19242b}.title{font-size:50px;font-weight:760}.sub{font-size:23px;fill:#52616a}.h{font-size:25px;font-weight:720}.b{font-size:19px}.s{font-size:16px;fill:#5c6a72}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:35px;font-weight:760}</style></defs>
  <rect width="1600" height="880" fill="#fbfaf6"/>
  <text class="t title" x="70" y="80">模型究竟吸收了什么？先看 capability-gap 分组</text>
  <text class="t sub" x="70" y="122">论文先用 base Qwen3-8B 与 Plan-Solve harness 的 pass rate，把 765 道数学题分成四组。</text>

  <rect x="70" y="198" width="340" height="480" rx="12" fill="#eaf5f0" stroke="#2f7d6b" stroke-width="3"/>
  <text class="t h" x="240" y="248" text-anchor="middle">Base ✓　Harness ✓</text><text class="t s" x="240" y="282" text-anchor="middle">n = 316</text><text class="t num" x="240" y="380" text-anchor="middle">98.10%</text><text class="t b" x="240" y="424" text-anchor="middle">训练后仍能通过</text><text class="t s" x="240" y="468" text-anchor="middle">310 / 316</text><text class="t s" x="240" y="548" text-anchor="middle">说明原有能力基本保留</text>

  <rect x="442" y="198" width="340" height="480" rx="12" fill="#e8f1f7" stroke="#2f6f98" stroke-width="3"/>
  <text class="t h" x="612" y="248" text-anchor="middle">Base ✗　Harness ✓</text><text class="t s" x="612" y="282" text-anchor="middle">n = 156</text><text class="t num" x="612" y="380" text-anchor="middle">84.62%</text><text class="t b" x="612" y="424" text-anchor="middle">训练后 standalone 通过</text><text class="t s" x="612" y="468" text-anchor="middle">132 / 156</text><text class="t s" x="612" y="548" text-anchor="middle">这是“吸收 harness 增益”</text><text class="t s" x="612" y="576" text-anchor="middle">最直接的一组证据</text>

  <rect x="814" y="198" width="340" height="480" rx="12" fill="#f3f3ef" stroke="#7d898f" stroke-width="3"/>
  <text class="t h" x="984" y="248" text-anchor="middle">Base ✓　Harness ✗</text><text class="t s" x="984" y="282" text-anchor="middle">n = 6</text><text class="t num" x="984" y="380" text-anchor="middle">100%</text><text class="t b" x="984" y="424" text-anchor="middle">训练后通过</text><text class="t s" x="984" y="468" text-anchor="middle">样本只有 6 道</text><text class="t s" x="984" y="548" text-anchor="middle">数量太小，不宜外推</text>

  <rect x="1186" y="198" width="340" height="480" rx="12" fill="#fff0e6" stroke="#b86538" stroke-width="3"/>
  <text class="t h" x="1356" y="248" text-anchor="middle">Base ✗　Harness ✗</text><text class="t s" x="1356" y="282" text-anchor="middle">n = 287</text><text class="t num" x="1356" y="380" text-anchor="middle">12.54%</text><text class="t b" x="1356" y="424" text-anchor="middle">训练后新增通过</text><text class="t s" x="1356" y="468" text-anchor="middle">约 36 / 287</text><text class="t s" x="1356" y="548" text-anchor="middle">可能有一般训练收益，</text><text class="t s" x="1356" y="576" text-anchor="middle">不全能归因于 harness</text>

  <rect x="238" y="744" width="1124" height="70" rx="35" fill="#19242b"/>
  <text x="800" y="788" text-anchor="middle" font-family="Inter,PingFang SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">最有说服力的是第二组；但论文没有拆掉 plan、答案提示和额外调用来做因果消融</text>
</svg>
