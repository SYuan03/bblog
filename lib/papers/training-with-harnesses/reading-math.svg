<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1320" viewBox="0 0 600 1320" role="img" aria-labelledby="title desc">
<title id="title">为什么系数是40</title><desc id="desc">OlympiadBench idx649求f(f(x))的x十次方系数。外层展开含1、2、4、8个因子，对应贡献0、2、10、28。两因子2与8顺序的选择须算两次；漏一项得到39。该计算由文章复算，不是模型日志。</desc>
<defs><style>text{font-family:"PingFang SC",Arial,sans-serif;fill:#24292f}.title{font-size:32px;font-weight:700}.h{font-size:29px;font-weight:700}.b{font-size:28px}.s{font-size:24px;fill:#536171}.v{font-size:31px;font-weight:700;fill:#245e99}</style></defs>
<rect width="600" height="1320" fill="#fff"/>
<text class="title" x="28" y="50">系数 40：一步步计数</text>
<text class="s" x="28" y="89">OlympiadBench idx 649 · Appendix B.2</text>
<text class="b" x="28" y="139">f(x) = x + x² + x⁴ + x⁸ + …</text>
<text class="b" x="28" y="180">求 f(f(x)) 中 x¹⁰ 的系数。</text>
<rect x="28" y="216" width="544" height="130" rx="8" fill="#f5f7f9" stroke="#d1dbe4" stroke-width="2"/>
<text class="h" x="48" y="258">f(x)：一个因子</text><text class="b" x="48" y="300">10 不是 2 的幂。</text><text class="v" x="546" y="300" text-anchor="end">贡献 0</text>
<rect x="28" y="374" width="544" height="188" rx="8" fill="#eef4fa" stroke="#a9c5df" stroke-width="2"/>
<text class="h" x="48" y="416">f(x)²：两个因子</text>
<text class="b" x="48" y="459">指数选 (2,8) 或 (8,2)，两项。</text>
<text class="s" x="48" y="500">乘积相同，但展开式里出现两次。</text>
<text class="v" x="48" y="543">贡献 2；只算一次就会少 1。</text>
<rect x="28" y="590" width="544" height="186" rx="8" fill="#f5f7f9" stroke="#d1dbe4" stroke-width="2"/>
<text class="h" x="48" y="632">f(x)⁴：四个因子</text>
<text class="b" x="48" y="675">(2,2,2,4)：4 个排列</text>
<text class="b" x="48" y="715">(1,1,4,4)：6 个排列</text>
<text class="v" x="48" y="758">贡献 4 + 6 = 10</text>
<rect x="28" y="804" width="544" height="186" rx="8" fill="#eef4fa" stroke="#a9c5df" stroke-width="2"/>
<text class="h" x="48" y="846">f(x)⁸：八个因子</text>
<text class="b" x="48" y="890">六个 1、两个 2，指数和是 10。</text>
<text class="b" x="48" y="930">从八个位置选两个放 2。</text>
<text class="v" x="48" y="972">贡献 C(8,2) = 28</text>
<text class="b" x="28" y="1053">16 个及更多因子的最低指数已超 10。</text>
<text class="v" x="28" y="1103">0 + 2 + 10 + 28 = 40</text>
<text class="b" x="28" y="1154">论文单题：OPHSD 正确 7/8，</text>
<text class="b" x="28" y="1194">OPSD 漏计后答 39，正确 0/8。</text>
<text class="s" x="28" y="1236">7/8 是八份回答的正确数，不是 pass@8。</text>
<text class="s" x="28" y="1284">根据 Appendix B.2 复算重绘 · 非完整模型日志</text>
</svg>
