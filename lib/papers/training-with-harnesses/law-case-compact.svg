<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
<title id="title">LawBench idx 44：重新检索反而丢掉正确标签</title><desc id="desc">同一个训练后模型，直接输出故意伤害和过失致人死亡，集合F1为2/3。重新接入检索流程，五条近邻都含故意伤害，另一组没有过失致人死亡；最终只输出故意伤害，F1为0。数据标准答案是过失致人死亡，原题还包含检方故意伤害指控。</desc>
<defs><style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#24292f}.h{font-size:21px;font-weight:700}.b{font-size:17px}.s{font-size:15px;fill:#526274}.blue{fill:#245e99}.red{fill:#a64b47}.arrow{fill:none;stroke:#617184;stroke-width:1.7;marker-end:url(#a)}</style><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#617184"/></marker></defs>
<rect width="900" height="330" fill="#fff"/><text x="24" y="34" class="h">同一个 OPHSD 模型，两条运行路径</text><text x="24" y="63" class="b">原题含检方“故意伤害”指控；数据标签为“过失致人死亡”。这里评的是标签匹配。</text>
<text x="24" y="124" class="h">直接作答</text><rect x="210" y="90" width="380" height="83" fill="#f2f7fb" stroke="#c9d5e0"/><text x="228" y="121" class="b">输出：故意伤害；过失致人死亡</text><text x="228" y="151" class="s">命中 1 个标签，也多报了 1 个</text><path d="M590 132H664" class="arrow"/><text x="694" y="125" class="h blue">F1 = 2/3 ≈ 0.67</text><text x="694" y="153" class="s">并非全对</text>
<text x="24" y="230" class="h">重新接入检索</text><rect x="210" y="195" width="380" height="91" fill="#fff8f5" stroke="#d9c7bd"/><text x="228" y="223" class="b">5 条近邻都含故意伤害</text><text x="228" y="250" class="b">另一组也没有过失致人死亡标签</text><text x="228" y="276" class="s">draft、verify 最终只输出故意伤害</text><path d="M590 241H664" class="arrow"/><text x="694" y="234" class="h red">F1 = 0</text><text x="694" y="262" class="s">唯一正确标签被丢掉</text>
<text x="24" y="316" class="s">根据 Appendix B.1 的作者报告与 LawBench 原始行、公开 F1 程序重绘；没有重新调用模型。</text>
</svg>
