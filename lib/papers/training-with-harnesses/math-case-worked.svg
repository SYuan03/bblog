<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730" role="img" aria-labelledby="title desc">
  <title id="title">OlympiadBench idx 649：系数 40 的四项来源</title>
  <desc id="desc">f(f(x)) 展开为 f(x)、f(x) 的二次幂、四次幂、八次幂等。x 的十次方系数分别为 0、2、10、28，合计 40。二次幂包含有序对 2,8 和 8,2，漏计一个会得到 39。</desc>
  <defs>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#23303c}
      .title{font-size:38px;font-weight:700}.sub{font-size:24px;fill:#566574}.head{font-size:29px;font-weight:700}.body{font-size:25px}.small{font-size:22px;fill:#566574}.value{font-size:48px;font-weight:700;fill:#215b82}
    </style>
  </defs>
  <rect width="1400" height="730" rx="12" fill="#fbfcfd"/>
  <text class="title" x="52" y="65">为什么是 40：逐项展开，而不是只记住答案</text>
  <text class="sub" x="52" y="108">f(x) = x + x² + x⁴ + x⁸ + …　求 f(f(x)) 中 x¹⁰ 的系数</text>
  <line x1="52" y1="135" x2="1348" y2="135" stroke="#d7e0e6" stroke-width="2"/>
  <text class="head" x="65" y="185">展开项</text>
  <text class="head" x="278" y="185">指数之和为 10 的选择</text>
  <text class="head" x="1220" y="185" text-anchor="middle">贡献</text>
  <rect x="52" y="211" width="1296" height="70" rx="8" fill="#f0f3f6"/>
  <text class="body" x="65" y="256">f(x)</text><text class="body" x="278" y="256">10 不是 2 的幂，没有这一项</text><text class="value" x="1220" y="261" text-anchor="middle">0</text>
  <rect x="52" y="295" width="1296" height="96" rx="8" fill="#eaf2f8"/>
  <text class="body" x="65" y="340">f(x)²</text><text class="body" x="278" y="335">(2, 8)　和　(8, 2)</text><text class="small" x="278" y="370">来自两个不同因子的选择，必须分别计数</text><text class="value" x="1220" y="357" text-anchor="middle">2</text>
  <rect x="52" y="405" width="1296" height="96" rx="8" fill="#f0f3f6"/>
  <text class="body" x="65" y="451">f(x)⁴</text><text class="body" x="278" y="445">(2, 2, 2, 4) 的 4 个排列　＋　(1, 1, 4, 4) 的 6 个排列</text><text class="small" x="278" y="480">分别选择 4 所在的一个位置、两个位置</text><text class="value" x="1220" y="467" text-anchor="middle">10</text>
  <rect x="52" y="515" width="1296" height="96" rx="8" fill="#eaf2f8"/>
  <text class="body" x="65" y="561">f(x)⁸</text><text class="body" x="278" y="555">六个 1、两个 2：从八个位置选两个放 2</text><text class="small" x="278" y="590">C(8, 2) = 28；16 个及更多因子最低指数已超过 10</text><text class="value" x="1220" y="577" text-anchor="middle">28</text>
  <text class="head" x="65" y="658">0 + 2 + 10 + 28 = 40</text><text class="body" x="660" y="658">把 (2, 8) 只计一次　→　39</text>
  <text class="small" x="65" y="704">根据论文 Appendix B.2 重绘 · 数学关系复算，不是模型完整输出</text>
</svg>
