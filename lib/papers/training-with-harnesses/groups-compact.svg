<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="title desc">
<title id="title">Figure4四组题目的训练后通过率</title><desc id="desc">按训练前基础模型和harness能否解题分组：都能解316题，训练后98.10%；只有harness能解156题，84.62%；只有基础模型能解6题，100%；都不能解287题，12.54%。不是所有旧能力都保留。</desc>
<defs><style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#24292f}.h{font-size:21px;font-weight:700}.b{font-size:17px}.s{font-size:15px;fill:#526274}.n{font-size:20px;fill:#245e99;font-weight:700}</style></defs>
<rect width="900" height="310" fill="#fff"/><text x="24" y="34" class="h">原来只有 harness 能解的 156 道题，训练后直接模型解出约 132 道</text>
<path d="M24 56H876" stroke="#dce2e8"/><text x="24" y="86" class="s">训练前的分组</text><text x="350" y="86" class="s">题数</text><text x="453" y="86" class="s">训练后直接模型通过率（0 到 100%）</text>
<text x="24" y="126" class="b">基础模型 ✓ / harness ✓</text><text x="350" y="126" class="b">316</text><rect x="455" y="110" width="284" height="22" fill="#eef1f5"/><rect x="455" y="110" width="278.604" height="22" fill="#8797a8"/><text x="752" y="127" class="n">98.10%</text>
<text x="24" y="169" class="b">基础模型 ✗ / harness ✓</text><text x="350" y="169" class="b">156</text><rect x="455" y="153" width="284" height="22" fill="#eef1f5"/><rect x="455" y="153" width="240.32" height="22" fill="#245e99"/><text x="752" y="170" class="n">84.62%</text>
<text x="24" y="212" class="b">基础模型 ✓ / harness ✗</text><text x="350" y="212" class="b">6</text><rect x="455" y="196" width="284" height="22" fill="#317e6a"/><text x="752" y="213" class="n">100.00%</text>
<text x="24" y="255" class="b">基础模型 ✗ / harness ✗</text><text x="350" y="255" class="b">287</text><rect x="455" y="239" width="284" height="22" fill="#eef1f5"/><rect x="455" y="239" width="35.61" height="22" fill="#a96238"/><text x="752" y="256" class="n">12.54%</text>
<text x="24" y="293" class="s">根据 Figure 4 数值重绘。约 132/156、310/316、36/287 是按已公布的四舍五入比例回算，非逐题结果文件。</text>
</svg>
