<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">OlympiadBench idx 649：为什么答案是40而不是39</title><desc id="desc">求 f(f(x)) 的x十次方系数，f(x)=x+x²+x⁴+x⁸+…。一、二、四、八个因子的贡献分别为0、2、10、28。第二项的2来自有序对(2,8)和(8,2)，漏数一次便得到39。</desc>
<defs><style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#24292f}.h{font-size:21px;font-weight:700}.b{font-size:17px}.s{font-size:15px;fill:#526274}.n{font-size:24px;font-weight:700;fill:#245e99}</style></defs>
<rect width="900" height="300" fill="#fff"/><text x="24" y="34" class="h">f(x) = x + x² + x⁴ + x⁸ + …；求 f(f(x)) 中 x¹⁰ 的系数</text>
<path d="M24 57H876" stroke="#dce2e8"/><text x="34" y="85" class="s">外层展开的项</text><text x="210" y="85" class="s">选各因子的指数，使总和为 10</text><text x="773" y="85" class="s">贡献</text>
<text x="34" y="120" class="b">f(x)</text><text x="210" y="120" class="b">10 不是 2 的整数次幂</text><text x="791" y="120" class="n">0</text>
<text x="34" y="160" class="b">f(x)²</text><text x="210" y="160" class="b">(2, 8) 与 (8, 2) 各出现一次，不能合并</text><text x="791" y="160" class="n">2</text>
<text x="34" y="200" class="b">f(x)⁴</text><text x="210" y="200" class="b">(2,2,2,4) 的 4 个排列 + (1,1,4,4) 的 6 个排列</text><text x="783" y="200" class="n">10</text>
<text x="34" y="240" class="b">f(x)⁸</text><text x="210" y="240" class="b">八个 1 中，选两处换成 2：8 × 7 / 2</text><text x="783" y="240" class="n">28</text>
<path d="M24 260H876" stroke="#dce2e8"/><text x="24" y="287" class="b">总计 40。把第二项只算 1 次就得到 39。根据 Appendix B.2 独立复算，非新模型实验。</text>
</svg>
