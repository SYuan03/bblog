<defs><style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#24292f}.h{font-size:21px;font-weight:700}.b{font-size:17px}.s{font-size:15px;fill:#526274}.blue{fill:#245e99}.num{font-size:20px;font-family:Arial,sans-serif}.bar{fill:#8797a8}.ours{fill:#245e99}</style></defs>
<rect width="900" height="370" fill="#fff"/><text x="24" y="34" class="h">数学四项平均 pass@8：最高分与固定终点分别比较</text>
