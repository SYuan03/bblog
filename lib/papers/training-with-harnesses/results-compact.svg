<text x="24" y="160" class="b">GRPO</text><rect x="170" y="142" width="166.425" height="23" class="bar"/><text x="354" y="161" class="num">66.57</text><rect x="527" y="142" width="162.5" height="23" class="bar"/><text x="710" y="161" class="num">65.00 ± 0.18</text>
