<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Three regimes of harness distillability</title>
  <desc id="desc">Procedures over the input can be fully distilled, procedures over dynamic content can only be partially distilled, and real-time external facts or execution results cannot be stored in model parameters in advance.</desc>
  <defs><style>.t{font-family:Inter,"PingFang SC",Arial,sans-serif;fill:#19242b}.title{font-size:50px;font-weight:760}.sub{font-size:23px;fill:#52616a}.h{font-size:26px;font-weight:720}.b{font-size:19px}.s{font-size:16px;fill:#5c6a72}</style></defs>
  <rect width="1600" height="850" fill="#fbfaf6"/>
  <text class="t title" x="70" y="80">什么能写进参数，什么仍要在运行时执行？</text>
  <text class="t sub" x="70" y="122">判断标准：部署时只给模型输入 x，它能否仅凭 x 与参数重现 harness 的优势？</text>
  <rect x="70" y="202" width="454" height="468" rx="12" fill="#eaf5f0" stroke="#2f7d6b" stroke-width="3"/>
  <text class="t h" x="297" y="254" text-anchor="middle">较容易内化</text><text class="t b" x="297" y="305" text-anchor="middle">只重新组织输入 x 的过程</text><text class="t s" x="110" y="354">• 先规划，再计算</text><text class="t s" x="110" y="394">• 显式检查常见陷阱</text><text class="t s" x="110" y="434">• 对候选答案做自我比较</text><text class="t b" x="110" y="510">论文例子</text><text class="t s" x="110" y="548">Plan-Solve 的结构化拆题习惯</text><text class="t s" x="110" y="582">训练后可用一次普通推理重现</text>
  <rect x="573" y="202" width="454" height="468" rx="12" fill="#fff0e6" stroke="#b86538" stroke-width="3"/>
  <text class="t h" x="800" y="254" text-anchor="middle">只能部分内化</text><text class="t b" x="800" y="305" text-anchor="middle">过程可学，动态内容不可预存</text><text class="t s" x="613" y="354">• 先检索相似案例</text><text class="t s" x="613" y="394">• 对支持与反例做比较</text><text class="t s" x="613" y="434">• 再修订初稿</text><text class="t b" x="613" y="510">论文例子</text><text class="t s" x="613" y="548">Draft-Verify 的比较结构可迁移</text><text class="t s" x="613" y="582">但 memory bank 的案例本身不会凭空出现</text>
  <rect x="1076" y="202" width="454" height="468" rx="12" fill="#fff0ee" stroke="#a84b47" stroke-width="3"/>
  <text class="t h" x="1303" y="254" text-anchor="middle">不能提前内化</text><text class="t b" x="1303" y="305" text-anchor="middle">结果依赖当前外部世界</text><text class="t s" x="1116" y="354">• 当前网页搜索结果</text><text class="t s" x="1116" y="394">• 当前代码的 compile / test 输出</text><text class="t s" x="1116" y="434">• 当前游戏 build 的运行状态</text><text class="t b" x="1116" y="510">对 game coding 的含义</text><text class="t s" x="1116" y="548">可训练“何时执行、怎样利用结果”</text><text class="t s" x="1116" y="582">但执行本身仍必须发生</text>
  <rect x="278" y="738" width="1044" height="62" rx="31" fill="#19242b"/>
  <text x="800" y="778" text-anchor="middle" font-family="Inter,PingFang SC,Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">论文只实证前两类；对真实工具调用的判断来自 Appendix C 的讨论，不是实验结果</text>
</svg>
