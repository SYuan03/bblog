<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1300" viewBox="0 0 600 1300" role="img" aria-labelledby="title desc">
<title id="title">LawBench idx 44 真实检索失败</title><desc id="desc">数据集标准标签是过失致人死亡。直接作答输出两个罪名，包含标准标签，F1 为2/3。重新挂 Draft-Verify 后五个近邻都含故意伤害，不同标签的近邻也未提供过失致人死亡类别，最后只输出故意伤害，F1 为0。</desc>
<defs><style>text{font-family:"PingFang SC",Arial,sans-serif;fill:#24292f}.title{font-size:32px;font-weight:700}.h{font-size:29px;font-weight:700}.b{font-size:28px}.s{font-size:24px;fill:#536171}.v{font-size:31px;font-weight:700;fill:#245e99}</style></defs>
<rect width="600" height="1300" fill="#fff"/>
<text class="title" x="28" y="50">真实 case：检索挤掉了正确候选</text>
<text class="s" x="28" y="89">LawBench-3-3 · idx 44 · Appendix B.1</text>
<rect x="28" y="120" width="544" height="236" rx="8" fill="#f5f7f9" stroke="#d1dbe4" stroke-width="2"/>
<text class="h" x="48" y="162">案件事实与数据集标签</text>
<text class="b" x="48" y="205">斗殴后死亡；法医认定在冠心病</text>
<text class="b" x="48" y="245">背景下，冲突触发急性心脏事件。</text>
<text class="b" x="48" y="289">标准标签：过失致人死亡</text>
<text class="s" x="48" y="330">英文标签：negligent homicide</text>
<rect x="28" y="392" width="544" height="242" rx="8" fill="#eef4fa" stroke="#a9c5df" stroke-width="2"/>
<text class="h" x="48" y="434">同一模型，直接作答</text>
<text class="b" x="48" y="480">预测：故意伤害、过失致人死亡</text>
<text class="b" x="48" y="525">两个标签，命中一个标准标签。</text>
<text class="v" x="48" y="574">F1 = 2×1 / (2+1) = 2/3</text>
<text class="s" x="48" y="614">保留正确标签，但多报一个，不能算全对。</text>
<rect x="28" y="670" width="544" height="352" rx="8" fill="#f5f7f9" stroke="#d1dbe4" stroke-width="2"/>
<text class="h" x="48" y="712">给该模型重新挂 Draft-Verify</text>
<text class="b" x="48" y="758">五个 draft 近邻都含故意伤害：</text>
<text class="s" x="48" y="797">0.814 / 0.811 / 0.808 / 0.799 / 0.797</text>
<text class="b" x="48" y="843">Challenger 来自侵入住宅、强奸、</text>
<text class="b" x="48" y="883">谋杀、盗窃等，也没有标准标签。</text>
<text class="b" x="48" y="929">最终只输出：故意伤害</text>
<text class="v" x="48" y="977">F1 = 2×0 / (1+1) = 0</text>
<text class="h" x="28" y="1084">不同标签 ≠ 有用的反例</text>
<text class="b" x="28" y="1129">只按相似度与标签筛选，可能</text>
<text class="b" x="28" y="1169">拿不到真正区分候选罪名的材料。</text>
<text class="s" x="28" y="1213">论文展示单例，未报告此类干扰的频率。</text>
<text class="s" x="28" y="1264">根据原论文 Appendix B.1 重绘</text>
</svg>
