<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Paper protocol versus released Plan-Solve path</title>
  <desc id="desc">The paper says the planner reads the reference solution. In the inspected release commit, the data contains a solution but extra_info omits it, and the trainer dispatch passes only question and answer, so the planner sees the question while the solver sees the answer hint.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#4c626e"/></marker><style>.t{font-family:Inter,"PingFang SC",Arial,sans-serif;fill:#19242b}.title{font-size:50px;font-weight:760}.sub{font-size:23px;fill:#52616a}.h{font-size:27px;font-weight:720}.b{font-size:20px}.s{font-size:17px;fill:#5c6a72}.box{stroke-width:3}.ln{fill:none;stroke:#4c626e;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="930" fill="#fbfaf6"/>
  <text class="t title" x="70" y="80">Plan-Solve：论文协议与公开代码路径并不完全一致</text>
  <text class="t sub" x="70" y="122">这是一处复现缺口；它不能反推论文内部实验一定按公开 commit 运行。</text>

  <rect class="box" x="70" y="184" width="690" height="558" rx="12" fill="#eaf5f0" stroke="#2f7d6b"/>
  <text class="t h" x="110" y="230">论文 §3.3 描述</text>
  <rect x="118" y="276" width="250" height="92" rx="8" fill="#fff" stroke="#7aa998" stroke-width="2"/><text class="t b" x="243" y="313" text-anchor="middle">题目 x</text><text class="t s" x="243" y="343" text-anchor="middle">reference solution y*</text>
  <rect x="462" y="276" width="250" height="92" rx="8" fill="#fff" stroke="#7aa998" stroke-width="2"/><text class="t b" x="587" y="313" text-anchor="middle">Planner</text><text class="t s" x="587" y="343" text-anchor="middle">提炼 strategy plan s</text>
  <path class="ln" d="M368 322H450"/>
  <rect x="290" y="446" width="250" height="92" rx="8" fill="#fff" stroke="#7aa998" stroke-width="2"/><text class="t b" x="415" y="483" text-anchor="middle">Solver prompt</text><text class="t s" x="415" y="513" text-anchor="middle">题目 x + plan s</text>
  <path class="ln" d="M587 368C587 409 504 416 466 434"/>
  <text class="t b" x="110" y="610">teacher context C = (x, s)</text>
  <text class="t s" x="110" y="650">reference solution 只用于教 planner 怎样拆题，</text>
  <text class="t s" x="110" y="682">部署时移除 reference，模型自己 plan 再 solve。</text>

  <rect class="box" x="840" y="184" width="690" height="558" rx="12" fill="#fff0ee" stroke="#a84b47"/>
  <text class="t h" x="880" y="230">公开 commit 20eaa0c 的参数传递</text>
  <rect x="888" y="276" width="250" height="92" rx="8" fill="#fff" stroke="#c58d89" stroke-width="2"/><text class="t b" x="1013" y="313" text-anchor="middle">extra_info</text><text class="t s" x="1013" y="343" text-anchor="middle">question + answer</text>
  <rect x="1232" y="276" width="250" height="92" rx="8" fill="#fff" stroke="#c58d89" stroke-width="2"/><text class="t b" x="1357" y="313" text-anchor="middle">Planner</text><text class="t s" x="1357" y="343" text-anchor="middle">solution 为空，只看题目</text>
  <path class="ln" d="M1138 322H1220"/>
  <rect x="1060" y="446" width="250" height="92" rx="8" fill="#fff" stroke="#c58d89" stroke-width="2"/><text class="t b" x="1185" y="483" text-anchor="middle">Solver prompt</text><text class="t s" x="1185" y="513" text-anchor="middle">题目 + plan + answer hint</text>
  <path class="ln" d="M1357 368C1357 409 1274 416 1236 434"/>
  <text class="t b" x="880" y="610">数据文件确实保存了 solution，trainer 却没有转发。</text>
  <text class="t s" x="880" y="650">prepare_deepmath_data.py 把 solution 放在顶层和 reward_model，</text>
  <text class="t s" x="880" y="682">fit() 只从 extra_info 取 question / answer。</text>

  <rect x="192" y="818" width="1216" height="70" rx="35" fill="#19242b"/>
  <text x="800" y="862" text-anchor="middle" font-family="Inter,PingFang SC,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">复现时要区分严格论文协议与当前公开实现；两者的输入不同，不能当作同一实验设置</text>
</svg>
