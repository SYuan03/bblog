<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1130" viewBox="0 0 600 1130" role="img" aria-labelledby="title desc">
<title id="title">两套结果口径，不能拼表</title><desc id="desc">论文取最佳训练检查点，仓库后来报告固定终点四次运行。三种任务指标不同，数值只在同一任务同一口径下比较。训练后重新挂 harness 未超过直接作答。</desc>
<defs><style>text{font-family:"PingFang SC",Arial,sans-serif;fill:#24292f}.title{font-size:32px;font-weight:700}.h{font-size:29px;font-weight:700}.b{font-size:28px}.s{font-size:24px;fill:#536171}.v{font-size:28px;font-weight:700;fill:#245e99}.line{stroke:#d1dbe4}</style></defs>
<rect width="600" height="1130" fill="#fff"/>
<text class="title" x="28" y="50">两套结果口径，不能拼表</text>
<text class="s" x="28" y="89">Qwen3-8B · 各指标按百分制展示</text>
<rect x="28" y="120" width="544" height="340" rx="8" fill="#f5f7f9" stroke="#d1dbe4" stroke-width="2"/>
<text class="h" x="48" y="163">论文 v1：最佳训练检查点</text>
<text class="s" x="48" y="205">同一任务：OPSD → OPHSD</text>
<text class="b" x="48" y="256">LawBench F1</text><text class="v" x="546" y="256" text-anchor="end">64.25 → 69.51</text>
<path class="line" d="M48 281H552"/>
<text class="b" x="48" y="326">USPTO 准确率</text><text class="v" x="546" y="326" text-anchor="end">88.01 → 90.81</text>
<path class="line" d="M48 351H552"/>
<text class="b" x="48" y="396">数学 pass@8</text><text class="v" x="546" y="396" text-anchor="end">66.68 → 69.50</text>
<text class="s" x="48" y="441">数学结果为四次运行平均。</text>
<rect x="28" y="496" width="544" height="332" rx="8" fill="#eef4fa" stroke="#a9c5df" stroke-width="2"/>
<text class="h" x="48" y="539">仓库：固定终点，四次运行</text>
<text class="s" x="48" y="581">文本 step 300；数学 step 150</text>
<text class="b" x="48" y="632">LawBench F1</text><text class="v" x="546" y="632" text-anchor="end">68.85±0.25</text>
<text class="b" x="48" y="701">USPTO 准确率</text><text class="v" x="546" y="701" text-anchor="end">90.71±0.13</text>
<text class="b" x="48" y="770">数学 pass@8</text><text class="v" x="546" y="770" text-anchor="end">66.89±0.65</text>
<text class="h" x="28" y="889">重新挂 harness：三项均未提高</text>
<text class="b" x="28" y="935">论文 v1：68.41 / 83.62 / 69.13</text>
<text class="s" x="28" y="982">F1 是标签集合匹配分；pass@8 是</text>
<text class="s" x="28" y="1018">八次尝试至少一次成功，不是单次正确率。</text>
<text class="s" x="28" y="1083">根据 Tables 2、5 和仓库 fixed-step CSV 重绘</text>
</svg>
