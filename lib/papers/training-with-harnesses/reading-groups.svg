<svg xmlns="http://www.w3.org/2000/svg" width="600" height="960" viewBox="0 0 600 960" role="img" aria-labelledby="title desc">
<title id="title">先分组，再判断训练收益</title><desc id="desc">765 道数学题按基础模型和 Plan-Solve 能否解出分成四组。训练后直接作答模型分别通过 310/316、132/156、6/6、约36/287。第二组最贴近吸收 harness 能力的主张，但不能单独证明因果。</desc>
<defs><style>text{font-family:"PingFang SC",Arial,sans-serif;fill:#24292f}.title{font-size:32px;font-weight:700}.h{font-size:28px;font-weight:700}.b{font-size:28px}.s{font-size:24px;fill:#536171}.v{font-size:31px;font-weight:700;fill:#245e99}</style></defs>
<rect width="600" height="960" fill="#fff"/>
<text class="title" x="28" y="50">先分组，再看训练后能否解出</text>
<text class="s" x="28" y="90">765 道题 · 基础模型与 Plan-Solve 比较</text>
<rect x="28" y="128" width="544" height="132" rx="8" fill="#f5f7f9" stroke="#d1dbe4" stroke-width="2"/>
<text class="h" x="48" y="170">两者原来都能解</text><text class="v" x="48" y="215">310 / 316 = 98.10%</text>
<text class="s" x="48" y="247">原有能力基本保留，仍有 6 道未通过。</text>
<rect x="28" y="288" width="544" height="178" rx="8" fill="#eef4fa" stroke="#a9c5df" stroke-width="2"/>
<text class="h" x="48" y="330">基础模型不能，Plan-Solve 能</text>
<text class="v" x="48" y="379">132 / 156 = 84.62%</text>
<text class="s" x="48" y="418">最贴近“吸收 harness 收益”的分组，</text>
<text class="s" x="48" y="451">训练后模型不挂 harness 也能解出。</text>
<rect x="28" y="494" width="544" height="126" rx="8" fill="#f5f7f9" stroke="#d1dbe4" stroke-width="2"/>
<text class="h" x="48" y="536">基础模型能，Plan-Solve 不能</text>
<text class="v" x="48" y="584">6 / 6 = 100%</text>
<rect x="28" y="648" width="544" height="132" rx="8" fill="#f5f7f9" stroke="#d1dbe4" stroke-width="2"/>
<text class="h" x="48" y="690">两者原来都不能</text><text class="v" x="48" y="736">约 36 / 287 = 12.54%</text>
<text class="s" x="48" y="767">不能把新增能力全归因于 harness。</text>
<text class="b" x="28" y="835">没有分别去掉计划、答案提示和</text>
<text class="b" x="28" y="875">额外模型调用，仍不能精确归因。</text>
<text class="s" x="28" y="931">根据原论文 Figure 4 重绘</text>
</svg>
