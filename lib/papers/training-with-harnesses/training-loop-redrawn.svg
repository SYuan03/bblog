<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">OPHSD training loop</title>
  <desc id="desc">The current model produces a direct student rollout and separately runs inside a harness. A frozen copy of the initial model reads the harness-built prompt and scores the same student tokens. The paper and release use opposite KL argument orders; only the current model is updated.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#45616f"/></marker>
    <style>
      .t{font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#18232a}.title{font-size:52px;font-weight:760}.sub{font-size:24px;fill:#53616a}.h{font-size:28px;font-weight:720}.b{font-size:21px}.small{font-size:18px;fill:#586872}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.box{stroke-width:3}.line{fill:none;stroke:#45616f;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#fbfaf6"/>
  <text class="t title" x="74" y="82">OPHSD 一步训练到底发生了什么？</text>
  <text class="t sub" x="74" y="124">两条支路使用同一个当前模型；只有 student 支路的参数会被更新。</text>

  <rect class="box" x="74" y="190" width="244" height="116" rx="10" fill="#edf2f3" stroke="#71838d"/>
  <text class="t h" x="196" y="238" text-anchor="middle">题目 x</text>
  <text class="t small" x="196" y="274" text-anchor="middle">student 与 harness 共用</text>

  <rect class="box" x="412" y="166" width="370" height="164" rx="10" fill="#e8f1f7" stroke="#2f6f98"/>
  <text class="t h" x="597" y="214" text-anchor="middle">当前模型 pθ</text>
  <text class="t b" x="597" y="254" text-anchor="middle">直接读取题目，采样一份回答 ŷ</text>
  <text class="t small" x="597" y="292" text-anchor="middle">这就是 on-policy rollout</text>

  <rect class="box" x="880" y="166" width="640" height="164" rx="10" fill="#fff0e6" stroke="#b86538"/>
  <text class="t h" x="1200" y="214" text-anchor="middle">当前模型 pθ + harness H</text>
  <text class="t b" x="1200" y="254" text-anchor="middle">多次调用模型、检索样例或先规划，再组装 teacher prompt</text>
  <text class="t small" x="1200" y="292" text-anchor="middle">输出的是 context C，不是拿来模仿的标准答案</text>

  <path class="line" d="M318 248H400"/><path class="line" d="M318 280C500 382 786 354 868 266"/>

  <rect class="box" x="270" y="412" width="510" height="158" rx="10" fill="#eef5f9" stroke="#2f6f98"/>
  <text class="t h" x="525" y="456" text-anchor="middle">Student 视角</text>
  <text class="t b mono" x="525" y="498" text-anchor="middle">x + ŷ&lt;n  →  pS(next token)</text>
  <text class="t small" x="525" y="536" text-anchor="middle">只看原题与自己已经写出的前缀</text>

  <rect class="box" x="820" y="412" width="700" height="158" rx="10" fill="#eaf5f0" stroke="#2f7d6b"/>
  <text class="t h" x="1170" y="456" text-anchor="middle">Teacher 视角</text>
  <text class="t b mono" x="1170" y="498" text-anchor="middle">C[Hθ(x,z)] + ŷ&lt;n  →  pT(next token)</text>
  <text class="t small" x="1170" y="536" text-anchor="middle">由冻结的初始模型 pθ̃ 计算，参数不更新</text>

  <path class="line" d="M597 330V398"/><path class="line" d="M1200 330V398"/>

  <rect class="box" x="438" y="646" width="724" height="176" rx="10" fill="#f6f2e9" stroke="#8b744e"/>
  <text class="t h" x="800" y="691" text-anchor="middle">论文与 release 的 KL 顺序不一致</text>
  <text class="t b mono" x="800" y="733" text-anchor="middle">paper Eq. 3: KL(pT || pS)</text>
  <text class="t b mono" x="800" y="769" text-anchor="middle">release default: KL(pS || pT)</text>
  <text class="t small" x="800" y="805" text-anchor="middle">两边评估同一份 direct rollout；差异会改变优化性质</text>
  <path class="line" d="M525 570C525 620 690 628 744 648"/><path class="line" d="M1170 570C1170 620 952 628 876 648"/>

  <rect class="box" x="470" y="874" width="660" height="72" rx="36" fill="#2f6f98" stroke="#2f6f98"/>
  <text x="800" y="920" text-anchor="middle" font-family="Inter,PingFang SC,Arial,sans-serif" font-size="24" font-weight="750" fill="#fff">只更新 pθ；下一步 harness 随新模型变化</text>
  <path class="line" d="M800 822V860"/>
</svg>
