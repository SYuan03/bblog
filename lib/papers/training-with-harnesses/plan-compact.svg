<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">Plan-Solve：论文与公开实现的输入差异</title><desc id="desc">论文让 planner 看原题和标准解，solver 与 teacher 只看原题和计划。公开代码漏传 solution，planner 只看原题；solver 与 teacher 多看计划和标准答案。两套流程的测试均移除标准解和答案。</desc>
<defs><style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#24292f}.h{font-size:21px;font-weight:700}.b{font-size:17px}.s{font-size:15px;fill:#526274}.arrow{fill:none;stroke:#617184;stroke-width:1.7;marker-end:url(#a)}</style><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#617184"/></marker></defs>
<rect width="900" height="300" fill="#fff"/><text x="24" y="34" class="h">计划是怎样得到的，teacher 又看到了什么？</text>
<text x="24" y="96" class="h">论文 §3.3</text><rect x="190" y="59" width="288" height="86" fill="#f2f7fb" stroke="#c9d5e0"/><text x="208" y="89" class="b">planner：原题 + 完整标准解</text><text x="208" y="121" class="s">当前模型把解答整理成 plan</text><path d="M478 103H550" class="arrow"/><rect x="563" y="59" width="313" height="86" fill="#f2f7fb" stroke="#c9d5e0"/><text x="581" y="89" class="b">solver / teacher：原题 + plan</text><text x="581" y="121" class="s">不直接添加完整标准解</text>
<text x="24" y="210" class="h">公开实现</text><text x="24" y="235" class="s">commit 20eaa0c</text><rect x="190" y="172" width="288" height="86" fill="#fff8f2" stroke="#d8c9bc"/><text x="208" y="202" class="b">planner：仅原题</text><text x="208" y="234" class="s">solution 在调度时丢失</text><path d="M478 216H550" class="arrow"/><rect x="563" y="172" width="313" height="86" fill="#fff8f2" stroke="#d8c9bc"/><text x="581" y="202" class="b">原题 + plan + 标准答案</text><text x="581" y="234" class="s">代码称答案为 verification hint</text>
<text x="24" y="286" class="s">评测时两者都移除标准解与答案提示。这里只确认发布路径的差异，不推断原实验内部运行了哪一套。</text>
</svg>
