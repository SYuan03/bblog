<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">OPHSD results under two reporting protocols</title>
  <desc id="desc">The arXiv v1 paper reports the best checkpoint, while the later repository reports four-run fixed checkpoints. OPHSD remains strongest, but the numbers differ and should not be mixed.</desc>
  <defs><style>.t{font-family:Inter,"PingFang SC",Arial,sans-serif;fill:#19242b}.title{font-size:50px;font-weight:760}.sub{font-size:23px;fill:#52616a}.h{font-size:27px;font-weight:720}.b{font-size:19px}.s{font-size:16px;fill:#5c6a72}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:21px;font-weight:700}</style></defs>
  <rect width="1600" height="920" fill="#fff"/>
  <text class="t title" x="70" y="80">同一篇工作有两套结果口径，不能拼表</text>
  <text class="t sub" x="70" y="122">论文取训练过程中成绩最高的模型权重；仓库固定训练终点，报告 4 次独立运行的均值 ± 标准差。</text>

  <rect x="70" y="180" width="700" height="610" rx="12" fill="#eef5f9" stroke="#2f6f98" stroke-width="3"/>
  <text class="t h" x="110" y="230">arXiv v1：最佳训练时刻</text><text class="t s" x="110" y="263">Qwen3-8B；数学运行 4 次，选各方法最高评测分</text>
  <text class="t s" x="330" y="285">灰色 OPSD · 绿色 OPHSD</text>
  <text class="t b" x="110" y="325">LawBench F1</text><rect x="330" y="300" width="160.625" height="14" fill="#a6b2bc"/><rect x="330" y="320" width="173.775" height="14" fill="#2f7d6b"/><text class="t num" x="690" y="326">69.51</text><text class="t s" x="330" y="357">OPSD 64.25 → OPHSD 69.51</text>
  <text class="t b" x="110" y="430">USPTO 准确率</text><rect x="330" y="405" width="220.025" height="14" fill="#a6b2bc"/><rect x="330" y="425" width="227.025" height="14" fill="#2f7d6b"/><text class="t num" x="690" y="431">90.81</text><text class="t s" x="330" y="462">OPSD 88.01 → OPHSD 90.81</text>
  <text class="t b" x="110" y="535">数学平均 pass@8</text><rect x="330" y="510" width="166.7" height="14" fill="#a6b2bc"/><rect x="330" y="530" width="173.75" height="14" fill="#2f7d6b"/><text class="t num" x="690" y="536">69.50</text><text class="t s" x="330" y="567">OPSD 66.68 → OPHSD 69.50</text>
  <text class="t b" x="110" y="655">重新挂 harness</text><text class="t s" x="110" y="692">LawBench 68.41；USPTO 83.62；数学 69.13。</text><text class="t s" x="110" y="724">三项均未超过不挂 harness 的 OPHSD。</text>

  <rect x="830" y="180" width="700" height="610" rx="12" fill="#eaf5f0" stroke="#2f7d6b" stroke-width="3"/>
  <text class="t h" x="870" y="230">仓库：固定终点，4 次运行</text><text class="t s" x="870" y="263">文本训练 300 步；数学 150 步；均值 ± 标准差</text>
  <text class="t s" x="1090" y="285">灰色 OPSD · 绿色 OPHSD</text>
  <text class="t b" x="870" y="325">LawBench F1</text><rect x="1090" y="300" width="160.025" height="14" fill="#a6b2bc"/><rect x="1090" y="320" width="172.125" height="14" fill="#2f7d6b"/><text class="t num" x="1372" y="326">68.85±0.25</text><text class="t s" x="1090" y="357">GRPO 61.13；OPSD 64.01</text>
  <text class="t b" x="870" y="430">USPTO 准确率</text><rect x="1090" y="405" width="218.275" height="14" fill="#a6b2bc"/><rect x="1090" y="425" width="226.775" height="14" fill="#2f7d6b"/><text class="t num" x="1372" y="431">90.71±0.13</text><text class="t s" x="1090" y="462">GRPO 89.44；OPSD 87.31</text>
  <text class="t b" x="870" y="535">数学平均 pass@8</text><rect x="1090" y="510" width="156.875" height="14" fill="#a6b2bc"/><rect x="1090" y="530" width="167.225" height="14" fill="#2f7d6b"/><text class="t num" x="1372" y="536">66.89±0.65</text><text class="t s" x="1090" y="567">GRPO 65.00；OPSD 62.75；CRISP 58.75</text>
  <text class="t b" x="870" y="655">新增 Qwen3-4B</text><text class="t s" x="870" y="692">OPHSD：47.56 / 87.81 / 58.37。</text><text class="t s" x="870" y="724">仍领先列出的 GRPO 与 OPSD。</text>

  <text class="t s" x="70" y="856">来源：Tables 2、5；results/fixed_checkpoint_summary.csv @ 20eaa0c。条长统一按 0–100 缩放；只比较同一任务。</text>
</svg>
