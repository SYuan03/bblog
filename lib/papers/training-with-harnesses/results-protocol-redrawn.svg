<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">OPHSD results under two reporting protocols</title>
  <desc id="desc">The arXiv v1 paper reports the best checkpoint, while the later repository reports four-run fixed checkpoints. OPHSD remains strongest, but the numbers differ and should not be mixed.</desc>
  <defs><style>.t{font-family:Inter,"PingFang SC",Arial,sans-serif;fill:#19242b}.title{font-size:50px;font-weight:760}.sub{font-size:23px;fill:#52616a}.h{font-size:27px;font-weight:720}.b{font-size:19px}.s{font-size:16px;fill:#5c6a72}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:21px;font-weight:700}</style></defs>
  <rect width="1600" height="920" fill="#fbfaf6"/>
  <text class="t title" x="70" y="80">同一篇工作有两套结果口径，不能拼表</text>
  <text class="t sub" x="70" y="122">arXiv v1 取训练过程中的最佳 checkpoint；仓库后来补了固定 step、4 次独立运行的均值 ± 标准差。</text>

  <rect x="70" y="180" width="700" height="610" rx="12" fill="#eef5f9" stroke="#2f6f98" stroke-width="3"/>
  <text class="t h" x="110" y="230">arXiv v1：best checkpoint</text><text class="t s" x="110" y="263">Qwen3-8B；Math 为 4 runs，但表中选每种方法的最佳 evaluation score</text>
  <text class="t b" x="110" y="325">LawBench F1</text><rect x="330" y="300" width="315" height="34" fill="#cad3d8"/><rect x="330" y="300" width="341" height="34" fill="#2f7d6b"/><text class="t num" x="690" y="326">69.51</text><text class="t s" x="330" y="357">OPSD 64.25 → OPHSD 69.51</text>
  <text class="t b" x="110" y="430">USPTO Acc</text><rect x="330" y="405" width="440" height="34" fill="#cad3d8"/><rect x="330" y="405" width="454" height="34" fill="#2f7d6b"/><text class="t num" x="690" y="431">90.81</text><text class="t s" x="330" y="462">OPSD 88.01 → OPHSD 90.81</text>
  <text class="t b" x="110" y="535">Math avg pass@8</text><rect x="330" y="510" width="333" height="34" fill="#cad3d8"/><rect x="330" y="510" width="348" height="34" fill="#2f7d6b"/><text class="t num" x="690" y="536">69.50</text><text class="t s" x="330" y="567">OPSD 66.68 → OPHSD 69.50</text>
  <text class="t b" x="110" y="655">重新挂 harness</text><text class="t s" x="110" y="692">LawBench 68.41；USPTO 83.62；Math 69.13。</text><text class="t s" x="110" y="724">在这三项上都没有超过 standalone OPHSD。</text>

  <rect x="830" y="180" width="700" height="610" rx="12" fill="#eaf5f0" stroke="#2f7d6b" stroke-width="3"/>
  <text class="t h" x="870" y="230">仓库：fixed checkpoint, 4 runs</text><text class="t s" x="870" y="263">Text step 300；Math step 150；均值 ± 标准差</text>
  <text class="t b" x="870" y="325">LawBench F1</text><rect x="1090" y="300" width="320" height="34" fill="#cad3d8"/><rect x="1090" y="300" width="344" height="34" fill="#2f7d6b"/><text class="t num" x="1372" y="326">68.85±0.25</text><text class="t s" x="1090" y="357">GRPO 61.13；OPSD 64.01</text>
  <text class="t b" x="870" y="430">USPTO Acc</text><rect x="1090" y="405" width="447" height="34" fill="#cad3d8"/><rect x="1090" y="405" width="454" height="34" fill="#2f7d6b"/><text class="t num" x="1372" y="431">90.71±0.13</text><text class="t s" x="1090" y="462">GRPO 89.44；OPSD 87.31</text>
  <text class="t b" x="870" y="535">Math avg pass@8</text><rect x="1090" y="510" width="325" height="34" fill="#cad3d8"/><rect x="1090" y="510" width="334" height="34" fill="#2f7d6b"/><text class="t num" x="1372" y="536">66.89±0.65</text><text class="t s" x="1090" y="567">GRPO 65.00；OPSD 62.75；CRISP 58.75</text>
  <text class="t b" x="870" y="655">新增 Qwen3-4B</text><text class="t s" x="870" y="692">OPHSD：47.56 / 87.81 / 58.37。</text><text class="t s" x="870" y="724">仍领先列出的 GRPO 与 OPSD。</text>

  <text class="t s" x="70" y="856">数值来源：论文 Tables 2, 5；仓库 results/fixed_checkpoint_summary.csv（commit 20eaa0c）。条形仅用于同任务内比较。</text>
</svg>
