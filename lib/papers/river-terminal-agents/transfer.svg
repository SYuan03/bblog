<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="t d"><title id="t">Domain transfer results</title><desc id="d">Held-out evaluation scores after training reinforcement learning on two, four, six or eight domains, compared with supervised fine-tuning.</desc>
<rect width="1400" height="720" fill="#fbfaf7"/><style>.h{font:700 34px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#1e2730}.k{font:700 15px ui-monospace,SFMono-Regular,monospace;fill:#2d669f;letter-spacing:1px}.b{font:650 19px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#27323b}.s{font:400 16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#63707b}.v{font:750 29px ui-monospace,SFMono-Regular,monospace}.box{fill:#fff;stroke:#cfd6dc;stroke-width:2}.muted{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#7d8993}</style>
<text x="70" y="68" class="k">HELD-OUT TMAX TASKS · ≈300 TASKS</text><text x="70" y="118" class="h">只在 Debug + Systems 上做 RL，其他六个 domain 仍然一起上涨</text><text x="70" y="155" class="s">表中是 8 个 domain 的总体 solve rate；括号是相对同一 SFT checkpoint 的绝对百分点增益。</text>
<g transform="translate(120 225)"><rect x="0" y="0" width="215" height="315" class="box"/><text x="28" y="48" class="k">SFT</text><text x="28" y="118" class="v" fill="#727e88">32.3</text><text x="28" y="156" class="s">no RL</text><rect x="28" y="245" width="158" height="30" fill="#cbd3da"/>
<rect x="245" y="0" width="215" height="315" class="box"/><text x="273" y="48" class="k">RL · 2 DOMAINS</text><text x="273" y="118" class="v" fill="#2d669f">49.2</text><text x="273" y="156" class="s">+16.9 pp</text><rect x="273" y="198" width="158" height="77" fill="#2d669f"/><text x="273" y="294" class="s">≈800 envs</text>
<rect x="490" y="0" width="215" height="315" class="box"/><text x="518" y="48" class="k">RL · 4 DOMAINS</text><text x="518" y="118" class="v" fill="#2b7863">53.6</text><text x="518" y="156" class="s">+21.3 pp</text><rect x="518" y="176" width="158" height="99" fill="#2b7863"/>
<rect x="735" y="0" width="215" height="315" class="box"/><text x="763" y="48" class="k">RL · 6 DOMAINS</text><text x="763" y="118" class="v" fill="#2b7863">55.2</text><text x="763" y="156" class="s">+22.9 pp</text><rect x="763" y="168" width="158" height="107" fill="#2b7863"/>
<rect x="980" y="0" width="215" height="315" class="box"/><text x="1008" y="48" class="k">RL · 8 DOMAINS</text><text x="1008" y="118" class="v" fill="#2b7863">53.9</text><text x="1008" y="156" class="s">+21.5 pp</text><rect x="1008" y="175" width="158" height="100" fill="#2b7863"/></g>
<rect x="70" y="585" width="1260" height="70" fill="#fff4ec"/><text x="95" y="615" class="b">怎样读这组 evidence</text><text x="95" y="642" class="s">它支持“behavior 可以跨 domain 转移”；但 domain 是作者按 skill 分组的 TMax 子集，并不等同于随机、独立的真实部署分布。</text>
<text x="70" y="694" class="muted">根据原论文 Table 2 与 Figure 8 重绘。</text></svg>
