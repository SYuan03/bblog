<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1329" viewBox="0 0 600 1329" role="img" aria-labelledby="title desc"><title id="title">同一0/1检查器，会怎样奖励错或惩罚对？</title><desc id="desc">作者整理的 Appendix C.4 案例 无完整验收代码；本文未重放</desc><rect width="600" height="1329" fill="#fff"/><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:32px;font-weight:750}.label{font-size:28px;font-weight:750}.main{font-size:28px}.small{font-size:24px}.value{font-size:32px;font-weight:750}</style><text x="24" y="66" class="title" fill="#20252d" text-anchor="start">同一0/1检查器，</text>
<text x="24" y="108" class="title" fill="#20252d" text-anchor="start">会怎样奖励错或惩罚对？</text>
<text x="24" y="152" class="small" fill="#596575" text-anchor="start">作者整理的 Appendix C.4 案例</text>
<text x="24" y="190" class="small" fill="#596575" text-anchor="start">无完整验收代码；本文未重放</text>
<path d="M24 200H576" stroke="#d7dee7" stroke-width="2"/>
<rect x="24" y="223" width="552" height="231" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="262" class="label" fill="#365f85" text-anchor="start">task_003722 · 新闻字幕</text>
<text x="43" y="306" class="main" fill="#20252d" text-anchor="start">输入：archive_broadcast.mp4</text>
<text x="43" y="345" class="main" fill="#20252d" text-anchor="start">Agent 却读到 ground_truth.txt。</text>
<text x="43" y="384" class="main" fill="#20252d" text-anchor="start">自己的OCR相似度0.368，</text>
<text x="43" y="423" class="main" fill="#20252d" text-anchor="start">低于要求的0.85。</text>
<path d="M300 479v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="515" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="554" class="label" fill="#8c4646" text-anchor="start">误放行：错误捷径得到1</text>
<text x="43" y="598" class="main" fill="#20252d" text-anchor="start">第7轮用可读参考答案覆盖输出。</text>
<text x="43" y="637" class="main" fill="#20252d" text-anchor="start">第8轮相似度=1.0，得1分。</text>
<text x="43" y="676" class="main" fill="#20252d" text-anchor="start">计算没错，答案本来不该可读。</text>
<path d="M24 729H576" stroke="#d7dee7" stroke-width="2"/>
<rect x="24" y="752" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="791" class="label" fill="#365f85" text-anchor="start">task_006064 · Rust文本处理</text>
<text x="43" y="835" class="main" fill="#20252d" text-anchor="start">要求保留 ASCII a-z 和空格。</text>
<text x="43" y="874" class="main" fill="#20252d" text-anchor="start">Agent 使用 is_ascii_alphabetic。</text>
<text x="43" y="913" class="main" fill="#20252d" text-anchor="start">高频词与协方差功能测试通过。</text>
<path d="M300 969v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="1005" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="1044" class="label" fill="#8c4646" text-anchor="start">误拒绝：合法写法得到0</text>
<text x="43" y="1088" class="main" fill="#20252d" text-anchor="start">第三项在源码找 is_alphabetic。</text>
<text x="43" y="1127" class="main" fill="#20252d" text-anchor="start">API名不含这段连续字符串，</text>
<text x="43" y="1166" class="main" fill="#20252d" text-anchor="start">即使功能正确，整题仍得0分。</text>
<text x="24" y="1257" class="main" fill="#20252d" text-anchor="start">前者学会“读答案”，后者因写法受罚。</text>
<text x="24" y="1295" class="main" fill="#20252d" text-anchor="start">两者都让训练分数偏离任务要求。</text></svg>
