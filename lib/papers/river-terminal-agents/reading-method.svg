<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1344" viewBox="0 0 600 1344" role="img" aria-labelledby="title desc"><title id="title">检查环境、筛难度、算分数是三个不同的步骤</title><desc id="desc">根据 Figure 2、Algorithm 1 绘制 初始环境来自 TMax，不是本文新造</desc><rect width="600" height="1344" fill="#fff"/><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:32px;font-weight:750}.label{font-size:28px;font-weight:750}.main{font-size:28px}.small{font-size:24px}.value{font-size:32px;font-weight:750}</style><text x="24" y="66" class="title" fill="#20252d" text-anchor="start">检查环境、筛难度、算分数</text>
<text x="24" y="108" class="title" fill="#20252d" text-anchor="start">是三个不同的步骤</text>
<text x="24" y="152" class="small" fill="#596575" text-anchor="start">根据 Figure 2、Algorithm 1 绘制</text>
<text x="24" y="190" class="small" fill="#596575" text-anchor="start">初始环境来自 TMax，不是本文新造</text>
<path d="M24 200H576" stroke="#d7dee7" stroke-width="2"/>
<rect x="24" y="223" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="262" class="label" fill="#365f85" text-anchor="start">1 · 读14,399个环境包</text>
<text x="43" y="306" class="main" fill="#20252d" text-anchor="start">GPT-5.4 阅读任务、容器与检查器。</text>
<text x="43" y="345" class="main" fill="#20252d" text-anchor="start">按八类问题给一个主标签；</text>
<text x="43" y="384" class="main" fill="#20252d" text-anchor="start">只保留判断为 CLEAN 的环境。</text>
<path d="M300 440v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="476" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="515" class="label" fill="#365f85" text-anchor="start">2 · 排除无法跑通的任务</text>
<text x="43" y="559" class="main" fill="#20252d" text-anchor="start">GPT-5.4 + Terminus-2 跑两次。</text>
<text x="43" y="598" class="main" fill="#20252d" text-anchor="start">两次都失败的任务被删除。</text>
<text x="43" y="637" class="main" fill="#20252d" text-anchor="start">这筛难度/兼容，不证明检查器正确。</text>
<path d="M300 693v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="729" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="768" class="label" fill="#365f85" text-anchor="start">3 · 训练模型在线执行任务</text>
<text x="43" y="812" class="main" fill="#20252d" text-anchor="start">模型只见任务、命令与环境观察。</text>
<text x="43" y="851" class="main" fill="#20252d" text-anchor="start">筛选标签与试做记录不进提示。</text>
<text x="43" y="890" class="main" fill="#20252d" text-anchor="start">原任务验收器给最终0或1。</text>
<path d="M300 946v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="982" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="1021" class="label" fill="#365f85" text-anchor="start">4 · 在重复操作上扣训练优势</text>
<text x="43" y="1065" class="main" fill="#20252d" text-anchor="start">命令与观察同时相似才罚：</text>
<text x="43" y="1104" class="main" fill="#20252d" text-anchor="start">该轮回复token的优势各扣0.05。</text>
<text x="43" y="1143" class="main" fill="#20252d" text-anchor="start">不改任务最终的 PASS/FAIL 分数。</text>
<text x="24" y="1234" class="small" fill="#596575" text-anchor="start">约3.5K筛选集未公开下载。</text>
<text x="24" y="1272" class="small" fill="#596575" text-anchor="start">表中另列0.15上限，分配未公开；</text>
<text x="24" y="1310" class="small" fill="#596575" text-anchor="start">也没有统一隐藏文件权限规范。</text></svg>
