<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1138" viewBox="0 0 600 1138" role="img" aria-labelledby="title desc"><title id="title">四项平均领先，但不是统一harness对照</title><desc id="desc">根据 Table 1 重绘 · 3 seeds 平均为四个benchmark的无权平均</desc><rect width="600" height="1138" fill="#fff"/><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:32px;font-weight:750}.label{font-size:28px;font-weight:750}.main{font-size:28px}.small{font-size:24px}.value{font-size:32px;font-weight:750}</style><text x="24" y="66" class="title" fill="#20252d" text-anchor="start">四项平均领先，</text>
<text x="24" y="108" class="title" fill="#20252d" text-anchor="start">但不是统一harness对照</text>
<text x="24" y="152" class="small" fill="#596575" text-anchor="start">根据 Table 1 重绘 · 3 seeds</text>
<text x="24" y="190" class="small" fill="#596575" text-anchor="start">平均为四个benchmark的无权平均</text>
<path d="M24 200H576" stroke="#d7dee7" stroke-width="2"/>
<text x="24" y="261" class="label" fill="#20252d" text-anchor="start">四项平均分（条长0–30）</text>
<text x="24" y="302" class="main" fill="#20252d" text-anchor="start">OpenThinker-8B-RL</text>
<text x="576" y="302" class="value" fill="#7e8997" text-anchor="end">17.8 ± 0.7</text>
<rect x="24" y="320" width="552" height="12" fill="#e6ebf1"/><rect x="24" y="320" width="327.52000000000004" height="12" fill="#7e8997"/>
<text x="24" y="386" class="main" fill="#20252d" text-anchor="start">River-8B</text>
<text x="576" y="386" class="value" fill="#365f85" text-anchor="end">19.4 ± 1.2</text>
<rect x="24" y="404" width="552" height="12" fill="#e6ebf1"/><rect x="24" y="404" width="356.96" height="12" fill="#365f85"/>
<rect x="24" y="446" width="552" height="231" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="485" class="label" fill="#365f85" text-anchor="start">River-8B 的四项成绩</text>
<text x="43" y="529" class="main" fill="#20252d" text-anchor="start">OpenThoughts-TBLite：21.8 ± 2.9</text>
<text x="43" y="568" class="main" fill="#20252d" text-anchor="start">Terminal-Bench-v2.1：9.7 ± 0.6</text>
<text x="43" y="607" class="main" fill="#20252d" text-anchor="start">Terminal-Bench-Pro：23.0 ± 3.1</text>
<text x="43" y="646" class="main" fill="#20252d" text-anchor="start">TerminalWorld-Verified：23.0 ± 2.5</text>
<path d="M300 702v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="738" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="777" class="label" fill="#365f85" text-anchor="start">这些数值测的是什么</text>
<text x="43" y="821" class="main" fill="#20252d" text-anchor="start">共589题；每题最多64次action，</text>
<text x="43" y="860" class="main" fill="#20252d" text-anchor="start">或600秒。TBLite为连续分数；</text>
<text x="43" y="899" class="main" fill="#20252d" text-anchor="start">其他三项要求全部checker通过。</text>
<text x="24" y="990" class="small" fill="#596575" text-anchor="start">baseline 各自使用原生 harness，</text>
<text x="24" y="1028" class="small" fill="#596575" text-anchor="start">训练数据与模型也同时变化。</text>
<text x="24" y="1066" class="small" fill="#596575" text-anchor="start">只能比较作者重测的开源8B Agent，</text>
<text x="24" y="1104" class="small" fill="#596575" text-anchor="start">不能扩大成 Claude/Codex 的排名。</text></svg>
