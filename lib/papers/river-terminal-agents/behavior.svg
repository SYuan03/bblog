<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Skill and behavior analysis</title><desc id="d">Behavior features predict success better after reinforcement learning than skill-presence features, and skill-skill structure remains more stable than task-task structure.</desc>
<rect width="1400" height="760" fill="#fbfaf7"/><style>.h{font:700 34px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#1e2730}.k{font:700 15px ui-monospace,SFMono-Regular,monospace;fill:#2d669f;letter-spacing:1px}.b{font:650 20px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#27323b}.s{font:400 16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#63707b}.n{font:750 42px ui-monospace,SFMono-Regular,monospace}.box{fill:#fff;stroke:#cfd6dc;stroke-width:2}.blue{fill:#2d669f}.green{fill:#2b7863}.gray{fill:#bdc7ce}.muted{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#7d8993}</style>
<text x="70" y="68" class="k">AGENTIC COMPOSITIONAL GENERALIZATION · CORRELATIONAL EVIDENCE</text><text x="70" y="118" class="h">成功更能被 multi-turn behavior 解释，而不是“轨迹里出现了哪些 skill”</text>
<rect x="70" y="175" width="610" height="450" class="box"/><text x="105" y="220" class="b">用轨迹特征预测 solved / unsolved</text><text x="105" y="250" class="s">L2 logistic regression · 15 seeds · 5-fold CV</text>
<text x="110" y="324" class="b">SFT · skill presence</text><rect x="355" y="296" width="166" height="38" class="gray"/><text x="535" y="323" class="n" font-size="28">≈0.55</text>
<text x="110" y="394" class="b">RL · skill presence</text><rect x="355" y="366" width="166" height="38" class="gray"/><text x="535" y="393" class="n" font-size="28">≈0.55</text>
<text x="110" y="464" class="b">SFT · 12 behaviors</text><rect x="355" y="436" width="273" height="38" class="blue"/><text x="535" y="463" class="n" font-size="28" fill="#fff">0.64</text>
<text x="110" y="534" class="b">RL · 12 behaviors</text><rect x="355" y="506" width="320" height="38" class="green"/><text x="580" y="533" class="n" font-size="28" fill="#fff">0.74</text>
<text x="105" y="590" class="s">AUC=0.5 是随机；这里支持“behavior 与成功更相关”，</text><text x="105" y="614" class="s">不能单独证明 RL 因果地只学习 behavior。</text>
<rect x="720" y="175" width="610" height="450" class="box"/><text x="755" y="220" class="b">RL 前后结构变化</text><text x="755" y="250" class="s">60 skills × 589 tasks；GPT-5.4 标注 skill presence</text>
<text x="770" y="350" class="k">SKILL-SKILL STRUCTURE</text><text x="770" y="410" class="n" fill="#2d669f">ρ = 0.83</text><text x="770" y="450" class="s">哪些 skills 经常共同出现，整体较稳定。</text>
<line x1="1030" y1="305" x2="1030" y2="535" stroke="#d5dadd" stroke-width="2"/>
<text x="1070" y="350" class="k">TASK-TASK STRUCTURE</text><text x="1070" y="410" class="n" fill="#b75b35">ρ = 0.27</text><text x="1070" y="450" class="s">每个 task 调用哪些 skills，</text><text x="1070" y="476" class="s">在 RL 后明显重排。</text>
<rect x="70" y="660" width="1260" height="45" fill="#fff4ec"/><text x="92" y="689" class="b" font-size="17">论文自己的措辞是“consistent with the hypothesis”：这些是结构与相关性证据，不是严格的机制因果证明。</text>
<text x="70" y="744" class="muted">根据原论文 Figures 1、5 与 §5.1-5.2 重绘。</text></svg>
