<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">River-8B results</title><desc id="d">Benchmark scores for River-8B and strongest baseline across four terminal benchmarks, plus the average.</desc>
<rect width="1400" height="760" fill="#fbfaf7"/><style>.h{font:700 34px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#1e2730}.k{font:700 15px ui-monospace,SFMono-Regular,monospace;fill:#2d669f;letter-spacing:1px}.l{font:600 17px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#35414b}.v{font:700 17px ui-monospace,SFMono-Regular,monospace;fill:#1e2730}.s{font:400 15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#697681}.axis{stroke:#ced5da}.r{fill:#2d669f}.b{fill:#cbd3da}.avg{fill:#2b7863}.muted{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#7d8993}</style>
<text x="70" y="68" class="k">8B OPEN-SOURCE RL-TRAINED TERMINAL AGENTS</text><text x="70" y="118" class="h">River-8B 四个 benchmark 的平均分最高，但领先幅度有限</text>
<text x="70" y="158" class="l">每个数值为 mean ± std，3 seeds；Avg 是四个 benchmark 的不加权平均。</text>
<g transform="translate(280 205)"><line x1="0" y1="0" x2="0" y2="400" class="axis"/><line x1="0" y1="400" x2="980" y2="400" class="axis"/>
<g class="axis"><line x1="196" y1="0" x2="196" y2="400"/><line x1="392" y1="0" x2="392" y2="400"/><line x1="588" y1="0" x2="588" y2="400"/><line x1="784" y1="0" x2="784" y2="400"/><line x1="980" y1="0" x2="980" y2="400"/></g>
<text x="-210" y="45" class="l">OTBL</text><rect x="0" y="18" width="712" height="31" class="r"/><rect x="0" y="54" width="601" height="22" class="b"/><text x="724" y="41" class="v">21.8 ±2.9</text><text x="614" y="72" class="v">18.4 ±1.5</text>
<text x="-210" y="125" class="l">TB-v2.1</text><rect x="0" y="98" width="317" height="31" class="r"/><rect x="0" y="134" width="281" height="22" class="b"/><text x="329" y="121" class="v">9.7 ±0.6</text><text x="294" y="152" class="v">8.6 ±0.6</text>
<text x="-210" y="205" class="l">TB-Pro</text><rect x="0" y="178" width="751" height="31" class="r"/><rect x="0" y="214" width="712" height="22" class="b"/><text x="763" y="201" class="v">23.0 ±3.1</text><text x="724" y="232" class="v">21.8 ±1.6</text>
<text x="-210" y="285" class="l">TWV</text><rect x="0" y="258" width="751" height="31" class="r"/><rect x="0" y="294" width="728" height="22" class="b"/><text x="763" y="281" class="v">23.0 ±2.5</text><text x="740" y="312" class="v">22.3 ±1.5</text>
<text x="-210" y="365" class="l">AVG</text><rect x="0" y="338" width="634" height="31" class="avg"/><rect x="0" y="374" width="581" height="22" class="b"/><text x="646" y="361" class="v">19.4 ±1.2</text><text x="594" y="392" class="v">17.8 ±0.7</text>
<text x="0" y="430" class="l" fill="#2d669f">■ River-8B</text><text x="170" y="430" class="l">■ OpenThinker-8B-RL</text></g>
<rect x="70" y="675" width="1260" height="42" fill="#eef5fb"/><text x="92" y="702" class="l">注意：不同 baseline 使用各自原生 harness；论文声称由同一 evaluation pipeline 重测，但这不是统一 harness 对照。</text>
<text x="70" y="744" class="muted">根据原论文 Table 1 重绘。</text></svg>
