<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Environment audit results</title><desc id="d">Clean rates in TMax, TermiGen and TerminalTraj, plus the cross-model audit agreement matrix.</desc>
<rect width="1400" height="760" fill="#fbfaf7"/><style>.h{font:700 34px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#1e2730}.k{font:700 15px ui-monospace,SFMono-Regular,monospace;fill:#2d669f;letter-spacing:1px}.b{font:650 19px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#27323b}.s{font:400 16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#63707b}.n{font:750 32px ui-monospace,SFMono-Regular,monospace}.box{fill:#fff;stroke:#cfd6dc;stroke-width:2}.green{fill:#2b7863}.bad{fill:#c7cdd2}.muted{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#7d8993}</style>
<text x="70" y="68" class="k">ENVIRONMENT QUALITY AUDIT</text><text x="70" y="118" class="h">三个公开集合里，GPT-5.4 判为 CLEAN 的环境都不到四成</text>
<rect x="70" y="170" width="735" height="460" class="box"/><text x="105" y="215" class="b">Rubric audit：instruction + Docker + verifier</text>
<g transform="translate(120 285)"><text x="0" y="0" class="b">TMax-15K</text><rect x="190" y="-28" width="430" height="42" fill="#dfe4e8"/><rect x="190" y="-28" width="154" height="42" class="green"/><text x="356" y="2" class="n">35.8%</text>
<text x="0" y="110" class="b">TermiGen</text><rect x="190" y="82" width="430" height="42" fill="#dfe4e8"/><rect x="190" y="82" width="43" height="42" class="green"/><text x="245" y="112" class="n">10.1%</text>
<text x="0" y="220" class="b">TerminalTraj-5K</text><rect x="190" y="192" width="430" height="42" fill="#dfe4e8"/><rect x="190" y="192" width="14" height="42" class="green"/><text x="218" y="222" class="n">3.3%</text></g>
<text x="105" y="585" class="s">“不 CLEAN”包括 weak verifier、spec mismatch、answer leak、</text><text x="105" y="609" class="s">ambiguous、trivial 和其他缺陷；一个环境可能同时有多种问题。</text>
<rect x="845" y="170" width="485" height="460" class="box"/><text x="880" y="215" class="b">Claude Opus 4.8 blind re-judge</text><text x="880" y="246" class="s">120 个分层样本，每个 GPT verdict 类别抽 15 个</text>
<rect x="900" y="290" width="170" height="80" fill="#eef8f3"/><text x="934" y="323" class="s">GPT clean →</text><text x="928" y="352" class="n" fill="#2b7863">6 clean</text>
<rect x="1070" y="290" width="210" height="80" fill="#fff4ec"/><text x="1116" y="323" class="s">GPT clean →</text><text x="1105" y="352" class="n" fill="#b75b35">9 defective</text>
<rect x="900" y="370" width="170" height="105" fill="#fff4ec"/><text x="927" y="407" class="s">GPT defective →</text><text x="936" y="446" class="n" fill="#b75b35">11 clean</text>
<rect x="1070" y="370" width="210" height="105" fill="#eef8f3"/><text x="1098" y="407" class="s">GPT defective →</text><text x="1110" y="446" class="n" fill="#2b7863">94 defective</text>
<text x="880" y="525" class="b">Binary agreement 100 / 120 = 83.3%</text><text x="880" y="558" class="s">但它是按 GPT verdict 分层抽样，不能当总体</text><text x="880" y="583" class="s">population agreement。GPT clean 的复判一致率仅 40%。</text>
<text x="70" y="682" class="b">更稳妥的用法：把 audit 当 conservative filter。缺陷判断较稳定，CLEAN 标签仍可能偏乐观。</text>
<text x="70" y="744" class="muted">根据原论文 Figure 11、Table 7 与 Appendix C 重绘。</text></svg>
