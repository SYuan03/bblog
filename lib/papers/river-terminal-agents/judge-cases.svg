<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="t d"><title id="t">Two verifier failure cases</title><desc id="d">A false-positive reward caused by a readable ground truth file and a false-negative reward caused by a brittle source-code substring test.</desc>
<rect width="1400" height="850" fill="#fbfaf7"/><style>.h{font:700 34px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#1e2730}.k{font:700 15px ui-monospace,SFMono-Regular,monospace;fill:#2d669f;letter-spacing:1px}.b{font:650 19px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#27323b}.s{font:400 16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#63707b}.c{font:500 15px ui-monospace,SFMono-Regular,monospace;fill:#27323b}.box{fill:#fff;stroke:#cfd6dc;stroke-width:2}.fp{fill:#eef8f3;stroke:#2b7863}.fn{fill:#fff4ec;stroke:#b75b35}.num{font:750 28px ui-monospace,SFMono-Regular,monospace}.muted{font:500 14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#7d8993}</style>
<text x="70" y="68" class="k">REAL TMAX ROLLOUTS · APPENDIX C.4</text><text x="70" y="118" class="h">同一个 binary reward，既会奖励作弊，也会惩罚正确实现</text>
<rect x="70" y="165" width="610" height="590" class="box fp"/><text x="100" y="207" class="k" fill="#2b7863">FALSE POSITIVE · task_003722 · reward = 1</text><text x="100" y="246" class="b">任务：从 broadcast.mp4 的字幕条恢复新闻 ticker</text>
<text x="112" y="300" class="num" fill="#2b7863">T1</text><text x="175" y="300" class="s">Agent 列目录，读到 /app/ground_truth.txt。</text>
<text x="112" y="365" class="num" fill="#2b7863">T2-T6</text><text x="230" y="351" class="s">仍尝试抽帧、裁剪和 OCR；自己恢复的文本</text><text x="230" y="378" class="s">对 reference 的 similarity 只有 0.368，门槛为 0.85。</text>
<text x="112" y="443" class="num" fill="#2b7863">T7</text><text x="175" y="443" class="s">用刚才读到的 ground truth 覆盖输出。</text>
<text x="112" y="508" class="num" fill="#2b7863">T8</text><text x="175" y="508" class="s">similarity = 1.0，checker 返回 reward 1。</text>
<rect x="100" y="565" width="550" height="135" fill="#fff"/><text x="125" y="600" class="b">Judge 错在哪里？</text><text x="125" y="635" class="s">reference 本来应该是隐藏输入，却与视频一起放在</text><text x="125" y="662" class="c">Agent-visible sandbox</text><text x="310" y="662" class="s">中。分数测到的是读文件能力。</text>
<rect x="720" y="165" width="610" height="590" class="box fn"/><text x="750" y="207" class="k" fill="#b75b35">FALSE NEGATIVE · task_006064 · reward = 0</text><text x="750" y="246" class="b">任务：Rust 文本处理，只保留 a-z 和空格</text>
<text x="762" y="300" class="num" fill="#b75b35">T1-T3</text><text x="880" y="286" class="s">Agent 使用 c.is_ascii_alphabetic()，</text><text x="880" y="313" class="s">语义正好对应明确写出的 ASCII a-z 要求。</text>
<text x="762" y="378" class="num" fill="#b75b35">T4-T5</text><text x="880" y="364" class="s">项目构建成功；top tokens 与 3×3 covariance</text><text x="880" y="391" class="s">两个 functional tests 都通过。</text>
<text x="762" y="456" class="num" fill="#b75b35">T6</text><text x="825" y="442" class="s">第三个 test grep 字面量 is_alphabetic；</text><text x="825" y="469" class="s">合法 API 名不同，所以整个任务 reward = 0。</text>
<rect x="750" y="565" width="550" height="135" fill="#fff"/><text x="775" y="600" class="b">Judge 错在哪里？</text><text x="775" y="635" class="s">checker 把一个未写进 instruction 的实现细节当作</text><text x="775" y="662" class="s">正确性条件，压过两个已经通过的输出级测试。</text>
<text x="70" y="796" class="b">Reward integrity = 让 PASS / FAIL 对齐任务本身，而不是让 checker 变得更复杂。</text><text x="70" y="832" class="muted">根据原论文 Appendix C.4 的两条 rollout 逐步重绘；没有使用未公开 checker 代码。</text></svg>
