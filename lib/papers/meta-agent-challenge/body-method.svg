<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="878" viewBox="0 0 1050 878" role="img" aria-labelledby="title"><title id="title">Meta-Agent Challenge：开发与隐藏测试的两个容器</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="878" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">Meta-Agent Challenge：开发与隐藏测试的两个容器</tspan></text><rect x="38" y="115.69999999999999" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="143.7" r="18" fill="#245e99"/><text x="69" y="150.7" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="149.7" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">开发者容器</tspan></text><text x="60" y="196.04" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">外层模型研究接口，编写 agent.py。</tspan></text><rect x="549" y="115.69999999999999" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="143.7" r="18" fill="#245e99"/><text x="580" y="150.7" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="149.7" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">调用开发评测 API</tspan></text><text x="571" y="196.04" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">候选实际在评测容器执行；开发者收</tspan><tspan x="571" dy="35.5">到逐题反馈。</tspan></text><path d="M507 199.37h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 199.37h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="321.03999999999996" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="349.03999999999996" r="18" fill="#245e99"/><text x="69" y="356.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="355.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">继续修改与审计</tspan></text><text x="60" y="401.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">按反馈调试；监控开发 API 是否违</tspan><tspan x="60" dy="35.5">规使用。</tspan></text><rect x="549" y="321.03999999999996" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="349.03999999999996" r="18" fill="#245e99"/><text x="580" y="356.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="355.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">结束开发，固定提交</tspan></text><text x="571" y="401.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">开发者不再自由改写项目。</tspan></text><path d="M507 404.71h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 404.71h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="526.38" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="554.38" r="18" fill="#245e99"/><text x="69" y="561.38" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">5</text><text x="107" y="560.38" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">注入最终验证脚本</tspan></text><text x="60" y="606.72" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">脚本和 test secret 放进开发者容</tspan><tspan x="60" dy="35.5">器，由这里发起最终验证。</tspan></text><rect x="549" y="526.38" width="463" height="167.34" rx="6" fill="#f1f7f5" stroke="#dce2e8"/><circle cx="580" cy="554.38" r="18" fill="#317e6a"/><text x="580" y="561.38" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">6</text><text x="618" y="560.38" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">评测容器跑隐藏题</tspan></text><text x="571" y="606.72" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">凭证授权测试；AIME、Science 先</tspan><tspan x="571" dy="35.5">解开题目和答案密文，再跑完整集。</tspan></text><path d="M507 610.05h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="731.72" width="974" height="68.5" fill="#fff" stroke="#dce2e8"/><path d="M38 731.72v68.5" stroke="#a96238" stroke-width="5"/><text x="55" y="757.72" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">开发期候选也在评测容器运行；加密细节仅核实了 AIME、Science。</tspan></text><path d="M38 817.22h974" stroke="#dce2e8"/><text x="38" y="842.22" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 §3 与官方评测 API 执行路径重绘。</tspan></text></g></svg>
