<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="567" viewBox="0 0 1050 567" role="img" aria-labelledby="title"><title id="title">自主开发超过人工基线的组合仍少</title><rect width="1050" height="567" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="66" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">自主开发超过人工基线的组合仍少</tspan></text><rect x="38" y="114.69999999999999" width="350" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="52" y="141.7" fill="#24292f" font-size="25" font-weight="700"><tspan x="52" dy="0">结果</tspan></text><rect x="388" y="114.69999999999999" width="220" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="402" y="141.7" fill="#24292f" font-size="25" font-weight="700"><tspan x="402" dy="0">原文计数</tspan></text><rect x="608" y="114.69999999999999" width="404" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="622" y="141.7" fill="#24292f" font-size="25" font-weight="700"><tspan x="622" dy="0">分母含义</tspan></text><rect x="38" y="171.2" width="350" height="51.5" fill="#f4f8fb" stroke="#dce2e8"/><text x="52" y="198.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">超过人工基线的配置</tspan></text><rect x="388" y="171.2" width="220" height="51.5" fill="#f4f8fb" stroke="#dce2e8"/><text x="402" y="198.2" fill="#465363" font-size="25" font-weight="400"><tspan x="402" dy="0">5 / 39</tspan></text><rect x="608" y="171.2" width="404" height="51.5" fill="#f4f8fb" stroke="#dce2e8"/><text x="622" y="198.2" fill="#465363" font-size="25" font-weight="400"><tspan x="622" dy="0">仅约 12.8% 的模型—任务组合</tspan></text><rect x="38" y="222.7" width="350" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="249.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">这些领先配置中的闭源模型</tspan></text><rect x="388" y="222.7" width="220" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="402" y="249.7" fill="#465363" font-size="25" font-weight="400"><tspan x="402" dy="0">4 / 5</tspan></text><rect x="608" y="222.7" width="404" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="622" y="249.7" fill="#465363" font-size="25" font-weight="400"><tspan x="622" dy="0">上述五个领先组合，不是 39 个</tspan><tspan x="622" dy="35.5">的 80%</tspan></text><rect x="38" y="309.7" width="350" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="52" y="336.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">高方差的配置</tspan></text><rect x="388" y="309.7" width="220" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="402" y="336.7" fill="#465363" font-size="25" font-weight="400"><tspan x="402" dy="0">约 33%</tspan></text><rect x="608" y="309.7" width="404" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="622" y="336.7" fill="#465363" font-size="25" font-weight="400"><tspan x="622" dy="0">三次独立开发仍存在明显不稳定</tspan></text><rect x="38" y="385.2" width="974" height="105" fill="#fff" stroke="#dce2e8"/><path d="M38 385.2v105" stroke="#a96238" stroke-width="5"/><text x="55" y="412.2" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">这些是开发系统的统计，不是五道题通过。正文保留各领域分数、预算与完整集判分</tspan><tspan x="55" dy="35.5">区别。</tspan></text><path d="M38 506.2h974" stroke="#dce2e8"/><text x="38" y="531.2" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据主结果表与三次独立开发实验重绘。</tspan></text></g></svg>
