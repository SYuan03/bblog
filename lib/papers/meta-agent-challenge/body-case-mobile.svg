<svg xmlns="http://www.w3.org/2000/svg" width="360" height="620" viewBox="0 0 360 620" role="img" aria-labelledby="t d">
  <title id="t">AIME 真题从题目到正式分数</title>
  <desc id="d">两个二次式相加后成为一次式，算得答案 116。只答对这题且漏答其余 59 题时，正式分数为 1/60。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#7c9bb2"/></marker></defs>
  <rect width="360" height="620" fill="#fff"/>
  <g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <text x="16" y="28" font-size="18" font-weight="700" fill="#22333f">AIME 2022 I · Problem 1</text>
    <text x="16" y="51" font-size="13" fill="#61717f">官方题目 idx=0；推导非模型输出</text>
    <g fill="#f7fafc" stroke="#cbd8e1"><rect x="16" y="70" width="328" height="101" rx="6"/><rect x="16" y="197" width="328" height="101" rx="6"/><rect x="16" y="324" width="328" height="101" rx="6"/></g>
    <g fill="#214e72" font-size="15" font-weight="700"><text x="30" y="94">1 · 官方题目</text><text x="30" y="221">2 · 两式相加</text><text x="30" y="348">3 · 算出所求</text></g>
    <g fill="#293b48" font-size="16"><text x="30" y="122">P、Q 二次项系数：+2、−2</text><text x="30" y="148">都经过 (16,54)、(20,53)</text><text x="30" y="249">R = P + Q，是一次式</text><text x="30" y="275">R(16)=108，R(20)=106</text><text x="30" y="376">斜率：(106−108)/4 = −0.5</text><text x="30" y="402">R(0) = 108 + 8 = 116</text></g>
    <path d="M180 174v17M180 301v17M180 428v17" stroke="#7c9bb2" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="16" y="451" width="328" height="148" rx="6" fill="#eff6f2" stroke="#b7d4c3"/>
    <text x="30" y="479" font-size="15" fill="#255940" font-weight="700">提交 (idx=0, pred=&quot;116&quot;)</text>
    <text x="30" y="509" font-size="15" fill="#293b48">math_equal_process = True</text>
    <text x="30" y="542" font-size="15" fill="#293b48">若其余 59 题漏答：</text>
    <text x="30" y="570" font-size="17" fill="#255940" font-weight="700">正式准确率 = 1/60 ≈ 0.0167</text>
  </g>
</svg>
