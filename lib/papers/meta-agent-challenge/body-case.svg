<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="t d">
  <title id="t">AIME 真题从题目到正式分数</title>
  <desc id="d">两个二次式相加后成为一次式，算得答案 116。只答对这题且漏答其余 59 题时，正式分数为 1/60。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#7c9bb2"/></marker></defs>
  <rect width="900" height="330" fill="#fff"/>
  <g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <text x="20" y="32" font-size="21" font-weight="700" fill="#22333f">AIME 2022 I · Problem 1：答案怎样进入分数</text>
    <text x="20" y="55" font-size="13" fill="#61717f">官方数据 idx=0；以下数学推导由本文完成，不是模型输出</text>
    <g fill="#f7fafc" stroke="#cbd8e1"><rect x="20" y="76" width="263" height="124" rx="6"/><rect x="319" y="76" width="263" height="124" rx="6"/><rect x="618" y="76" width="263" height="124" rx="6"/></g>
    <g fill="#214e72" font-size="15" font-weight="700"><text x="35" y="101">1 · 官方题目</text><text x="334" y="101">2 · 两式相加</text><text x="633" y="101">3 · 算出所求</text></g>
    <g fill="#293b48" font-size="17"><text x="35" y="130">P、Q 二次项系数：+2、−2</text><text x="35" y="159">都经过 (16,54)、(20,53)</text><text x="334" y="130">R = P + Q，是一次式</text><text x="334" y="159">R(16)=108，R(20)=106</text><text x="633" y="130">斜率：(106−108)/4 = −0.5</text><text x="633" y="159">R(0) = 108 + 8 = 116</text></g>
    <path d="M285 138h28M584 138h28" stroke="#7c9bb2" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="20" y="221" width="861" height="79" rx="6" fill="#eff6f2" stroke="#b7d4c3"/>
    <text x="35" y="250" font-size="17" fill="#255940" font-weight="700">提交 Prediction(idx=0, pred=&quot;116&quot;) → math_equal_process = True</text>
    <text x="35" y="279" font-size="17" fill="#293b48">若其余 59 题漏答：正式准确率 = 1 / 60 ≈ 0.0167；漏答记 False</text>
  </g>
</svg>
