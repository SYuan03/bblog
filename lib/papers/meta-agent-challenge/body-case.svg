<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="745" viewBox="0 0 1050 745" role="img" aria-labelledby="title"><title id="title">AIME 2022 I Problem 1：答案 116，分母仍是 60 题</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="745" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">AIME 2022 I Problem 1：答案 116，分母仍是 60 题</tspan></text><text x="38" y="116.69999999999999" fill="#465363" font-size="25" font-weight="400"><tspan x="38" dy="0">官方真实数据 id=0；以下推导为本文算术核对，不是模型运行日志。</tspan></text><rect x="38" y="153.2" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="181.2" r="18" fill="#245e99"/><text x="69" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">题目给出的约束</tspan></text><text x="60" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">两个二次式 P、Q 的二次项系数为</tspan><tspan x="60" dy="35.5">±2；都经过 (16,54)、(20,53)。</tspan></text><rect x="549" y="153.2" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="181.2" r="18" fill="#245e99"/><text x="580" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">把两式相加</tspan></text><text x="571" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">R=P+Q 的二次项抵消，因此 R 是一</tspan><tspan x="571" dy="35.5">次式。R(16)=108，R(20)=106。</tspan></text><path d="M507 236.87h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 236.87h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="358.53999999999996" width="463" height="167.34" rx="6" fill="#f1f7f5" stroke="#dce2e8"/><circle cx="69" cy="386.53999999999996" r="18" fill="#317e6a"/><text x="69" y="393.53999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="392.53999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">算出原点的值</tspan></text><text x="60" y="438.87999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">斜率为 (106−108)/(20−16)</tspan><tspan x="60" dy="35.5">=−0.5；R(0)=108+8=116。</tspan></text><rect x="549" y="358.53999999999996" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="386.53999999999996" r="18" fill="#245e99"/><text x="580" y="393.53999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="392.53999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">官方全集合判分</tspan></text><text x="571" y="438.87999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">漏答题记 False；只答对这一题时得</tspan><tspan x="571" dy="35.5">1/60≈0.0167，不是 1/1。</tspan></text><path d="M507 442.21h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="563.88" width="974" height="104" fill="#fff" stroke="#dce2e8"/><path d="M38 563.88v104" stroke="#a96238" stroke-width="5"/><text x="55" y="589.88" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">first_k 只缩小开发调试范围，不改变最终完整集分母。其他领域仍使用各自的官方</tspan><tspan x="55" dy="35.5">checker。</tspan></text><path d="M38 684.88h974" stroke="#dce2e8"/><text x="38" y="709.88" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据官方 AIME 数据与 evaluation_api.py 557–694 行重绘。</tspan></text></g></svg>
