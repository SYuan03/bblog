<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">ViCuR 一次训练</title><desc id="desc">student看图片与问题生成，teacher多看离线视觉线索评价同一回答，比较概率后更新student及视觉分支。</desc><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#24292f;font-size:23px}.h{font-size:27px;font-weight:700}.s{font-size:20px;fill:#536171}.b{fill:#fff;stroke:#becbd6;stroke-width:2}.line{fill:none;stroke:#245e99;stroke-width:3}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#245e99"/></marker></defs><rect width="960" height="440" fill="white"/><text x="30" y="43" class="h">同一回答、两种可见输入</text><rect x="30" y="83" width="255" height="123" rx="8" class="b"/><text x="48" y="118">student：图片＋问题</text><text x="48" y="155" class="s">视觉分支读取原图向量</text><text x="48" y="185" class="s">先生成自己的回答</text><rect x="30" y="262" width="255" height="127" rx="8" class="b"/><text x="48" y="298">teacher：多看视觉线索</text><text x="48" y="335" class="s">离线 teacher_prompt</text><text x="48" y="367" class="s">线索生成流程未完整公开</text><rect x="359" y="104" width="265" height="90" rx="8" class="b"/><text x="377" y="140">固定 student 回答 token</text><text x="377" y="175" class="s">不换成 teacher 示范轨迹</text><rect x="359" y="262" width="265" height="127" rx="8" class="b"/><text x="377" y="299">逐 token 计算概率</text><text x="377" y="335" class="s">teacher 接收同一回答前缀</text><text x="377" y="367" class="s">评分结果停止梯度</text><rect x="701" y="177" width="235" height="143" rx="8" class="b"/><text x="719" y="215">比较 token 概率</text><text x="719" y="252" class="s">策略损失带裁剪</text><text x="719" y="287" class="s">更新 student＋视觉分支</text><path d="M285 144H345M285 325H345M491 194V248M624 325H662V268H687M624 150H662V215H687" class="line" marker-end="url(#a)"/><text x="200" y="429" class="s">依据 §3.2–3.4；部署不提供线索文字，但保留视觉分支。</text></svg>
