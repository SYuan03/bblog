<svg xmlns="http://www.w3.org/2000/svg" width="960" height="445" viewBox="0 0 960 445" role="img" aria-labelledby="t d"><title id="t">Geometry3K 相交弦真实案例</title><desc id="d">两条弦分别为x与8、4与6，正确相乘得到x等于3。错误把4和x配在一条弦上会得到12。</desc><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#24292f;font-size:25px}.h{font-size:29px;font-weight:700}.s{font-size:21px;fill:#536171}.r{fill:#a64b47}.blue{fill:#245e99}</style><rect width="960" height="445" fill="white"/><text x="30" y="43" class="h">同一个定理，线段配错就会算错</text><circle cx="180" cy="222" r="115" fill="#f7f9fb" stroke="#536171" stroke-width="2"/><path d="M84 158L290 190" stroke="#a64b47" stroke-width="4"/><path d="M108 132L265 302" stroke="#245e99" stroke-width="4"/><text x="131" y="160" class="blue">x</text><text x="216" y="254" class="blue">8</text><text x="108" y="200" class="r">4</text><text x="239" y="165" class="r">6</text><text x="70" y="369">问题：Find x.</text><text x="70" y="405" class="s">标准答案：3</text><path d="M338 90V397" stroke="#dce2e8"/><text x="377" y="120" class="h r">错误配对</text><text x="377" y="159">4 与 x；6 与 8</text><text x="377" y="202">4x = 6×8 → x = 12</text><text x="377" y="235" class="s">未训练 5/10 次正确；OPSD 7/10</text><text x="377" y="295" class="h blue">正确配对</text><text x="377" y="334">4 与 6；x 与 8</text><text x="377" y="377">4×6 = x×8 → x = 3</text><text x="377" y="413" class="s">ViCuR 10/10 次正确，仅为这一题的重复测试</text></svg>
