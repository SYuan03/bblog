<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="448" viewBox="0 0 1000 448" role="img" aria-labelledby="t d"><title id="t">ViCuR 主结果完整对比</title><desc id="d">2B与8B均改善OPSD，但低于GRPO，8B也仍低于未训练模型。七项分数等权平均。</desc><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#24292f;font-size:23px}.h{font-size:29px;font-weight:700}.s{font-size:20px;fill:#536171}.v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}</style><rect width="1000" height="448" fill="white"/><text x="30" y="42" class="h">七项报告分数的等权平均：不是全题微平均</text><text x="31" y="91" class="h">2B student</text><text x="508" y="91" class="h">8B student</text><g fill="#8b99a9"><rect x="177" y="130" width="181.7" height="29"/><rect x="654" y="130" width="243" height="29"/><rect x="177" y="187" width="194" height="29"/><rect x="654" y="187" width="261.4" height="29"/><rect x="177" y="244" width="179.5" height="29"/><rect x="654" y="244" width="232.6" height="29"/></g><g fill="#245e99"><rect x="177" y="301" width="184.3" height="29"/><rect x="654" y="301" width="237.6" height="29"/></g><g><text x="30" y="153">未训练</text><text x="30" y="210">GRPO</text><text x="30" y="267">答案 OPSD</text><text x="30" y="324">＋ViCuR</text><text x="507" y="153">未训练</text><text x="507" y="210">GRPO</text><text x="507" y="267">答案 OPSD</text><text x="507" y="324">＋ViCuR</text></g><g class="v"><text x="369" y="154">45.42</text><text x="381" y="211">48.51</text><text x="367" y="268">44.88</text><text x="372" y="325">46.07</text><text x="907" y="154">60.76</text><text x="926" y="211">65.35</text><text x="897" y="268">58.15</text><text x="903" y="325">59.39</text></g><path d="M177 117V345M654 117V345" stroke="#dce2e8"/><text x="30" y="390">相对 OPSD：+1.19 个点</text><text x="507" y="390">+1.24，但低于未训练 1.37 个点</text><text x="30" y="432" class="s">依据 Table 1；条形起点为 0。蒸馏每题生成 1 次，GRPO 5 次，生成成本不同。</text></svg>
