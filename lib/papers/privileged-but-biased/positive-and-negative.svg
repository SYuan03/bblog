<g font-size="19" text-anchor="end"><text x="279" y="121">−1.56</text><text x="279" y="157">−1.57</text><text x="279" y="193">−0.28</text><text x="279" y="229">−1.80</text><text x="279" y="265">−0.30</text><text x="279" y="301" fill="#245e99">+0.94</text><text x="279" y="337">−3.51</text><text x="279" y="373" fill="#245e99">+4.68</text></g>
<rect x="682" y="99" width="285" height="280" rx="9" fill="#f4f7fa" stroke="#d3dde7"/>
<text x="702" y="133" font-size="20" font-weight="700">另一配方：Table 2</text><text x="702" y="166" font-size="18">固定初始教师、一条采样</text><text x="702" y="210" font-size="19">数学 think</text><text x="702" y="248" font-size="25" font-weight="700">63.38 → 59.10</text><text x="702" y="287" font-size="23">−4.28 点</text><text x="702" y="329" font-size="17" fill="#536171">教师安排和损失均有变化，</text><text x="702" y="355" font-size="17" fill="#536171">不能与主实验拼成同一曲线。</text>
<text x="30" y="426" font-size="17" fill="#536171">主实验没有成败奖励。短回答的 instruct 例外真实存在；研究没有测试奖励 + 蒸馏是否修复问题。</text>
