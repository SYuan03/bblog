<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc">
<title id="title">不能省略正面结果</title><desc id="desc">主实验四个领域两种模式的平均分数变化，代码instruct加0.94，工具instruct加4.68，其余六组为负；固定初始教师的数学think另为减4.28。</desc>
