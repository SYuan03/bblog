<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="486" viewBox="0 0 1000 486" role="img" aria-labelledby="title desc">
<title id="title">真实公开训练题与五种资料</title><desc id="desc">sample_id 1 比较 p=2^3009、q=3^2006、r=5^1003；统一指数为1003，底数是8、9、5，正确答案D。五种资料分别给出完整推导、策略、一般方向、题型或D。</desc>
<rect width="1000" height="486" fill="#fff"/>
<g font-family="Arial, PingFang SC, sans-serif" fill="#24292f">
<text x="30" y="38" font-size="24" font-weight="700">一条真实数据行：sample_id＝1，source＝olympiads</text>
<rect x="30" y="63" width="940" height="168" rx="5" fill="#f7f9fb" stroke="#dce2e8"/>
<text x="53" y="102" font-size="23">p＝2³⁰⁰⁹＝8¹⁰⁰³</text><text x="362" y="102" font-size="23">q＝3²⁰⁰⁶＝9¹⁰⁰³</text><text x="699" y="102" font-size="23">r＝5¹⁰⁰³</text>
<text x="53" y="151" font-size="21">共同指数＝gcd(3009, 2006, 1003)＝1003</text>
<text x="53" y="198" font-size="23" font-weight="700" fill="#245e99">5＜8＜9 → r＜p＜q → 选项 D</text>
<rect x="30" y="254" width="940" height="42" fill="#fff" stroke="#dce2e8"/>
<text x="48" y="281" font-size="19" font-weight="700">L1 完整解答</text><text x="256" y="281" font-size="19">给出上面的改写、计算与答案</text>
<rect x="30" y="296" width="940" height="42" fill="#f7f9fb" stroke="#dce2e8"/>
<text x="48" y="323" font-size="19" font-weight="700">L2 strategy</text><text x="256" y="323" font-size="19">指定幂的乘方规则、统一为最大公约数指数，再比较底数</text>
<rect x="30" y="338" width="940" height="42" fill="#fff" stroke="#dce2e8"/>
<text x="48" y="365" font-size="19" font-weight="700">L3 framing</text><text x="256" y="365" font-size="19">提示统一表示，只剩一个变化量；不指定这道题的具体规则</text>
<rect x="30" y="380" width="940" height="42" fill="#f7f9fb" stroke="#dce2e8"/>
<text x="48" y="407" font-size="19" font-weight="700">L4 / L5</text><text x="256" y="407" font-size="19">L4 只给“不同底数与指数的幂的排序”；L5 只给 D</text>
<text x="30" y="456" font-size="16" fill="#536171">附录 B.1 与公开 JSONL 的原题；此处展示参考推导，不是虚构 student 的实际回答。</text>
</g></svg>
