<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">离线资料与在线 OPSD 训练</title><desc id="desc">离线模型从同题参考解答生成题型、方向和策略。在线 student 只看题目，冻结初始 teacher 看资料和相同 student 前文。两份概率产生损失，只更新 student。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#245e99" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="480" fill="#fff"/>
<g font-family="Arial, PingFang SC, sans-serif" fill="#24292f">
<text x="30" y="38" font-size="24" font-weight="700">资料生成与训练，是两个不同阶段</text>
<rect x="30" y="63" width="940" height="102" rx="5" fill="#f7f9fb" stroke="#dce2e8"/>
<text x="47" y="91" font-size="18" fill="#536171">离线一次</text>
<text x="47" y="121" font-size="20">题目＋完整参考解答</text>
<path d="M278 116 H335" stroke="#245e99" stroke-width="2" marker-end="url(#arrow)"/>
<text x="350" y="105" font-size="19" font-weight="700">Qwen3.5-397B-A17B</text>
<text x="350" y="137" font-size="18">先 L4 题型，再 L3 方向，再 L2 策略</text>
<path d="M717 116 H754" stroke="#245e99" stroke-width="2" marker-end="url(#arrow)"/>
<text x="768" y="105" font-size="19" font-weight="700">29,434 行资料</text>
<text x="768" y="137" font-size="18">每题对齐 L1 至 L5</text>
<rect x="30" y="196" width="426" height="126" rx="5" fill="#fff" stroke="#245e99"/>
<text x="49" y="227" font-size="21" font-weight="700">student：只看题目</text>
<text x="49" y="258" font-size="19">当前参数生成自己的回答</text>
<text x="49" y="291" font-size="18" fill="#536171">在题目＋自身前文上计算概率 p</text>
<rect x="544" y="196" width="426" height="126" rx="5" fill="#fff" stroke="#317e6a"/>
<text x="563" y="227" font-size="21" font-weight="700">teacher：初始模型，LoRA 关闭</text>
<text x="563" y="258" font-size="19">看同题资料＋相同 student 前文</text>
<text x="563" y="291" font-size="18" fill="#536171">计算概率 q，不另生成替代答案</text>
<path d="M456 260 H540" stroke="#245e99" stroke-width="2" marker-end="url(#arrow)"/>
<text x="478" y="241" font-size="15" fill="#536171">前文</text>
<path d="M238 323 V347 H466" fill="none" stroke="#245e99" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M757 323 V347 H535" fill="none" stroke="#317e6a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="166" y="365" width="668" height="59" rx="4" fill="#f7f9fb" stroke="#dce2e8"/>
<text x="500" y="401" font-size="21" text-anchor="middle">比较完整词表概率 → 回答位置损失 → 只更新 student LoRA</text>
<text x="30" y="459" font-size="16" fill="#536171">依据：论文 §3、A.1、B.1；公开 collator / trainer。部署时不提供这些参考资料。</text>
</g></svg>
