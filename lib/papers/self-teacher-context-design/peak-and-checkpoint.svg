<text x="30" y="68" font-size="18" fill="#536171">Qwen3-4B，seed 42；三个数学测试集均值，单位 %</text>
<rect x="30" y="91" width="940" height="51" fill="#f0f3f6" stroke="#dce2e8"/>
<text x="47" y="122" font-size="18" font-weight="700">怎样选择检查点</text>
<text x="467" y="122" font-size="18" text-anchor="middle">L1 完整</text><text x="608" y="122" font-size="18" text-anchor="middle">L2 策略</text><text x="748" y="122" font-size="18" text-anchor="middle">L3 方向</text><text x="887" y="122" font-size="18" text-anchor="middle">L4 题型</text>
<rect x="30" y="142" width="940" height="77" fill="#fff" stroke="#dce2e8"/>
<text x="47" y="175" font-size="19">每个测试集分别取最高</text><text x="47" y="202" font-size="16" fill="#536171">可能混合三个不同检查点</text>
<text x="467" y="188" font-size="23" text-anchor="middle">63.43</text><text x="608" y="188" font-size="23" text-anchor="middle">64.07</text><text x="748" y="188" font-size="23" text-anchor="middle" fill="#245e99" font-weight="700">64.81</text><text x="887" y="188" font-size="23" text-anchor="middle">64.63</text>
