<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="472" viewBox="0 0 1000 472" role="img" aria-labelledby="title desc">
<title id="title">三种读分方式，4B的冠军会变化</title><desc id="desc">逐测试集最高分均值：L1 63.43 L2 64.07 L3 64.81 L4 64.63；同一检查点最高均值：62.31 63.43 63.24 64.63；固定第200步：60.93 62.59 61.76 62.59。主表冠军L3，共同检查点冠军L4。</desc>
<rect width="1000" height="472" fill="#fff"/>
<g font-family="Arial, PingFang SC, sans-serif" fill="#24292f">
