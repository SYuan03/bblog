<text x="47" y="252" font-size="19">一个共同检查点的最高均值</text><text x="47" y="279" font-size="16" fill="#536171">三项都来自同一个模型检查点</text>
<text x="467" y="264" font-size="23" text-anchor="middle">62.31</text><text x="608" y="264" font-size="23" text-anchor="middle">63.43</text><text x="748" y="264" font-size="23" text-anchor="middle">63.24</text><text x="887" y="264" font-size="23" text-anchor="middle" fill="#245e99" font-weight="700">64.63</text>
<rect x="30" y="296" width="940" height="77" fill="#fff" stroke="#dce2e8"/>
<text x="47" y="329" font-size="19">固定第 200 步</text><text x="47" y="356" font-size="16" fill="#536171">没有从评测分数中挑选停止位置</text>
<text x="467" y="342" font-size="23" text-anchor="middle">60.93</text><text x="608" y="342" font-size="23" text-anchor="middle" fill="#245e99" font-weight="700">62.59</text><text x="748" y="342" font-size="23" text-anchor="middle">61.76</text><text x="887" y="342" font-size="23" text-anchor="middle" fill="#245e99" font-weight="700">62.59</text>
<text x="30" y="414" font-size="20">L3 的最高分优势存在，但选用的指标决定优势大小与冠军。</text>
<text x="30" y="451" font-size="16" fill="#536171">依据：Table 1、Table 14；L4 的共同最高均值 64.63 取第 125 步。</text>
