<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="825" viewBox="0 0 1050 825" role="img" aria-labelledby="title"><title id="title">Self-Harness：同一模型改程序，再重跑两个分区</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="825" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">Self-Harness：同一模型改程序，再重跑两个分区</tspan></text><text x="38" y="116.69999999999999" fill="#465363" font-size="25" font-weight="400"><tspan x="38" dy="0">模型参数固定；每次改变的是 DeepAgent 程序与配置。</tspan></text><rect x="38" y="153.2" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="181.2" r="18" fill="#245e99"/><text x="69" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">先执行，保留失败</tspan></text><text x="60" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">模型用当前程序完成任务，收集失败</tspan><tspan x="60" dy="35.5">步骤与测试反馈。</tspan></text><rect x="549" y="153.2" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="181.2" r="18" fill="#245e99"/><text x="580" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">归类共同原因</tspan></text><text x="571" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">按测试拒绝什么、什么行为造成失败、</tspan><tspan x="571" dy="35.5">共同机制是什么进行分析。</tspan></text><path d="M507 236.87h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 236.87h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="358.53999999999996" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="386.53999999999996" r="18" fill="#245e99"/><text x="69" y="393.53999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="392.53999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">提出小范围修改</tspan></text><text x="60" y="438.87999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">同一模型换一份输入，修改程序定义</tspan><tspan x="60" dy="35.5">或配置，避免无依据的大改。</tspan></text><rect x="549" y="358.53999999999996" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="386.53999999999996" r="18" fill="#245e99"/><text x="580" y="393.53999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="392.53999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">两个分区都重跑</tspan></text><text x="571" y="438.87999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">held-in 与论文所称 held-out，都</tspan><tspan x="571" dy="35.5">会参与每轮候选选择。</tspan></text><path d="M507 442.21h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 442.21h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="563.88" width="463" height="167.34" rx="6" fill="#f1f7f5" stroke="#dce2e8"/><circle cx="69" cy="591.88" r="18" fill="#317e6a"/><text x="69" y="598.88" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">5</text><text x="107" y="597.88" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">满足条件才保留</tspan></text><text x="60" y="644.22" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">两组均分不下降，至少一组提高；</tspan><tspan x="60" dy="35.5">否则继续用上一版本。</tspan></text><rect x="549" y="563.88" width="463" height="167.34" rx="6" fill="#fbf3f2" stroke="#dce2e8"/><circle cx="580" cy="591.88" r="18" fill="#a64b47"/><text x="580" y="598.88" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">6</text><text x="618" y="597.88" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">看清独立测试边界</tspan></text><text x="571" y="644.22" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">这里的 held-out 是选择用验证分区，</tspan><tspan x="571" dy="35.5">不能当作最后仅用一次的盲测。</tspan></text><path d="M507 647.55h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M38 764.22h974" stroke="#dce2e8"/><text x="38" y="789.22" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 v3 §3 的版本选择流程重绘。</tspan></text></g></svg>
