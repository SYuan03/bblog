<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="816" viewBox="0 0 1050 816" role="img" aria-labelledby="title"><title id="title">Django 修复：49 项本地测试与 47 项官方测试</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="816" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">Django 修复：49 项本地测试与 47 项官方测试</tspan></text><text x="38" y="116.69999999999999" fill="#465363" font-size="25" font-weight="400"><tspan x="38" dy="0">来自 v3 Appendix B.2 的真实修复记录；两套测试不是同一个分母。</tspan></text><rect x="38" y="153.2" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="181.2" r="18" fill="#245e99"/><text x="69" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">原提交仍失败</tspan></text><text x="60" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">修改 window expression 后未成功</tspan><tspan x="60" dy="35.5">执行目标测试；必须转为通过的测试</tspan><tspan x="60" dy="35.5">仍失败。</tspan></text><rect x="549" y="153.2" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="181.2" r="18" fill="#245e99"/><text x="580" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">运行程序增加提交检查</tspan></text><text x="571" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">模型提交前要检查 diff，并拿到真</tspan><tspan x="571" dy="35.5">正可执行的测试结果。</tspan></text><path d="M507 254.62h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 254.62h16v115.42H21v127.42h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="394.03999999999996" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="422.03999999999996" r="18" fill="#245e99"/><text x="69" y="429.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="428.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">新执行检查 SQLite</tspan></text><text x="60" y="474.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">调整 casting guard，并运行</tspan><tspan x="60" dy="35.5">expressions_window 的 49 项本</tspan><tspan x="60" dy="35.5">地测试。</tspan></text><rect x="549" y="394.03999999999996" width="463" height="202.84" rx="6" fill="#f1f7f5" stroke="#dce2e8"/><circle cx="580" cy="422.03999999999996" r="18" fill="#317e6a"/><text x="580" y="429.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="428.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">官方测试给任务判定</tspan></text><text x="571" y="474.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">1/1 FAIL-TO-PASS 与 46/46</tspan><tspan x="571" dy="35.5">PASS-TO-PASS 全过，任务才解决。</tspan></text><path d="M507 495.46h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="634.88" width="974" height="104" fill="#fff" stroke="#dce2e8"/><path d="M38 634.88v104" stroke="#a96238" stroke-width="5"/><text x="55" y="660.88" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">FAIL-TO-PASS 检查 bug 已修；PASS-TO-PASS 检查原功能未退化。不能把这条记</tspan><tspan x="55" dy="35.5">录写成 47/49 分。</tspan></text><path d="M38 755.88h974" stroke="#dce2e8"/><text x="38" y="780.88" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 Self-Harness v3 Appendix B.2 重绘。</tspan></text></g></svg>
