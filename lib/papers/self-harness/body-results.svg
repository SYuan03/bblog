<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="602" viewBox="0 0 1050 602" role="img" aria-labelledby="title"><title id="title">九个组合都提高，但选择本身要计入结论</title><rect width="1050" height="602" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="66" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">九个组合都提高，但选择本身要计入结论</tspan></text><rect x="38" y="114.69999999999999" width="280" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="52" y="141.7" fill="#24292f" font-size="25" font-weight="700"><tspan x="52" dy="0">证据</tspan></text><rect x="318" y="114.69999999999999" width="295" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="332" y="141.7" fill="#24292f" font-size="25" font-weight="700"><tspan x="332" dy="0">原文结果</tspan></text><rect x="613" y="114.69999999999999" width="399" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="627" y="141.7" fill="#24292f" font-size="25" font-weight="700"><tspan x="627" dy="0">解释边界</tspan></text><rect x="38" y="171.2" width="280" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="52" y="198.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">三个模型 × 三个评</tspan><tspan x="52" dy="35.5">测</tspan></text><rect x="318" y="171.2" width="295" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="332" y="198.2" fill="#465363" font-size="25" font-weight="400"><tspan x="332" dy="0">9 / 9 均提升</tspan></text><rect x="613" y="171.2" width="399" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="627" y="198.2" fill="#465363" font-size="25" font-weight="400"><tspan x="627" dy="0">两个分区都用来挑选候选版本</tspan></text><rect x="38" y="258.2" width="280" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="285.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">GLM-5 · AppWorld</tspan></text><rect x="318" y="258.2" width="295" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="332" y="285.2" fill="#465363" font-size="25" font-weight="400"><tspan x="332" dy="0">44.4% → 85.0%</tspan></text><rect x="613" y="258.2" width="399" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="627" y="285.2" fill="#465363" font-size="25" font-weight="400"><tspan x="627" dy="0">增加 40.6 个百分点，不是相对</tspan><tspan x="627" dy="35.5">增长率</tspan></text><rect x="38" y="345.2" width="280" height="87" fill="#f8fafb" stroke="#dce2e8"/><text x="52" y="372.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">修改保留规则</tspan></text><rect x="318" y="345.2" width="295" height="87" fill="#f8fafb" stroke="#dce2e8"/><text x="332" y="372.2" fill="#465363" font-size="25" font-weight="400"><tspan x="332" dy="0">两边不退化，至少一边</tspan><tspan x="332" dy="35.5">提高</tspan></text><rect x="613" y="345.2" width="399" height="87" fill="#f8fafb" stroke="#dce2e8"/><text x="627" y="372.2" fill="#465363" font-size="25" font-weight="400"><tspan x="627" dy="0">这是版本筛选标准，不是独立泛</tspan><tspan x="627" dy="35.5">化证明</tspan></text><rect x="38" y="456.2" width="974" height="69.5" fill="#fff" stroke="#dce2e8"/><path d="M38 456.2v69.5" stroke="#a96238" stroke-width="5"/><text x="55" y="483.2" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">低次数重跑、反复候选选择可能放大偶然收益。完整版本演化能力仍需独立最终测试。</tspan></text><path d="M38 541.7h974" stroke="#dce2e8"/><text x="38" y="566.7" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 v3 Table 1 与方法章节重绘。</tspan></text></g></svg>
