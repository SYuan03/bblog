<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
  <title id="title">RecreationBench task contract and visibility boundary</title>
  <desc id="desc">Five platform recreation tasks expose a running reference and tools to the agent, while source and hidden tests remain protected where possible.</desc>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#1f2933}.h{font-size:34px;font-weight:750}.t{font-size:22px;font-weight:700}.p{font-size:18px;fill:#52606d}.k{font-size:15px;font-weight:800;letter-spacing:1.5px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px}.box{fill:#fff;stroke:#cbd3da;stroke-width:2}.blue{fill:#eaf2f8;stroke:#3977a6}.green{fill:#e9f4ef;stroke:#2e806f}.orange{fill:#fbefe7;stroke:#bd6737}.red{fill:#f9eceb;stroke:#a84644}.arrow{stroke:#7b8794;stroke-width:3;fill:none;marker-end:url(#m)}
  </style>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#7b8794"/></marker></defs>
  <rect width="1400" height="660" fill="#f7f7f4"/>
  <text x="60" y="62" class="h">一个任务到底给 Agent 什么，又把什么藏起来？</text>
  <g transform="translate(60 105)">
    <rect class="box blue" width="290" height="430" rx="12"/>
    <text x="24" y="42" class="k" fill="#3977a6">AGENT CAN SEE</text>
    <text x="24" y="82" class="t">运行中的 reference</text><text x="24" y="112" class="p">用 GUI 主动探索状态与交互</text>
    <text x="24" y="162" class="t">任务 prompt</text><text x="24" y="192" class="p">只规定交付物，不规定工作流</text>
    <text x="24" y="242" class="t">开发工具</text><text x="24" y="272" class="p">写代码、构建、启动、截图、操作 GUI</text>
    <text x="24" y="322" class="t">可写 workspace</text><text x="24" y="352" class="p">候选实现与构建产物</text>
    <text x="24" y="397" class="mono">20 h rollout budget</text>
  </g>
  <path class="arrow" d="M365 320H505"/>
  <g transform="translate(510 105)">
    <rect class="box green" width="380" height="430" rx="12"/>
    <text x="24" y="42" class="k" fill="#2e806f">DELIVERABLE</text>
    <text x="24" y="84" class="t">完整、可启动的 recreation</text>
    <text x="24" y="126" class="p">Ubuntu / macOS / Windows</text><text x="24" y="153" class="mono">source + build/launch</text>
    <text x="24" y="205" class="p">Android</text><text x="24" y="232" class="mono">Gradle project → APK</text>
    <text x="24" y="284" class="p">Web</text><text x="24" y="311" class="mono">pinned React stack → index.html</text>
    <rect x="22" y="345" width="336" height="62" rx="8" fill="#fff" stroke="#2e806f"/>
    <text x="38" y="373" class="p">实现方式不限：</text><text x="38" y="397" class="p">只比较可观察行为与画面</text>
  </g>
  <path class="arrow" d="M905 320H1045"/>
  <g transform="translate(1050 105)">
    <rect class="box red" width="290" height="430" rx="12"/>
    <text x="24" y="42" class="k" fill="#a84644">HIDDEN FROM AGENT</text>
    <text x="24" y="82" class="t">reference source</text><text x="24" y="112" class="p">Desktop / Android 尽量 source-blind</text>
    <text x="24" y="162" class="t">frozen test suite</text><text x="24" y="192" class="p">actions、fixtures、expected outcomes</text>
    <text x="24" y="242" class="t">ground truth</text><text x="24" y="272" class="p">截图、UI 状态与 judge assertions</text>
    <rect x="22" y="316" width="246" height="91" rx="8" class="orange"/>
    <text x="38" y="345" class="p">Web 例外：</text><text x="38" y="371" class="p">浏览器必然拿到 HTML / CSS / JS，</text><text x="38" y="397" class="p">因此只隐藏 ground truth 与 tests。</text>
  </g>
  <g transform="translate(60 570)">
    <text class="k" fill="#3977a6">250 TASKS</text><text x="130" class="p">Ubuntu 50 · macOS 50 · Windows 50 · Android 50 · Web 50</text>
  </g>
  <text x="60" y="630" class="p">根据 Sections 2.1、4.1、4.2、4.5 与 Appendix C.6 重绘</text>
</svg>
