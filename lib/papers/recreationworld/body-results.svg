<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="825" viewBox="0 0 1000 825" role="img" aria-labelledby="title desc">
  <title id="title">RecreationBench：总体评分与完整程序检查通过比例</title>
  <desc id="desc">领先模型的程序、视觉和总体分数，以及 GPT-6 Astra 达到九成或全部程序检查的任务占比。总体分数是两个平台宏平均通道的平均，不是任务全部完成的比例。</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.title{font-size:33px;font-weight:750}.head{font-size:27px;font-weight:700}.body{font-size:25px;fill:#46545d}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:29px;font-weight:650}.small{font-size:23px;fill:#56646d}</style>
  <rect width="1000" height="825" fill="#fff"/>
  <text x="40" y="53" class="title">58.06 是评分，不是“58% 的任务完整做好”</text>
  <text x="40" y="94" class="body">先算平台原生分数，再对应用和平台等权，最后平均两通道。</text>
  <rect x="40" y="127" width="920" height="62" fill="#f1f4f6"/>
  <g class="head"><text x="64" y="167">模型</text><text x="490" y="167" text-anchor="middle">Prog</text><text x="665" y="167" text-anchor="middle">VLM</text><text x="855" y="167" text-anchor="middle">Overall</text></g>
  <rect x="40" y="189" width="920" height="72" fill="#f1f5f8"/>
  <g class="body"><text x="64" y="235">GPT-6 Astra</text><text x="64" y="306">Claude Opus 5</text><text x="64" y="377">GPT-5.6 Sol</text></g>
  <g class="num" text-anchor="middle"><text x="490" y="235">58.19</text><text x="665" y="235">57.92</text><text x="855" y="235" fill="#245f87">58.06</text><text x="490" y="306">45.99</text><text x="665" y="306">42.34</text><text x="855" y="306">44.16</text><text x="490" y="377">40.63</text><text x="665" y="377">43.49</text><text x="855" y="377">42.06</text></g>
  <path d="M40 261H960M40 332H960M40 403H960" stroke="#d2dade"/>
  <rect x="40" y="431" width="920" height="150" fill="#f7f8f8" stroke="#ccd4d9"/>
  <text x="64" y="474" class="head">GPT-6 Astra 的程序检查完成程度</text>
  <text x="64" y="521" class="num" fill="#245f87">17.6%</text><text x="237" y="521" class="body">任务的 Prog ≥ 90%</text>
  <text x="551" y="521" class="num" fill="#85413b">2.8%</text><text x="701" y="521" class="body">Prog = 100%</text>
  <text x="64" y="560" class="small">平均分与全部检查通过的任务占比，是不同的指标。</text>
  <text x="40" y="627" class="head">评分单位不能混用</text>
  <text x="40" y="670" class="body">桌面 / Android：Prog 按用例，VLM 按视觉断言。</text>
  <text x="40" y="711" class="body">Web：功能加权；视觉先在页面与视口内汇总。</text>
  <text x="40" y="751" class="body">Overall 既不是统一断言通过率，也不是任务完成率。</text>
  <text x="40" y="801" class="small">根据 Table 3 与 §4.4 重绘；每配置一条记录，未报告重复运行方差。</text>
</svg>
