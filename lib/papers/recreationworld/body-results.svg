<svg xmlns="http://www.w3.org/2000/svg" width="900" height="326" viewBox="0 0 900 326" role="img" aria-labelledby="title desc">
<title id="title">RecreationBench 的部分得分和严格通过率</title>
<desc id="desc">GPT-6 Astra 的程序检查 58.19、视觉检查 57.92、总体 58.06；总体得分不是整项任务完成率，程序检查全通过的任务占比只有 2.8%。</desc>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0.5" y="0.5" width="899" height="325" rx="0" fill="#ffffff" stroke="#cbd6de" stroke-width="1"/>
<text x="28" y="42" font-size="25" font-weight="760" fill="#25313b" text-anchor="start">58.06 是平均检查得分，不是 58% 的任务完成</text>
<text x="28" y="69" font-size="15.5" font-weight="400" fill="#536270" text-anchor="start">先算平台内应用平均，再对五平台等权，最后平均 Prog 与 VLM。</text>
<rect x="28" y="89" width="844" height="38" rx="0" fill="#eef3f7" stroke="none" stroke-width="1"/>
<text x="43" y="115" font-size="16" font-weight="700" fill="#25313b" text-anchor="start">模型</text>
<text x="414" y="115" font-size="16" font-weight="700" fill="#25313b" text-anchor="start">Prog</text>
<text x="562" y="115" font-size="16" font-weight="700" fill="#25313b" text-anchor="start">VLM</text>
<text x="715" y="115" font-size="16" font-weight="700" fill="#25313b" text-anchor="start">Overall</text>
<rect x="28" y="127" width="844" height="43" rx="0" fill="#f5faff" stroke="none" stroke-width="1"/>
<line x1="28" y1="170" x2="872" y2="170" stroke="#cbd6de" stroke-width="1"/>
<text x="43" y="155" font-size="17" font-weight="700" fill="#25313b" text-anchor="start">GPT-6 Astra</text>
<text x="414" y="155" font-size="17" font-weight="700" fill="#25313b" text-anchor="start">58.19</text>
<text x="562" y="155" font-size="17" font-weight="700" fill="#25313b" text-anchor="start">57.92</text>
<text x="715" y="155" font-size="17" font-weight="700" fill="#25313b" text-anchor="start">58.06</text>
<line x1="28" y1="213" x2="872" y2="213" stroke="#cbd6de" stroke-width="1"/>
<text x="43" y="198" font-size="16" font-weight="450" fill="#25313b" text-anchor="start">Claude Opus 5</text>
<text x="414" y="198" font-size="16" font-weight="450" fill="#25313b" text-anchor="start">45.99</text>
<text x="562" y="198" font-size="16" font-weight="450" fill="#25313b" text-anchor="start">42.34</text>
<text x="715" y="198" font-size="16" font-weight="450" fill="#25313b" text-anchor="start">44.16</text>
<line x1="28" y1="256" x2="872" y2="256" stroke="#cbd6de" stroke-width="1"/>
<text x="43" y="241" font-size="16" font-weight="450" fill="#25313b" text-anchor="start">GPT-5.6 Sol</text>
<text x="414" y="241" font-size="16" font-weight="450" fill="#25313b" text-anchor="start">40.63</text>
<text x="562" y="241" font-size="16" font-weight="450" fill="#25313b" text-anchor="start">43.49</text>
<text x="715" y="241" font-size="16" font-weight="450" fill="#25313b" text-anchor="start">42.06</text>
<text x="28" y="278" font-size="16" font-weight="700" fill="#235f8f" text-anchor="start">严格检查：Astra 的 Prog ≥ 90% 为 17.6%；Prog = 100% 仅 2.8%。</text>
<text x="28" y="304" font-size="14.5" font-weight="400" fill="#536270" text-anchor="start">单次 rollout；模型与 harness 配置不同，分差不能全归因于模型权重。</text>
</g>
</svg>
