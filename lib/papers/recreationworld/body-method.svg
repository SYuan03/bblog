<svg xmlns="http://www.w3.org/2000/svg" width="900" height="334" viewBox="0 0 900 334" role="img" aria-labelledby="title desc">
<title id="title">RecreationBench 的输入、交付与隐藏评测</title>
<desc id="desc">Agent 可操作运行中的原软件、使用开发工具，并在二十小时内交付可运行代码；固定测试和参考结果在提交后用于独立评测。</desc>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0.5" y="0.5" width="899" height="333" rx="0" fill="#ffffff" stroke="#cbd6de" stroke-width="1"/>
<text x="28" y="42" font-size="25" font-weight="760" fill="#25313b" text-anchor="start">任务边界：看得见原软件，看不见最终检查</text>
<text x="28" y="68" font-size="15.5" font-weight="400" fill="#536270" text-anchor="start">同一 Agent 可在探索、实现和自查之间反复切换。</text>
<rect x="28" y="91" width="260" height="181" rx="0" fill="#f4f8fb" stroke="#cbd6de" stroke-width="1"/>
<rect x="28" y="91" width="4" height="181" rx="0" fill="#235f8f" stroke="none" stroke-width="1"/>
<text x="44" y="122" font-size="18" font-weight="700" fill="#25313b" text-anchor="start">Agent 可见</text>
<text x="44" y="150" font-size="15.5" font-weight="400" fill="#536270" text-anchor="start">任务提示与运行中的 reference</text>
<text x="44" y="174" font-size="15.5" font-weight="400" fill="#536270" text-anchor="start">GUI 操作、终端和开发工具</text>
<text x="44" y="198" font-size="15.5" font-weight="400" fill="#536270" text-anchor="start">可反复探索、编码、启动新版本</text>
<rect x="304" y="91" width="260" height="181" rx="0" fill="#f4faf7" stroke="#cbd6de" stroke-width="1"/>
<rect x="304" y="91" width="4" height="181" rx="0" fill="#246d5e" stroke="none" stroke-width="1"/>
<text x="320" y="122" font-size="18" font-weight="700" fill="#25313b" text-anchor="start">20 小时内交付</text>
<text x="320" y="150" font-size="15.5" font-weight="400" fill="#536270" text-anchor="start">探索 ↔ 实现 ↔ 运行自查</text>
<text x="320" y="174" font-size="15.5" font-weight="400" fill="#536270" text-anchor="start">完整源代码与构建、启动入口</text>
<text x="320" y="198" font-size="15.5" font-weight="400" fill="#536270" text-anchor="start">提交后冻结文件和进程</text>
<rect x="580" y="91" width="292" height="181" rx="0" fill="#fff7f4" stroke="#cbd6de" stroke-width="1"/>
<rect x="580" y="91" width="4" height="181" rx="0" fill="#a45a29" stroke="none" stroke-width="1"/>
<text x="596" y="122" font-size="18" font-weight="700" fill="#25313b" text-anchor="start">独立隐藏评测</text>
<text x="596" y="150" font-size="15.5" font-weight="400" fill="#536270" text-anchor="start">固定输入、动作和预期结果</text>
<text x="596" y="174" font-size="15.5" font-weight="400" fill="#536270" text-anchor="start">Prog：核对控件状态与结果</text>
<text x="596" y="198" font-size="15.5" font-weight="400" fill="#536270" text-anchor="start">VLM：判断最终窗口截图</text>
<text x="295" y="184" font-size="20" font-weight="700" fill="#235f8f" text-anchor="middle">→</text>
<text x="571" y="184" font-size="20" font-weight="700" fill="#246d5e" text-anchor="middle">→</text>
<line x1="28" y1="289" x2="872" y2="289" stroke="#cbd6de" stroke-width="1"/>
<text x="28" y="313" font-size="14.5" font-weight="400" fill="#536270" text-anchor="start">桌面 / Android 尽量隐藏源码；Web 浏览器可见前端文件，隐藏的是参考结果和测试。</text>
</g>
</svg>
