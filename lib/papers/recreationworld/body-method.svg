<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950" role="img" aria-labelledby="title desc">
  <title id="title">RecreationBench：可见输入、完整提交与隐藏检查</title>
  <desc id="desc">Agent 可操作原软件并用开发工具重建，在二十小时内提交可启动项目。隐藏检查回放固定动作并评估行为和画面。桌面与 Android 尽量隐藏原软件源码，Web 浏览器必然拿到前端代码。</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.title{font-size:33px;font-weight:750}.head{font-size:28px;font-weight:700}.body{font-size:25px;fill:#46545d}.small{font-size:23px;fill:#56646d}</style>
  <rect width="1000" height="950" fill="#fff"/>
  <text x="40" y="53" class="title">探索原软件，提交新版本，隐藏检查再验证</text>
  <text x="40" y="95" class="body">五个平台各 50 个任务；检查的是新版本的行为与画面。</text>
  <rect x="40" y="127" width="920" height="192" fill="#f1f5f8" stroke="#c4d3dd"/>
  <text x="64" y="171" class="head" fill="#245f87">① Agent 可见：原软件 + 任务说明 + 开发环境</text>
  <text x="64" y="213" class="body">操作运行中的原软件（reference），自己选择探索路径。</text>
  <text x="64" y="253" class="body">读写自己的目录，构建、启动新版本（candidate）并操作检查。</text>
  <text x="64" y="293" class="body">任务规定交付物；完整执行过程最多 20 小时。</text>
  <path d="M500 335v33m0 0-8-10m8 10 8-10" stroke="#647584" stroke-width="3" fill="none"/>
  <rect x="40" y="386" width="920" height="224" fill="#f2f6f4" stroke="#c6d8cf"/>
  <text x="64" y="430" class="head" fill="#356954">② 提交：可启动项目，不限定与原软件同一种实现</text>
  <text x="64" y="473" class="body">Ubuntu / macOS / Windows：源代码 + 构建和启动入口。</text>
  <text x="64" y="515" class="body">Android：Gradle 项目，构建成 APK 安装包。</text>
  <text x="64" y="557" class="body">Web：固定 React 开发栈，提交可运行站点入口 index.html。</text>
  <text x="64" y="590" class="small">时间结束后停止 Agent，冻结提交文件，再进入独立评测。</text>
  <path d="M500 626v33m0 0-8-10m8 10 8-10" stroke="#647584" stroke-width="3" fill="none"/>
  <rect x="40" y="678" width="920" height="202" fill="#fbf3f2" stroke="#d8bfbb"/>
  <text x="64" y="722" class="head" fill="#85413b">③ Agent 不可见：固定输入、动作、预期结果与参考截图</text>
  <text x="64" y="765" class="body">评测器回放隐藏测试，读取控件状态，并判断窗口截图。</text>
  <text x="64" y="806" class="body">桌面 / Android 尽量隐藏 reference 源码。</text>
  <text x="64" y="847" class="body">Web 是例外：浏览器必然拿到 HTML / CSS / JS；只隐藏测试依据。</text>
  <text x="40" y="926" class="small">根据论文 §§2.1、4.1、4.2、4.5 与 Appendix C.6 重绘。</text>
</svg>
