<svg xmlns="http://www.w3.org/2000/svg" width="360" height="536" viewBox="0 0 360 536" role="img" aria-labelledby="title desc">
<title id="title">Logbert 固定日志的程序与视觉检查，手机排版</title>
<desc id="desc">固定日志通过界面操作进入 Statistic；程序检查精确百分比，视觉检查饼图；旧值百分之十七是推演的失败例子。</desc>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0.5" y="0.5" width="359" height="535" rx="0" fill="#ffffff" stroke="#cbd6de" stroke-width="1"/>
<text x="17" y="31" font-size="20" font-weight="760" fill="#25313b" text-anchor="start">Logbert：十条日志</text>
<text x="17" y="56" font-size="20" font-weight="760" fill="#25313b" text-anchor="start">怎样产生 PASS / FAIL</text>
<text x="17" y="78" font-size="12.9" font-weight="400" fill="#536270" text-anchor="start">作者在原软件回放并人工复核后冻结测试。</text>
<rect x="17" y="94" width="326" height="77" rx="0" fill="#f7f9fb" stroke="#cbd6de" stroke-width="1"/>
<rect x="17" y="94" width="4" height="77" rx="0" fill="#235f8f" stroke="none" stroke-width="1"/>
<text x="33" y="125" font-size="16" font-weight="700" fill="#25313b" text-anchor="start">固定输入</text>
<text x="33" y="153" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">Info 5 · Error 3 · Debug 2，共 10 条</text>
<rect x="17" y="181" width="326" height="79" rx="0" fill="#f7f9fb" stroke="#cbd6de" stroke-width="1"/>
<rect x="17" y="181" width="4" height="79" rx="0" fill="#235f8f" stroke="none" stroke-width="1"/>
<text x="33" y="212" font-size="16" font-weight="700" fill="#25313b" text-anchor="start">runner 操作界面</text>
<text x="33" y="240" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">New Logger → 选日志 → 等载入</text>
<text x="33" y="259" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">点击 Statistic；导航深度 3</text>
<rect x="17" y="270" width="326" height="108" rx="0" fill="#f3f8fc" stroke="#cbd6de" stroke-width="1"/>
<rect x="17" y="270" width="4" height="108" rx="0" fill="#235f8f" stroke="none" stroke-width="1"/>
<text x="33" y="301" font-size="16" font-weight="700" fill="#25313b" text-anchor="start">Prog · 精确文字</text>
<text x="33" y="329" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">标签恰为 20%、30%、50%</text>
<text x="33" y="348" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">数量 3；旧值 17% 不存在</text>
<text x="33" y="367" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">50% = 5 / 10，均命中才通过</text>
<rect x="17" y="388" width="326" height="98" rx="0" fill="#f3faf7" stroke="#cbd6de" stroke-width="1"/>
<rect x="17" y="388" width="4" height="98" rx="0" fill="#246d5e" stroke="none" stroke-width="1"/>
<text x="33" y="419" font-size="16" font-weight="700" fill="#25313b" text-anchor="start">VLM · 窗口截图</text>
<text x="33" y="447" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">50% 扇区最大；20% 最小</text>
<text x="33" y="466" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">图例 Debug:2 / Info:5 / Error:3</text>
<rect x="17" y="497" width="326" height="27" rx="0" fill="#fff4f2" stroke="#efc6c4" stroke-width="1"/>
<text x="27" y="516" font-size="13.1" font-weight="650" fill="#ad4140" text-anchor="start">推演 FAIL：多一个旧值 17% 即失败。</text>
</g>
</svg>
