<svg xmlns="http://www.w3.org/2000/svg" width="360" height="454" viewBox="0 0 360 454" role="img" aria-labelledby="title desc">
<title id="title">RecreationBench 的输入、交付与隐藏评测，手机排版</title>
<desc id="desc">Agent 可看运行中的原软件并交付代码，固定检查在提交后独立执行；Web 前端文件对浏览器可见。</desc>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0.5" y="0.5" width="359" height="453" rx="0" fill="#ffffff" stroke="#cbd6de" stroke-width="1"/>
<text x="17" y="31" font-size="20" font-weight="760" fill="#25313b" text-anchor="start">看原软件、交付新版本、</text>
<text x="17" y="56" font-size="20" font-weight="760" fill="#25313b" text-anchor="start">再由隐藏检查评分</text>
<rect x="17" y="75" width="326" height="98" rx="0" fill="#f4f8fb" stroke="#cbd6de" stroke-width="1"/>
<rect x="17" y="75" width="4" height="98" rx="0" fill="#235f8f" stroke="none" stroke-width="1"/>
<text x="33" y="106" font-size="16" font-weight="700" fill="#25313b" text-anchor="start">Agent 可见</text>
<text x="33" y="134" font-size="13.5" font-weight="400" fill="#536270" text-anchor="start">任务提示、运行中的 reference</text>
<text x="33" y="153" font-size="13.5" font-weight="400" fill="#536270" text-anchor="start">GUI 与开发工具；可反复探索</text>
<rect x="17" y="184" width="326" height="98" rx="0" fill="#f4faf7" stroke="#cbd6de" stroke-width="1"/>
<rect x="17" y="184" width="4" height="98" rx="0" fill="#246d5e" stroke="none" stroke-width="1"/>
<text x="33" y="215" font-size="16" font-weight="700" fill="#25313b" text-anchor="start">20 小时内交付</text>
<text x="33" y="243" font-size="13.5" font-weight="400" fill="#536270" text-anchor="start">探索 ↔ 实现 ↔ 运行自查</text>
<text x="33" y="262" font-size="13.5" font-weight="400" fill="#536270" text-anchor="start">完整源代码与构建、启动入口</text>
<rect x="17" y="293" width="326" height="98" rx="0" fill="#fff7f4" stroke="#cbd6de" stroke-width="1"/>
<rect x="17" y="293" width="4" height="98" rx="0" fill="#a45a29" stroke="none" stroke-width="1"/>
<text x="33" y="324" font-size="16" font-weight="700" fill="#25313b" text-anchor="start">独立隐藏评测</text>
<text x="33" y="352" font-size="13.5" font-weight="400" fill="#536270" text-anchor="start">固定输入与动作；Prog 核对结果</text>
<text x="33" y="371" font-size="13.5" font-weight="400" fill="#536270" text-anchor="start">VLM 判断窗口截图</text>
<line x1="17" y1="404" x2="343" y2="404" stroke="#cbd6de" stroke-width="1"/>
<text x="17" y="425" font-size="13.3" font-weight="400" fill="#536270" text-anchor="start">桌面 / Android 尽量隐藏原软件源码。</text>
<text x="17" y="444" font-size="13.3" font-weight="400" fill="#536270" text-anchor="start">Web 前端可见；参考结果与测试隐藏。</text>
</g>
</svg>
