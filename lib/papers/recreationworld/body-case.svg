<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-labelledby="title desc">
<title id="title">Logbert 固定日志的程序与视觉检查</title>
<desc id="desc">十条固定日志经过 New Logger 与 Statistic 页面，程序检查三个百分比且排除旧值，视觉检查饼图和图例；多出百分之十七是推演的失败例子。</desc>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0.5" y="0.5" width="899" height="369" rx="0" fill="#ffffff" stroke="#cbd6de" stroke-width="1"/>
<text x="28" y="41" font-size="25" font-weight="760" fill="#25313b" text-anchor="start">Logbert：十条日志如何产生一个 PASS / FAIL</text>
<text x="28" y="67" font-size="15.5" font-weight="400" fill="#536270" text-anchor="start">测试由作者生成，在原软件回放、人工复核后冻结。</text>
<rect x="28" y="89" width="260" height="68" rx="0" fill="#f7f9fb" stroke="#cbd6de" stroke-width="1"/>
<rect x="28" y="89" width="4" height="68" rx="0" fill="#235f8f" stroke="none" stroke-width="1"/>
<text x="44" y="120" font-size="17" font-weight="700" fill="#25313b" text-anchor="start">固定输入</text>
<text x="44" y="148" font-size="14.5" font-weight="400" fill="#536270" text-anchor="start">10 条：Info 5 · Error 3 · Debug 2</text>
<rect x="304" y="89" width="568" height="68" rx="0" fill="#f7f9fb" stroke="#cbd6de" stroke-width="1"/>
<rect x="304" y="89" width="4" height="68" rx="0" fill="#235f8f" stroke="none" stroke-width="1"/>
<text x="320" y="120" font-size="17" font-weight="700" fill="#25313b" text-anchor="start">runner 执行动作</text>
<text x="320" y="148" font-size="14.5" font-weight="400" fill="#536270" text-anchor="start">New Logger → 选日志 → 等待载入 → Statistic（depth 3）</text>
<rect x="28" y="170" width="404" height="141" rx="0" fill="#f3f8fc" stroke="#cbd6de" stroke-width="1"/>
<rect x="28" y="170" width="4" height="141" rx="0" fill="#235f8f" stroke="none" stroke-width="1"/>
<text x="44" y="201" font-size="18" font-weight="700" fill="#25313b" text-anchor="start">Prog · UI Automation</text>
<text x="44" y="229" font-size="15" font-weight="400" fill="#536270" text-anchor="start">文字标签恰为 20%、30%、50%</text>
<text x="44" y="252" font-size="15" font-weight="400" fill="#536270" text-anchor="start">数量必须为 3；旧值 17% 不存在</text>
<text x="44" y="275" font-size="15" font-weight="400" fill="#536270" text-anchor="start">50% = 5 / 10；三条都命中才通过</text>
<rect x="446" y="170" width="426" height="141" rx="0" fill="#f3faf7" stroke="#cbd6de" stroke-width="1"/>
<rect x="446" y="170" width="4" height="141" rx="0" fill="#246d5e" stroke="none" stroke-width="1"/>
<text x="462" y="201" font-size="18" font-weight="700" fill="#25313b" text-anchor="start">VLM · 窗口截图</text>
<text x="462" y="229" font-size="15" font-weight="400" fill="#536270" text-anchor="start">50% 扇区最大，20% 最小</text>
<text x="462" y="252" font-size="15" font-weight="400" fill="#536270" text-anchor="start">图例 Debug: 2 / Info: 5 / Error: 3</text>
<text x="462" y="275" font-size="15" font-weight="400" fill="#536270" text-anchor="start">还检查标签页、列表和状态栏</text>
<rect x="28" y="324" width="844" height="28" rx="0" fill="#fff4f2" stroke="#efc6c4" stroke-width="1"/>
<text x="40" y="344" font-size="14.3" font-weight="650" fill="#ad4140" text-anchor="start">推演 FAIL：若多出旧值 17%，精确文字检查失败；这不是某模型的真实日志。</text>
</g>
</svg>
