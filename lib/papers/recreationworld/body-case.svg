<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110" role="img" aria-labelledby="title desc">
  <title id="title">Logbert：十条日志的隐藏测试与两条评分通道</title>
  <desc id="desc">作者生成测试，在原软件回放并人工复核后冻结。程序打开日志并进入统计页，程序通道检查三个百分比，视觉通道检查饼图与界面。残留百分之十七使程序检查失败，该分支根据公开断言推演。</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.title{font-size:33px;font-weight:750}.head{font-size:28px;font-weight:700}.body{font-size:25px;fill:#46545d}.small{font-size:23px;fill:#56646d}.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:23px;fill:#35424b}</style>
  <rect width="1000" height="1110" fill="#fff"/>
  <text x="40" y="53" class="title">Logbert：从十条固定日志到统计页的 PASS / FAIL</text>
  <text x="40" y="94" class="body">作者生成测试，在原软件回放并人工复核后冻结。</text>
  <rect x="40" y="125" width="920" height="148" fill="#f7f8f8" stroke="#ccd4d9"/>
  <text x="64" y="168" class="head">1 · 评测程序准备固定输入</text>
  <text x="64" y="209" class="code">sample_log4net_mixed.log</text>
  <text x="64" y="250" class="body">共 10 条消息：Info 5，Error 3，Debug 2。</text>
  <rect x="40" y="298" width="920" height="150" fill="#f7f8f8" stroke="#ccd4d9"/>
  <text x="64" y="342" class="head">2 · 执行程序（runner）操作界面</text>
  <text x="64" y="383" class="body">File → New Logger → 选择日志 → 确认。</text>
  <text x="64" y="424" class="body">等 Number 列出现，再点 Statistic；共三个导航层次。</text>
  <rect x="40" y="473" width="920" height="174" fill="#f1f5f8" stroke="#c4d3dd"/>
  <text x="64" y="517" class="head" fill="#245f87">3a · Prog：通过控件接口读取精确文字</text>
  <text x="64" y="559" class="code">sorted(labels) == ["20%", "30%", "50%"]</text>
  <text x="64" y="600" class="code">len(labels) == 3; "17%" not in labels</text>
  <text x="64" y="633" class="small">三条条件全部成立，这个程序检查用例才通过。</text>
  <rect x="40" y="672" width="920" height="190" fill="#f2f6f4" stroke="#c6d8cf"/>
  <text x="64" y="716" class="head" fill="#356954">3b · VLM：Qwen3.7-Plus 判断窗口截图</text>
  <text x="64" y="757" class="body">50% 扇区最大，20% 最小；图例计数 5 / 3 / 2。</text>
  <text x="64" y="798" class="body">Statistic 选中；十行列表、Running、10 Messages 保留。</text>
  <text x="64" y="840" class="small">逐条视觉断言计分，不替代精确文字检查。</text>
  <rect x="40" y="887" width="920" height="132" fill="#fbf3f2" stroke="#d8bfbb"/>
  <text x="64" y="931" class="head" fill="#85413b">明确失败：第四个标签仍残留旧值 17%</text>
  <text x="64" y="973" class="body">["50%", "30%", "20%", "17%"] 使程序检查失败。</text>
  <text x="64" y="1004" class="small">这个失败分支按公开断言推演，不是某个模型的真实日志。</text>
  <text x="40" y="1063" class="small">根据论文 Figure 8、Appendix C.5 与公开任务清单重绘。</text>
  <text x="40" y="1094" class="small">两通道各自计分，再按平台规则汇总；完整隐藏测试包未在本文重现。</text>
</svg>
