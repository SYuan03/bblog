<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">RecreationBench 分数与完整通过比例</title>
  <desc id="desc">领先三模型的程序与视觉平均分，以及 GPT-6 Astra 程序检查达到九成和满分的应用占比。平均分与完整通过比例不是同一指标。</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.h{font-size:34px;font-weight:750}.label{font-size:20px;font-weight:700}.p{font-size:20px;fill:#53616b}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:28px;font-weight:750}.small{font-size:17px;fill:#65717a}.line{stroke:#d5dce0;stroke-width:1}</style>
  <rect width="1400" height="720" fill="#fff"/>
  <text x="56" y="58" class="h">58.06 是复刻评分，不是“58% 的任务完整做好”</text>
  <text x="56" y="98" class="p">先算各平台的原生分数，再对应用、平台等权平均；两条通道最后取平均。</text>
  <rect x="56" y="132" width="1288" height="64" fill="#f2f5f7"/>
  <g class="label"><text x="80" y="173">模型</text><text x="648" y="173" text-anchor="middle">Prog · 程序检查</text><text x="924" y="173" text-anchor="middle">VLM · 画面检查</text><text x="1200" y="173" text-anchor="middle">Overall · 两通道平均</text></g>
  <rect x="56" y="196" width="1288" height="83" fill="#edf4f8"/>
  <g class="label"><text x="80" y="248">GPT-6 Astra</text><text x="80" y="331">Claude Opus 5</text><text x="80" y="414">GPT-5.6 Sol</text></g>
  <g class="num" text-anchor="middle"><text x="648" y="248">58.19</text><text x="924" y="248">57.92</text><text x="1200" y="248" fill="#245f87">58.06</text><text x="648" y="331">45.99</text><text x="924" y="331">42.34</text><text x="1200" y="331">44.16</text><text x="648" y="414">40.63</text><text x="924" y="414">43.49</text><text x="1200" y="414">42.06</text></g>
  <path class="line" d="M56 279H1344M56 362H1344M56 445H1344"/>
  <rect x="56" y="475" width="580" height="175" fill="#f4f7f6" stroke="#d5dce0"/>
  <text x="80" y="509" class="label">GPT-6 Astra · 应用程序检查完成程度</text>
  <text x="80" y="564" class="num" fill="#245f87">17.6%</text><text x="256" y="559" class="p">应用达到 Prog ≥ 90%</text>
  <text x="80" y="617" class="num" fill="#a64643">2.8%</text><text x="256" y="612" class="p">应用达到 Prog = 100%</text>
  <rect x="662" y="475" width="682" height="175" fill="#fff" stroke="#d5dce0"/>
  <text x="686" y="509" class="label">评分单位不能混用</text>
  <text x="686" y="549" class="p">桌面 / Android：Prog 按 case，VLM 按视觉断言。</text>
  <text x="686" y="581" class="p">Web：功能加权，视觉先在页面与视口内汇总。</text>
  <text x="686" y="618" class="p">因此 Overall 既不是统一断言率，也不是任务完成率。</text>
  <text x="56" y="690" class="small">根据论文 Table 3 与 §4.4 重绘。每配置一条执行记录；论文未报告重复运行方差或置信区间。</text>
</svg>
