<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">RecreationBench main results</title><desc id="desc">Programmatic, VLM and overall scores for the leading three models, plus strict programmatic task coverage.</desc>
  <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#1f2933}.h{font-size:34px;font-weight:760}.k{font-size:15px;font-weight:800;letter-spacing:1.2px}.p{font-size:17px;fill:#52606d}.name{font-size:19px;font-weight:700}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:750}.grid{stroke:#d9dee3;stroke-width:1}.bar1{fill:#3977a6}.bar2{fill:#2e806f}.bar3{fill:#735ca6}.box{fill:#fff;stroke:#cbd3da;stroke-width:2}</style>
  <rect width="1400" height="720" fill="#f7f7f4"/><text x="55" y="58" class="h">平均 58.06，不等于“58% 的任务完整做好”</text>
  <g transform="translate(55 110)">
    <text y="0" class="k" fill="#3977a6">PLATFORM-BALANCED SCORE (%)</text>
    <g transform="translate(0 38)"><text y="23" class="name">GPT-6 Astra</text><rect x="220" width="850" height="30" fill="#e6eaed"/><rect x="220" width="824" height="30" class="bar1"/><text x="1058" y="23" class="num">58.19 Prog</text><rect x="220" y="43" width="850" height="30" fill="#e6eaed"/><rect x="220" y="43" width="820" height="30" class="bar2"/><text x="1058" y="66" class="num">57.92 VLM</text><text x="1260" y="44" class="num" fill="#735ca6">58.06 overall</text></g>
    <g transform="translate(0 135)"><text y="23" class="name">Claude Opus 5</text><rect x="220" width="850" height="30" fill="#e6eaed"/><rect x="220" width="652" height="30" class="bar1"/><text x="886" y="23" class="num">45.99</text><rect x="220" y="43" width="850" height="30" fill="#e6eaed"/><rect x="220" y="43" width="600" height="30" class="bar2"/><text x="834" y="66" class="num">42.34</text><text x="1260" y="44" class="num">44.16</text></g>
    <g transform="translate(0 232)"><text y="23" class="name">GPT-5.6 Sol</text><rect x="220" width="850" height="30" fill="#e6eaed"/><rect x="220" width="576" height="30" class="bar1"/><text x="810" y="23" class="num">40.63</text><rect x="220" y="43" width="850" height="30" fill="#e6eaed"/><rect x="220" y="43" width="616" height="30" class="bar2"/><text x="850" y="66" class="num">43.49</text><text x="1260" y="44" class="num">42.06</text></g>
  </g>
  <g transform="translate(55 455)"><rect class="box" width="610" height="185" rx="10"/><text x="22" y="37" class="k" fill="#735ca6">STRICT PROGRAMMATIC COVERAGE · GPT-6 ASTRA</text><text x="22" y="92" class="num" style="font-size:37px" fill="#735ca6">17.6%</text><text x="175" y="90" class="p">tasks with Prog ≥ 90%</text><text x="22" y="145" class="num" style="font-size:37px" fill="#a84644">2.8%</text><text x="175" y="143" class="p">tasks with Prog = 100%</text></g>
  <g transform="translate(735 455)"><rect class="box" width="610" height="185" rx="10"/><text x="22" y="37" class="k" fill="#bd6737">HOW TO READ IT</text><text x="22" y="77" class="p">Prog 与 VLM 先在每个平台内按 application 做 macro average，</text><text x="22" y="108" class="p">再让五个平台等权；overall = (Prog + VLM) / 2。</text><text x="22" y="148" class="p">所以 58.06 是许多断言的平均通过程度，不是 solved-task rate。</text></g>
  <text x="55" y="684" class="p">根据原论文 Table 3 重绘。单次 rollout；论文未报告置信区间或 run-to-run 方差。</text>
</svg>
