<svg xmlns="http://www.w3.org/2000/svg" width="360" height="412" viewBox="0 0 360 412" role="img" aria-labelledby="title desc">
<title id="title">RecreationBench 的部分得分和严格通过率，手机排版</title>
<desc id="desc">GPT-6 Astra 总体 58.06，但程序检查全通过的任务占比只有 2.8%。</desc>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0.5" y="0.5" width="359" height="411" rx="0" fill="#ffffff" stroke="#cbd6de" stroke-width="1"/>
<text x="17" y="31" font-size="20" font-weight="760" fill="#25313b" text-anchor="start">58.06 是检查平均分，</text>
<text x="17" y="56" font-size="20" font-weight="760" fill="#25313b" text-anchor="start">不是任务完成率</text>
<text x="17" y="78" font-size="12.8" font-weight="400" fill="#536270" text-anchor="start">五平台等权；Overall 是 Prog 与 VLM 的平均。</text>
<rect x="17" y="96" width="326" height="32" rx="0" fill="#eef3f7" stroke="none" stroke-width="1"/>
<text x="25" y="118" font-size="12.5" font-weight="700" fill="#25313b" text-anchor="start">模型</text>
<text x="168" y="118" font-size="12.5" font-weight="700" fill="#25313b" text-anchor="start">Prog</text>
<text x="225" y="118" font-size="12.5" font-weight="700" fill="#25313b" text-anchor="start">VLM</text>
<text x="278" y="118" font-size="12.5" font-weight="700" fill="#25313b" text-anchor="start">总分</text>
<rect x="17" y="128" width="326" height="45" rx="0" fill="#f5faff" stroke="none" stroke-width="1"/>
<line x1="17" y1="173" x2="343" y2="173" stroke="#cbd6de" stroke-width="1"/>
<text x="25" y="157" font-size="13" font-weight="700" fill="#25313b" text-anchor="start">GPT-6 Astra</text>
<text x="168" y="157" font-size="13" font-weight="700" fill="#25313b" text-anchor="start">58.19</text>
<text x="225" y="157" font-size="13" font-weight="700" fill="#25313b" text-anchor="start">57.92</text>
<text x="278" y="157" font-size="13" font-weight="700" fill="#25313b" text-anchor="start">58.06</text>
<line x1="17" y1="218" x2="343" y2="218" stroke="#cbd6de" stroke-width="1"/>
<text x="25" y="202" font-size="13" font-weight="450" fill="#25313b" text-anchor="start">Claude Opus 5</text>
<text x="168" y="202" font-size="13" font-weight="450" fill="#25313b" text-anchor="start">45.99</text>
<text x="225" y="202" font-size="13" font-weight="450" fill="#25313b" text-anchor="start">42.34</text>
<text x="278" y="202" font-size="13" font-weight="450" fill="#25313b" text-anchor="start">44.16</text>
<line x1="17" y1="263" x2="343" y2="263" stroke="#cbd6de" stroke-width="1"/>
<text x="25" y="247" font-size="13" font-weight="450" fill="#25313b" text-anchor="start">GPT-5.6 Sol</text>
<text x="168" y="247" font-size="13" font-weight="450" fill="#25313b" text-anchor="start">40.63</text>
<text x="225" y="247" font-size="13" font-weight="450" fill="#25313b" text-anchor="start">43.49</text>
<text x="278" y="247" font-size="13" font-weight="450" fill="#25313b" text-anchor="start">42.06</text>
<rect x="17" y="279" width="326" height="68" rx="0" fill="#f3f8fc" stroke="#cbd6de" stroke-width="1"/>
<text x="27" y="304" font-size="15" font-weight="700" fill="#25313b" text-anchor="start">Astra 的严格通过率</text>
<text x="27" y="329" font-size="13.5" font-weight="700" fill="#235f8f" text-anchor="start">Prog ≥ 90%：17.6% · Prog = 100%：2.8%</text>
<text x="17" y="369" font-size="13.3" font-weight="400" fill="#536270" text-anchor="start">每任务只运行一次；不同 Agent 配置的分差</text>
<text x="17" y="388" font-size="13.3" font-weight="400" fill="#536270" text-anchor="start">不能全归因于模型权重。</text>
</g>
</svg>
