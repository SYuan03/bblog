<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Logbert benchmark case</title>
  <desc id="desc">A fixed ten-row log fixture is loaded, the Statistic tab is selected, and exact programmatic and visual assertions decide the result.</desc>
  <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#1f2933}.h{font-size:34px;font-weight:760}.k{font-size:14px;font-weight:800;letter-spacing:1.4px}.t{font-size:21px;font-weight:720}.p{font-size:17px;fill:#52606d}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px}.box{fill:#fff;stroke:#cbd3da;stroke-width:2}.blue{fill:#eaf2f8;stroke:#3977a6}.green{fill:#e9f4ef;stroke:#2e806f}.orange{fill:#fbefe7;stroke:#bd6737}.red{fill:#f9eceb;stroke:#a84644}.arrow{stroke:#7b8794;stroke-width:3;fill:none;marker-end:url(#m)}</style>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#7b8794"/></marker></defs>
  <rect width="1400" height="760" fill="#f7f7f4"/>
  <text x="55" y="58" class="h">真实 case：Logbert 的 Statistic 页面怎样判 PASS / FAIL</text>
  <g transform="translate(55 100)"><rect class="box blue" width="250" height="250" rx="10"/><text x="20" y="36" class="k" fill="#3977a6">1 · FIXTURE</text><text x="20" y="76" class="t">sample_log4net_mixed.log</text><text x="20" y="112" class="p">固定 10 条消息：</text><text x="20" y="147" class="mono">Info  = 5</text><text x="20" y="178" class="mono">Error = 3</text><text x="20" y="209" class="mono">Debug = 2</text><text x="20" y="238" class="p">fixture 随隐藏测试分发给 evaluator</text></g>
  <path class="arrow" d="M315 225H370"/>
  <g transform="translate(380 100)"><rect class="box orange" width="250" height="250" rx="10"/><text x="20" y="36" class="k" fill="#bd6737">2 · ACTIONS</text><text x="20" y="76" class="t">打开 → 载入 → 等待 → 切页</text><text x="20" y="112" class="mono">File → New Logger</text><text x="20" y="143" class="mono">select fixture; OK</text><text x="20" y="174" class="mono">wait Number populated</text><text x="20" y="205" class="mono">click Statistic</text><text x="20" y="238" class="p">交互深度：0 → 1 → 2 → 3</text></g>
  <path class="arrow" d="M640 225H695"/>
  <g transform="translate(705 100)"><rect class="box green" width="290" height="250" rx="10"/><text x="20" y="36" class="k" fill="#2e806f">3 · PROGRAMMATIC</text><text x="20" y="76" class="t">UI Automation 读取精确状态</text><text x="20" y="112" class="mono">sorted(labels)</text><text x="20" y="143" class="mono">== ["20%","30%","50%"]</text><text x="20" y="174" class="mono">len(labels) == 3</text><text x="20" y="205" class="mono">"17%" not in labels</text><text x="20" y="238" class="p">少一个、多一个或残留旧值都失败</text></g>
  <path class="arrow" d="M1005 225H1060"/>
  <g transform="translate(1070 100)"><rect class="box blue" width="275" height="250" rx="10"/><text x="20" y="36" class="k" fill="#3977a6">4 · VISUAL</text><text x="20" y="76" class="t">Qwen3.7-Plus 判画面</text><text x="20" y="112" class="p">50% 扇区最大，20% 最小</text><text x="20" y="143" class="p">legend 显示 Debug:2 / Info:5 / Error:3</text><text x="20" y="174" class="p">Statistic 已选中</text><text x="20" y="205" class="p">10-row grid、Running 与 10 Messages 不变</text><text x="20" y="238" class="p">输入是完整 application-window capture</text></g>
  <g transform="translate(55 410)"><rect class="box green" width="610" height="220" rx="10"/><text x="22" y="38" class="k" fill="#2e806f">PASS</text><text x="22" y="78" class="t">同一轮交互同时满足两种证据</text><text x="22" y="116" class="p">程序通道读到三个准确百分比，没有 stale 17%；</text><text x="22" y="148" class="p">视觉通道看到与 reference 一致的饼图、legend 和页面状态。</text><text x="22" y="190" class="p">最后再进入平台内 macro average，而不是整题单一布尔值。</text></g>
  <g transform="translate(735 410)"><rect class="box red" width="610" height="220" rx="10"/><text x="22" y="38" class="k" fill="#a84644">ONE CONCRETE FAIL TRACE</text><text x="22" y="78" class="t">饼图“看起来像”，但百分比标签仍是旧状态</text><text x="22" y="116" class="p">例如页面包含 50%、30%、20%，同时残留 17%。</text><text x="22" y="148" class="p">视觉判断可能仍认可大体布局；程序断言会因 label 数量为 4</text><text x="22" y="180" class="p">且出现 17% 而失败。此轨迹由公开断言推演，不是模型日志。</text></g>
  <text x="55" y="696" class="p">根据 Figure 8、Appendix C.5 与官方测试清单重绘；测试由作者生成、在 reference 上回放并经人工复核后冻结。</text>
</svg>
