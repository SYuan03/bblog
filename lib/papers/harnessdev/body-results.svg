<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" role="img" aria-labelledby="title desc">
<title id="title">HarnessDev 控制组件在真实执行中的触发证据</title><desc id="desc">18份代码程序六模块共108组件，72完整证据18部分18未触发，26679任务记录未见checkpoint，Data退化提交未被检测。这不是组件增益因果实验。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.title{font-size:33px;font-weight:750}.head{font-size:28px;font-weight:700}.body{font-size:25px;fill:#46545d}.small{font-size:23px;fill:#56646d}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:28px;font-weight:650}</style>
<rect width="1000" height="880" fill="#fff"/>
<text x="40" y="53" class="title">代码里写了功能，不代表任务中真正用过</text>
<text x="40" y="97" class="body">18 份 Code harness × 6 个控制模块 = 108 个组件实例。</text>
<text x="40" y="137" class="small">这不是 108 道任务；下面只统计正式执行中的功能证据。</text>
<g class="body"><text x="40" y="205">完整证据</text><text x="40" y="271">部分触发</text><text x="40" y="337">未触发</text></g>
<g fill="#e1e7eb"><rect x="252" y="174" width="560" height="40"/><rect x="252" y="240" width="560" height="40"/><rect x="252" y="306" width="560" height="40"/></g>
<rect x="252" y="174" width="373.333" height="40" fill="#39765f"/><rect x="252" y="240" width="93.333" height="40" fill="#658399"/><rect x="252" y="306" width="93.333" height="40" fill="#9aa8b1"/>
<g class="num"><text x="835" y="205">72/108</text><text x="835" y="271">18/108</text><text x="835" y="337">18/108</text></g>
<rect x="40" y="387" width="920" height="185" fill="#f7f8f8" stroke="#ccd4d9"/>
<text x="64" y="431" class="head">状态与恢复：接口声明多，实际保存少</text>
<text x="64" y="473" class="body">11/18 定义 State 类；只有一个提供保存接口，一个做定期快照。</text>
<text x="64" y="514" class="body">26,679 条任务记录中，没发现保存检查点的 checkpoint event。</text>
<text x="64" y="556" class="small">定义状态类，不等于状态能持久保存或恢复。</text>
<rect x="40" y="602" width="920" height="168" fill="#fbf3f2" stroke="#d8bfbb"/>
<text x="64" y="646" class="head" fill="#85413b">有验证机制，也可能漏掉明显退化提交</text>
<text x="64" y="688" class="body">15/18 声明完整验证；Data 的 2,325 次执行中有 441 份退化提交。</text>
<text x="64" y="731" class="body">论文记录：没有 harness 检出这些退化提交。</text>
<text x="40" y="821" class="small">根据 §4.2 整理；这是执行审计，不是单个组件的因果增益实验。</text>
<text x="40" y="855" class="small">Figure 5 按领域与阶段归一化显示证据密度，不是这里的总数柱图。</text>
</svg>
