<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="835" viewBox="0 0 1000 835" role="img" aria-labelledby="title desc">
<title id="title">HarnessDev 换执行模型时的三程序平均</title><desc id="desc">三份Opus创建程序不变，自用69.3，固定Gemini执行33.0。包含一份完全退化，事后排除的49.1不是正式结果替代。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.title{font-size:33px;font-weight:750}.head{font-size:28px;font-weight:700}.body{font-size:25px;fill:#46545d}.small{font-size:23px;fill:#56646d}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:31px;font-weight:650}</style>
<rect width="1000" height="835" fill="#fff"/>
<text x="40" y="53" class="title">保持三份代码不变，换成统一的执行模型</text>
<text x="40" y="97" class="body">Opus 独立创建三份 harness，avg@3 是三份程序均分。</text>
<rect x="40" y="130" width="920" height="171" fill="#f1f5f8" stroke="#c4d3dd"/>
<text x="64" y="174" class="head" fill="#245f87">自用：Opus 创建，Opus 执行</text>
<text x="64" y="224" class="num">H₁ / H₂ / H₃ → SWE avg@3 = 69.3</text>
<text x="64" y="277" class="small">三份独立创建程序的正式平均成绩。</text>
<rect x="40" y="331" width="920" height="171" fill="#fbf3f2" stroke="#d8bfbb"/>
<text x="64" y="375" class="head" fill="#85413b">统一执行：同三份代码，固定 Gemini 3.1 Pro</text>
<text x="64" y="425" class="num">H₁ / H₂ / H₃ → SWE avg@3 = 33.0</text>
<text x="64" y="478" class="small">第三份程序完全退化，仍按预先规定计入均值。</text>
<rect x="40" y="532" width="920" height="128" fill="#f7f8f8" stroke="#ccd4d9"/>
<text x="64" y="576" class="head">事后敏感性分析：删去退化副本，剩余均分 49.1</text>
<text x="64" y="620" class="body">49.1 不能替代正式结果 33.0，也不能忽略程序不稳的问题。</text>
<text x="40" y="709" class="body">论文提及写死 120 步等专用逻辑，但不能把全部分差归给它。</text>
<text x="40" y="751" class="small">这是跨任务平均成绩，不是可重放的单题 PASS / FAIL。</text>
<text x="40" y="799" class="small">根据 Tables 3–4 与 Figure 6 重绘；完整检查与原始轨迹未公开。</text>
<text x="40" y="827" class="small">本文未独立重跑原评测。</text>
</svg>
