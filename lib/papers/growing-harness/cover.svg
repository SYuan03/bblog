    <text x="24" y="151" font-family="ui-monospace, monospace" font-size="16" fill="#5e686f">fixed model + tools</text>
  </g>
  <path d="M420 572 H548" stroke="#aa5d35" stroke-width="6"/>
  <path d="M548 572 l-22 -14 v28 z" fill="#aa5d35"/>

