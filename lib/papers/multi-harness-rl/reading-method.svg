<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1011" viewBox="0 0 600 1011" role="img" aria-labelledby="title desc"><title id="title">改变比较组，不改训练记录</title><desc id="desc">根据 Figure 1、§3 与公式绘制 下面 A/B 数值仅用于解释公式</desc><rect width="600" height="1011" fill="#fff"/><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:32px;font-weight:750}.label{font-size:28px;font-weight:750}.main{font-size:28px}.small{font-size:24px}.value{font-size:32px;font-weight:750}</style><text x="24" y="66" class="title" fill="#20252d" text-anchor="start">改变比较组，不改训练记录</text>
<text x="24" y="110" class="small" fill="#596575" text-anchor="start">根据 Figure 1、§3 与公式绘制</text>
<text x="24" y="148" class="small" fill="#596575" text-anchor="start">下面 A/B 数值仅用于解释公式</text>
<path d="M24 158H576" stroke="#d7dee7" stroke-width="2"/>
<rect x="24" y="181" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="220" class="label" fill="#365f85" text-anchor="start">固定条件</text>
<text x="43" y="264" class="main" fill="#20252d" text-anchor="start">四套 harness 的执行记录被冻结。</text>
<text x="43" y="303" class="main" fill="#20252d" text-anchor="start">同样的模型、任务与训练步数，</text>
<text x="43" y="342" class="main" fill="#20252d" text-anchor="start">只改变测试分数的比较范围。</text>
<path d="M300 398v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="434" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="473" class="label" fill="#365f85" text-anchor="start">Within：同题、同接口内比较</text>
<text x="43" y="517" class="main" fill="#20252d" text-anchor="start">A 接口四次都成功：均值=1。</text>
<text x="43" y="556" class="main" fill="#20252d" text-anchor="start">B 接口四次都失败：均值=0。</text>
<text x="43" y="595" class="main" fill="#20252d" text-anchor="start">两组分子都是0，相对分都是0。</text>
<path d="M300 651v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="687" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="726" class="label" fill="#365f85" text-anchor="start">Cross：同题的接口混在一起</text>
<text x="43" y="770" class="main" fill="#20252d" text-anchor="start">八次的均值=0.5、标准差=0.5。</text>
<text x="43" y="809" class="main" fill="#20252d" text-anchor="start">成功相对分约+1，失败约−1。</text>
<text x="43" y="848" class="main" fill="#20252d" text-anchor="start">差异可能来自接口，不只来自模型。</text>
<text x="24" y="939" class="small" fill="#596575" text-anchor="start">真实实验有四套接口；两接口例子</text>
<text x="24" y="977" class="small" fill="#596575" text-anchor="start">只说明组均值怎样改变更新方向。</text></svg>
