    <rect x="350" width="326" height="66" fill="#eef4fb"/><text x="368" y="27" class="s">三种训练 seed 合并 · avg@4</text><text x="368" y="52" class="n" fill="#285d9b">+0.16 [−0.41,+0.72]</text>
