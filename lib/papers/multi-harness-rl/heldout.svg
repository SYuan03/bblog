    <g class="lab"><text x="0" y="42">Base</text><text x="0" y="92">SFT</text><text x="0" y="142">Within</text><text x="0" y="192">Cross</text><text x="0" y="242">Coverage-matched</text><text x="0" y="292">Residualized</text></g>
    <g stroke="#285d9b" stroke-width="4" fill="#285d9b"><circle cx="497" cy="36" r="8"/><circle cx="474" cy="86" r="8"/><circle cx="512" cy="136" r="8"/><circle cx="748" cy="186" r="8"/><circle cx="638" cy="236" r="8"/><circle cx="733" cy="286" r="8"/></g>
    <g class="n"><text x="514" y="43">4.07</text><text x="491" y="93">4.01</text><text x="529" y="143">4.11</text><text x="765" y="193" fill="#285d9b">4.73</text><text x="655" y="243">4.44</text><text x="750" y="293">4.69</text></g>
    <path d="M590 320H1042" stroke="#ad5735" stroke-width="8"/><path d="M590 307V333M1042 307V333" stroke="#ad5735" stroke-width="3"/><text x="816" y="300" class="s" text-anchor="middle" fill="#ad5735">80% 检出概率的最小效应：1.19 pp</text>
