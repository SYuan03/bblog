<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Held-out weak-ReAct results</title>
  <desc id="desc">Six recipes cluster between 4.01 and 4.73 percent at avg@4, below the 1.19 percentage point minimum detectable difference. Cross minus Within shrinks to 0.25 points at avg@8.</desc>
  <rect width="1200" height="650" fill="#fff"/>
  <style>.h{font:700 29px Arial,"PingFang SC",sans-serif;fill:#20252b}.lab{font:17px Arial,"PingFang SC",sans-serif;fill:#3e4652}.n{font:700 19px ui-monospace,monospace;fill:#20252b}.s{font:15px Arial,"PingFang SC",sans-serif;fill:#596775}</style>
  <text x="54" y="58" class="h">未见 weak-ReAct：六种模型的 avg@4 只有 4.01%–4.73%</text>
  <text x="54" y="90" class="s">v2 Figure 3a / Tables 5–7 · 绝对均值用共同有分的 499 题；配对比较的题目集合可不同</text>
  <g transform="translate(68 135)">
