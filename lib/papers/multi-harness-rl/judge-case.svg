<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">SWE-bench Verified case astropy__astropy-12907</title>
  <desc id="desc">The agent receives a nested CompoundModel bug report and repository checkout. The hidden grader applies the candidate patch and checks two fail-to-pass tests and thirteen pass-to-pass tests.</desc>
  <rect width="1200" height="690" fill="#fbfaf7"/>
  <style>.h{font:700 28px Georgia,serif;fill:#20252b}.t{font:700 20px Arial,sans-serif;fill:#20252b}.s{font:16px Arial,sans-serif;fill:#66717b}.m{font:700 14px ui-monospace,monospace;fill:#285d9b}.box{fill:#fff;stroke:#cbd1d7;stroke-width:2}.vis{fill:#eef4fb;stroke:#285d9b}.hid{fill:#fff4ed;stroke:#ad5735}.ok{fill:#edf7f2;stroke:#2b7562}.arr{stroke:#285d9b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <text x="52" y="56" class="h">Real case: astropy__astropy-12907</text>
  <text x="52" y="88" class="s">SWE-bench Verified dataset · base commit d16bfe05… · difficulty field from the official record</text>
  <g transform="translate(52 128)">
    <rect class="vis" width="280" height="184"/><text x="22" y="34" class="m">VISIBLE TO THE AGENT</text><text x="22" y="72" class="t">Issue + repository</text><text x="22" y="106" class="s">Nested CompoundModel makes</text><text x="22" y="131" class="s">separability_matrix mark two</text><text x="22" y="156" class="s">independent Linear1D models</text><text x="22" y="181" class="s">as coupled.</text>
    <path class="arr" d="M280 92H350"/>
    <rect class="box" x="365" width="280" height="184"/><text x="387" y="34" class="m">AGENT + HARNESS</text><text x="387" y="72" class="t">Inspect, edit, test</text><text x="387" y="106" class="s">Aider / OpenHands /</text><text x="387" y="131" class="s">Qwen Code / SWE-agent</text><text x="387" y="156" class="s">expose different prompts, tools</text><text x="387" y="181" class="s">and control flow.</text>
    <path class="arr" d="M645 92H715"/>
    <rect class="hid" x="730" width="365" height="184"/><text x="752" y="34" class="m" style="fill:#ad5735">SEALED ORACLE</text><text x="752" y="72" class="t">Hidden test patch</text><text x="752" y="108" class="s">FAIL_TO_PASS: 2 parameterized</text><text x="752" y="133" class="s">nested-model cases.</text><text x="752" y="160" class="s">PASS_TO_PASS: 13 existing tests</text><text x="752" y="185" class="s">guard against regressions.</text>
  </g>
  <g transform="translate(52 365)">
    <rect class="box" width="320" height="190"/><text x="22" y="36" class="m">EVALUATION</text><text x="22" y="75" class="t">Apply candidate patch</text><text x="22" y="111" class="s">Run repository-specific command;</text><text x="22" y="137" class="s">parse the log into per-test states.</text><text x="22" y="166" class="s">Infra failure stays outside the score.</text>
    <path class="arr" d="M320 95H390"/>
    <rect class="ok" x="405" width="315" height="190"/><text x="427" y="36" class="m" style="fill:#2b7562">RESOLVED = 1</text><text x="427" y="77" class="t">All required tests pass</text><text x="427" y="113" class="s">2 / 2 FAIL_TO_PASS</text><text x="427" y="139" class="s">13 / 13 PASS_TO_PASS</text><text x="427" y="166" class="s">Patch applied and log parsed.</text>
    <path class="arr" d="M720 95H790"/>
    <rect class="hid" x="805" width="290" height="190"/><text x="827" y="36" class="m" style="fill:#ad5735">RESOLVED = 0</text><text x="827" y="77" class="t">Any required test fails</text><text x="827" y="113" class="s">A fix that passes one new case</text><text x="827" y="139" class="s">but couples another nested form</text><text x="827" y="166" class="s">still receives episode reward 0.</text>
  </g>
  <text x="52" y="620" class="s">The paper does not release per-harness trajectories for this instance; the case and checks come from the official SWE-bench Verified record.</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#285d9b"/></marker></defs>
</svg>
