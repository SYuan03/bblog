<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Harness identity and action composition diagnostics</title>
  <desc id="desc">Cross and residualized advantages reveal harness identity, while action distributions vary much more across harnesses than between SFT and Cross within a harness.</desc>
  <rect width="1200" height="680" fill="#fff"/>
  <style>.h{font:700 28px Arial,"PingFang SC",sans-serif;fill:#20252b}.lab{font:17px Arial,"PingFang SC",sans-serif;fill:#3e4652}.n{font:700 18px ui-monospace,monospace;fill:#20252b}.s{font:15px Arial,"PingFang SC",sans-serif;fill:#596775}</style>
  <text x="54" y="58" class="h">相对分可透露接口信息；动作频率也对接口敏感</text>
  <g transform="translate(54 112)">
    <text class="n" fill="#285d9b">A · 只输入 advantage，猜来源接口</text><text x="0" y="28" class="s">按任务五折验证；减去本方案标签打乱后的基准准确率，单位 pp。这不是模型成绩。</text>
    <g transform="translate(0 65)">
      <text y="29" class="lab">Within</text><rect x="215" y="10" width="4" height="25" fill="#aeb8c2"/><text x="230" y="29" class="n">+0.02</text>
      <text y="91" class="lab">Coverage-matched</text><rect x="215" y="72" width="117" height="25" fill="#8fb5da"/><text x="343" y="91" class="n">+1.17</text>
      <text y="153" class="lab">Cross</text><rect x="215" y="134" width="448" height="25" fill="#285d9b"/><text x="674" y="153" class="n" fill="#285d9b">+4.48</text>
      <text y="215" class="lab">Residualized</text><rect x="215" y="196" width="454" height="25" fill="#ad5735"/><text x="680" y="215" class="n" fill="#ad5735">+4.54</text>
    </g>
  </g>
  <path d="M54 425H1146" stroke="#cbd1d7" stroke-width="2"/>
  <g transform="translate(54 458)">
    <text class="n" fill="#285d9b">B · JSD：两组动作频率分布的差异，0 表示相同</text><text x="0" y="32" class="s">只比较 SFT 与 Cross，未比较 Within 与 Cross；频率不评价单步动作质量。</text>
    <rect x="0" y="62" width="505" height="98" fill="#fff4ed" stroke="#ad5735"/><text x="24" y="96" class="lab">同一模型，换不同接口</text><text x="24" y="140" class="n" fill="#ad5735">0.174–0.350 bit</text>
    <rect x="545" y="62" width="505" height="98" fill="#eef4fb" stroke="#285d9b"/><text x="569" y="96" class="lab">同一接口，比较 SFT 与 Cross</text><text x="569" y="140" class="n" fill="#285d9b">0.0003–0.0029 bit</text>
    <text x="0" y="193" class="s">v2 Figures 3b–4 / Tables 9–10。按最高优先级标记：编辑后测试只记编辑；不能据此说没有测试。</text>
  </g>
</svg>
