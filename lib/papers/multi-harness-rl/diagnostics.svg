<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Harness identity and action composition diagnostics</title>
  <desc id="desc">Cross and residualized advantages reveal harness identity, while action distributions vary much more across harnesses than between SFT and Cross within a harness.</desc>
  <rect width="1200" height="680" fill="#fbfaf7"/>
  <style>.h{font:700 28px Georgia,serif;fill:#20252b}.lab{font:17px Arial,sans-serif;fill:#3e4652}.n{font:700 18px ui-monospace,monospace;fill:#20252b}.s{font:15px Arial,sans-serif;fill:#66717b}</style>
  <text x="54" y="58" class="h">The credit signal carries the harness; the policy behavior still follows the interface</text>
  <g transform="translate(54 112)">
    <text class="n" fill="#285d9b">A · Harness identity recoverable from advantage</text><text x="0" y="28" class="s">OOF classifier accuracy above shuffled-label null · 95% task-bootstrap CI</text>
    <g transform="translate(0 65)">
      <text y="29" class="lab">Within</text><rect x="215" y="10" width="4" height="25" fill="#aeb8c2"/><text x="230" y="29" class="n">+0.02</text>
      <text y="91" class="lab">Coverage-matched</text><rect x="215" y="72" width="117" height="25" fill="#8fb5da"/><text x="343" y="91" class="n">+1.17</text>
      <text y="153" class="lab">Cross</text><rect x="215" y="134" width="448" height="25" fill="#285d9b"/><text x="674" y="153" class="n" fill="#285d9b">+4.48</text>
      <text y="215" class="lab">Residualized</text><rect x="215" y="196" width="454" height="25" fill="#ad5735"/><text x="680" y="215" class="n" fill="#ad5735">+4.54</text>
    </g>
  </g>
  <path d="M54 425H1146" stroke="#cbd1d7" stroke-width="2"/>
  <g transform="translate(54 470)">
    <text class="n" fill="#285d9b">B · Jensen-Shannon divergence of action distributions</text><text x="0" y="32" class="s">Same checkpoint, different harness vs. same harness, SFT→Cross</text>
    <rect x="0" y="70" width="505" height="104" fill="#fff4ed" stroke="#ad5735"/><text x="24" y="105" class="lab">Move the same checkpoint between harnesses</text><text x="24" y="151" class="n" fill="#ad5735">0.174–0.350 bit</text>
    <rect x="545" y="70" width="505" height="104" fill="#eef4fb" stroke="#285d9b"/><text x="569" y="105" class="lab">Swap SFT for Cross inside one harness</text><text x="569" y="151" class="n" fill="#285d9b">0.0003–0.0029 bit</text>
    <text x="0" y="214" class="s">The smallest cross-harness change is at least 59× the largest within-harness checkpoint change.</text>
  </g>
</svg>
