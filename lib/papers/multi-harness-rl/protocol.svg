<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Controlled multi-harness experiment</title>
  <desc id="desc">SWE-Gym tasks are collected through four harnesses, frozen, grouped by Within or Cross, then evaluated by a sealed oracle on source and held-out harnesses.</desc>
  <rect width="1200" height="660" fill="#fff"/>
  <style>.t{font:700 24px Arial,"PingFang SC",sans-serif;fill:#20252b}.s{font:17px Arial,"PingFang SC",sans-serif;fill:#596775}.m{font:700 15px Arial,"PingFang SC",sans-serif;fill:#285d9b}.box{fill:#fff;stroke:#cbd1d7;stroke-width:2}.blue{fill:#eef4fb;stroke:#285d9b}.orange{fill:#fff4ed;stroke:#ad5735}.green{fill:#edf7f2;stroke:#2b7562}.arr{stroke:#285d9b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <text x="52" y="52" class="m">根据 v2 Figure 1 重绘：固定数据与模型起点，只改变分数的分组边界</text>
  <g transform="translate(52 92)">
    <rect class="box" width="190" height="110"/><text x="95" y="43" text-anchor="middle" class="t">SWE-Gym</text><text x="95" y="75" text-anchor="middle" class="s">训练任务</text>
    <path class="arr" d="M190 55H260"/>
    <rect class="box" x="275" y="0" width="200" height="110"/><text x="375" y="34" text-anchor="middle" class="t">四套执行程序</text><text x="375" y="64" text-anchor="middle" class="s">Aider · OpenHands</text><text x="375" y="88" text-anchor="middle" class="s">Qwen Code · SWE-agent</text>
    <path class="arr" d="M475 55H545"/>
    <rect class="blue" x="560" y="0" width="240" height="110"/><text x="680" y="35" text-anchor="middle" class="t">固定 RL 数据</text><text x="680" y="65" text-anchor="middle" class="s">5,543 次完整执行</text><text x="680" y="89" text-anchor="middle" class="s">81,216 条记录 · 183 题</text>
    <rect class="green" x="885" y="0" width="210" height="110"/><text x="990" y="43" text-anchor="middle" class="t">共同 SFT 起点</text><text x="990" y="75" text-anchor="middle" class="s">成功执行训练的 Qwen3-8B</text>
  </g>
  <path class="arr" d="M732 202V245H375V300"/><path class="arr" d="M732 202V245H825V300"/>
  <path class="arr" d="M1042 202V274H925V300"/><path class="arr" d="M1042 274H475V300"/>
  <g transform="translate(170 300)">
    <rect class="blue" width="410" height="145"/><text x="205" y="40" text-anchor="middle" class="m">Within</text><text x="205" y="80" text-anchor="middle" class="t">每个任务 × 接口单独成组</text><text x="205" y="112" text-anchor="middle" class="s">每组分别减均值、除以标准差</text>
  </g>
  <g transform="translate(620 300)">
    <rect class="orange" width="410" height="145"/><text x="205" y="40" text-anchor="middle" class="m" style="fill:#ad5735">Cross</text><text x="205" y="80" text-anchor="middle" class="t">每题合并所有接口的执行</text><text x="205" y="112" text-anchor="middle" class="s">整题共用一个均值与标准差</text>
  </g>
  <path class="arr" d="M375 445V500H530"/><path class="arr" d="M825 445V500H670"/>
  <g transform="translate(390 500)">
    <rect class="box" width="420" height="112"/><text x="210" y="34" text-anchor="middle" class="t">Verified 独立隐藏测试判定</text><text x="210" y="65" text-anchor="middle" class="s">四个原接口 · 每题两次取平均</text><text x="210" y="90" text-anchor="middle" class="s">未见 weak-ReAct · 每题四次 / 八次</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#285d9b"/></marker></defs>
</svg>
