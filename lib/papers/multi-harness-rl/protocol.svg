<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Controlled multi-harness experiment</title>
  <desc id="desc">SWE-Gym tasks are collected through four harnesses, frozen, grouped by Within or Cross, then evaluated by a sealed oracle on source and held-out harnesses.</desc>
  <rect width="1200" height="660" fill="#fbfaf7"/>
  <style>.t{font:700 24px Arial,sans-serif;fill:#20252b}.s{font:17px Arial,sans-serif;fill:#66717b}.m{font:700 15px ui-monospace,monospace;fill:#285d9b}.box{fill:#fff;stroke:#cbd1d7;stroke-width:2}.blue{fill:#eef4fb;stroke:#285d9b}.orange{fill:#fff4ed;stroke:#ad5735}.green{fill:#edf7f2;stroke:#2b7562}.arr{stroke:#285d9b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <text x="52" y="52" class="m">CONTROLLED DESIGN · ONLY THE GROUPING BOUNDARY MOVES</text>
  <g transform="translate(52 92)">
    <rect class="box" width="190" height="110"/><text x="95" y="43" text-anchor="middle" class="t">SWE-Gym</text><text x="95" y="75" text-anchor="middle" class="s">training tasks</text>
    <path class="arr" d="M190 55H260"/>
    <rect class="box" x="275" y="0" width="200" height="110"/><text x="375" y="34" text-anchor="middle" class="t">4 harnesses</text><text x="375" y="64" text-anchor="middle" class="s">Aider · OpenHands</text><text x="375" y="88" text-anchor="middle" class="s">Qwen Code · SWE-agent</text>
    <path class="arr" d="M475 55H545"/>
    <rect class="blue" x="560" y="0" width="240" height="110"/><text x="680" y="35" text-anchor="middle" class="t">Frozen manifest</text><text x="680" y="65" text-anchor="middle" class="s">5,543 episodes</text><text x="680" y="89" text-anchor="middle" class="s">81,216 records · 183 tasks</text>
    <path class="arr" d="M800 55H870"/>
    <rect class="green" x="885" y="0" width="210" height="110"/><text x="990" y="43" text-anchor="middle" class="t">Same SFT</text><text x="990" y="75" text-anchor="middle" class="s">Qwen3-8B warm start</text>
  </g>
  <path class="arr" d="M1042 202V260H375V300"/><path class="arr" d="M1042 202V260H825V300"/>
  <g transform="translate(170 300)">
    <rect class="blue" width="410" height="145"/><text x="205" y="40" text-anchor="middle" class="m">WITHIN</text><text x="205" y="80" text-anchor="middle" class="t">one group per task × harness</text><text x="205" y="112" text-anchor="middle" class="s">harness-level reward offset cancels</text>
  </g>
  <g transform="translate(620 300)">
    <rect class="orange" width="410" height="145"/><text x="205" y="40" text-anchor="middle" class="m" style="fill:#ad5735">CROSS</text><text x="205" y="80" text-anchor="middle" class="t">one group per task</text><text x="205" y="112" text-anchor="middle" class="s">all four harnesses compete for credit</text>
  </g>
  <path class="arr" d="M375 445V500H530"/><path class="arr" d="M825 445V500H670"/>
  <g transform="translate(390 500)">
    <rect class="box" width="420" height="112"/><text x="210" y="34" text-anchor="middle" class="t">Sealed SWE-bench Verified oracle</text><text x="210" y="65" text-anchor="middle" class="s">4 source harnesses · avg@2</text><text x="210" y="90" text-anchor="middle" class="s">held-out weak-ReAct · avg@4 / avg@8</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#285d9b"/></marker></defs>
</svg>
