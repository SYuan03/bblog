<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1139" viewBox="0 0 600 1139" role="img" aria-labelledby="title desc"><title id="title">未见接口的额外收益没有被稳定检测到</title><desc id="desc">根据 v2 Figure 2、Tables 4–7 重绘 差值单位：百分点（pp）</desc><rect width="600" height="1139" fill="#fff"/><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:32px;font-weight:750}.label{font-size:28px;font-weight:750}.main{font-size:28px}.small{font-size:24px}.value{font-size:32px;font-weight:750}</style><text x="24" y="66" class="title" fill="#20252d" text-anchor="start">未见接口的额外收益</text>
<text x="24" y="108" class="title" fill="#20252d" text-anchor="start">没有被稳定检测到</text>
<text x="24" y="152" class="small" fill="#596575" text-anchor="start">根据 v2 Figure 2、Tables 4–7 重绘</text>
<text x="24" y="190" class="small" fill="#596575" text-anchor="start">差值单位：百分点（pp）</text>
<path d="M24 200H576" stroke="#d7dee7" stroke-width="2"/>
<rect x="24" y="223" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="262" class="label" fill="#365f85" text-anchor="start">原接口的 Cross − SFT</text>
<text x="43" y="306" class="main" fill="#20252d" text-anchor="start">四个接口平均：+0.77 pp。</text>
<text x="43" y="345" class="main" fill="#20252d" text-anchor="start">95% CI：+0.03 到 +1.52。</text>
<text x="43" y="384" class="main" fill="#20252d" text-anchor="start">五次比较修正后99% CI含0。</text>
<path d="M300 440v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="476" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="515" class="label" fill="#365f85" text-anchor="start">未见 weak-ReAct · avg@8</text>
<text x="43" y="559" class="main" fill="#20252d" text-anchor="start">Cross − Within：+0.25 pp。</text>
<text x="43" y="598" class="main" fill="#20252d" text-anchor="start">95% CI：−0.48 到 +1.02。</text>
<text x="43" y="637" class="main" fill="#20252d" text-anchor="start">Cross − SFT：+0.13 pp。</text>
<path d="M300 693v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="729" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="768" class="label" fill="#365f85" text-anchor="start">三个 seed 合并</text>
<text x="43" y="812" class="main" fill="#20252d" text-anchor="start">Cross − Within：+0.16 pp。</text>
<text x="43" y="851" class="main" fill="#20252d" text-anchor="start">95% CI：−0.41 到 +0.72。</text>
<text x="43" y="890" class="main" fill="#20252d" text-anchor="start">各seed单点差值有正也有负。</text>
<text x="24" y="981" class="main" fill="#20252d" text-anchor="start">评测接口列均值最大差7.13pp；</text>
<text x="24" y="1019" class="main" fill="#20252d" text-anchor="start">模型行均值最大差0.91pp。</text>
<text x="24" y="1067" class="small" fill="#596575" text-anchor="start">没有检出 ≠ 证明完全相等。</text>
<text x="24" y="1105" class="small" fill="#596575" text-anchor="start">avg@8 的最小可检出差异仍约1pp。</text></svg>
