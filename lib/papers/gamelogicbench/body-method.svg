<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-label="GameLogicBench 的单次提交如何变成逐帧判定与严格任务分数">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#456c93"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#263445}.title{font-size:36px;font-weight:700}.head{font-size:29px;font-weight:700}.body{font-size:27px}.small{font-size:23px;fill:#526276}.mono{font-family:Menlo,Consolas,monospace;font-size:24px}.blue{fill:#365f85}.red{fill:#9a4b46}.rule{stroke:#ccd5df;stroke-width:2}.flow{stroke:#456c93;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="1200" height="790" fill="#fff"/>
<text x="44" y="58" class="title">GameLogicBench：从一份脚本提交到一道题的分数</text>
<text x="44" y="104" class="small">任务构建已经完成；这里单独展示提交后的评测，不混入标注流程。</text>
<rect x="44" y="140" width="342" height="300" rx="5" fill="#f5f7fa" stroke="#ccd5df" stroke-width="2"/><text x="64" y="184" class="head">1  SOLVE：模型写脚本</text>
<text x="64" y="233" class="body">收到 brief 与 Godot 项目</text>
<text x="64" y="275" class="body">能运行一个公开 preview</text>
<text x="64" y="317" class="body">可在 preview 中换 seed</text>
<text x="64" y="359" class="body">只提交允许修改的文件</text>
<rect x="429" y="140" width="342" height="300" rx="5" fill="#f5f7fa" stroke="#ccd5df" stroke-width="2"/><text x="449" y="184" class="head">2  HARNESS：隔离组装</text>
<text x="449" y="233" class="body">复制求解工作区</text>
<text x="449" y="275" class="body">另开断网 judge 容器</text>
<text x="449" y="317" class="body">按 game → solution</text>
<text x="449" y="359" class="body">→ frozen judge 组装</text>
<rect x="814" y="140" width="342" height="300" rx="5" fill="#f5f7fa" stroke="#ccd5df" stroke-width="2"/><text x="834" y="184" class="head">3  JUDGE：引擎判行为</text>
<text x="834" y="233" class="body">选择隐藏 scenario × seed</text>
<text x="834" y="275" class="body">按固定 timestep 运行</text>
<text x="834" y="317" class="body">逐 tick 读取状态和事件</text>
<text x="834" y="359" class="body">检查全过程与终局规则</text>
<path d="M386 290H426" class="flow"/><path d="M771 290H811" class="flow"/>
<rect x="44" y="486" width="1112" height="188" rx="5" fill="#eef4f9" stroke="#ccd5df" stroke-width="2"/>
<text x="64" y="530" class="head">一道题 solved 需要全部计分测试通过</text>
<text x="64" y="579" class="body">所有 tick 与终局断言 → test case PASS</text>
<text x="64" y="616" class="body">所有 seed → scenario strict PASS → 所有 case → task solved</text>
<text x="64" y="653" class="body">最终 solve rate = solved tasks / 72</text>
<text x="44" y="726" class="small">403 个手工场景用 seed 取值得到 1,451 个测试用例；不将它们平均后替代题级分数。</text>
<text x="44" y="761" class="small">统一协议：论文 §2–3、README。各题完整隐藏 checker 未取得；图由本文整理。</text>
</svg>
