<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-label="Platform Guard 案例：完整坐标名单与可见目标是不同信息">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#456c93"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#263445}.title{font-size:36px;font-weight:700}.head{font-size:29px;font-weight:700}.body{font-size:27px}.small{font-size:23px;fill:#526276}.mono{font-family:Menlo,Consolas,monospace;font-size:24px}.blue{fill:#365f85}.red{fill:#9a4b46}.rule{stroke:#ccd5df;stroke-width:2}.flow{stroke:#456c93;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
<rect width="1200" height="840" fill="#fff"/>
<text x="44" y="58" class="title">Platform Guard：有目标坐标，不代表能追它</text>
<text x="44" y="104" class="small">公开 brief 的规则与接口；几何仅为本文示意，不是隐藏关卡或模型实测轨迹。</text>
<rect x="44" y="140" width="552" height="338" rx="5" fill="#f5f7fa" stroke="#ccd5df" stroke-width="2"/><rect x="626" y="140" width="530" height="338" rx="5" fill="#f5f7fa" stroke="#ccd5df" stroke-width="2"/>
<text x="64" y="185" class="head">state 给出所有访客的真实位置</text>
<rect x="77" y="368" width="486" height="35" fill="#e2e8ef"/>
<rect x="296" y="229" width="69" height="139" fill="#8b9caf"/>
<circle cx="151" cy="342" r="25" fill="#456c93"/><circle cx="488" cy="342" r="25" fill="#bd9b76"/>
<path d="M177 342H461" stroke="#9a4b46" stroke-width="4" stroke-dasharray="9 7"/>
<path d="M311 320L350 360M350 320L311 360" stroke="#9a4b46" stroke-width="5"/>
<text x="115" y="438" class="small">守卫</text><text x="300" y="215" class="small">tower</text><text x="454" y="438" class="small">访客</text>
<text x="647" y="185" class="head">controller 必须自己算可见性</text>
<text x="647" y="232" class="body">距离 ≤ vision_range</text>
<text x="647" y="277" class="body">并且视线未被平台或塔挡住</text>
<text x="647" y="322" class="body">才能返回 chasing = 目标 id</text>
<text x="647" y="367" class="body">否则不能声称正在追逐</text>
<rect x="44" y="520" width="1112" height="124" rx="5" fill="#fbf3f1" stroke="#ccd5df" stroke-width="2"/>
<text x="64" y="565" class="head">按规则展开的 FAIL：只读名单，直接追塔后访客</text>
<text x="64" y="609" class="body">输入含 id / pos → 返回 chasing=id → 目标不可见 → ghost chase</text>
<rect x="44" y="680" width="1112" height="90" rx="5" fill="#eef4f9" stroke="#ccd5df" stroke-width="2"/>
<text x="64" y="716" class="body">其他并行要求：巡逻覆盖 ≥34%；地面接近至 130 世界单位；</text>
<text x="64" y="752" class="body">安静后离家 ≤6 秒；一次 watch 为 1,800 帧（30 秒，60 Hz）。</text>
<text x="44" y="808" class="small">来源：Appendix F.3；完整隐藏断言、布局与容差未公开。</text>
</svg>
