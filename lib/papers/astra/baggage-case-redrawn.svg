<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
  <title id="title">Public ASTRA-RL baggage example and verification boundary</title>
  <desc id="desc">The user sees tool schemas and a baggage request. Hidden Python mock tools and sub question answers define the environment. The released row contains a duplicate payment tool schema and a payment implementation that does not reproduce the expected transaction string.</desc>
  <rect width="1500" height="860" fill="#fff"/>
  <text x="52" y="62" font-family="Arial, PingFang SC, sans-serif" font-size="36" font-weight="700" fill="#182027">公开行李样本：可见输入、隐藏目标与支付返回值的冲突</text>
  <g font-family="Arial, PingFang SC, sans-serif">
    <g transform="translate(52 104)">
      <rect width="410" height="650" fill="#eef4f8" stroke="#39779f" stroke-width="2"/>
      <text x="25" y="42" font-size="20" font-weight="700" fill="#39779f">调用工具的模型可见</text>
      <text x="25" y="82" font-size="18" fill="#202a31">Amit Kumar 的目标</text>
      <text x="25" y="112" font-size="16" fill="#4d5961">Bengaluru City ↔ Chennai Central</text>
      <text x="25" y="140" font-size="16" fill="#4d5961">9 月 20 / 23 日 · 1 件 → 3 件行李</text>
      <text x="25" y="168" font-size="16" fill="#4d5961">先报告额外费用，再用钱包支付</text>
      <line x1="25" y1="196" x2="385" y2="196" stroke="#b8cbd7"/>
      <text x="25" y="233" font-size="18" font-weight="700" fill="#202a31">9 项工具说明（8 个不同名称）</text>
      <text x="25" y="267" font-size="16" fill="#4d5961">完成请求需要这 4 个工具</text>
      <text x="43" y="300" font-size="16" fill="#4d5961">reservation_finder</text>
      <text x="43" y="330" font-size="16" fill="#4d5961">baggage_allowance_retriever</text>
      <text x="43" y="360" font-size="16" fill="#4d5961">baggage_fee_calculator</text>
      <text x="43" y="390" font-size="16" fill="#4d5961">payment_processor</text>
      <text x="25" y="438" font-size="16" fill="#4d5961">另有 4 个明显无关的工具，</text>
      <text x="25" y="466" font-size="16" fill="#4d5961">以及第二个同名 payment_processor。</text>
      <rect x="25" y="514" width="360" height="94" fill="#dfeaf1"/>
      <text x="43" y="548" font-size="16" font-weight="700" fill="#275f82">模型看不到</text>
      <text x="43" y="578" font-size="15" fill="#4d5961">Python 模拟实现与目标答案字典</text>
    </g>

    <g transform="translate(510 104)">
      <rect width="938" height="650" fill="#fff" stroke="#cbd2d6" stroke-width="2"/>
      <text x="26" y="42" font-size="20" font-weight="700" fill="#2f6f58">隐藏环境声明的执行目标</text>
      <g transform="translate(26 82)">
        <rect width="195" height="91" fill="#edf5f1" stroke="#9dbdae"/><text x="97" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#25332d">1 · 找预订</text><text x="97" y="62" text-anchor="middle" font-size="15" fill="#4d5b54">RES987654</text>
        <path d="M207 45h35" stroke="#397a63" stroke-width="3"/><path d="m242 45-10-7v14z" fill="#397a63"/>
        <rect x="254" width="195" height="91" fill="#edf5f1" stroke="#9dbdae"/><text x="351" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#25332d">2 · 查行李额度</text><text x="351" y="62" text-anchor="middle" font-size="15" fill="#4d5b54">1 件行李</text>
        <path d="M461 45h35" stroke="#397a63" stroke-width="3"/><path d="m496 45-10-7v14z" fill="#397a63"/>
        <rect x="508" width="195" height="91" fill="#edf5f1" stroke="#9dbdae"/><text x="605" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#25332d">3 · 算费用</text><text x="605" y="62" text-anchor="middle" font-size="15" fill="#4d5b54">₹600</text>
        <path d="M715 45h35" stroke="#b24743" stroke-width="3"/><path d="m750 45-10-7v14z" fill="#b24743"/>
        <rect x="762" width="124" height="91" fill="#faeeee" stroke="#b24743"/><text x="824" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#7e3431">4 · 支付</text><text x="824" y="62" text-anchor="middle" font-size="15" fill="#7e3431">对不上</text>
      </g>
      <text x="26" y="224" font-size="18" font-weight="700" fill="#202a31">目标答案字典 sub_qa_dict 期待的四个字符串</text>
      <rect x="26" y="246" width="886" height="154" fill="#f3f4f2"/>
      <text x="44" y="278" font-family="Menlo, Consolas, monospace" font-size="15" fill="#34414a">Reservation ID: RES987654</text>
      <text x="44" y="309" font-family="Menlo, Consolas, monospace" font-size="15" fill="#34414a">Current baggage allowance: 1 bag</text>
      <text x="44" y="340" font-family="Menlo, Consolas, monospace" font-size="15" fill="#34414a">Extra charge: ₹600</text>
      <text x="44" y="371" font-family="Menlo, Consolas, monospace" font-size="15" fill="#34414a">Payment successful. Transaction ID: TXN123456789</text>

      <text x="26" y="449" font-size="18" font-weight="700" fill="#202a31">公开 1k 子集 · 第 0 行字段与代码审计</text>
      <rect x="26" y="474" width="886" height="128" fill="#faeeee" stroke="#d8aaa8"/>
      <text x="44" y="508" font-size="16" fill="#5b3533">工具说明中 payment_processor 重名；按名称索引的 tool_dict 只保留一个。</text>
      <text x="44" y="541" font-size="16" fill="#5b3533">公开实现返回 “Charge processed successfully ...”，且通常随机生成交易编号。</text>
      <text x="44" y="574" font-size="16" font-weight="700" fill="#8a3734">前三个目标可由工具返回；支付目标字符串无法由公开实现稳定复现。</text>
    </g>

    <rect x="52" y="786" width="1396" height="42" fill="#f2f5f7"/>
    <text x="750" y="813" text-anchor="middle" font-size="16" fill="#5c5b56">来源：ASTRA-RL-1k 第 0 行，revision dbc70e26；核查公开字段与实现，不代表内部 6,596 个环境全部如此。</text>
  </g>
</svg>
