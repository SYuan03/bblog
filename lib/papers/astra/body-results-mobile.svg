<svg xmlns="http://www.w3.org/2000/svg" width="360" height="540" viewBox="0 0 360 540" role="img" aria-labelledby="title desc">
<title id="title">ASTRA 阶段结果（手机排版）</title>
<desc id="desc">两个模型在三项评测的基座、SFT、RL 分数，突出 ACEBench 的 SFT 增量。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Noto Sans CJK SC,sans-serif">
<rect width="360" height="540" fill="#fff"/>
<text x="14" y="27" font-size="17" font-weight="700" fill="#24313a">三榜提高，阶段贡献不同</text>
<text x="14" y="47" font-size="12.8" font-weight="400" fill="#52636d">基座 → SFT → RL；同一 Table 2 内比较</text>
<rect x="14" y="64" width="332" height="205" rx="6" fill="#f8fafb" stroke="#cdd8de"/>
<text x="26" y="89" font-size="15.5" font-weight="700" fill="#315f82">Qwen3-14B</text>
<text x="26" y="113" font-size="13.5" font-weight="650" fill="#24313a">BFCL-MT</text>
<text x="26" y="131" font-size="13.4" font-weight="400" fill="#24313a">44.50 → 48.50 → 58.13</text>
<text x="26" y="149" font-size="12.4" font-weight="600" fill="#276b58">SFT / RL 增量：+4.00 / +9.63</text>
<text x="26" y="164" font-size="13.5" font-weight="650" fill="#24313a">τ²-Bench</text>
<text x="26" y="182" font-size="13.4" font-weight="400" fill="#24313a">44.55 → 50.45 → 57.70</text>
<text x="26" y="200" font-size="12.4" font-weight="600" fill="#276b58">SFT / RL 增量：+5.90 / +7.25</text>
<text x="26" y="215" font-size="13.5" font-weight="650" fill="#24313a">ACEBench</text>
<text x="26" y="233" font-size="13.4" font-weight="400" fill="#24313a">51.67 → 67.71 → 68.96</text>
<text x="26" y="251" font-size="12.4" font-weight="600" fill="#9b403b">SFT / RL 增量：+16.04 / +1.25</text>
<rect x="14" y="281" width="332" height="205" rx="6" fill="#f8fafb" stroke="#cdd8de"/>
<text x="26" y="306" font-size="15.5" font-weight="700" fill="#315f82">Qwen3-32B</text>
<text x="26" y="330" font-size="13.5" font-weight="650" fill="#24313a">BFCL-MT</text>
<text x="26" y="348" font-size="13.4" font-weight="400" fill="#24313a">47.88 → 52.13 → 64.25</text>
<text x="26" y="366" font-size="12.4" font-weight="600" fill="#276b58">SFT / RL 增量：+4.25 / +12.12</text>
<text x="26" y="381" font-size="13.5" font-weight="650" fill="#24313a">τ²-Bench</text>
<text x="26" y="399" font-size="13.4" font-weight="400" fill="#24313a">49.70 → 52.30 → 63.70</text>
<text x="26" y="417" font-size="12.4" font-weight="600" fill="#276b58">SFT / RL 增量：+2.60 / +11.40</text>
<text x="26" y="432" font-size="13.5" font-weight="650" fill="#24313a">ACEBench</text>
<text x="26" y="450" font-size="13.4" font-weight="400" fill="#24313a">59.79 → 67.71 → 71.88</text>
<text x="26" y="468" font-size="12.4" font-weight="600" fill="#9b403b">SFT / RL 增量：+7.92 / +4.17</text>
<text x="14" y="514" font-size="12.8" font-weight="650" fill="#24313a">14B ACE：+17.29 = SFT +16.04 + RL +1.25</text>
<text x="14" y="532" font-size="12.2" font-weight="400" fill="#52636d">来源：论文 Table 2；增量单位：百分点</text>
</g>
</svg>
