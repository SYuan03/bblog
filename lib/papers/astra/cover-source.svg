<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ASTRA paper explainer cover</title>
  <desc id="desc">Two coordinated production lines turn MCP tool documents into supervised trajectories and question decomposition into executable reinforcement learning environments.</desc>
  <rect width="1600" height="900" fill="#f7f3ea"/>
  <path d="M0 0h18v900H0z" fill="#2f6f9f"/>
