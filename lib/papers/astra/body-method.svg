<svg xmlns="http://www.w3.org/2000/svg" width="900" height="316" viewBox="0 0 900 316" role="img" aria-labelledby="title desc">
<title id="title">ASTRA 的两条数据流程和两阶段训练</title>
<desc id="desc">工具文档生成固定示范用于 SFT；多步问答生成可执行环境用于在线 RL；两条数据流程在模型训练中衔接。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Noto Sans CJK SC,sans-serif">
<rect width="900" height="316" fill="#fff"/>
<text x="20" y="35" font-size="22" font-weight="700" fill="#24313a">两条生成流程，各自提供一种训练材料</text>
<text x="20" y="58" font-size="14" font-weight="400" fill="#52636d">SFT 学固定调用记录；RL 在固定模拟工具中重新做任务。</text>
<rect x="20" y="76" width="860" height="86" rx="6" fill="#f1f6fa" stroke="#cdd8de"/>
<text x="36" y="108" font-size="17" font-weight="700" fill="#315f82">SFT · 示范</text>
<text x="36" y="134" font-size="15" font-weight="600" fill="#52636d">54,885 条</text>
<rect x="20" y="179" width="860" height="86" rx="6" fill="#f1f8f4" stroke="#cdd8de"/>
<text x="36" y="211" font-size="17" font-weight="700" fill="#276b58">RL · 环境</text>
<text x="36" y="237" font-size="15" font-weight="600" fill="#52636d">6,596 条</text>
<rect x="180" y="92" width="202" height="55" rx="6" fill="#fff" stroke="#cdd8de"/>
<text x="281" y="115" font-size="16" font-weight="650" fill="#24313a" text-anchor="middle">同一服务的工具文档</text>
<text x="281" y="135" font-size="13.5" font-weight="400" fill="#52636d" text-anchor="middle">名称、参数、返回值</text>
<rect x="407" y="92" width="202" height="55" rx="6" fill="#fff" stroke="#cdd8de"/>
<text x="508" y="115" font-size="16" font-weight="650" fill="#24313a" text-anchor="middle">调用图与任务</text>
<text x="508" y="135" font-size="13.5" font-weight="400" fill="#52636d" text-anchor="middle">选链、验证依赖</text>
<rect x="634" y="92" width="202" height="55" rx="6" fill="#fff" stroke="#cdd8de"/>
<text x="735" y="115" font-size="16" font-weight="650" fill="#24313a" text-anchor="middle">完整执行记录</text>
<text x="735" y="135" font-size="13.5" font-weight="400" fill="#52636d" text-anchor="middle">真实或有状态模拟工具</text>
<rect x="180" y="195" width="202" height="55" rx="6" fill="#fff" stroke="#cdd8de"/>
<text x="281" y="218" font-size="16" font-weight="650" fill="#24313a" text-anchor="middle">多步问答及依赖</text>
<text x="281" y="238" font-size="13.5" font-weight="400" fill="#52636d" text-anchor="middle">子问题与目标答案</text>
<rect x="407" y="195" width="202" height="55" rx="6" fill="#fff" stroke="#cdd8de"/>
<text x="508" y="218" font-size="16" font-weight="650" fill="#24313a" text-anchor="middle">Python 模拟工具</text>
<text x="508" y="238" font-size="13.5" font-weight="400" fill="#52636d" text-anchor="middle">检查目标输出</text>
<rect x="634" y="195" width="202" height="55" rx="6" fill="#fff" stroke="#cdd8de"/>
<text x="735" y="218" font-size="16" font-weight="650" fill="#24313a" text-anchor="middle">当前模型反复执行</text>
<text x="735" y="238" font-size="13.5" font-weight="400" fill="#52636d" text-anchor="middle">F1 奖励更新 policy</text>
<path d="M386 119H400" stroke="#52636d" stroke-width="2" fill="none"/>
<path d="M394 114l6 5-6 5" stroke="#52636d" stroke-width="2" fill="none"/>
<path d="M613 119H627" stroke="#52636d" stroke-width="2" fill="none"/>
<path d="M621 114l6 5-6 5" stroke="#52636d" stroke-width="2" fill="none"/>
<path d="M386 222H400" stroke="#52636d" stroke-width="2" fill="none"/>
<path d="M394 217l6 5-6 5" stroke="#52636d" stroke-width="2" fill="none"/>
<path d="M613 222H627" stroke="#52636d" stroke-width="2" fill="none"/>
<path d="M621 217l6 5-6 5" stroke="#52636d" stroke-width="2" fill="none"/>
<text x="20" y="292" font-size="15" font-weight="600" fill="#24313a">同一个 Qwen3 policy：基座 → SFT → online RL</text>
<text x="880" y="292" font-size="13" font-weight="400" fill="#52636d" text-anchor="end">来源：论文 §§2–3、Figures 2–4</text>
</g>
</svg>
