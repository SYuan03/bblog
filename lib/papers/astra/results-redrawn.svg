<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">ASTRA 分阶段分数与增量</title>
  <desc id="desc">14B 与 32B 最终模型均在三个工具使用评测上提升。BFCL 与 tau squared 的增量主要来自强化学习，ACEBench 则主要来自监督微调。表格列出基座、SFT、RL 的精确分数。</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.h{font-size:34px;font-weight:750}.label{font-size:22px;font-weight:700}.p{font-size:21px;fill:#53616b}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:26px;font-weight:650}.small{font-size:18px;fill:#65717a}</style>
  <rect width="1400" height="760" fill="#fff"/>
  <text x="54" y="56" class="h">最终模型三榜都提高，增量却不能一概归到 RL</text>
  <text x="54" y="97" class="p">下面只比较 Table 2 内的阶段；不同 benchmark 使用自己的协议与评分，不混成一个总分。</text>
  <rect x="54" y="129" width="1292" height="62" fill="#f2f5f7"/>
  <g class="label"><text x="78" y="170">模型 / 评测</text><text x="575" y="170" text-anchor="middle">基座</text><text x="795" y="170" text-anchor="middle">SFT</text><text x="1015" y="170" text-anchor="middle">RL</text><text x="1230" y="170" text-anchor="middle">较前阶段增量</text></g>
  <text x="78" y="230" class="label" fill="#245f87">Qwen3-14B</text>
  <text x="78" y="273" class="p">BFCL-MT</text><text x="78" y="319" class="p">τ²-Bench</text><text x="78" y="365" class="p">ACEBench</text>
  <g class="num" text-anchor="middle"><text x="575" y="273">44.50</text><text x="795" y="273">48.50</text><text x="1015" y="273">58.13</text><text x="575" y="319">44.55</text><text x="795" y="319">50.45</text><text x="1015" y="319">57.70</text><text x="575" y="365">51.67</text><text x="795" y="365">67.71</text><text x="1015" y="365">68.96</text></g>
  <g class="small" text-anchor="middle"><text x="1230" y="273">+4.00 / +9.63</text><text x="1230" y="319">+5.90 / +7.25</text><text x="1230" y="365" fill="#245f87">+16.04 / +1.25</text></g>
  <path d="M54 393H1346" stroke="#d5dce0"/>
  <text x="78" y="434" class="label" fill="#2f7d6b">Qwen3-32B</text>
  <text x="78" y="477" class="p">BFCL-MT</text><text x="78" y="523" class="p">τ²-Bench</text><text x="78" y="569" class="p">ACEBench</text>
  <g class="num" text-anchor="middle"><text x="575" y="477">47.88</text><text x="795" y="477">52.13</text><text x="1015" y="477">64.25</text><text x="575" y="523">49.70</text><text x="795" y="523">52.30</text><text x="1015" y="523">63.70</text><text x="575" y="569">59.79</text><text x="795" y="569">67.71</text><text x="1015" y="569">71.88</text></g>
  <g class="small" text-anchor="middle"><text x="1230" y="477">+4.25 / +12.12</text><text x="1230" y="523">+2.60 / +11.40</text><text x="1230" y="569" fill="#245f87">+7.92 / +4.17</text></g>
  <rect x="54" y="605" width="1292" height="78" fill="#edf4f8" stroke="#c2d6e4"/>
  <text x="78" y="638" class="label" fill="#245f87">右列顺序：SFT 增量 / 随后 RL 增量，按显示值相减。</text>
  <text x="78" y="671" class="p">14B ACE 的 +17.29 是总增益；其中 SFT +16.04，后续 RL +1.25。</text>
  <text x="54" y="718" class="small">根据论文 Table 2 重绘。τ² 排除 airline；Table 1 与 2 部分基座分数不一致，本文不混用两张表。</text>
  <text x="54" y="746" class="small">论文没有多个训练随机种子与主要分数置信区间；各行数字保留其原评测尺度。</text>
</svg>
