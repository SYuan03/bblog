<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">ASTRA results before and after SFT and reinforcement learning</title>
  <desc id="desc">Grouped bars compare Qwen3 base, ASTRA SFT, and ASTRA RL scores on BFCL-MT, tau squared Bench, and ACEBench for 14B and 32B models.</desc>
  <rect width="1400" height="760" fill="#fbfaf7"/>
  <text x="56" y="64" font-family="Georgia, Songti SC, serif" font-size="38" font-weight="700" fill="#182027">SFT 负责 cold start，RL 才把三项 agentic score 全部推高</text>
  <text x="56" y="104" font-family="Arial, PingFang SC, sans-serif" font-size="17" fill="#6a737a">分数来自论文 Table 2；三项 benchmark 的 protocol 不同，横向比较只看同一列内的训练阶段变化。</text>
  <g font-family="Arial, PingFang SC, sans-serif">
    <g transform="translate(82 160)">
      <text x="0" y="0" font-size="24" font-weight="700" fill="#253039">Qwen3-14B</text>
      <g transform="translate(0 42)">
        <text x="0" y="32" font-size="17" fill="#4c5961">BFCL-MT</text>
        <rect x="130" y="8" width="445" height="28" fill="#d7dde0"/><rect x="130" y="8" width="247" height="28" fill="#8e999f"/><text x="385" y="29" font-size="15" fill="#263139">44.50</text>
        <rect x="130" y="43" width="445" height="28" fill="#d7e7ef"/><rect x="130" y="43" width="269" height="28" fill="#4d87a8"/><text x="407" y="64" font-size="15" fill="#263139">48.50</text>
        <rect x="130" y="78" width="445" height="28" fill="#d8e9df"/><rect x="130" y="78" width="323" height="28" fill="#397a63"/><text x="461" y="99" font-size="15" font-weight="700" fill="#263139">58.13</text>
      </g>
      <g transform="translate(0 176)">
        <text x="0" y="32" font-size="17" fill="#4c5961">τ²-Bench</text>
        <rect x="130" y="8" width="445" height="28" fill="#d7dde0"/><rect x="130" y="8" width="247" height="28" fill="#8e999f"/><text x="385" y="29" font-size="15" fill="#263139">44.55</text>
        <rect x="130" y="43" width="445" height="28" fill="#d7e7ef"/><rect x="130" y="43" width="280" height="28" fill="#4d87a8"/><text x="418" y="64" font-size="15" fill="#263139">50.45</text>
        <rect x="130" y="78" width="445" height="28" fill="#d8e9df"/><rect x="130" y="78" width="321" height="28" fill="#397a63"/><text x="459" y="99" font-size="15" font-weight="700" fill="#263139">57.70</text>
      </g>
      <g transform="translate(0 310)">
        <text x="0" y="32" font-size="17" fill="#4c5961">ACEBench</text>
        <rect x="130" y="8" width="445" height="28" fill="#d7dde0"/><rect x="130" y="8" width="287" height="28" fill="#8e999f"/><text x="425" y="29" font-size="15" fill="#263139">51.67</text>
        <rect x="130" y="43" width="445" height="28" fill="#d7e7ef"/><rect x="130" y="43" width="376" height="28" fill="#4d87a8"/><text x="514" y="64" font-size="15" fill="#263139">67.71</text>
        <rect x="130" y="78" width="445" height="28" fill="#d8e9df"/><rect x="130" y="78" width="383" height="28" fill="#397a63"/><text x="521" y="99" font-size="15" font-weight="700" fill="#263139">68.96</text>
      </g>
    </g>

    <g transform="translate(744 160)">
      <text x="0" y="0" font-size="24" font-weight="700" fill="#253039">Qwen3-32B</text>
      <g transform="translate(0 42)">
        <text x="0" y="32" font-size="17" fill="#4c5961">BFCL-MT</text>
        <rect x="130" y="8" width="445" height="28" fill="#d7dde0"/><rect x="130" y="8" width="266" height="28" fill="#8e999f"/><text x="404" y="29" font-size="15" fill="#263139">47.88</text>
        <rect x="130" y="43" width="445" height="28" fill="#d7e7ef"/><rect x="130" y="43" width="290" height="28" fill="#4d87a8"/><text x="428" y="64" font-size="15" fill="#263139">52.13</text>
        <rect x="130" y="78" width="445" height="28" fill="#d8e9df"/><rect x="130" y="78" width="357" height="28" fill="#397a63"/><text x="495" y="99" font-size="15" font-weight="700" fill="#263139">64.25</text>
      </g>
      <g transform="translate(0 176)">
        <text x="0" y="32" font-size="17" fill="#4c5961">τ²-Bench</text>
        <rect x="130" y="8" width="445" height="28" fill="#d7dde0"/><rect x="130" y="8" width="276" height="28" fill="#8e999f"/><text x="414" y="29" font-size="15" fill="#263139">49.70</text>
        <rect x="130" y="43" width="445" height="28" fill="#d7e7ef"/><rect x="130" y="43" width="291" height="28" fill="#4d87a8"/><text x="429" y="64" font-size="15" fill="#263139">52.30</text>
        <rect x="130" y="78" width="445" height="28" fill="#d8e9df"/><rect x="130" y="78" width="354" height="28" fill="#397a63"/><text x="492" y="99" font-size="15" font-weight="700" fill="#263139">63.70</text>
      </g>
      <g transform="translate(0 310)">
        <text x="0" y="32" font-size="17" fill="#4c5961">ACEBench</text>
        <rect x="130" y="8" width="445" height="28" fill="#d7dde0"/><rect x="130" y="8" width="332" height="28" fill="#8e999f"/><text x="470" y="29" font-size="15" fill="#263139">59.79</text>
        <rect x="130" y="43" width="445" height="28" fill="#d7e7ef"/><rect x="130" y="43" width="376" height="28" fill="#4d87a8"/><text x="514" y="64" font-size="15" fill="#263139">67.71</text>
        <rect x="130" y="78" width="445" height="28" fill="#d8e9df"/><rect x="130" y="78" width="399" height="28" fill="#397a63"/><text x="537" y="99" font-size="15" font-weight="700" fill="#263139">71.88</text>
      </g>
    </g>

    <g transform="translate(82 642)">
      <rect width="18" height="18" fill="#8e999f"/><text x="29" y="15" font-size="15" fill="#4c5961">base</text>
      <rect x="102" width="18" height="18" fill="#4d87a8"/><text x="131" y="15" font-size="15" fill="#4c5961">SFT</text>
      <rect x="198" width="18" height="18" fill="#397a63"/><text x="227" y="15" font-size="15" fill="#4c5961">RL</text>
      <text x="0" y="54" font-size="15" fill="#6a737a">τ²-Bench 排除 airline subset；14B 表内 base overall 按 Table 2 为 44.55。</text>
    </g>
  </g>
</svg>
