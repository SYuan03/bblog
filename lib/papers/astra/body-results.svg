<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" role="img" aria-labelledby="title desc">
  <title id="title">ASTRA Table 2 分阶段结果：基座、SFT 与 RL</title>
  <desc id="desc">显示 Qwen3 14B 和 32B 三项评测的基座、监督微调与强化学习分数，以及两个阶段分别带来的增量。14B ACEBench 的总增益主要来自 SFT。</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.title{font-size:32px;font-weight:750}.head{font-size:27px;font-weight:700}.body{font-size:25px;fill:#46545d}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:27px;font-weight:650}.small{font-size:23px;fill:#56646d}</style>
  <rect width="1000" height="860" fill="#fff"/>
  <text x="40" y="52" class="title">三榜都提高，但阶段贡献不同</text>
  <text x="40" y="94" class="body">同一张 Table 2 内比较；不同评测不混成一个总分。</text>
  <rect x="40" y="122" width="920" height="61" fill="#f1f4f6"/>
  <g class="head"><text x="62" y="161">模型 / 评测</text><text x="380" y="161" text-anchor="middle">基座</text><text x="540" y="161" text-anchor="middle">SFT</text><text x="700" y="161" text-anchor="middle">RL</text></g>
  <text x="866" y="148" text-anchor="middle" class="small">阶段增量</text>
  <text x="866" y="175" text-anchor="middle" class="small">SFT / RL</text>
  <text x="62" y="223" class="head" fill="#245f87">Qwen3-14B</text>
  <g class="body"><text x="62" y="266">BFCL-MT</text><text x="62" y="312">τ²-Bench</text><text x="62" y="358">ACEBench</text></g>
  <g class="num" text-anchor="middle"><text x="380" y="266">44.50</text><text x="540" y="266">48.50</text><text x="700" y="266">58.13</text><text x="380" y="312">44.55</text><text x="540" y="312">50.45</text><text x="700" y="312">57.70</text><text x="380" y="358">51.67</text><text x="540" y="358">67.71</text><text x="700" y="358">68.96</text></g>
  <g class="small" text-anchor="middle"><text x="866" y="266">4.00 / 9.63</text><text x="866" y="312">5.90 / 7.25</text><text x="866" y="358">16.04 / 1.25</text></g>
  <path d="M40 387H960" stroke="#d2dade"/>
  <text x="62" y="431" class="head" fill="#356954">Qwen3-32B</text>
  <g class="body"><text x="62" y="474">BFCL-MT</text><text x="62" y="520">τ²-Bench</text><text x="62" y="566">ACEBench</text></g>
  <g class="num" text-anchor="middle"><text x="380" y="474">47.88</text><text x="540" y="474">52.13</text><text x="700" y="474">64.25</text><text x="380" y="520">49.70</text><text x="540" y="520">52.30</text><text x="700" y="520">63.70</text><text x="380" y="566">59.79</text><text x="540" y="566">67.71</text><text x="700" y="566">71.88</text></g>
  <g class="small" text-anchor="middle"><text x="866" y="474">4.25 / 12.12</text><text x="866" y="520">2.60 / 11.40</text><text x="866" y="566">7.92 / 4.17</text></g>
  <rect x="40" y="607" width="920" height="118" fill="#f1f5f8" stroke="#c4d3dd"/>
  <text x="64" y="650" class="head" fill="#245f87">14B ACE 的 +17.29 是总增益。</text>
  <text x="64" y="695" class="body">其中 SFT +16.04，随后 RL +1.25；不能全算在 RL 上。</text>
  <text x="40" y="774" class="small">根据论文 Table 2 重绘；增量按显示值相减，均为百分点。</text>
  <text x="40" y="805" class="small">τ² 排除 airline；Table 1 与 Table 2 的部分基座数值不一致。</text>
  <text x="40" y="836" class="small">论文未报告多个训练随机种子或主要分数置信区间。</text>
</svg>
