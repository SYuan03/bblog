<svg xmlns="http://www.w3.org/2000/svg" width="900" height="366" viewBox="0 0 900 366" role="img" aria-labelledby="title desc">
<title id="title">ASTRA 公开行李样本的目标与模拟工具观察</title>
<desc id="desc">公开样本的四个隐藏目标中，前三个在特定输入下可以命中；支付目标与按名称注册的工具返回不匹配。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Noto Sans CJK SC,sans-serif">
<rect width="900" height="366" fill="#fff"/>
<text x="20" y="35" font-size="22" font-weight="700" fill="#24313a">公开行李样本：前三项目标可命中，支付对不上</text>
<rect x="20" y="56" width="860" height="54" rx="6" fill="#f1f6fa" stroke="#cdd8de"/>
<text x="35" y="78" font-size="15" font-weight="400" fill="#24313a">Agent 可见：Amit Kumar 的行李加购请求、9 项工具说明及调用返回</text>
<text x="35" y="99" font-size="14" font-weight="400" fill="#52636d">评分端另存四个目标答案；请求未给年份，预订实现要求 2024 年。</text>
<rect x="20" y="127" width="860" height="36" rx="0" fill="#edf3f6" stroke="#edf3f6"/>
<text x="35" y="151" font-size="14.5" font-weight="700" fill="#24313a">步骤 / 工具</text>
<text x="300" y="151" font-size="14.5" font-weight="700" fill="#24313a">隐藏目标中的关键值</text>
<text x="625" y="151" font-size="14.5" font-weight="700" fill="#24313a">已检查实现的结果</text>
<rect x="20" y="163" width="860" height="41" rx="0" fill="#fafbfc" stroke="#e0e6e9"/>
<text x="35" y="189" font-size="15" font-weight="400" fill="#24313a">1 找预订</text>
<text x="300" y="189" font-size="15" font-weight="600" fill="#315f82">RES987654</text>
<text x="625" y="189" font-size="14.5" font-weight="600" fill="#276b58">命中，需设 2024 年</text>
<rect x="20" y="204" width="860" height="41" rx="0" fill="#fff" stroke="#e0e6e9"/>
<text x="35" y="230" font-size="15" font-weight="400" fill="#24313a">2 查额度</text>
<text x="300" y="230" font-size="15" font-weight="600" fill="#315f82">1 bag</text>
<text x="625" y="230" font-size="14.5" font-weight="600" fill="#276b58">命中</text>
<rect x="20" y="245" width="860" height="41" rx="0" fill="#fafbfc" stroke="#e0e6e9"/>
<text x="35" y="271" font-size="15" font-weight="400" fill="#24313a">3 算费用</text>
<text x="300" y="271" font-size="15" font-weight="600" fill="#315f82">₹600</text>
<text x="625" y="271" font-size="14.5" font-weight="600" fill="#276b58">命中</text>
<rect x="20" y="286" width="860" height="41" rx="0" fill="#fff" stroke="#e0e6e9"/>
<text x="35" y="312" font-size="15" font-weight="400" fill="#24313a">4 支付</text>
<text x="300" y="312" font-size="15" font-weight="600" fill="#315f82">TXN123456789</text>
<text x="625" y="312" font-size="14.5" font-weight="600" fill="#9b403b">未命中：重名覆盖、随机编号</text>
<rect x="20" y="337" width="860" height="22" rx="2" fill="#fff4f2" stroke="#efcdca"/>
<text x="31" y="353" font-size="13.5" font-weight="600" fill="#9b403b">条件计算：若四次调用只命中前三项，F1 ≈ 0.75；这不是公开的 policy 实测得分。</text>
</g>
</svg>
