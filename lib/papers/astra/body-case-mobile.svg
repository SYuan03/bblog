<svg xmlns="http://www.w3.org/2000/svg" width="360" height="562" viewBox="0 0 360 562" role="img" aria-labelledby="title desc">
<title id="title">ASTRA 行李样本（手机排版）</title>
<desc id="desc">Agent 可见请求和工具；隐藏评分目标有四项。前三项在特定输入下命中，支付目标无法从已检查实现稳定取得。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Noto Sans CJK SC,sans-serif">
<rect width="360" height="562" fill="#fff"/>
<text x="14" y="27" font-size="17" font-weight="700" fill="#24313a">行李样本：支付目标对不上</text>
<rect x="14" y="43" width="332" height="71" rx="6" fill="#f1f6fa" stroke="#cdd8de"/>
<text x="26" y="65" font-size="14.2" font-weight="400" fill="#24313a">Agent：看请求、工具和返回。</text>
<text x="26" y="87" font-size="14.2" font-weight="400" fill="#24313a">评分：看四个隐藏目标答案。</text>
<text x="26" y="106" font-size="12.5" font-weight="400" fill="#52636d">请求没写年份；预订代码限定 2024。</text>
<rect x="14" y="129" width="332" height="77" rx="6" fill="#fafbfc" stroke="#cdd8de"/>
<text x="27" y="153" font-size="15.5" font-weight="700" fill="#24313a">1 找预订</text>
<text x="27" y="174" font-size="14" font-weight="600" fill="#315f82">目标：RES987654</text>
<text x="27" y="194" font-size="13.2" font-weight="600" fill="#276b58">命中，需设 2024 年</text>
<rect x="14" y="218" width="332" height="77" rx="6" fill="#fafbfc" stroke="#cdd8de"/>
<text x="27" y="242" font-size="15.5" font-weight="700" fill="#24313a">2 查额度</text>
<text x="27" y="263" font-size="14" font-weight="600" fill="#315f82">目标：1 bag</text>
<text x="27" y="283" font-size="13.2" font-weight="600" fill="#276b58">命中</text>
<rect x="14" y="307" width="332" height="77" rx="6" fill="#fafbfc" stroke="#cdd8de"/>
<text x="27" y="331" font-size="15.5" font-weight="700" fill="#24313a">3 算费用</text>
<text x="27" y="352" font-size="14" font-weight="600" fill="#315f82">目标：₹600</text>
<text x="27" y="372" font-size="13.2" font-weight="600" fill="#276b58">命中</text>
<rect x="14" y="396" width="332" height="77" rx="6" fill="#fff4f2" stroke="#efcdca"/>
<text x="27" y="420" font-size="15.5" font-weight="700" fill="#24313a">4 支付</text>
<text x="27" y="441" font-size="14" font-weight="600" fill="#315f82">目标：TXN123456789</text>
<text x="27" y="461" font-size="13.2" font-weight="600" fill="#9b403b">未命中：重名覆盖、随机编号</text>
<rect x="14" y="497" width="332" height="49" rx="6" fill="#fff4f2" stroke="#efcdca"/>
<text x="26" y="517" font-size="13.2" font-weight="600" fill="#9b403b">若四次只命中前三项：F1 ≈ 0.75。</text>
<text x="26" y="537" font-size="12.5" font-weight="400" fill="#52636d">条件计算，不是 policy 实测分数。</text>
</g>
</svg>
