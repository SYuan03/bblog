<svg xmlns="http://www.w3.org/2000/svg" width="360" height="445" viewBox="0 0 360 445" role="img" aria-labelledby="title desc">
<title id="title">ASTRA 两条训练材料流程（手机排版）</title>
<desc id="desc">工具文档生成示范；多步问答生成环境；先监督微调，再用环境奖励训练同一个模型。</desc>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Noto Sans CJK SC,sans-serif">
<rect width="360" height="445" fill="#fff"/>
<text x="14" y="28" font-size="17" font-weight="700" fill="#24313a">两条流程，衔接成两阶段训练</text>
<rect x="14" y="45" width="332" height="153" rx="6" fill="#f1f6fa" stroke="#cdd8de"/>
<text x="27" y="71" font-size="16" font-weight="700" fill="#315f82">SFT · 54,885 条固定示范</text>
<rect x="27" y="85" width="306" height="39" rx="6" fill="#fff" stroke="#cdd8de"/>
<text x="39" y="110" font-size="14.5" font-weight="400" fill="#24313a">同一服务的 MCP 工具文档</text>
<path d="M180 127L180 136" stroke="#52636d" stroke-width="2" fill="none"/>
<path d="M175 130l5 6 5-6" stroke="#52636d" stroke-width="2" fill="none"/>
<rect x="27" y="139" width="306" height="42" rx="6" fill="#fff" stroke="#cdd8de"/>
<text x="39" y="165" font-size="14.3" font-weight="400" fill="#24313a">调用图 → 任务 → 完整执行记录</text>
<rect x="14" y="220" width="332" height="153" rx="6" fill="#f1f8f4" stroke="#cdd8de"/>
<text x="27" y="246" font-size="16" font-weight="700" fill="#276b58">RL · 6,596 个固定环境</text>
<rect x="27" y="260" width="306" height="39" rx="6" fill="#fff" stroke="#cdd8de"/>
<text x="39" y="285" font-size="14.5" font-weight="400" fill="#24313a">多步问答与目标答案</text>
<path d="M180 302L180 311" stroke="#52636d" stroke-width="2" fill="none"/>
<path d="M175 305l5 6 5-6" stroke="#52636d" stroke-width="2" fill="none"/>
<rect x="27" y="314" width="306" height="42" rx="6" fill="#fff" stroke="#cdd8de"/>
<text x="39" y="340" font-size="14.3" font-weight="400" fill="#24313a">Python 模拟工具 → 当前模型执行</text>
<text x="27" y="207" font-size="14" font-weight="600" fill="#52636d">示范初始化同一个 Qwen3 policy ↓</text>
<text x="27" y="394" font-size="14" font-weight="400" fill="#24313a">F1 同时计算目标命中与工具调用数。</text>
<text x="14" y="432" font-size="12.5" font-weight="400" fill="#52636d">来源：论文 §§2–3、Figures 2–4</text>
</g>
</svg>
