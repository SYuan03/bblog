<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="781" viewBox="0 0 1050 781" role="img" aria-labelledby="title"><title id="title">AppWorld 示例：付款请求没创建，程序却宣布成功</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="781" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">AppWorld 示例：付款请求没创建，程序却宣布成功</tspan></text><text x="38" y="116.69999999999999" fill="#465363" font-size="25" font-weight="400"><tspan x="38" dy="0">目标是分摊最近三笔 Amazon 订单；54.0 的请求需要 user_email。</tspan></text><rect x="38" y="153.2" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="181.2" r="18" fill="#245e99"/><text x="69" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">API 请求缺少参数</tspan></text><text x="60" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">调用没有传 user_email，因此无法</tspan><tspan x="60" dy="35.5">创建期望的 PaymentRequest。</tspan></text><rect x="549" y="153.2" width="463" height="167.34" rx="6" fill="#fbf3f2" stroke="#dce2e8"/><circle cx="580" cy="181.2" r="18" fill="#a64b47"/><text x="580" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">运行程序吞掉错误</tspan></text><text x="571" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">捕获 API 错误，却仍把 success</tspan><tspan x="571" dy="35.5">标志设为成功。</tspan></text><path d="M507 236.87h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 236.87h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="358.53999999999996" width="463" height="202.84" rx="6" fill="#fbf3f2" stroke="#dce2e8"/><circle cx="69" cy="386.53999999999996" r="18" fill="#a64b47"/><text x="69" y="393.53999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="392.53999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">结束检查只看标志</tspan></text><text x="60" y="438.87999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">没有检查真实记录，</tspan><tspan x="60" dy="35.5">PaymentRequest 数量并未增加，任</tspan><tspan x="60" dy="35.5">务已过早结束。</tspan></text><rect x="549" y="358.53999999999996" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="386.53999999999996" r="18" fill="#245e99"/><text x="580" y="393.53999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="392.53999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">诊断要求检查状态变化</tspan></text><text x="571" y="438.87999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">沿文档、请求与状态依赖定位；完成</tspan><tspan x="571" dy="35.5">前必须验证请求确实创建。</tspan></text><path d="M507 459.96h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="599.38" width="974" height="104" fill="#fff" stroke="#dce2e8"/><path d="M38 599.38v104" stroke="#a96238" stroke-width="5"/><text x="55" y="625.38" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">Figure 3 是方法说明，未公开这道题完整修补重跑日志。不能把修补规范当成已观</tspan><tspan x="55" dy="35.5">测的单题 PASS；这里是创建请求，不是完成付款。</tspan></text><path d="M38 720.38h974" stroke="#dce2e8"/><text x="38" y="745.38" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 v2 Figure 3 与 §III-A 重绘；金额沿用后者的 54.0。</tspan></text></g></svg>
