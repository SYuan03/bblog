<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="650" viewBox="0 0 1050 650" role="img" aria-labelledby="title"><title id="title">GAIA 消融：只加提示不能解释全部收益</title><rect width="1050" height="650" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="66" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">GAIA 消融：只加提示不能解释全部收益</tspan></text><rect x="38" y="114.69999999999999" width="350" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="52" y="141.7" fill="#24292f" font-size="25" font-weight="700"><tspan x="52" dy="0">设置</tspan></text><rect x="388" y="114.69999999999999" width="175" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="402" y="141.7" fill="#24292f" font-size="25" font-weight="700"><tspan x="402" dy="0">成功率</tspan></text><rect x="563" y="114.69999999999999" width="449" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="577" y="141.7" fill="#24292f" font-size="25" font-weight="700"><tspan x="577" dy="0">测试的问题</tspan></text><rect x="38" y="171.2" width="350" height="51.5" fill="#f4f8fb" stroke="#dce2e8"/><text x="52" y="198.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">初始运行程序</tspan></text><rect x="388" y="171.2" width="175" height="51.5" fill="#f4f8fb" stroke="#dce2e8"/><text x="402" y="198.2" fill="#465363" font-size="25" font-weight="400"><tspan x="402" dy="0">43.3%</tspan></text><rect x="563" y="171.2" width="449" height="51.5" fill="#f4f8fb" stroke="#dce2e8"/><text x="577" y="198.2" fill="#465363" font-size="25" font-weight="400"><tspan x="577" dy="0">共同起点</tspan></text><rect x="38" y="222.7" width="350" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="249.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">只修改 prompt</tspan></text><rect x="388" y="222.7" width="175" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="402" y="249.7" fill="#465363" font-size="25" font-weight="400"><tspan x="402" dy="0">50.6%</tspan></text><rect x="563" y="222.7" width="449" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="577" y="249.7" fill="#465363" font-size="25" font-weight="400"><tspan x="577" dy="0">只补提示是否足够</tspan></text><rect x="38" y="274.2" width="350" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="52" y="301.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">无结构化诊断</tspan></text><rect x="388" y="274.2" width="175" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="402" y="301.2" fill="#465363" font-size="25" font-weight="400"><tspan x="402" dy="0">51.1%</tspan></text><rect x="563" y="274.2" width="449" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="577" y="301.2" fill="#465363" font-size="25" font-weight="400"><tspan x="577" dy="0">失败归因是否有用</tspan></text><rect x="38" y="325.7" width="350" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="352.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">不限定修补操作</tspan></text><rect x="388" y="325.7" width="175" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="402" y="352.7" fill="#465363" font-size="25" font-weight="400"><tspan x="402" dy="0">50.6%</tspan></text><rect x="563" y="325.7" width="449" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="577" y="352.7" fill="#465363" font-size="25" font-weight="400"><tspan x="577" dy="0">任意修改是否足够</tspan></text><rect x="38" y="377.2" width="350" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="52" y="404.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">无回归验收</tspan></text><rect x="388" y="377.2" width="175" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="402" y="404.2" fill="#465363" font-size="25" font-weight="400"><tspan x="402" dy="0">55.6%</tspan></text><rect x="563" y="377.2" width="449" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="577" y="404.2" fill="#465363" font-size="25" font-weight="400"><tspan x="577" dy="0">候选筛选是否有用</tspan></text><rect x="38" y="428.7" width="350" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="455.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">完整 HarnessFix</tspan></text><rect x="388" y="428.7" width="175" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="402" y="455.7" fill="#465363" font-size="25" font-weight="400"><tspan x="402" dy="0">61.7%</tspan></text><rect x="563" y="428.7" width="449" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="577" y="455.7" fill="#465363" font-size="25" font-weight="400"><tspan x="577" dy="0">诊断、修补范围与验收共同作用</tspan></text><rect x="38" y="504.2" width="974" height="69.5" fill="#fff" stroke="#dce2e8"/><path d="M38 504.2v69.5" stroke="#a96238" stroke-width="5"/><text x="55" y="531.2" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">完整系统超过提示修改基线，但这张表不能把全部增益归给一个模块。</tspan></text><path d="M38 589.7h974" stroke="#dce2e8"/><text x="38" y="614.7" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 v2 Table VI 的 GAIA 消融重绘。</tspan></text></g></svg>
