<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="913" viewBox="0 0 1050 913" role="img" aria-labelledby="title"><title id="title">HarnessFix：从运行事实，定位到允许修改的代码</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="913" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">HarnessFix：从运行事实，定位到允许修改的代码</tspan></text><rect x="38" y="115.69999999999999" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="143.7" r="18" fill="#245e99"/><text x="69" y="150.7" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="149.7" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">保留原始运行记录</tspan></text><text x="60" y="196.04" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">包括模型输入输出、工具调用、返回</tspan><tspan x="60" dy="35.5">值与状态，而不是仅看最终答错。</tspan></text><rect x="549" y="115.69999999999999" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="143.7" r="18" fill="#245e99"/><text x="580" y="150.7" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="149.7" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">整理结构化步骤 HTIR</tspan></text><text x="571" y="196.04" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">形成 TraceSteps，连接数据依赖、</tspan><tspan x="571" dy="35.5">控制依赖和相关源码位置。</tspan></text><path d="M507 199.37h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 199.37h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="321.03999999999996" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="349.03999999999996" r="18" fill="#245e99"/><text x="69" y="356.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="355.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">诊断负责的步骤</tspan></text><text x="60" y="401.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">合并重复问题，区分模型推理错误与</tspan><tspan x="60" dy="35.5">运行程序缺陷。</tspan></text><rect x="549" y="321.03999999999996" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="349.03999999999996" r="18" fill="#245e99"/><text x="580" y="356.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="355.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">写出修补范围</tspan></text><text x="571" y="401.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">规定允许改哪些文件、做哪些操作，</tspan><tspan x="571" dy="35.5">禁止触碰任务数据。</tspan></text><path d="M507 404.71h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 404.71h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="526.38" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="554.38" r="18" fill="#245e99"/><text x="69" y="561.38" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">5</text><text x="107" y="560.38" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">生成可执行补丁</tspan></text><text x="60" y="606.72" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">修改状态传递、工具结果处理或完成</tspan><tspan x="60" dy="35.5">条件。</tspan></text><rect x="549" y="526.38" width="463" height="167.34" rx="6" fill="#f1f7f5" stroke="#dce2e8"/><circle cx="580" cy="554.38" r="18" fill="#317e6a"/><text x="580" y="561.38" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">6</text><text x="618" y="560.38" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">检查，再重跑验收</tspan></text><text x="571" y="606.72" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">静态检查后验证目标改善，同时检查</tspan><tspan x="571" dy="35.5">原成功任务是否退化。</tspan></text><path d="M507 610.05h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="731.72" width="974" height="104" fill="#fff" stroke="#dce2e8"/><path d="M38 731.72v104" stroke="#a96238" stroke-width="5"/><text x="55" y="757.72" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">HTIR 是结构化运行记录；anchor 是把一个步骤连接到源码位置。二者都不是新增</tspan><tspan x="55" dy="35.5">执行 Agent。</tspan></text><path d="M38 852.72h974" stroke="#dce2e8"/><text x="38" y="877.72" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 v2 §III 与 Figure 2 重绘。</tspan></text></g></svg>
