<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc">
  <title id="title">Harness-Zero 的部署结果与领域边界</title>
  <desc id="desc">Qwen3.5-9B 在固定 minimal harness 下的三个领域平均分由23.3增加到44.3。蒸馏后表格44.0、AppWorld58.9、USPTO30.0；直接使用专用 harness 则为39.0、48.2、38.0。平均分是三个领域指标的算术平均。</desc>
  <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#20252d;font-size:25px}.heading{font-size:32px;font-weight:750}.label{font-size:27px;font-weight:700}.muted{fill:#596575;font-size:22px}.number{font-size:30px;font-weight:750;fill:#365f85}.line{stroke:#d7dee7;stroke-width:2}</style>
  <rect width="1000" height="740" fill="#fff"/>
  <text class="heading" x="40" y="56">移除专用程序后，9B 模型仍保留了主要收益</text>
  <text class="muted" x="40" y="98">根据 Table 2 重绘；三个领域分别评分，再取算术平均。</text>
  <rect x="40" y="129" width="920" height="132" fill="#f5f7fa" stroke="#d7dee7"/>
  <text class="label" x="62" y="172">同一个最小执行接口 h 下</text>
  <text class="number" x="62" y="222">23.3% → 44.3%</text>
  <text x="374" y="222">基础模型 → Harness-Zero</text>
  <text class="label" x="40" y="314">各领域部署成绩</text>
  <text class="muted" x="570" y="314">原模型 + h*</text>
  <text class="muted" x="790" y="314">蒸馏模型 + h</text>
  <line class="line" x1="40" y1="338" x2="960" y2="338"/>
  <text x="40" y="386">SpreadsheetBench（pass@1）</text>
  <text x="610" y="386">39.0</text><text class="number" x="823" y="386">44.0</text>
  <line class="line" x1="40" y1="408" x2="960" y2="408"/>
  <text x="40" y="456">AppWorld（SGC）</text>
  <text x="610" y="456">48.2</text><text class="number" x="823" y="456">58.9</text>
  <line class="line" x1="40" y1="478" x2="960" y2="478"/>
  <text x="40" y="526">USPTO（pass@1）</text>
  <text class="number" x="610" y="526">38.0</text><text x="823" y="526">30.0</text>
  <line class="line" x1="40" y1="548" x2="960" y2="548"/>
  <text x="40" y="599">41.7 是原模型 + h* 的三领域平均；44.3 是蒸馏后平均。</text>
  <text x="40" y="643">但 USPTO 仍低于直接携带 h*：领域知识并未全部迁移。</text>
  <text class="muted" x="40" y="701">单次测试结果；不是所有任务混在一起的成功率，也不是 Oracle 采集成绩。</text>
</svg>
