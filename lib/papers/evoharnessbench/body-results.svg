<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="828" viewBox="0 0 1050 828" role="img" aria-labelledby="title"><title id="title">能力扩张下，多 Agent 协调退化更严重</title><rect width="1050" height="828" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="66" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">能力扩张下，多 Agent 协调退化更严重</tspan></text><rect x="38" y="114.69999999999999" width="345" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="52" y="141.7" fill="#24292f" font-size="25" font-weight="700"><tspan x="52" dy="0">指标</tspan></text><rect x="383" y="114.69999999999999" width="215" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="397" y="141.7" fill="#24292f" font-size="25" font-weight="700"><tspan x="397" dy="0">原文数值</tspan></text><rect x="598" y="114.69999999999999" width="414" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="612" y="141.7" fill="#24292f" font-size="25" font-weight="700"><tspan x="612" dy="0">具体含义</tspan></text><rect x="38" y="171.2" width="345" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="52" y="198.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">Tools 最差 relative</tspan><tspan x="52" dy="35.5">BWT</tspan></text><rect x="383" y="171.2" width="215" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="397" y="198.2" fill="#465363" font-size="25" font-weight="400"><tspan x="397" dy="0">−5.3%</tspan></text><rect x="598" y="171.2" width="414" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="612" y="198.2" fill="#465363" font-size="25" font-weight="400"><tspan x="612" dy="0">工具目录扩大后的旧题退化</tspan></text><rect x="38" y="258.2" width="345" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="285.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">Skills 最差 relative</tspan><tspan x="52" dy="35.5">BWT</tspan></text><rect x="383" y="258.2" width="215" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="397" y="285.2" fill="#465363" font-size="25" font-weight="400"><tspan x="397" dy="0">−4.0%</tspan></text><rect x="598" y="258.2" width="414" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="612" y="285.2" fill="#465363" font-size="25" font-weight="400"><tspan x="612" dy="0">任务关联来自规则匹配</tspan></text><rect x="38" y="345.2" width="345" height="87" fill="#f8fafb" stroke="#dce2e8"/><text x="52" y="372.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">Agents 最差 relative</tspan><tspan x="52" dy="35.5">BWT</tspan></text><rect x="383" y="345.2" width="215" height="87" fill="#f8fafb" stroke="#dce2e8"/><text x="397" y="372.2" fill="#465363" font-size="25" font-weight="400"><tspan x="397" dy="0">−34.7%</tspan></text><rect x="598" y="345.2" width="414" height="87" fill="#f8fafb" stroke="#dce2e8"/><text x="612" y="372.2" fill="#465363" font-size="25" font-weight="400"><tspan x="612" dy="0">多 Agent 协调的退化幅度更大</tspan></text><rect x="38" y="432.2" width="345" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="459.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">委派 precision</tspan></text><rect x="383" y="432.2" width="215" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="397" y="459.2" fill="#465363" font-size="25" font-weight="400"><tspan x="397" dy="0">约 90%</tspan></text><rect x="598" y="432.2" width="414" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="612" y="459.2" fill="#465363" font-size="25" font-weight="400"><tspan x="612" dy="0">已经调用的 Agent 中，相关的比</tspan><tspan x="612" dy="35.5">例</tspan></text><rect x="38" y="519.2" width="345" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="52" y="546.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">委派 recall</tspan></text><rect x="383" y="519.2" width="215" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="397" y="546.2" fill="#465363" font-size="25" font-weight="400"><tspan x="397" dy="0">79% → 89%</tspan></text><rect x="598" y="519.2" width="414" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="612" y="546.2" fill="#465363" font-size="25" font-weight="400"><tspan x="612" dy="0">必需 Agent 被叫到的比例</tspan></text><rect x="38" y="570.7" width="345" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="597.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">无适应下旧题的委派变化</tspan></text><rect x="383" y="570.7" width="215" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="397" y="597.7" fill="#465363" font-size="25" font-weight="400"><tspan x="397" dy="0">保住约 13%；失</tspan><tspan x="397" dy="35.5">败约 25%</tspan></text><rect x="598" y="570.7" width="414" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="612" y="597.7" fill="#465363" font-size="25" font-weight="400"><tspan x="612" dy="0">两类旧题对比，不是 13% 升到</tspan><tspan x="612" dy="35.5">25%</tspan></text><rect x="38" y="681.7" width="974" height="69.5" fill="#fff" stroke="#dce2e8"/><path d="M38 681.7v69.5" stroke="#a96238" stroke-width="5"/><text x="55" y="708.7" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">relative BWT 的归一化细节未公开；选对 Agent 仍不保证结果正确传递。</tspan></text><path d="M38 767.2h974" stroke="#dce2e8"/><text x="38" y="792.2" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 v3 主图与 Table 8 重绘，保留指标与归一化边界。</tspan></text></g></svg>
