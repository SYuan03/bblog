<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="860" viewBox="0 0 1050 860" role="img" aria-labelledby="title">
<title id="title">真实 CSM 任务：补产品与关联知识，检查最终状态</title>
<rect width="1050" height="860" fill="#fff"/>
<g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif" fill="#24292f">
<text x="38" y="63" font-size="35" font-weight="700">真实工单任务：补上产品，再关联用过的指南</text>
<text x="38" y="109" font-size="25" fill="#465363">公开合成 benchmark 任务；以下 ID 来自实际 seed 和任务 SQL。</text>
<rect x="38" y="145" width="469" height="188" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="64" cy="175" r="17" fill="#245e99"/><text x="64" y="183" text-anchor="middle" fill="#fff" font-size="22">1</text><text x="94" y="184" font-size="27" font-weight="700">定位原工单</text><text x="58" y="230" fill="#465363" font-size="25"><tspan x="58" dy="0">Thomas Bailey → contact 5 → Initech</tspan><tspan x="58" dy="35">case 101：phone / new / 产品为空</tspan><tspan x="58" dy="35">工单 108 已解决且属于另一产品</tspan></text>
<rect x="543" y="145" width="469" height="188" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="569" cy="175" r="17" fill="#245e99"/><text x="569" y="183" text-anchor="middle" fill="#fff" font-size="22">2</text><text x="599" y="184" font-size="27" font-weight="700">查出产品和知识</text><text x="563" y="230" fill="#465363" font-size="25"><tspan x="563" dy="0">产品 35：Docker Enterprise Variant 15</tspan><tspan x="563" dy="35">知识 54：标题含产品名，已发布</tspan><tspan x="563" dy="35">Agent 通过工具查找，不直接改 SQL</tspan></text>
<rect x="38" y="370" width="469" height="188" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="64" cy="400" r="17" fill="#245e99"/><text x="64" y="408" text-anchor="middle" fill="#fff" font-size="22">3</text><text x="94" y="409" font-size="27" font-weight="700">提交最终业务状态</text><text x="58" y="455" fill="#465363" font-size="25"><tspan x="58" dy="0">工单 101：product_id = 35</tspan><tspan x="58" dy="35">状态改为 in_progress（处理中）</tspan><tspan x="58" dy="35">关联知识 54，used_as = applied</tspan></text>
<rect x="543" y="370" width="469" height="188" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="569" cy="400" r="17" fill="#245e99"/><text x="569" y="408" text-anchor="middle" fill="#fff" font-size="22">4</text><text x="599" y="409" font-size="27" font-weight="700">评测端运行两条 SQL</text><text x="563" y="455" fill="#465363" font-size="25"><tspan x="563" dy="0">检查 1：客户、公司、产品与状态</tspan><tspan x="563" dy="35">检查 2：同一工单关联知识，且 applied</tspan><tspan x="563" dy="35">每条 COUNT(*) 都必须等于 1</tspan></text>
<path d="M513 239H532M274 341V359M779 341V359M513 464H532" stroke="#8da8c1" stroke-width="3"/>
<rect x="38" y="601" width="974" height="150" fill="#fff" stroke="#dce2e8"/>
<path d="M38 601V751" stroke="#a64b47" stroke-width="5"/>
<text x="59" y="639" font-size="26" font-weight="700">按公开条件推导的 FAIL，不是观测模型日志</text>
<text x="59" y="685" font-size="25" fill="#465363"><tspan x="59">产品和状态正确，但 used_as = resolution：检查结果 1、0。</tspan><tspan x="59" dy="36">状态仍为 new：两条结果都为 0；重复匹配成 2 条也不等于 1。</tspan></text>
<path d="M38 779H1012" stroke="#dce2e8"/>
<text x="38" y="816" font-size="22" fill="#617184">来源：公开 HF 工具任务；EOG seed 与 benchmark/verifier.py。未运行 hosted 环境。</text>
</g></svg>
