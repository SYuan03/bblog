<svg xmlns="http://www.w3.org/2000/svg" width="900" height="356" viewBox="0 0 900 356" role="img" aria-label="SERA执行与评价的不同输入，三个交替更新阶段"><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#263444;font-size:18px}.s{font-size:15px;fill:#586a7b}.b{font-weight:700}.blue{fill:#245e99}.green{fill:#26775e}.red{fill:#a44242}.mono{font-family:Menlo,monospace;font-size:16px}.rule{stroke:#d9e1ea;stroke-width:1.2}.arr{stroke:#245e99;stroke-width:1.8;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245e99"/></marker></defs><rect width="900" height="356" fill="#fff"/>
<text x="22" y="29" class="b">一次委派：执行、生成条件、评分，所有调用共享参数 θ</text>
<rect x="20" y="64" width="188" height="97" fill="#f4f7fa" stroke="#d9e1ea"/><text x="34" y="89" class="b">父 Agent 决定委派</text><text x="34" y="116">已有前文 + 子目标</text><text x="34" y="142" class="s">只保留委派前的信息</text>
<path d="M208 105H241" class="arr"/><rect x="246" y="64" width="268" height="97" fill="#f4f8ff" stroke="#245e99"/><text x="260" y="89" class="b blue">子 Agent 执行</text><text x="260" y="116">目标、工具、当前观察</text><text x="260" y="142" class="s">不读 rubric；可继续委派</text>
<path d="M514 105H553" class="arr"/><rect x="558" y="64" width="321" height="97" fill="#f4faf7" stroke="#26775e"/><text x="572" y="89" class="b green">另一次调用：评分</text><text x="572" y="116">rubric + 执行轨迹 + 最终状态</text><text x="572" y="142" class="s">非根得 s；根仍由程序给 0 / 1</text>
<path d="M114 161V209H241" class="arr"/><rect x="246" y="182" width="268" height="72" fill="#f4faf7" stroke="#26775e"/><text x="260" y="208" class="b green">生成 rubric（评分条件）</text><text x="260" y="236" class="s">不看执行结果；条件写完后不改</text><path d="M514 219H543V149H552" class="arr"/>
<text x="22" y="283" class="s">信息依赖如上；实际生成 rubric 与运行子 Agent 可并发，不必强制串行。</text>
<line x1="20" y1="299" x2="880" y2="299" class="rule"/>
<text x="22" y="326" class="blue b">E · 16 步：训练执行输出</text><text x="317" y="326" class="b">D · 2 步：只训委派语句</text><text x="609" y="326" class="green b">RT · 2 步：只训 rubric 输出</text><text x="22" y="349" class="s">20 个优化步循环；E 包含求解、委派与返回文字，评分调用不直接贡献梯度。</text></svg>
