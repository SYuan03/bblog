<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1160" viewBox="0 0 600 1160" role="img" aria-labelledby="title desc"><title id="title">SERA 三种训练的真实区别</title><desc id="desc">E 训练求解和委派输出，D 用叶节点覆盖率额外训练委派，RT 用同起点八分支的成败排序训练评分标准生成；普通评测不调用评分标准。</desc><defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#24292f;font-size:28px}.title{font-size:32px;font-weight:700}.label{font-size:29px;font-weight:700}.sub{font-size:25px;fill:#536171}.box{fill:#fff;stroke:#dce2e8;stroke-width:2}.blue{fill:#245e99}.arrow{stroke:#245e99;stroke-width:3;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#245e99"/></marker></defs><rect width="600" height="1160" fill="#fff"/><text x="28" y="48" class="title">同一组权重，三种更新</text><text x="28" y="87" class="sub">按 Figure 1、§3、Appendix B.2 重绘</text><rect x="28" y="122" width="544" height="215" class="box"/><text x="48" y="162" class="label blue">1 · 执行 E：运行一棵真实树</text><text x="48" y="207">根节点：程序验收的 0 / 1</text><text x="48" y="250">子节点：固定 rubric 评结果</text><text x="48" y="293">更新求解 + 委派输出</text><text x="48" y="327" class="sub">写标准、评分输出不进入 E 损失</text><rect x="28" y="372" width="544" height="191" class="box"/><text x="48" y="412" class="label blue">2 · 委派 D：只更新委派输出</text><text x="48" y="457">奖励 = 根成败 × 叶节点占比</text><text x="48" y="500">成功树：覆盖 2 / 3 → 奖励 2 / 3</text><text x="48" y="543">根任务失败 → 所有 D 奖励 0</text><rect x="28" y="598" width="544" height="326" class="box"/><text x="48" y="638" class="label blue">3 · 标准训练 RT：同起点 8 分支</text><text x="48" y="683">复制环境 → 执行 8 棵候选子树</text><text x="48" y="726">程序 / Kimi 标记真实成败</text><text x="48" y="769">同一份 rubric 对每条轨迹评分</text><text x="48" y="812">成功分须比失败分至少高 0.2</text><text x="48" y="855">只训练写 rubric 的输出</text><text x="48" y="895" class="sub">第 0 条提交状态；其余只用于 RT</text><rect x="28" y="966" width="544" height="151" fill="#f4f7fa" stroke="#dce2e8"/><text x="48" y="1005" class="label">主表 N=1：直接递归执行</text><text x="48" y="1048">不写 / 评分 rubric，不选择候选</text><text x="48" y="1090" class="sub">16 : 2 : 2 是训练步数比例，不是奖励权重</text></svg>
