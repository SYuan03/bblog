<svg xmlns="http://www.w3.org/2000/svg" width="900" height="394" viewBox="0 0 900 394" role="img"><title>共享权重，三种更新对象</title><defs><style>text{font:18px Arial,'PingFang SC',sans-serif;fill:#24292f}.h{font-size:22px;font-weight:700}.s{font-size:16px;fill:#59636f}.b{fill:#245e99;font-weight:700}.a{fill:none;stroke:#245e99;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#245e99"/></marker></defs><rect width="900" height="394" fill="white"/><text x="20" y="34" class="h">共享权重，三种更新对象</text><text x="20" y="67" class="s">输入 / 采集</text><text x="369" y="67" class="s">奖励来源</text><text x="729" y="67" class="s">更新的输出</text><text x="20" y="108" class="b">E · 真实执行树</text><path d="M254 102H333" class="a"/><text x="353" y="108">根：程序成败；子：rubric 分</text><path d="M656 102H710" class="a"/><text x="730" y="108" class="b">求解 + 委派</text><text x="20" y="190" class="b">D · 委派对应的子树</text><path d="M254 184H333" class="a"/><text x="353" y="190">根成功 × 叶节点占比</text><path d="M656 184H710" class="a"/><text x="730" y="190" class="b">只更新委派</text><text x="20" y="272" class="b">RT · 同起点 8 分支</text><path d="M254 266H333" class="a"/><text x="353" y="272">成败配对：成功分 − 失败分 ≥ .2</text><path d="M656 266H710" class="a"/><text x="730" y="272" class="b">只写 rubric</text><path d="M20 303H880" stroke="#dce2e8"/><text x="20" y="333">普通 N=1：直接递归执行，不生成 / 评分 rubric，不选择候选。</text><text x="20" y="365" class="s">根据 Figure 1、§3、Appendix B.2 整理；16:2:2 是训练步数；RT 提交分支0状态。</text></svg>
