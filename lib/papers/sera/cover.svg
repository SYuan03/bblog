<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Self-Evaluating Recursive Agents 方法与结果封面"><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#263444;font-size:18px}.s{font-size:15px;fill:#586a7b}.b{font-weight:700}.blue{fill:#245e99}.green{fill:#26775e}.red{fill:#a44242}.mono{font-family:Menlo,monospace;font-size:16px}.rule{stroke:#d9e1ea;stroke-width:1.2}.arr{stroke:#245e99;stroke-width:1.8;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245e99"/></marker></defs><rect width="1600" height="900" fill="#fff"/>
<text x="95" y="142" style="font-size:30px;fill:#586a7b">arXiv:2610.04902 · 2026-10-04</text><text x="95" y="241" style="font-size:56px;font-weight:700">Self-Evaluating Recursive Agents</text><text x="95" y="325" style="font-size:38px">模型写评分标准，再用真实成败训练它</text>
<line x1="95" y1="375" x2="1495" y2="375" class="rule"/>
<text x="95" y="485" style="font-size:31px">执行奖励：根任务由程序验收，子任务按模型的标准给分</text><text x="95" y="552" style="font-size:31px">三种交替更新：执行 · 委派 · 评分标准生成</text><text x="95" y="690" style="font-size:55px;fill:#245e99">TextWorld 51.93% → 65.07%</text><text x="95" y="755" style="font-size:27px;fill:#586a7b">同一 Qwen3-4B；主表无候选选择，3 个种子的均值</text><text x="95" y="828" style="font-size:25px;fill:#a44242">只给二元奖励基线加评价训练，反而降到 45.62%</text></svg>
