<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1200" viewBox="0 0 600 1200" role="img" aria-labelledby="title desc"><title id="title">SERA TextWorld 真实两菜题</title><desc id="desc">seed850000 两道菜、库存容量1、整题96次共享世界动作，收集与处理全部食材后还必须 prepare 和 eat 所有菜；漏吃一道根任务失败。</desc><defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#24292f;font-size:28px}.title{font-size:32px;font-weight:700}.label{font-size:29px;font-weight:700}.sub{font-size:25px;fill:#536171}.box{fill:#fff;stroke:#dce2e8;stroke-width:2}.blue{fill:#245e99}.red{fill:#a84b47}</style></defs><rect width="600" height="1200" fill="#fff"/><text x="28" y="48" class="title">真实题：两道菜怎样算完成？</text><text x="28" y="89" class="sub">官方训练记录 ...fork_join_medium_0000</text><rect x="28" y="122" width="544" height="161" class="box"/><text x="48" y="163" class="label blue">seed = 850000</text><text x="48" y="206">9 地点 · 11 干扰物 · 库存容量 1</text><text x="48" y="251">整题共享 96 次世界动作</text><rect x="28" y="313" width="544" height="205" class="box"/><text x="48" y="354" class="label">dish_1：收齐四种食材</text><text x="48" y="399">red apple、orange bell pepper</text><text x="48" y="441">→ roasted + sliced（烤、切片）</text><text x="48" y="484">olive oil、water → raw + uncut</text><rect x="28" y="548" width="544" height="205" class="box"/><text x="48" y="589" class="label">dish_2：同样按配方处理</text><text x="48" y="634">carrot、purple potato</text><text x="48" y="676">→ roasted + sliced</text><text x="48" y="719">salt、flour → raw + uncut</text><rect x="28" y="783" width="544" height="202" fill="#f4f7fa" stroke="#dce2e8"/><text x="48" y="824" class="label blue">程序逐项验收，必须全部满足</text><text x="48" y="869">食材 collected 且没有 deleted</text><text x="48" y="912">处理状态与配方完全一致</text><text x="48" y="955">两道菜都 prepare 并 eat</text><rect x="28" y="1015" width="544" height="144" class="box"/><text x="48" y="1056" class="label red">漏吃第二道菜 → 根分 0</text><text x="48" y="1099">按检查规则推得，不是模型日志</text><text x="48" y="1140" class="sub">来源：Dataset；composite_scorer.py</text></svg>
