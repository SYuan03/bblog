<svg xmlns="http://www.w3.org/2000/svg" width="900" height="346" viewBox="0 0 900 346" role="img" aria-label="真实TextWorld两菜配方与完整验收，实际CPU25动作通过，漏eat为0"><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#263444;font-size:18px}.s{font-size:15px;fill:#586a7b}.b{font-weight:700}.blue{fill:#245e99}.green{fill:#26775e}.red{fill:#a44242}.mono{font-family:Menlo,monospace;font-size:16px}.rule{stroke:#d9e1ea;stroke-width:1.2}.arr{stroke:#245e99;stroke-width:1.8;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245e99"/></marker></defs><rect width="900" height="346" fill="#fff"/>
<text x="22" y="28" class="b">公开训练题 seed=850000：96 次世界动作，库存容量 1</text>
<line x1="20" y1="43" x2="880" y2="43" class="rule"/>
<text x="22" y="72" class="b blue">dish_1</text><text x="131" y="72">red apple / orange bell pepper：roasted + sliced（烤制、切片）</text><text x="131" y="99">olive oil / water：raw + uncut（保持原状）</text>
<text x="22" y="134" class="b blue">dish_2</text><text x="131" y="134">carrot / purple potato：roasted + sliced</text><text x="131" y="161">salt / flour：raw + uncut</text>
<line x1="20" y1="178" x2="880" y2="178" class="rule"/>
<text x="22" y="206" class="b">每种食材：</text><text x="148" y="206">collected=true；deleted=false；处理集合与配方完全一致</text>
<text x="22" y="234" class="b">每道菜：</text><text x="148" y="234">meal_prepared=true 且 meal_eaten=true；两道全部完成才得 1</text>
<line x1="20" y1="251" x2="880" y2="251" class="rule"/>
<text x="22" y="279" class="b green">25 次：全完成 → 1</text><text x="420" y="279" class="b red">24 次：只漏 eat dish_2 → 0</text><text x="22" y="309" class="s">这是本文导入官方环境的 CPU 重放。两名 worker 顺序执行，不是 SERA 模型日志。</text><text x="22" y="333" class="s">省略最后吃菜，仍可继续操作；task_failure=false，但当前整题未成功。</text></svg>
