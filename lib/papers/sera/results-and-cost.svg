<svg xmlns="http://www.w3.org/2000/svg" width="900" height="352" viewBox="0 0 900 352" role="img"><title>RT 的作用依赖执行奖励</title><defs><style>text{font:18px Arial,'PingFang SC',sans-serif;fill:#24292f}.h{font-size:22px;font-weight:700}.s{font-size:16px;fill:#59636f}.b{fill:#245e99;font-weight:700}.a{fill:none;stroke:#245e99;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#245e99"/></marker></defs><rect width="900" height="352" fill="white"/><text x="20" y="34" class="h">RT 的作用依赖执行奖励</text><text x="20" y="65" class="s">TextWorld 成功率 % · 三个 seeds 均值 · 根据 Tables 1、2、7 重绘</text><text x="20" y="116">二元奖励</text><rect x="152" y="100" width="218.106" height="22" fill="#9aa9b5"/><text x="378.106" y="117">51.93</text><text x="20" y="153">二元 + RT</text><rect x="152" y="137" width="191.60399999999998" height="22" fill="#bd6a62"/><text x="351.604" y="154">45.62</text><text x="20" y="190">rubric 奖励</text><rect x="152" y="174" width="214.62" height="22" fill="#9aa9b5"/><text x="374.62" y="191">51.10</text><text x="20" y="227">rubric + RT</text><rect x="152" y="211" width="253.092" height="22" fill="#4482b2"/><text x="413.092" y="228">60.26</text><text x="20" y="264">再加 D</text><rect x="152" y="248" width="273.294" height="22" fill="#245e99"/><text x="433.294" y="265">65.07</text><path d="M535 87V280" stroke="#dce2e8"/><text x="558" y="113" class="b">TextCraft：加 D 略降</text><text x="558" y="146">74.84% → 74.31%</text><text x="558" y="194" class="b">TextWorld：标签少，训练久</text><text x="558" y="227">外部 judge：147.80K → 35.79K</text><text x="558" y="260">时间：13h08 → 24h14</text><text x="20" y="325" class="s">相同16张H200；RT训练rubric，D额外训练委派。调用标签减少不等于总成本下降。</text></svg>
