<svg xmlns="http://www.w3.org/2000/svg" width="600" height="960" viewBox="0 0 600 960" role="img" aria-labelledby="title desc"><title id="title">SERA 关键对照与成本</title><desc id="desc">TextWorld 二元执行奖励加RT由51.93降到45.62，rubric奖励加RT由51.10升到60.26，再加D到65.07。TextCraft加D略降。TextWorld外部标签减少但训练时间增加。</desc><defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#24292f;font-size:28px}.title{font-size:32px;font-weight:700}.label{font-size:29px;font-weight:700}.sub{font-size:25px;fill:#536171}.blue{fill:#245e99}.red{fill:#a84b47}.box{fill:#fff;stroke:#dce2e8;stroke-width:2}</style></defs><rect width="600" height="960" fill="#fff"/><text x="28" y="48" class="title">哪项对照真正检验了方法？</text><text x="28" y="87" class="sub">Tables 1、2、7 · 成功率是三种子均值</text><rect x="28" y="122" width="544" height="195" class="box"/><text x="48" y="163" class="label">TextWorld · 二元执行奖励</text><text x="48" y="208">RAO 51.93% → 加 RT 45.62%</text><text x="48" y="254" class="red">评价训练单独加入，会退步</text><text x="48" y="294" class="sub">RT：训练模型自己生成的评分标准</text><rect x="28" y="347" width="544" height="195" class="box"/><text x="48" y="388" class="label">TextWorld · rubric 执行奖励</text><text x="48" y="433">51.10% → 加 RT 60.26%</text><text x="48" y="479" class="blue">再加 D → 完整 SERA 65.07%</text><text x="48" y="519" class="sub">D：按叶节点覆盖率训练委派</text><rect x="28" y="572" width="544" height="143" class="box"/><text x="48" y="613" class="label">TextCraft 并非每项组件都增益</text><text x="48" y="658">不加 D 74.84% → 加 D 74.31%</text><text x="48" y="697" class="sub">完整模型第二名；不应称所有设置第一</text><rect x="28" y="745" width="544" height="172" fill="#f4f7fa" stroke="#dce2e8"/><text x="48" y="786" class="label">TextWorld：标签少，时间却更长</text><text x="48" y="831">外部 judge：147.80K → 35.79K</text><text x="48" y="875">训练用时：13h08 → 24h14</text><text x="48" y="908" class="sub">相同 16 张 H200；不代表总成本下降</text></svg>
