<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="同一子任务上对成功失败分数做配对排序，教学分数示例"><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#263444;font-size:18px}.s{font-size:15px;fill:#586a7b}.b{font-weight:700}.blue{fill:#245e99}.green{fill:#26775e}.red{fill:#a44242}.mono{font-family:Menlo,monospace;font-size:16px}.rule{stroke:#d9e1ea;stroke-width:1.2}.arr{stroke:#245e99;stroke-width:1.8;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245e99"/></marker></defs><rect width="900" height="290" fill="#fff"/>
<text x="22" y="29" class="b">同一委派起点 → B=8 条独立候选 → 同一份 rubric 评分</text>
<rect x="21" y="53" width="276" height="130" fill="#f4f8ff" stroke="#d9e1ea"/><text x="35" y="79" class="b blue">外部标签与模型分数分开</text><text x="35" y="106" class="green">真实成功：s = .8、.4</text><text x="35" y="133" class="red">真实失败：s = .3、.7</text><text x="35" y="160" class="s">假设数据；模型可能排错</text>
<path d="M297 113H329" class="arr"/>
<text x="349" y="77" class="b">四个成功 × 失败配对</text><text x="349" y="105" class="mono">(.8,.3) → max(0,.2−.8+.3) = 0</text><text x="349" y="132" class="mono">(.8,.7) → .1    (.4,.3) → .1</text><text x="349" y="159" class="mono">(.4,.7) → .5</text><text x="349" y="185" class="b blue">Lrank = (0+.1+.1+.5)/4 = .175</text>
<line x1="20" y1="204" x2="880" y2="204" class="rule"/><text x="22" y="232">奖励 = −.175，供 RT 更新“写这份 rubric”的输出。</text><text x="22" y="258" class="s">第 0 条候选提交给父节点，另 7 条仅作训练；全成功 / 全失败的组跳过。</text><text x="22" y="282" class="s">分数分散可以很大但排序仍错；配对损失检验的是与真实成败一致的顺序。</text></svg>
