<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 317" role="img" aria-label="GLM控制的数据与实验循环，以及Qwen监督微调的模型更新边界"><title>GLM控制的数据与实验循环，以及Qwen监督微调的模型更新边界</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#326e9c"/></marker></defs><rect width="900" height="317" fill="white"/><g font-family="PingFang SC,Arial,sans-serif"><text x="18" y="28" font-size="23" fill="#172535">自动化后训练：GLM 组织研究，Qwen 接受 SFT 更新</text><rect x="18" y="62" width="198" height="120" rx="3" fill="#edf3f6" stroke="#c8d2d7"/><text x="29" y="92" font-size="19" fill="#326e9c">Qwen 当前模型</text><text x="29" y="129" font-size="17" fill="#172535">在八项任务上评测</text><text x="29" y="159" font-size="16" fill="#172535">发现失败与能力缺口</text><path d="M217,121L235,121" stroke="#326e9c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="238" y="62" width="198" height="120" rx="3" fill="#edf3f6" stroke="#c8d2d7"/><text x="249" y="92" font-size="19" fill="#326e9c">固定 GLM-5.3</text><text x="249" y="129" font-size="17" fill="#172535">调整任务与数据配方</text><text x="249" y="159" font-size="16" fill="#172535">生成、修复教师轨迹</text><path d="M437,121L455,121" stroke="#326e9c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="458" y="62" width="198" height="120" rx="3" fill="#edf3f6" stroke="#c8d2d7"/><text x="469" y="92" font-size="19" fill="#326e9c">验证与过滤</text><text x="469" y="129" font-size="17" fill="#172535">检查约束和近重复</text><text x="469" y="159" font-size="16" fill="#172535">保留训练用演示</text><path d="M657,121L675,121" stroke="#326e9c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="678" y="62" width="198" height="120" rx="3" fill="#edf3f6" stroke="#c8d2d7"/><text x="689" y="92" font-size="19" fill="#326e9c">监督微调 Qwen</text><text x="689" y="129" font-size="17" fill="#172535">按演示训练模型</text><text x="689" y="159" font-size="16" fill="#172535">新 checkpoint 再评测</text><path d="M790,194L111,194" stroke="#326e9c" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="190" y="224" font-size="18" fill="#172535">下一轮依据评测反馈修改数据；这是研究控制循环，不是 RL 损失。</text><text x="20" y="263" font-size="19" fill="#172535">R0、R1 各自从 base 训练；R2–R5 才接续上一 checkpoint。</text><text x="20" y="294" font-size="18" fill="#172535">评测分数用于选数据，论文未报告 GRPO、OPD、logits / KL 蒸馏。</text></g></svg>