<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 282" role="img" aria-label="人修改共享资源后，旧版本候选被拒绝，Main重新审阅与提交"><title>人修改共享资源后，旧版本候选被拒绝，Main重新审阅与提交</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#326e9c"/></marker></defs><rect width="900" height="282" fill="white"/><g font-family="PingFang SC,Arial,sans-serif"><text x="18" y="28" font-size="23" fill="#172535">共享资源：先检查版本，再接纳修改</text><rect x="18" y="60" width="198" height="124" rx="3" fill="#edf3f6" stroke="#c8d2d7"/><text x="30" y="90" font-size="19" fill="#326e9c">Agent 读到 v2</text><text x="30" y="128" font-size="17" fill="#172535">以 v2 生成候选</text><text x="30" y="159" font-size="16" fill="#172535">baseRevision = 2</text><path d="M217,120L235,120" stroke="#326e9c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="238" y="60" width="198" height="124" rx="3" fill="#edf3f6" stroke="#c8d2d7"/><text x="250" y="90" font-size="19" fill="#326e9c">人保存露台修改</text><text x="250" y="128" font-size="17" fill="#172535">当前资源成为 v3</text><text x="250" y="159" font-size="16" fill="#172535">currentRevision = 3</text><path d="M437,120L455,120" stroke="#326e9c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="458" y="60" width="198" height="124" rx="3" fill="#edf3f6" stroke="#c8d2d7"/><text x="470" y="90" font-size="19" fill="#326e9c">提交发生冲突</text><text x="470" y="128" font-size="17" fill="#172535">2 ≠ 3，拒绝覆盖</text><text x="470" y="159" font-size="16" fill="#172535">候选保留，重新读取</text><path d="M657,120L675,120" stroke="#326e9c" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="678" y="60" width="198" height="124" rx="3" fill="#edf3f6" stroke="#c8d2d7"/><text x="690" y="90" font-size="19" fill="#326e9c">Main 接纳新候选</text><text x="690" y="128" font-size="17" fill="#172535">在 v3 上补遮阴等</text><text x="690" y="159" font-size="16" fill="#172535">成功保存为 v4</text><text x="20" y="222" font-size="19" fill="#172535">版本一致只是允许提交的条件；结果是否满足用户目标仍由 Main 判断。</text><text x="20" y="258" font-size="18" fill="#172535">保证适用于接入资源协议的写路径；外部 Blender 等保留自身保存语义。</text></g></svg>