<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1022" viewBox="0 0 1050 1022" role="img" aria-labelledby="title"><title id="title">从一包失败记录，到一次补丁模型更新</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="1022" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">从一包失败记录，到一次补丁模型更新</tspan></text><text x="38" y="116.69999999999999" fill="#465363" font-size="25" font-weight="400"><tspan x="38" dy="0">做任务的模型始终冻结；写补丁的模型接受训练。</tspan></text><rect x="38" y="153.2" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="181.2" r="18" fill="#245e99"/><text x="69" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">原 Agent 先执行任务</tspan></text><text x="60" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">缓存完整批次的轨迹与环境得分；程</tspan><tspan x="60" dy="35.5">序提取失败题的要求、动作和反馈，</tspan><tspan x="60" dy="35.5">再说明 hook 接口。</tspan></text><rect x="549" y="153.2" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="181.2" r="18" fill="#245e99"/><text x="580" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">补丁模型生成 8 个候选</tspan></text><text x="571" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">每个候选只修改四个预留调用位置：</tspan><tspan x="571" dy="35.5">任务开始、决策前、动作前、环境反</tspan><tspan x="571" dy="35.5">馈后。</tspan></text><path d="M507 254.62h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 254.62h16v115.42H21v127.42h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="394.03999999999996" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="422.03999999999996" r="18" fill="#245e99"/><text x="69" y="429.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="428.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">分别安装，重跑整批题</tspan></text><text x="60" y="474.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">原来成功的题也要重跑，才能看出修</tspan><tspan x="60" dy="35.5">改是否修好了失败、又破坏了旧成功。</tspan></text><rect x="549" y="394.03999999999996" width="463" height="202.84" rx="6" fill="#fbf3f2" stroke="#dce2e8"/><circle cx="580" cy="422.03999999999996" r="18" fill="#a64b47"/><text x="580" y="429.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="428.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">无效候选归零</tspan></text><text x="571" y="474.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">语法错误、没有实际干预或评测不完</tspan><tspan x="571" dy="35.5">整，候选奖励均为 0。有效但退化的</tspan><tspan x="571" dy="35.5">补丁可以得负奖励。</tspan></text><path d="M507 495.46h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 495.46h16v115.42H21v127.42h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="634.88" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="662.88" r="18" fill="#245e99"/><text x="69" y="669.88" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">5</text><text x="107" y="668.88" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">计算每题环境奖励差</tspan></text><text x="60" y="715.22" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">先算修补后减修补前，再对完整批次</tspan><tspan x="60" dy="35.5">平均。WebShop 用连续匹配分，不是</tspan><tspan x="60" dy="35.5">完整成功率。</tspan></text><rect x="549" y="634.88" width="463" height="202.84" rx="6" fill="#f1f7f5" stroke="#dce2e8"/><circle cx="580" cy="662.88" r="18" fill="#317e6a"/><text x="580" y="669.88" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">6</text><text x="618" y="668.88" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">只更新写补丁的模型</tspan></text><text x="571" y="715.22" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">比较 8 个候选的相对好坏，用 GRPO</tspan><tspan x="571" dy="35.5">更新工程师。负责做任务的模型参数</tspan><tspan x="571" dy="35.5">不动。</tspan></text><path d="M507 736.3h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="875.72" width="974" height="68.5" fill="#fff" stroke="#dce2e8"/><path d="M38 875.72v68.5" stroke="#a96238" stroke-width="5"/><text x="55" y="901.72" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">DBBench v1 只允许提示与拦截：补丁不能直接改 SQL，或强制提交数据库操作。</tspan></text><path d="M38 961.22h974" stroke="#dce2e8"/><text x="38" y="986.22" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 Figure 2、Algorithm 1 与 Appendix C 重绘。</tspan></text></g></svg>
