<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="762" viewBox="0 0 1050 762" role="img" aria-labelledby="title"><title id="title">主结果与迁移结果，分母要分开</title><rect width="1050" height="762" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="66" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">主结果与迁移结果，分母要分开</tspan></text><text x="38" y="116.69999999999999" fill="#465363" font-size="25" font-weight="400"><tspan x="38" dy="0">主榜：WebShop 500、ALFWorld 500、DBBench 300 题，三项成功率等权平均。</tspan></text><rect x="38" y="152.2" width="315" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="52" y="179.2" fill="#24292f" font-size="25" font-weight="700"><tspan x="52" dy="0">比较设置</tspan></text><rect x="353" y="152.2" width="310" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="367" y="179.2" fill="#24292f" font-size="25" font-weight="700"><tspan x="367" dy="0">结果</tspan></text><rect x="663" y="152.2" width="349" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="677" y="179.2" fill="#24292f" font-size="25" font-weight="700"><tspan x="677" dy="0">能说明什么</tspan></text><rect x="38" y="208.7" width="315" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="52" y="235.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">未微调任务模型</tspan></text><rect x="353" y="208.7" width="310" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="367" y="235.7" fill="#465363" font-size="25" font-weight="400"><tspan x="367" dy="0">44.3% → 53.6%</tspan></text><rect x="663" y="208.7" width="349" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="677" y="235.7" fill="#465363" font-size="25" font-weight="400"><tspan x="677" dy="0">单次任务执行，增加 9.3 个</tspan><tspan x="677" dy="35.5">百分点</tspan></text><rect x="38" y="295.7" width="315" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="322.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">任务模型先 SFT</tspan></text><rect x="353" y="295.7" width="310" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="367" y="322.7" fill="#465363" font-size="25" font-weight="400"><tspan x="367" dy="0">59.2% → 64.2%</tspan></text><rect x="663" y="295.7" width="349" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="677" y="322.7" fill="#465363" font-size="25" font-weight="400"><tspan x="677" dy="0">模型训练与外部程序修补可</tspan><tspan x="677" dy="35.5">叠加</tspan></text><rect x="38" y="382.7" width="315" height="87" fill="#f8fafb" stroke="#dce2e8"/><text x="52" y="409.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">20 个未见任务模型</tspan></text><rect x="353" y="382.7" width="310" height="87" fill="#f8fafb" stroke="#dce2e8"/><text x="367" y="409.7" fill="#465363" font-size="25" font-weight="400"><tspan x="367" dy="0">平均 +7.06 个百分点</tspan></text><rect x="663" y="382.7" width="349" height="87" fill="#f8fafb" stroke="#dce2e8"/><text x="677" y="409.7" fill="#465363" font-size="25" font-weight="400"><tspan x="677" dy="0">换模型后重新生成补丁，不</tspan><tspan x="677" dy="35.5">是迁移同一补丁</tspan></text><rect x="38" y="469.7" width="315" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="496.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">1,270 个未见任务</tspan></text><rect x="353" y="469.7" width="310" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="367" y="496.7" fill="#465363" font-size="25" font-weight="400"><tspan x="367" dy="0">+8.9 ± 1.5 个百分点</tspan></text><rect x="663" y="469.7" width="349" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="677" y="496.7" fill="#465363" font-size="25" font-weight="400"><tspan x="677" dy="0">1,270 题合并；± 为三种子</tspan><tspan x="677" dy="35.5">标准差</tspan></text><rect x="38" y="580.7" width="974" height="105" fill="#fff" stroke="#dce2e8"/><path d="M38 580.7v105" stroke="#a96238" stroke-width="5"/><text x="55" y="607.7" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">不能把 1,300 题直接混为一个平均。Reflection 行允许两次尝试，其他行单次；</tspan><tspan 