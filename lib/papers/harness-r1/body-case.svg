<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="781" viewBox="0 0 1050 781" role="img" aria-labelledby="title"><title id="title">WebShop batch 008：漏选颜色后提前购买</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="781" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">WebShop batch 008：漏选颜色后提前购买</tspan></text><text x="38" y="116.69999999999999" fill="#465363" font-size="25" font-weight="400"><tspan x="38" dy="0">真实任务要求 black brown 的 synthetic hairpiece，价格低于 $40。</tspan></text><rect x="38" y="153.2" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="181.2" r="18" fill="#245e99"/><text x="69" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">原 Agent 提前 Buy Now</tspan></text><text x="60" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">商品合适，但没有选择 black brown</tspan><tspan x="60" dy="35.5">颜色；环境只给 0.667 部分奖励。</tspan></text><rect x="549" y="153.2" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="181.2" r="18" fill="#245e99"/><text x="580" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">补丁检查价格和选项</tspan></text><text x="571" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">on_before_action 在购买前检查预</tspan><tspan x="571" dy="35.5">算与必需选项；未选颜色时拦截购买。</tspan></text><path d="M507 236.87h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 236.87h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="358.53999999999996" width="463" height="202.84" rx="6" fill="#f1f7f5" stroke="#dce2e8"/><circle cx="69" cy="386.53999999999996" r="18" fill="#317e6a"/><text x="69" y="393.53999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="392.53999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">同题重跑，先选颜色</tspan></text><text x="60" y="438.87999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">Agent 读到提示，选择 black</tspan><tspan x="60" dy="35.5">brown 再购买；这次环境奖励为 1.0。</tspan></text><rect x="549" y="358.53999999999996" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="386.53999999999996" r="18" fill="#245e99"/><text x="580" y="393.53999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="392.53999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">整批十题一起算奖励</tspan></text><text x="571" y="438.87999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">连续奖励均值：0.682 → 0.768。完</tspan><tspan x="571" dy="35.5">整成功数：2/10 → 5/10，旧成功两</tspan><tspan x="571" dy="35.5">题均保留。</tspan></text><path d="M507 459.96h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="599.38" width="974" height="104" fill="#fff" stroke="#dce2e8"/><path d="M38 599.38v104" stroke="#a96238" stroke-width="5"/><text x="55" y="625.38" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">训练奖励 = 0.768−0.682 = 0.086；完整成功率差 = 5/10−2/10 = 0.3。两者</tspan><tspan x="55" dy="35.5">不可互换，0.667 的逐属性评分分解未公开。</tspan></text><path d="M38 720.38h974" stroke="#dce2e8"/><text x="38" y="745.38" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 Appendix H.1 / Table H.1 重绘；数值来自公开评测记录。</tspan></text></g></svg>
