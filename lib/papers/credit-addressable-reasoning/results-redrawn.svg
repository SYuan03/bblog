<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">CE-GRPO 的九项 benchmark 结果</title>
  <desc id="desc">比较 Qwen3-VL-8B、Code-CoT SFT、trajectory-level GRPO 和 CE-GRPO 在九项几何 benchmark 上的准确率。</desc>
  <rect width="1200" height="650" fill="#fbfaf7"/>
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#17212b}.s{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#66707a}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.h{font-size:29px;font-weight:760}.p{font-size:15px}.v{font-size:15px;font-weight:700}</style>
  <text x="52" y="55" class="t h">CE-GRPO 的优势集中在“中间决策会影响很久”的任务</text>
  <text x="52" y="86" class="s p">准确率（%）；根据原论文 Table 2 数据重绘。每列独立看，整体 Avg. 是九项无权平均。</text>

  <g transform="translate(52,130)">
    <text x="0" y="0" class="s p">Benchmark</text><text x="310" y="0" class="s p">Native</text><text x="430" y="0" class="s p">SFT</text><text x="550" y="0" class="s p">Traj. GRPO</text><text x="710" y="0" class="s p">CE-GRPO</text><text x="930" y="0" class="s p">CE − Traj.</text>
    <g transform="translate(0,28)">
      <text x="0" y="18" class="t p">MathVerse</text><rect x="310" y="3" width="170" height="20" fill="#e8ecef"/><rect x="310" y="3" width="97" height="20" fill="#97a6b3"/><text x="489" y="19" class="m v">56.85</text><text x="430" y="19" class="m v">55.08</text><text x="550" y="19" class="m v">61.85</text><text x="710" y="19" class="m v" fill="#28796d">62.44</text><text x="930" y="19" class="m v" fill="#28796d">+0.59</text>
    </g>
    <g transform="translate(0,72)"><text x="0" y="18" class="t p">VisOnlyQA-Syn</text><text x="310" y="19" class="m v">51.13</text><text x="430" y="19" class="m v">62.89</text><text x="550" y="19" class="m v">64.19</text><text x="710" y="19" class="m v" fill="#b45f32">63.47</text><text x="930" y="19" class="m v" fill="#b45f32">−0.72</text></g>
    <g transform="translate(0,116)"><text x="0" y="18" class="t p">VisOnlyQA-Real</text><text x="310" y="19" class="m v">63.73</text><text x="430" y="19" class="m v">70.85</text><text x="550" y="19" class="m v">71.86</text><text x="710" y="19" class="m v" fill="#28796d">74.24</text><text x="930" y="19" class="m v" fill="#28796d">+2.38</text></g>
    <g transform="translate(0,160)"><text x="0" y="18" class="t p">MathVista-GPS</text><text x="310" y="19" class="m v">83.19</text><text x="430" y="19" class="m v">81.48</text><text x="550" y="19" class="m v">86.11</text><text x="710" y="19" class="m v" fill="#28796d">86.57</text><text x="930" y="19" class="m v" fill="#28796d">+0.46</text></g>
    <g transform="translate(0,204)"><text x="0" y="18" class="t p">Geometry3K</text><text x="310" y="19" class="m v">64.52</text><text x="430" y="19" class="m v">53.31</text><text x="550" y="19" class="m v">70.29</text><text x="710" y="19" class="m v" fill="#b45f32">67.40</text><text x="930" y="19" class="m v" fill="#b45f32">−2.89</text></g>
    <g transform="translate(0,248)"><text x="0" y="18" class="t p">PGPS9K</text><text x="310" y="19" class="m v">59.60</text><text x="430" y="19" class="m v">52.10</text><text x="550" y="19" class="m v">66.30</text><text x="710" y="19" class="m v" fill="#28796d">66.90</text><text x="930" y="19" class="m v" fill="#28796d">+0.60</text></g>
    <g transform="translate(0,292)"><text x="0" y="18" class="t p">GeoQA</text><text x="310" y="19" class="m v">83.16</text><text x="430" y="19" class="m v">87.53</text><text x="550" y="19" class="m v">86.60</text><text x="710" y="19" class="m v" fill="#28796d">92.44</text><text x="930" y="19" class="m v" fill="#28796d">+5.84</text></g>
    <g transform="translate(0,336)"><rect x="-12" y="-4" width="1065" height="34" fill="#fff1e7"/><text x="0" y="18" class="t p">GeoLaux-mini</text><text x="310" y="19" class="m v">77.27</text><text x="430" y="19" class="m v">84.24</text><text x="550" y="19" class="m v">75.45</text><text x="710" y="19" class="m v" fill="#28796d">90.61</text><text x="930" y="19" class="m v" fill="#28796d">+15.16</text></g>
    <g transform="translate(0,380)"><rect x="-12" y="-4" width="1065" height="34" fill="#fff1e7"/><text x="0" y="18" class="t p">MM-Math</text><text x="310" y="19" class="m v">72.10</text><text x="430" y="19" class="m v">78.51</text><text x="550" y="19" class="m v">70.88</text><text x="710" y="19" class="m v" fill="#28796d">80.32</text><text x="930" y="19" class="m v" fill="#28796d">+9.44</text></g>
    <line x1="0" y1="430" x2="1060" y2="430" stroke="#c9d0d6"/>
    <text x="0" y="464" class="t v">九项无权平均</text><text x="310" y="464" class="m v">67.95</text><text x="430" y="464" class="m v">69.55</text><text x="550" y="464" class="m v">72.61</text><text x="710" y="464" class="m v" fill="#28796d">76.04</text><text x="930" y="464" class="m v" fill="#28796d">+3.43</text>
  </g>
  <rect x="52" y="603" width="1096" height="29" fill="#eef2f5"/>
  <text x="64" y="623" class="s p">注意：主表没有重复运行的误差条；CE-GRPO 与不同 baseline 的 rollout 数、硬件和可训练参数也不完全一致。</text>
</svg>
