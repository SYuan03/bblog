<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1469" viewBox="0 0 600 1469" role="img" aria-labelledby="title desc"><title id="title">等腰三角形：D不是中点，AD不是高</title><desc id="desc">根据 Figure 5、Appendix C.1 重绘 分支文句为说明，不是原始生成日志</desc><rect width="600" height="1469" fill="#fff"/><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:32px;font-weight:750}.label{font-size:28px;font-weight:750}.main{font-size:28px}.small{font-size:24px}.value{font-size:32px;font-weight:750}</style><text x="24" y="66" class="title" fill="#20252d" text-anchor="start">等腰三角形：</text>
<text x="24" y="108" class="title" fill="#20252d" text-anchor="start">D不是中点，AD不是高</text>
<text x="24" y="152" class="small" fill="#596575" text-anchor="start">根据 Figure 5、Appendix C.1 重绘</text>
<text x="24" y="190" class="small" fill="#596575" text-anchor="start">分支文句为说明，不是原始生成日志</text>
<path d="M24 200H576" stroke="#d7dee7" stroke-width="2"/>
<path d="M300 278L96 608H504Z" fill="#f7f9fc" stroke="#365f85" stroke-width="3"/><path d="M300 278L178 608" stroke="#8c4646" stroke-width="3"/>
<text x="300" y="263" class="label" fill="#20252d" text-anchor="middle">A</text>
<text x="80" y="643" class="label" fill="#20252d" text-anchor="start">B</text>
<text x="173" y="643" class="label" fill="#8c4646" text-anchor="start">D</text>
<text x="515" y="643" class="label" fill="#20252d" text-anchor="start">C</text>
<text x="142" y="428" class="main" fill="#20252d" text-anchor="start">13</text>
<text x="427" y="428" class="main" fill="#20252d" text-anchor="start">13</text>
<text x="131" y="595" class="main" fill="#20252d" text-anchor="start">2</text>
<text x="342" y="595" class="main" fill="#20252d" text-anchor="start">8</text>
<rect x="24" y="678" width="552" height="153" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="717" class="label" fill="#365f85" text-anchor="start">相同题设</text>
<text x="43" y="761" class="main" fill="#20252d" text-anchor="start">AB=AC=13，BC=10，BD=2。</text>
<text x="43" y="800" class="main" fill="#20252d" text-anchor="start">求顶点到D的线段AD。</text>
<path d="M300 856v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="892" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="931" class="label" fill="#8c4646" text-anchor="start">错误：把AD当成高</text>
<text x="43" y="975" class="main" fill="#20252d" text-anchor="start">假设AD垂直BC，按半底边5算：</text>
<text x="43" y="1014" class="main" fill="#20252d" text-anchor="start">AD=√(13²−5²)=12。</text>
<text x="43" y="1053" class="main" fill="#20252d" text-anchor="start">运算正确，前提没有依据。</text>
<path d="M300 1109v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="1145" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="1184" class="label" fill="#357067" text-anchor="start">正确：保留D的实际位置</text>
<text x="43" y="1228" class="main" fill="#20252d" text-anchor="start">D距中点3，高为12。</text>
<text x="43" y="1267" class="main" fill="#20252d" text-anchor="start">AD=√(12²+3²)=3√17。</text>
<text x="43" y="1306" class="main" fill="#20252d" text-anchor="start">等价于原文所用Stewart关系。</text>
<text x="24" y="1397" class="small" fill="#596575" text-anchor="start">两条后续共享此前内容，最终分不同，</text>
<text x="24" y="1435" class="small" fill="#596575" text-anchor="start">才形成组内优势；不是人工逐步标注。</text></svg>
