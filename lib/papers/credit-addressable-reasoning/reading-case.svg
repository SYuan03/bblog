<svg xmlns="http://www.w3.org/2000/svg" width="900" height="364" viewBox="0 0 900 364" role="img" aria-labelledby="title desc">
<title id="title">等腰三角形中错误的中点假设与正确的 Stewart 推导</title>
<desc id="desc">AB 和 AC 等于 13，BC 等于 10，BD 等于 2。把 AD 当作高会得到 12；保留 D 的真实位置，用 Stewart 定理得到 AD 等于 3 根号 17。</desc>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0.5" y="0.5" width="899" height="363" fill="#fff" stroke="#cbd6de" stroke-width="1"/>
<text x="28" y="42" font-size="25" font-weight="760" fill="#25313b" text-anchor="start">等腰三角形：D 不是中点，AD 也不是高</text>
<text x="28" y="68" font-size="15.2" font-weight="400" fill="#536270" text-anchor="start">Figure 5 的两个后续共享此前题设；分歧始于如何处理 D 的位置。</text>
<rect x="28" y="89" width="261" height="221" fill="#fff" stroke="#cbd6de" stroke-width="1"/>
<line x1="157" y1="110" x2="56" y2="274" stroke="#245f93" stroke-width="2"/>
<line x1="157" y1="110" x2="260" y2="274" stroke="#245f93" stroke-width="2"/>
<line x1="56" y1="274" x2="260" y2="274" stroke="#245f93" stroke-width="2"/>
<line x1="157" y1="110" x2="97" y2="274" stroke="#267564" stroke-width="3"/>
<line x1="157" y1="110" x2="158" y2="274" stroke="#aa4441" stroke-width="2" stroke-dasharray="6 5"/>
<text x="157" y="102" font-size="14" font-weight="700" fill="#25313b" text-anchor="start">A</text>
<text x="46" y="294" font-size="14" font-weight="700" fill="#25313b" text-anchor="start">B</text>
<text x="266" y="294" font-size="14" font-weight="700" fill="#25313b" text-anchor="start">C</text>
<text x="93" y="294" font-size="14" font-weight="700" fill="#25313b" text-anchor="start">D</text>
<text x="154" y="294" font-size="14" font-weight="700" fill="#aa4441" text-anchor="start">中点</text>
<text x="41" y="106" font-size="14.5" font-weight="700" fill="#245f93" text-anchor="start">AB = AC = 13</text>
<text x="75" y="306" font-size="14" font-weight="400" fill="#536270" text-anchor="start">BC = 10；BD = 2</text>
<rect x="306" y="89" width="266" height="221" fill="#fff7f5" stroke="#cbd6de" stroke-width="1"/>
<rect x="306" y="89" width="4" height="221" fill="#aa4441" stroke="none" stroke-width="1"/>
<text x="322" y="120" font-size="16.4" font-weight="700" fill="#25313b" text-anchor="start">错误后续 · 假定 AD 垂直</text>
<text x="322" y="148" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">把 D 当成底边中点</text>
<text x="322" y="172" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">按半底边 5 求高：</text>
<text x="322" y="196" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">√(13² − 5²) = 12</text>
<text x="322" y="220" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">计算正确，前提无依据</text>
<rect x="588" y="89" width="284" height="221" fill="#f3faf7" stroke="#cbd6de" stroke-width="1"/>
<rect x="588" y="89" width="4" height="221" fill="#267564" stroke="none" stroke-width="1"/>
<text x="604" y="120" font-size="16.4" font-weight="700" fill="#25313b" text-anchor="start">正确后续 · 保留 BD=2</text>
<text x="604" y="148" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">DC = 8；用 Stewart 定理</text>
<text x="604" y="172" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">13²×8 + 13²×2</text>
<text x="604" y="196" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">= 10(AD² + 2×8)</text>
<text x="604" y="220" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">AD = 3√17 ≈ 12.369</text>
<text x="28" y="339" font-size="14.3" font-weight="400" fill="#536270" text-anchor="start">12 的相对误差约 2.986%（超过 1% 容差）；原文 R=−1 还涉及未公开的检查与惩罚。</text>
</g>
</svg>
