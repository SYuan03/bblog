<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
<title id="title">CE-GRPO 九项平均准确率与两正两负结果</title>
<desc id="desc">CE-GRPO 九项无权平均 76.04，比整条回答级 GRPO 的 72.61 高 3.43 个百分点；GeoLaux-mini 和 MM-Math 增益较大，VisOnlyQA-Syn 和 Geometry3K 下降。</desc>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0.5" y="0.5" width="899" height="319" fill="#fff" stroke="#cbd6de" stroke-width="1"/>
<text x="28" y="42" font-size="25" font-weight="760" fill="#25313b" text-anchor="start">九项平均提高 3.43 点，不代表每项都提高</text>
<text x="28" y="69" font-size="15.2" font-weight="400" fill="#536270" text-anchor="start">每项准确率等权平均；主表未给重复训练方差。</text>
<rect x="28" y="88" width="844" height="67" fill="#f4f8fb" stroke="#cbd6de" stroke-width="1"/>
<text x="44" y="116" font-size="16" font-weight="700" fill="#536270" text-anchor="start">Trajectory GRPO</text>
<text x="44" y="142" font-size="24" font-weight="760" fill="#536270" text-anchor="start">72.61</text>
<text x="381" y="133" font-size="25" font-weight="700" fill="#245f93" text-anchor="start">→</text>
<text x="451" y="116" font-size="16" font-weight="700" fill="#245f93" text-anchor="start">CE-GRPO</text>
<text x="451" y="142" font-size="24" font-weight="760" fill="#245f93" text-anchor="start">76.04</text>
<text x="675" y="135" font-size="21" font-weight="760" fill="#267564" text-anchor="start">+3.43 pp</text>
<rect x="28" y="170" width="410" height="107" fill="#f3faf7" stroke="#cbd6de" stroke-width="1"/>
<rect x="28" y="170" width="4" height="107" fill="#267564" stroke="none" stroke-width="1"/>
<text x="44" y="201" font-size="17" font-weight="700" fill="#25313b" text-anchor="start">提升较大的两项</text>
<text x="44" y="229" font-size="15.2" font-weight="400" fill="#536270" text-anchor="start">GeoLaux-mini：+15.16 pp</text>
<text x="44" y="252" font-size="15.2" font-weight="400" fill="#536270" text-anchor="start">MM-Math：+9.44 pp</text>
<rect x="452" y="170" width="420" height="107" fill="#fff7f5" stroke="#cbd6de" stroke-width="1"/>
<rect x="452" y="170" width="4" height="107" fill="#aa4441" stroke="none" stroke-width="1"/>
<text x="468" y="201" font-size="17" font-weight="700" fill="#25313b" text-anchor="start">下降的两项</text>
<text x="468" y="229" font-size="15.2" font-weight="400" fill="#536270" text-anchor="start">VisOnlyQA-Syn：−0.72 pp</text>
<text x="468" y="252" font-size="15.2" font-weight="400" fill="#536270" text-anchor="start">Geometry3K：−2.89 pp</text>
<text x="28" y="303" font-size="14.3" font-weight="400" fill="#536270" text-anchor="start">不同方法的训练硬件与每组采样数不同；不能把分差直接换算成样本效率。</text>
</g>
</svg>
