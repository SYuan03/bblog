<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1198" viewBox="0 0 600 1198" role="img" aria-labelledby="title desc"><title id="title">长依赖题增益更大，普通题并非都提高</title><desc id="desc">根据 Table 2 重绘 九项accuracy无权平均，单位为pp</desc><rect width="600" height="1198" fill="#fff"/><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:32px;font-weight:750}.label{font-size:28px;font-weight:750}.main{font-size:28px}.small{font-size:24px}.value{font-size:32px;font-weight:750}</style><text x="24" y="66" class="title" fill="#20252d" text-anchor="start">长依赖题增益更大，</text>
<text x="24" y="108" class="title" fill="#20252d" text-anchor="start">普通题并非都提高</text>
<text x="24" y="152" class="small" fill="#596575" text-anchor="start">根据 Table 2 重绘</text>
<text x="24" y="190" class="small" fill="#596575" text-anchor="start">九项accuracy无权平均，单位为pp</text>
<path d="M24 200H576" stroke="#d7dee7" stroke-width="2"/>
<text x="24" y="261" class="label" fill="#20252d" text-anchor="start">九项平均准确率</text>
<text x="24" y="302" class="main" fill="#20252d" text-anchor="start">Trajectory GRPO</text>
<text x="576" y="302" class="value" fill="#7e8997" text-anchor="end">72.61</text>
<rect x="24" y="320" width="552" height="12" fill="#e6ebf1"/><rect x="24" y="320" width="400.8072" height="12" fill="#7e8997"/>
<text x="24" y="386" class="main" fill="#20252d" text-anchor="start">CE-GRPO</text>
<text x="576" y="386" class="value" fill="#365f85" text-anchor="end">76.04</text>
<rect x="24" y="404" width="552" height="12" fill="#e6ebf1"/><rect x="24" y="404" width="419.74080000000004" height="12" fill="#365f85"/>
<rect x="24" y="446" width="552" height="153" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="485" class="label" fill="#357067" text-anchor="start">相对trajectory GRPO的增益</text>
<text x="43" y="529" class="main" fill="#20252d" text-anchor="start">GeoLaux-mini：+15.16 pp。</text>
<text x="43" y="568" class="main" fill="#20252d" text-anchor="start">MM-Math：+9.44 pp。</text>
<path d="M300 624v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="660" width="552" height="153" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="699" class="label" fill="#8c4646" text-anchor="start">下降的两项</text>
<text x="43" y="743" class="main" fill="#20252d" text-anchor="start">VisOnlyQA-Syn：−0.72 pp。</text>
<text x="43" y="782" class="main" fill="#20252d" text-anchor="start">Geometry3K：−2.89 pp。</text>
<path d="M300 838v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="874" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="913" class="label" fill="#365f85" text-anchor="start">结果能支持的边界</text>
<text x="43" y="957" class="main" fill="#20252d" text-anchor="start">76.04不是按样本数加权。</text>
<text x="43" y="996" class="main" fill="#20252d" text-anchor="start">没有重复运行方差；</text>
<text x="43" y="1035" class="main" fill="#20252d" text-anchor="start">对照也未完全等计算预算。</text>
<text x="24" y="1126" class="small" fill="#596575" text-anchor="start">单次调用更方便，不表示每项都胜过</text>
<text x="24" y="1164" class="small" fill="#596575" text-anchor="start">专门识图+推理的两阶段系统。</text></svg>
