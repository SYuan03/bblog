<svg xmlns="http://www.w3.org/2000/svg" width="360" height="533" viewBox="0 0 360 533" role="img" aria-labelledby="title desc">
<title id="title">等腰三角形案例，手机排版</title>
<desc id="desc">AB=AC=13，BC=10，BD=2。错误分支无依据地把 AD 当成高，得到 12；正确分支保留 D 的位置，用 Stewart 定理得到 3 根号 17。</desc>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0.5" y="0.5" width="359" height="532" fill="#fff" stroke="#cbd6de" stroke-width="1"/>
<text x="17" y="31" font-size="19" font-weight="760" fill="#25313b" text-anchor="start">等腰三角形：D 不是中点</text>
<text x="17" y="56" font-size="19" font-weight="760" fill="#25313b" text-anchor="start">AD 也不是高</text>
<text x="17" y="78" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">AB=AC=13 · BC=10 · BD=2</text>
<line x1="178" y1="102" x2="62" y2="226" stroke="#245f93" stroke-width="2"/>
<line x1="178" y1="102" x2="302" y2="226" stroke="#245f93" stroke-width="2"/>
<line x1="62" y1="226" x2="302" y2="226" stroke="#245f93" stroke-width="2"/>
<line x1="178" y1="102" x2="110" y2="226" stroke="#267564" stroke-width="3"/>
<line x1="178" y1="102" x2="182" y2="226" stroke="#aa4441" stroke-width="2" stroke-dasharray="5 5"/>
<text x="173" y="96" font-size="13.4" font-weight="700" fill="#25313b" text-anchor="start">A</text>
<text x="49" y="246" font-size="13.4" font-weight="700" fill="#25313b" text-anchor="start">B</text>
<text x="307" y="246" font-size="13.4" font-weight="700" fill="#25313b" text-anchor="start">C</text>
<text x="105" y="246" font-size="13.4" font-weight="700" fill="#267564" text-anchor="start">D</text>
<text x="177" y="246" font-size="13.4" font-weight="700" fill="#aa4441" text-anchor="start">中点</text>
<rect x="17" y="264" width="326" height="92" fill="#fff7f5" stroke="#cbd6de" stroke-width="1"/>
<rect x="17" y="264" width="4" height="92" fill="#aa4441" stroke="none" stroke-width="1"/>
<text x="33" y="295" font-size="15.7" font-weight="700" fill="#25313b" text-anchor="start">错误：把 AD 当成高</text>
<text x="33" y="323" font-size="13.3" font-weight="400" fill="#536270" text-anchor="start">假定 D 是中点：√(13²−5²)=12</text>
<text x="33" y="342" font-size="13.3" font-weight="400" fill="#536270" text-anchor="start">运算正确，前提没有依据</text>
<rect x="17" y="367" width="326" height="92" fill="#f3faf7" stroke="#cbd6de" stroke-width="1"/>
<rect x="17" y="367" width="4" height="92" fill="#267564" stroke="none" stroke-width="1"/>
<text x="33" y="398" font-size="15.7" font-weight="700" fill="#25313b" text-anchor="start">正确：保留 BD=2、DC=8</text>
<text x="33" y="426" font-size="13.3" font-weight="400" fill="#536270" text-anchor="start">Stewart：AD²=153</text>
<text x="33" y="445" font-size="13.3" font-weight="400" fill="#536270" text-anchor="start">AD=3√17≈12.369</text>
<rect x="17" y="470" width="326" height="49" fill="#f7f9fb" stroke="#cbd6de" stroke-width="1"/>
<text x="27" y="491" font-size="12.8" font-weight="400" fill="#536270" text-anchor="start">12 相对误差 2.986%，超过 1% 容差。</text>
<text x="27" y="509" font-size="12.8" font-weight="400" fill="#536270" text-anchor="start">论文 R=−1 还取决于未公开惩罚。</text>
</g>
</svg>
