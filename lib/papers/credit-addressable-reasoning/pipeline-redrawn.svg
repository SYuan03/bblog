<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Code-CoT 与 CE-GRPO 的训练流程</title>
  <desc id="desc">先监督微调，再从初始模型固定采集 3270 个事件前缀。强化学习将普通问题与共享前缀问题按 1:1 混合；前缀不进损失，重采事件和全部后续 token 一起训练。</desc>
  <rect width="1200" height="680" fill="#fff"/>
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#17212b}.s{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#59636e}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.box{fill:#fff;stroke:#cfd6dc;stroke-width:2}.arrow{stroke:#6b7785;stroke-width:2.5;fill:none;marker-end:url(#a)}.tag{font-size:18px;font-weight:700}.small{font-size:16px}.head{font-size:28px;font-weight:760}.num{font-size:18px;font-weight:800;fill:#fff}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7785"/></marker></defs>
  <text x="54" y="58" class="t head">完整几何步骤的起点，也用作训练重新生成的起点</text>
  <text x="54" y="90" class="s small">根据 Figure 3 与 Sections 4.1-4.4 重绘：先做 SFT，再固定采前缀；RL 重采完整后续，推理只生成一次回答。</text>

  <rect x="52" y="132" width="202" height="205" rx="6" class="box"/>
  <circle cx="78" cy="158" r="17" fill="#2c6fa3"/><text x="72" y="165" class="t num">1</text>
  <text x="105" y="165" class="t tag">SFT 教会格式</text>
  <text x="72" y="205" class="s small">18,302 条合成记录</text>
  <text x="72" y="237" class="s small">Gemini：原图 → 代码 C</text>
  <text x="72" y="266" class="s small">DeepSeek：Q、C、答案</text>
  <text x="72" y="295" class="s small">学生：只看原图与问题</text>
  <text x="72" y="324" class="s small">学习生成整条 Code-CoT</text>

  <path d="M254 235 H295" class="arrow"/>
  <rect x="300" y="132" width="202" height="205" rx="6" class="box"/>
  <circle cx="326" cy="158" r="17" fill="#28796d"/><text x="320" y="165" class="t num">2</text>
  <text x="353" y="165" class="t tag">初始模型采样</text>
  <text x="320" y="205" class="s small">2,000 题，每题两条回答</text>
  <text x="320" y="234" class="s small">代码 + 计划 + 操作步骤</text>
  <line x1="326" y1="270" x2="474" y2="270" stroke="#d7dce1" stroke-width="5"/>
  <circle cx="342" cy="270" r="9" fill="#2c6fa3"/>
  <circle cx="386" cy="270" r="9" fill="#28796d"/>
  <circle cx="430" cy="270" r="9" fill="#b45f32"/>
  <circle cx="474" cy="270" r="9" fill="#6d5aa7"/>
  <text x="320" y="316" class="s small">完整 think/action 块是 event</text>

  <path d="M502 235 H543" class="arrow"/>
  <rect x="548" y="132" width="202" height="205" rx="6" class="box"/>
  <circle cx="574" cy="158" r="17" fill="#b45f32"/><text x="568" y="165" class="t num">3</text>
  <text x="601" y="165" class="t tag">筛选并固定起点</text>
  <text x="568" y="205" class="s small">完整标签定起点</text>
  <text x="568" y="235" class="s small">同类 entropy 排优先级</text>
  <text x="568" y="264" class="s small">3,270 个 prefix 全程固定</text>
  <rect x="568" y="289" width="162" height="29" fill="#f7eee8" stroke="#e3b89e"/>
  <text x="583" y="309" class="s small" fill="#8e4527">从事件起点重采</text>

  <path d="M750 235 H791" class="arrow"/>
  <rect x="796" y="132" width="352" height="205" rx="6" class="box"/>
  <circle cx="822" cy="158" r="17" fill="#6d5aa7"/><text x="816" y="165" class="t num">4</text>
  <text x="849" y="165" class="t tag">同一 prefix，重采四条完整后续</text>
  <text x="816" y="194" class="s small">同一图、问题、已有前缀；示例 G = 4</text>
  <line x1="825" y1="247" x2="884" y2="247" stroke="#6d5aa7" stroke-width="6"/>
  <path d="M884 247 L930 218 M884 247 L930 242 M884 247 L930 266 M884 247 L930 290" stroke="#6d5aa7" stroke-width="2" fill="none"/>
  <rect x="938" y="204" width="178" height="25" fill="#eaf5ef"/><text x="950" y="222" class="s small">答对，操作全有效：1.3</text>
  <rect x="938" y="228" width="178" height="25" fill="#eaf5ef"/><text x="950" y="246" class="s small">答对，操作全有效：1.3</text>
  <rect x="938" y="252" width="178" height="25" fill="#f3f1fb"/><text x="950" y="270" class="s small">答错，操作全有效：0.3</text>
  <rect x="938" y="276" width="178" height="25" fill="#f3f1fb"/><text x="950" y="294" class="s small">答错，操作全有效：0.3</text>
  <text x="816" y="326" class="s small">均无惩罚；成绩有差异才计为关键 event</text>

  <path d="M972 337 V382" class="arrow"/>
  <rect x="548" y="390" width="600" height="204" rx="6" class="box"/>
  <circle cx="574" cy="416" r="17" fill="#c04d4a"/><text x="568" y="423" class="t num">5</text>
  <text x="601" y="423" class="t tag">11,450 普通题 + 11,450 前缀行，1:1 混合训练</text>
  <rect x="574" y="462" width="235" height="82" fill="#edf4f8" stroke="#b8d0df"/>
  <text x="593" y="489" class="t tag">从原题生成</text>
  <text x="593" y="520" class="s small">整条回答共用一个 advantage</text>
  <rect x="838" y="462" width="282" height="82" fill="#f4eff9" stroke="#cfbde0"/>
  <text x="857" y="489" class="t tag">从固定 prefix 生成</text>
  <text x="857" y="514" class="s small">prefix 不进 loss；新 event</text>
  <text x="857" y="537" class="s small">与全部 future 共用 advantage</text>
  <text x="574" y="577" class="s small">推理阶段只生成一次完整回答；贪心解码，不调用外部几何求解器。</text>

  <rect x="52" y="390" width="450" height="204" rx="6" fill="#fff8ea" stroke="#e4c991" stroke-width="2"/>
  <text x="72" y="425" class="t tag">“credit-addressable”具体指什么？</text>
  <text x="72" y="466" class="s small">Event 是完整几何步骤；prefix 是它之前的内容。</text>
  <text x="72" y="498" class="s small">Future 是从此步骤重新生成到最终答案的全部后续。</text>
  <text x="72" y="548" class="s small">Credit assignment 用终局成绩决定鼓励哪些生成。</text>
  <text x="72" y="578" class="s small">每条 future 共用一个相对成绩，不给 event 单独打分。</text>

  <text x="54" y="646" class="s small">来源：Guo et al., arXiv:2608.30457v1，Figure 3、Equations 3-7、Appendix A.4-A.5；本图为结构重绘。</text>
</svg>
