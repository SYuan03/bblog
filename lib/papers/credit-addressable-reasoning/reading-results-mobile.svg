<svg xmlns="http://www.w3.org/2000/svg" width="360" height="406" viewBox="0 0 360 406" role="img" aria-labelledby="title desc">
<title id="title">CE-GRPO 九项平均与两正两负结果，手机排版</title>
<desc id="desc">CE-GRPO 九项无权平均 76.04，比整条回答级 GRPO 高 3.43 个百分点；两项几何任务提升较大，两项任务略降。</desc>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0.5" y="0.5" width="359" height="405" fill="#fff" stroke="#cbd6de" stroke-width="1"/>
<text x="17" y="31" font-size="20" font-weight="760" fill="#25313b" text-anchor="start">九项平均 +3.43 点，</text>
<text x="17" y="56" font-size="20" font-weight="760" fill="#25313b" text-anchor="start">但有两项下降</text>
<text x="17" y="77" font-size="12.9" font-weight="400" fill="#536270" text-anchor="start">每项准确率等权；未给重复训练方差。</text>
<rect x="17" y="94" width="326" height="58" fill="#f4f8fb" stroke="#cbd6de" stroke-width="1"/>
<text x="27" y="116" font-size="12.9" font-weight="700" fill="#536270" text-anchor="start">Trajectory GRPO</text>
<text x="27" y="139" font-size="20" font-weight="760" fill="#536270" text-anchor="start">72.61</text>
<text x="144" y="137" font-size="20" font-weight="700" fill="#245f93" text-anchor="start">→</text>
<text x="181" y="116" font-size="12.9" font-weight="700" fill="#245f93" text-anchor="start">CE-GRPO</text>
<text x="181" y="139" font-size="20" font-weight="760" fill="#245f93" text-anchor="start">76.04</text>
<rect x="17" y="166" width="326" height="91" fill="#f3faf7" stroke="#cbd6de" stroke-width="1"/>
<rect x="17" y="166" width="4" height="91" fill="#267564" stroke="none" stroke-width="1"/>
<text x="33" y="197" font-size="15.7" font-weight="700" fill="#25313b" text-anchor="start">提升较大</text>
<text x="33" y="225" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">GeoLaux-mini +15.16 pp</text>
<text x="33" y="244" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">MM-Math +9.44 pp</text>
<rect x="17" y="270" width="326" height="91" fill="#fff7f5" stroke="#cbd6de" stroke-width="1"/>
<rect x="17" y="270" width="4" height="91" fill="#aa4441" stroke="none" stroke-width="1"/>
<text x="33" y="301" font-size="15.7" font-weight="700" fill="#25313b" text-anchor="start">有所下降</text>
<text x="33" y="329" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">VisOnlyQA-Syn −0.72 pp</text>
<text x="33" y="348" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">Geometry3K −2.89 pp</text>
<text x="17" y="388" font-size="13" font-weight="400" fill="#536270" text-anchor="start">硬件与采样数不同，无法比较训练效率。</text>
</g>
</svg>
