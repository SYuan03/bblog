<svg xmlns="http://www.w3.org/2000/svg" width="900" height="354" viewBox="0 0 900 354" role="img" aria-labelledby="title desc">
<title id="title">CE-GRPO 从完整步骤边界重采后续</title>
<desc id="desc">先让模型学会生成带标签的 Code-CoT 回答，再固定步骤前文，从同一位置生成四条完整后续并比较最终得分；前文不进入这组损失。</desc>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0.5" y="0.5" width="899" height="353" fill="#fff" stroke="#cbd6de" stroke-width="1"/>
<text x="28" y="42" font-size="25" font-weight="760" fill="#25313b" text-anchor="start">固定同一前文，比较四条完整后续</text>
<text x="28" y="69" font-size="15.5" font-weight="400" fill="#536270" text-anchor="start">完整 event 的标签给出分支边界；同类步骤熵帮助选择位置。</text>
<rect x="28" y="91" width="257" height="168" fill="#f4f8fb" stroke="#cbd6de" stroke-width="1"/>
<rect x="28" y="91" width="4" height="168" fill="#245f93" stroke="none" stroke-width="1"/>
<text x="44" y="122" font-size="18" font-weight="700" fill="#25313b" text-anchor="start">1 · 生成 Code-CoT</text>
<text x="44" y="150" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">原图 + 问题 → 识图代码、计划</text>
<text x="44" y="172" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">再写 think / action，直到答案</text>
<text x="44" y="194" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">SFT 学会这种输出格式</text>
<rect x="299" y="91" width="272" height="168" fill="#f7f8fb" stroke="#cbd6de" stroke-width="1"/>
<rect x="299" y="91" width="4" height="168" fill="#245f93" stroke="none" stroke-width="1"/>
<text x="315" y="122" font-size="18" font-weight="700" fill="#25313b" text-anchor="start">2 · 选步骤，冻结前文</text>
<text x="315" y="150" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">解析完整 event 的起点</text>
<text x="315" y="172" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">同类型熵排序；保留随机探索</text>
<text x="315" y="194" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">3,270 个 prefix 在 RL 前固定</text>
<rect x="585" y="91" width="287" height="168" fill="#f3faf7" stroke="#cbd6de" stroke-width="1"/>
<rect x="585" y="91" width="4" height="168" fill="#267564" stroke="none" stroke-width="1"/>
<text x="601" y="122" font-size="18" font-weight="700" fill="#25313b" text-anchor="start">3 · 重采到最终答案</text>
<text x="601" y="150" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">同一 prefix 生成 4 条后续</text>
<text x="601" y="172" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">每条重写候选步骤与后面内容</text>
<text x="601" y="194" font-size="14.8" font-weight="400" fill="#536270" text-anchor="start">最终 reward 在组内相对比较</text>
<text x="292" y="186" font-size="20" font-weight="700" fill="#245f93" text-anchor="middle">→</text>
<text x="578" y="186" font-size="20" font-weight="700" fill="#267564" text-anchor="middle">→</text>
<rect x="28" y="276" width="844" height="53" fill="#f5f9fc" stroke="#cbd6de" stroke-width="1"/>
<text x="42" y="298" font-size="15" font-weight="700" fill="#245f93" text-anchor="start">例：[1.3, 1.3, 0.3, 0.3] → 相对优势约 [+1, +1, −1, −1]</text>
<text x="42" y="319" font-size="14.3" font-weight="400" fill="#536270" text-anchor="start">只给重采步骤和全部后续算损失；共享前文作为输入，不在这组中更新。</text>
</g>
</svg>
