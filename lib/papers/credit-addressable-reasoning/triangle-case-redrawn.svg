<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">等腰三角形 case 中 CE-GRPO 的分支</title>
  <desc id="desc">AB 和 AC 等于 13，BC 等于 10，BD 等于 2。错误分支把从顶点到边上 D 的线段 AD 当成高，正确分支按实际位置计算得到三倍根号十七。图中的 prefix 文句是说明性概括，不是原始日志。</desc>
  <rect width="1100" height="620" fill="#fff"/>
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#17212b}.s{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#5b6570}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.h{font-size:28px;font-weight:760}.b{font-size:19px;font-weight:700}.p{font-size:16px}.box{fill:#fff;stroke:#ccd4db;stroke-width:2}</style>
  <text x="50" y="55" class="t h">已知题设相同；把 AD 错当成高，就会算出不同答案</text>
  <text x="50" y="86" class="s p">根据 Figure 5 与 Appendix C.1 重绘。Prefix 是所选步骤之前的已有内容；下方文句仅作示意。</text>
  <rect x="48" y="118" width="335" height="390" rx="6" class="box"/>
  <text x="70" y="153" class="t b">已知状态</text>
  <line x1="211" y1="202" x2="96" y2="420" stroke="#253746" stroke-width="4"/>
  <line x1="211" y1="202" x2="325" y2="420" stroke="#253746" stroke-width="4"/>
  <line x1="96" y1="420" x2="325" y2="420" stroke="#253746" stroke-width="4"/>
  <line x1="211" y1="202" x2="142" y2="420" stroke="#c04d4a" stroke-width="4"/>
  <circle cx="211" cy="202" r="6" fill="#17212b"/><circle cx="96" cy="420" r="6" fill="#17212b"/><circle cx="325" cy="420" r="6" fill="#17212b"/><circle cx="142" cy="420" r="6" fill="#c04d4a"/>
  <text x="202" y="189" class="t b">A</text><text x="76" y="448" class="t b">B</text><text x="328" y="448" class="t b">C</text><text x="136" y="448" class="t b">D</text>
  <text x="83" y="270" class="s p">AB = 13</text><text x="283" y="270" class="s p">AC = 13</text><text x="201" y="449" class="s p">BC = 10</text><text x="70" y="467" class="s p">BD = 2</text>
  <text x="70" y="492" class="s p">前缀概括：已知题设，接下来求 AD</text>

  <path d="M383 310 H450" stroke="#6b7785" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7785"/></marker></defs>

  <rect x="460" y="118" width="590" height="175" rx="6" fill="#faeceb" stroke="#dfaaa7" stroke-width="2"/>
  <text x="482" y="153" class="t b" fill="#9a3937">错误分支：任意顶点到边的连线，都当成高</text>
  <text x="482" y="190" class="s p">假设 AD ⟂ BC，于是把 AD 当成高：</text>
  <text x="482" y="226" class="m b">AD = √(13² − 5²) = 12</text>
  <text x="482" y="262" class="t p">最终答案错误，这条完整后续得到较低分。</text>

  <rect x="460" y="333" width="590" height="175" rx="6" fill="#eaf5ef" stroke="#9cc7b2" stroke-width="2"/>
  <text x="482" y="368" class="t b" fill="#216959">正确分支：保留 D 的真实位置</text>
  <text x="482" y="398" class="s p">BD = 2、DC = 8；Stewart 定理把两侧边与 AD 联成：</text>
  <text x="482" y="441" class="m b">13²·8 + 13²·2 = 10(AD² + 16)</text>
  <text x="482" y="477" class="m b">AD = √153 = 3√17</text>

  <rect x="48" y="536" width="1002" height="50" fill="#eef2f5"/>
  <text x="67" y="568" class="t p">前缀不进训练 loss；重新生成的判断和全部后续 token 共用这条后续的 advantage（相对同组平均成绩）。</text>
  <text x="50" y="608" class="s p">来源：Figure 5 / Appendix C.1。几何与答案按原文重绘；没有公开完整分支日志，不能当作作者具体生成文本。</text>
</svg>
