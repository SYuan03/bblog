<svg xmlns="http://www.w3.org/2000/svg" width="360" height="531" viewBox="0 0 360 531" role="img" aria-labelledby="title desc">
<title id="title">CE-GRPO 从完整步骤边界重采后续，手机排版</title>
<desc id="desc">模型生成带标签的 Code-CoT，训练器选择完整步骤并冻结前文，从同一位置生成四条后续；最终得分用于更新新生成内容。</desc>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0.5" y="0.5" width="359" height="530" fill="#fff" stroke="#cbd6de" stroke-width="1"/>
<text x="17" y="31" font-size="20" font-weight="760" fill="#25313b" text-anchor="start">固定同一前文，比较</text>
<text x="17" y="56" font-size="20" font-weight="760" fill="#25313b" text-anchor="start">四条完整后续</text>
<text x="17" y="78" font-size="13.2" font-weight="400" fill="#536270" text-anchor="start">event 标签给出步骤边界。</text>
<rect x="17" y="95" width="326" height="113" fill="#f4f8fb" stroke="#cbd6de" stroke-width="1"/>
<rect x="17" y="95" width="4" height="113" fill="#245f93" stroke="none" stroke-width="1"/>
<text x="33" y="126" font-size="16" font-weight="700" fill="#25313b" text-anchor="start">1 · 生成 Code-CoT</text>
<text x="33" y="154" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">原图 + 问题 → 识图代码、计划</text>
<text x="33" y="173" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">think / action → 最终答案</text>
<rect x="17" y="219" width="326" height="113" fill="#f7f8fb" stroke="#cbd6de" stroke-width="1"/>
<rect x="17" y="219" width="4" height="113" fill="#245f93" stroke="none" stroke-width="1"/>
<text x="33" y="250" font-size="16" font-weight="700" fill="#25313b" text-anchor="start">2 · 选步骤，冻结前文</text>
<text x="33" y="278" font-size="13.2" font-weight="400" fill="#536270" text-anchor="start">找完整 event 起点；按同类型熵排序</text>
<text x="33" y="297" font-size="13.2" font-weight="400" fill="#536270" text-anchor="start">3,270 个 prefix 在 RL 前固定</text>
<rect x="17" y="343" width="326" height="113" fill="#f3faf7" stroke="#cbd6de" stroke-width="1"/>
<rect x="17" y="343" width="4" height="113" fill="#267564" stroke="none" stroke-width="1"/>
<text x="33" y="374" font-size="16" font-weight="700" fill="#25313b" text-anchor="start">3 · 从这里重采四条</text>
<text x="33" y="402" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">每条重写候选步骤直到答案</text>
<text x="33" y="421" font-size="13.4" font-weight="400" fill="#536270" text-anchor="start">比较最终分，更新新生成内容</text>
<rect x="17" y="468" width="326" height="49" fill="#f5f9fc" stroke="#cbd6de" stroke-width="1"/>
<text x="27" y="489" font-size="13.5" font-weight="700" fill="#245f93" text-anchor="start">得分 1.3 / 1.3 / 0.3 / 0.3</text>
<text x="27" y="507" font-size="13.5" font-weight="700" fill="#245f93" text-anchor="start">相对优势约 +1 / +1 / −1 / −1</text>
</g>
</svg>
