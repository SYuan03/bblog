<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 321" role="img" aria-label="接续轨迹中旧失败前缀只做上下文，修复输出参与SFT损失"><title>接续轨迹中旧失败前缀只做上下文，修复输出参与SFT损失</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#326e9c"/></marker></defs><rect width="900" height="321" fill="white"/><g font-family="PingFang SC,Arial,sans-serif"><text x="18" y="30" font-size="22" fill="#172535">接续样本：失败历史仍可见，学习目标从修复部分开始</text><rect x="18" y="68" width="273" height="126" fill="#f4eee8" stroke="#c8d2d7"/><text x="31" y="99" font-size="20" fill="#326e9c">旧模型的失败历史</text><text x="31" y="133" font-size="16" fill="#172535">消息 + 工具调用 + 结果</text><text x="31" y="167" font-size="17" fill="#172535">保留为上下文</text><rect x="311" y="68" width="273" height="126" fill="#eaf2f7" stroke="#c8d2d7"/><text x="324" y="99" font-size="20" fill="#326e9c">接续模型的修复</text><text x="324" y="133" font-size="16" fill="#172535">改实现 → 再检查 → 提交</text><text x="324" y="167" font-size="17" fill="#172535">监督 resumed portion</text><rect x="604" y="68" width="273" height="126" fill="#eef3ee" stroke="#c8d2d7"/><text x="617" y="99" font-size="20" fill="#326e9c">工具返回的观测</text><text x="617" y="133" font-size="16" fill="#172535">错误、文件内容、图片</text><text x="617" y="167" font-size="17" fill="#172535">提供上下文，不当答案</text><text x="18" y="236" font-size="24" fill="#326e9c">L = − Σ mₜ log pθ(yₜ | context, y&lt;t)</text><text x="18" y="271" font-size="17" fill="#172535">mₜ 只选需要监督的输出；旧失败前缀 mₜ = 0。公式是本文对 SFT 的说明。</text><text x="18" y="302" font-size="17" fill="#172535">最终验证通过，仍可保留修复段内部的错误与改正；通过不等于每步都正确。</text></g></svg>