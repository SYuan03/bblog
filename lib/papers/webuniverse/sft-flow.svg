<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 301" role="img" aria-label="任务采集到轨迹监督微调，验证分数用于筛选和修复，未报告RL参数更新"><title>任务采集到轨迹监督微调，验证分数用于筛选和修复，未报告RL参数更新</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#326e9c"/></marker></defs><rect width="900" height="301" fill="white"/><g font-family="PingFang SC,Arial,sans-serif"><text x="18" y="30" font-size="22" fill="#172535">验证发生在数据采集阶段；梯度来自保留下来的模型输出</text><rect x="18" y="61" width="199" height="117" fill="#eef4f7" stroke="#c8d2d7"/><text x="30" y="91" font-size="19" fill="#326e9c">任务与工作区</text><text x="30" y="125" font-size="16" fill="#172535">文字 / 截图 / 文件</text><text x="30" y="153" font-size="16" fill="#172535">作者构建</text><path d="M218,118L234,118" fill="none" stroke="#326e9c" stroke-width="2" marker-end="url(#a)"/><rect x="238" y="61" width="199" height="117" fill="#eef4f7" stroke="#c8d2d7"/><text x="250" y="91" font-size="19" fill="#326e9c">教师模型 + OpenCode</text><text x="250" y="125" font-size="16" fill="#172535">写代码、运行、检查</text><text x="250" y="153" font-size="16" fill="#172535">失败时继续修复</text><path d="M438,118L454,118" fill="none" stroke="#326e9c" stroke-width="2" marker-end="url(#a)"/><rect x="458" y="61" width="199" height="117" fill="#eef4f7" stroke="#c8d2d7"/><text x="470" y="91" font-size="19" fill="#326e9c">验证与筛选</text><text x="470" y="125" font-size="16" fill="#172535">功能全部通过</text><text x="470" y="153" font-size="16" fill="#172535">视觉每项 ≥ 0.75</text><path d="M658,118L674,118" fill="none" stroke="#326e9c" stroke-width="2" marker-end="url(#a)"/><rect x="678" y="61" width="199" height="117" fill="#eef4f7" stroke="#c8d2d7"/><text x="690" y="91" font-size="19" fill="#326e9c">轨迹 SFT</text><text x="690" y="125" font-size="16" fill="#172535">监督 assistant 输出</text><text x="690" y="153" font-size="16" fill="#172535">更新 Qwen 参数</text><rect x="18" y="206" width="862" height="76" fill="#f2f6ef" stroke="#c8d2d7"/><text x="31" y="235" font-size="19" fill="#2f745c">验证记录 / 分数 → 选择样本、提供失败反馈</text><text x="31" y="264" font-size="17" fill="#172535">论文未报告：奖励加权策略损失、优势估计、PPO / GRPO 或在线 RL 更新。</text></g></svg>