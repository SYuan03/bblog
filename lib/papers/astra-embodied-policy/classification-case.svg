<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">真实分类任务：类别、篮子和判定</title>
<desc id="desc">汽车到左篮，手表到中篮，木制玩具到右篮。几何检查物体参考点投影在篮内并符合高度，最终还要双臂归位。Hybrid794步通过，Direct1100步失败，获得40分。</desc>
