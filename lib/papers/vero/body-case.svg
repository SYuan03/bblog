<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="816" viewBox="0 0 1050 816" role="img" aria-labelledby="title"><title id="title">Terminal 实例：异常减少，旧成功也可能丢失</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="816" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">Terminal 实例：异常减少，旧成功也可能丢失</tspan></text><text x="38" y="116.69999999999999" fill="#465363" font-size="25" font-weight="400"><tspan x="38" dy="0">原版本共 89 题：27 PASS、41 异常、21 无异常但零分。</tspan></text><rect x="38" y="153.2" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="181.2" r="18" fill="#245e99"/><text x="69" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">Tools · B=89 样本</tspan></text><text x="60" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">先检查 tool-call 是否为 dict。</tspan><tspan x="60" dy="35.5">AttributeError 从 11 降到 0，</tspan><tspan x="60" dy="35.5">通过数为 30/89。</tspan></text><rect x="549" y="153.2" width="463" height="202.84" rx="6" fill="#fbf3f2" stroke="#dce2e8"/><circle cx="580" cy="181.2" r="18" fill="#a64b47"/><text x="580" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">Filesystem · B=178</tspan></text><text x="571" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">异常减少，通过仍是 27/89；新成功</tspan><tspan x="571" dy="35.5">6 题，同时丢失 6 个原成功。</tspan></text><path d="M507 254.62h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 254.62h16v115.42H21v127.42h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="394.03999999999996" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="422.03999999999996" r="18" fill="#245e99"/><text x="69" y="429.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="428.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">Tools · B=178 样本</tspan></text><text x="60" y="474.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">主要压缩上下文，仍有</tspan><tspan x="60" dy="35.5">AttributeError；通过数提高到</tspan><tspan x="60" dy="35.5">33/89。</tspan></text><rect x="549" y="394.03999999999996" width="463" height="202.84" rx="6" fill="#f1f7f5" stroke="#dce2e8"/><circle cx="580" cy="422.03999999999996" r="18" fill="#317e6a"/><text x="580" y="429.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="428.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">拆开新增与退化</tspan></text><text x="571" y="474.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">最佳版本：保留 21 题 + 新成功 12</tspan><tspan x="571" dy="35.5">题 = 33/89 ≈ 37.1%。</tspan></text><path d="M507 495.46h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="634.88" width="974" height="104" fill="#fff" stroke="#dce2e8"/><path d="M38 634.88v104" stroke="#a96238" stroke-width="5"/><text x="55" y="660.88" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">净增加 = (12−6)/89 ≈ 6.7 个百分点。少 11 个异常不能自动换成多 11 个</tspan><tspan x="55" dy="35.5">PASS。每个配置只做一次搜索。</tspan></text><path d="M38 755.88h974" stroke="#dce2e8"/><text x="38" y="780.88" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 v4 Appendix A.4 与 Table 18 的真实分类重绘。</tspan></text></g></svg>
