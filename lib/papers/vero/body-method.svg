<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="787" viewBox="0 0 1050 787" role="img" aria-labelledby="title"><title id="title">VeRO：每个候选都留下可比较的版本与结果</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="787" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">VeRO：每个候选都留下可比较的版本与结果</tspan></text><rect x="38" y="115.69999999999999" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="143.7" r="18" fill="#245e99"/><text x="69" y="150.7" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="149.7" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">隔离一个代码版本</tspan></text><text x="60" y="196.04" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">用独立 Git worktree 保存候选源</tspan><tspan x="60" dy="35.5">码，避免修改相互污染。</tspan></text><rect x="549" y="115.69999999999999" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="143.7" r="18" fill="#245e99"/><text x="580" y="150.7" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="149.7" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">优化模型修改允许内容</tspan></text><text x="571" y="196.04" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">可改提示、工具或代码；接口范围由</tspan><tspan x="571" dy="35.5">实验设置决定。</tspan></text><path d="M507 199.37h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 199.37h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="321.03999999999996" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="349.03999999999996" r="18" fill="#245e99"/><text x="69" y="356.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="355.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">执行评测并扣额度</tspan></text><text x="60" y="401.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">主实验按评测调用计费；Terminal</tspan><tspan x="60" dy="35.5">扩展按任务样本扣额度。</tspan></text><rect x="549" y="321.03999999999996" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="349.03999999999996" r="18" fill="#245e99"/><text x="580" y="356.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="355.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">写回逐题反馈</tspan></text><text x="571" y="401.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">记录 commit、分数、每题结果和运</tspan><tspan x="571" dy="35.5">行异常。</tspan></text><path d="M507 404.71h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 404.71h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="526.38" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="554.38" r="18" fill="#245e99"/><text x="69" y="561.38" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">5</text><text x="107" y="560.38" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">继续修改或回滚</tspan></text><text x="60" y="606.72" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">优化模型按反馈选版本，再提出候选。</tspan></text><rect x="549" y="526.38" width="463" height="167.34" rx="6" fill="#f1f7f5" stroke="#dce2e8"/><circle cx="580" cy="554.38" r="18" fill="#317e6a"/><text x="580" y="561.38" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">6</text><text x="618" y="560.38" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">最终检查任务成功</tspan></text><text x="571" y="606.72" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">提交最佳版本，仍由原任务 checker</tspan><tspan x="571" dy="35.5">判分；没有报错不等于任务成功。</tspan></text><path d="M507 610.05h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M38 726.72h974" stroke="#dce2e8"/><text x="38" y="751.72" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 v4 §3–4 的平台执行流程重绘。</tspan></text></g></svg>
