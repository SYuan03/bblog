<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="654" viewBox="0 0 1050 654" role="img" aria-labelledby="title"><title id="title">主实验最优分，与 Terminal 任务通过率分开</title><rect width="1050" height="654" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="66" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">主实验最优分，与 Terminal 任务通过率分开</tspan></text><rect x="38" y="114.69999999999999" width="310" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="52" y="141.7" fill="#24292f" font-size="25" font-weight="700"><tspan x="52" dy="0">设置</tspan></text><rect x="348" y="114.69999999999999" width="255" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="362" y="141.7" fill="#24292f" font-size="25" font-weight="700"><tspan x="362" dy="0">结果</tspan></text><rect x="603" y="114.69999999999999" width="409" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="617" y="141.7" fill="#24292f" font-size="25" font-weight="700"><tspan x="617" dy="0">预算与统计</tspan></text><rect x="38" y="171.2" width="310" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="52" y="198.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">VeRO-Agent 主实验</tspan></text><rect x="348" y="171.2" width="255" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="362" y="198.2" fill="#465363" font-size="25" font-weight="400"><tspan x="362" dy="0">平均最优分 0.61</tspan></text><rect x="603" y="171.2" width="409" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="617" y="198.2" fill="#465363" font-size="25" font-weight="400"><tspan x="617" dy="0">五项任务 × 三次搜索，各取最优</tspan><tspan x="617" dy="35.5">后平均</tspan></text><rect x="38" y="258.2" width="310" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="285.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">GEPA / Resources</tspan></text><rect x="348" y="258.2" width="255" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="362" y="285.2" fill="#465363" font-size="25" font-weight="400"><tspan x="362" dy="0">平均约 0.54</tspan></text><rect x="603" y="258.2" width="409" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="617" y="285.2" fill="#465363" font-size="25" font-weight="400"><tspan x="617" dy="0">同组实验中的比较基线</tspan></text><rect x="38" y="309.7" width="310" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="52" y="336.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">主实验额度</tspan></text><rect x="348" y="309.7" width="255" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="362" y="336.7" fill="#465363" font-size="25" font-weight="400"><tspan x="362" dy="0">B = 8 次评测调用</tspan></text><rect x="603" y="309.7" width="409" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="617" y="336.7" fill="#465363" font-size="25" font-weight="400"><tspan x="617" dy="0">不等于 8 个 Terminal 样本</tspan></text><rect x="38" y="361.2" width="310" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="388.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">Terminal 扩展</tspan></text><rect x="348" y="361.2" width="255" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="362" y="388.2" fill="#465363" font-size="25" font-weight="400"><tspan x="362" dy="0">Tools 最佳 33 /</tspan><tspan x="362" dy="35.5">89</tspan></text><rect x="603" y="361.2" width="409" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="617" y="388.2" fill="#465363" font-size="25" font-weight="400"><tspan x="617" dy="0">B=89 或 178 个任务样本；每配</tspan><tspan x="617" dy="35.5">置 N=1</tspan></text><rect x="38" y="472.2" width="974" height="105" fill="#fff" stroke="#dce2e8"/><path d="M38 472.2v105" stroke="#a96238" stroke-width="5"/><text x="55" y="499.2" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">优化模型的 token / API 成本不在统一评测额度中。Terminal 单次搜索不能证明</tspan><tspan x="55" dy="35.5">接口稳定胜出。</tspan></text><path d="M38 593.2h974" stroke="#dce2e8"/><text x="38" y="618.2" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 v4 Table 2、Appendix A.4 / Table 18 重绘。</tspan></text></g></svg>
