<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="640" viewBox="0 0 1050 640" role="img" aria-labelledby="title"><title id="title">Overall 采用 2 / 2 / 1 权重</title><rect width="1050" height="640" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="66" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">Overall 采用 2 / 2 / 1 权重</tspan></text><text x="38" y="116.69999999999999" fill="#465363" font-size="25" font-weight="400"><tspan x="38" dy="0">验证集每来源 32 题，共 160；最终来源分布为 128 / 128 / 64 / 64 / 64。</tspan></text><rect x="38" y="152.2" width="220" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="52" y="179.2" fill="#24292f" font-size="25" font-weight="700"><tspan x="52" dy="0">域</tspan></text><rect x="258" y="152.2" width="504" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="272" y="179.2" fill="#24292f" font-size="25" font-weight="700"><tspan x="272" dy="0">怎样判分</tspan></text><rect x="762" y="152.2" width="250" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="776" y="179.2" fill="#24292f" font-size="25" font-weight="700"><tspan x="776" dy="0">Overall 权重</tspan></text><rect x="38" y="208.7" width="220" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="52" y="235.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">Search</tspan></text><rect x="258" y="208.7" width="504" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="272" y="235.7" fill="#465363" font-size="25" font-weight="400"><tspan x="272" dy="0">BrowseComp、HLE 按来源评分；排除多模</tspan><tspan x="272" dy="35.5">态题</tspan></text><rect x="762" y="208.7" width="250" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="776" y="235.7" fill="#465363" font-size="25" font-weight="400"><tspan x="776" dy="0">2</tspan></text><rect x="38" y="295.7" width="220" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="322.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">Office</tspan></text><rect x="258" y="295.7" width="504" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="272" y="322.7" fill="#465363" font-size="25" font-weight="400"><tspan x="272" dy="0">GDPVal 连续分；APEX 需全部 rubric</tspan><tspan x="272" dy="35.5">通过</tspan></text><rect x="762" y="295.7" width="250" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="776" y="322.7" fill="#465363" font-size="25" font-weight="400"><tspan x="776" dy="0">2</tspan></text><rect x="38" y="382.7" width="220" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="52" y="409.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">General</tspan></text><rect x="258" y="382.7" width="504" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="272" y="409.7" fill="#465363" font-size="25" font-weight="400"><tspan x="272" dy="0">Claw-Eval 的 Pass³：同题三次都通过</tspan></text><rect x="762" y="382.7" width="250" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="776" y="409.7" fill="#465363" font-size="25" font-weight="400"><tspan x="776" dy="0">1</tspan></text><rect x="38" y="458.2" width="974" height="105" fill="#fff" stroke="#dce2e8"/><path d="M38 458.2v105" stroke="#a96238" stroke-width="5"/><text x="55" y="485.2" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">GPT 示例：(2×44.5 + 2×41.6 + 59.4)/5 = 46.32 ≈ 46.3。不能用三个域简</tspan><tspan x="55" dy="35.5">单平均，也不能把 448 题全部混算。</tspan></text><path d="M38 579.2h974" stroke="#dce2e8"/><text x="38" y="604.2" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 v2 评分协议与官方 DOMAIN_WEIGHTS 重绘；本文核算 46.32。</tspan></text></g></svg>
