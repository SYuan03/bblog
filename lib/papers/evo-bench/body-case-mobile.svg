<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1260" viewBox="0 0 660 1260" role="img" aria-labelledby="title desc">
  <title id="title">Elastic NV 办公题的四步判分流程</title>
  <desc id="desc">修改成本假设，核对净债务与股权价值，判断内部收益率，最后检查三项 rubric 是否全部通过。</desc>
  <rect width="660" height="1260" fill="#fff"/>
  <g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <text x="28" y="57" fill="#24292f" font-size="34" font-weight="700">Elastic NV 办公题怎样判分</text>
    <text x="28" y="99" fill="#465363" font-size="25">APEX InvestmentBankingWorld 224 · 官方任务</text>

    <rect x="28" y="136" width="604" height="213" rx="8" fill="#f7f9fb" stroke="#dce2e8"/>
    <circle cx="68" cy="179" r="23" fill="#245e99"/>
    <text x="68" y="188" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">1</text>
    <text x="108" y="188" fill="#24292f" font-size="29" font-weight="700">修改成本假设</text>
    <text x="50" y="244" fill="#465363" font-size="26">订阅和服务成本占各自收入的比例，</text>
    <text x="50" y="283" fill="#465363" font-size="26">从第一年起各提高 1 个百分点；</text>
    <text x="50" y="322" fill="#465363" font-size="26">把结果写入新工作表。</text>

    <rect x="28" y="373" width="604" height="213" rx="8" fill="#f7f9fb" stroke="#dce2e8"/>
    <circle cx="68" cy="416" r="23" fill="#245e99"/>
    <text x="68" y="425" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">2</text>
    <text x="108" y="425" fill="#24292f" font-size="29" font-weight="700">检查第五年退出估值</text>
    <text x="50" y="481" fill="#465363" font-size="26">净债务：717.44M</text>
    <text x="50" y="520" fill="#465363" font-size="26">投资者股权价值：26,068.66M</text>
    <text x="50" y="559" fill="#465363" font-size="24">M 表示百万美元。</text>

    <rect x="28" y="610" width="604" height="188" rx="8" fill="#f7f9fb" stroke="#dce2e8"/>
    <circle cx="68" cy="653" r="23" fill="#245e99"/>
    <text x="68" y="662" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">3</text>
    <text x="108" y="662" fill="#24292f" font-size="29" font-weight="700">看内部收益率 IRR</text>
    <text x="50" y="720" fill="#465363" font-size="27">公开目标为 18.25%，</text>
    <text x="50" y="760" fill="#465363" font-size="27">低于题目询问的 20% 门槛。</text>

    <rect x="28" y="822" width="604" height="213" rx="8" fill="#f1f7f5" stroke="#dce2e8"/>
    <circle cx="68" cy="865" r="23" fill="#317e6a"/>
    <text x="68" y="874" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">4</text>
    <text x="108" y="874" fill="#24292f" font-size="29" font-weight="700">读取 world 的评分</text>
    <text x="50" y="930" fill="#465363" font-size="26">world 生成 grades.json / final_score；</text>
    <text x="50" y="969" fill="#465363" font-size="26">三项 rubric 全部通过，</text>
    <text x="50" y="1008" fill="#465363" font-size="26">这道任务才算成功。</text>

    <rect x="28" y="1059" width="604" height="120" fill="#fff8f2" stroke="#dce2e8"/>
    <rect x="28" y="1059" width="6" height="120" fill="#a96238"/>
    <text x="50" y="1104" fill="#465363" font-size="25">若只通过 2/3 项，仍是失败任务。</text>
    <text x="50" y="1145" fill="#465363" font-size="24">这是规则推导，本文没有重跑 world。</text>
    <text x="28" y="1226" fill="#617184" font-size="21">据官方 task apex-2299b89dcaf64a4da4f3d03f8aac7215 整理</text>
  </g>
</svg>
