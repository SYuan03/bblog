<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="816" viewBox="0 0 1050 816" role="img" aria-labelledby="title"><title id="title">真实 APEX 任务：修改 Elastic 杠杆收购模型</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="816" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">真实 APEX 任务：修改 Elastic 杠杆收购模型</tspan></text><text x="38" y="116.69999999999999" fill="#465363" font-size="25" font-weight="400"><tspan x="38" dy="0">InvestmentBankingWorld 224；数据来自官方任务，不是模型评分日志。</tspan></text><rect x="38" y="153.2" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="181.2" r="18" fill="#245e99"/><text x="69" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">修改成本假设</tspan></text><text x="60" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">第一年及以后，订阅与服务成本比例</tspan><tspan x="60" dy="35.5">提高 1 个百分点；结果写入新</tspan><tspan x="60" dy="35.5">worksheet。</tspan></text><rect x="549" y="153.2" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="181.2" r="18" fill="#245e99"/><text x="580" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">检查对应估值</tspan></text><text x="571" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">净债务 717.44M，股权 26,</tspan><tspan x="571" dy="35.5">068.66M；M 表示百万美元。</tspan></text><path d="M507 254.62h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 254.62h16v115.42H21v127.42h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="394.03999999999996" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="422.03999999999996" r="18" fill="#245e99"/><text x="69" y="429.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="428.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">看内部收益率 IRR</tspan></text><text x="60" y="474.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">公开目标为 18.25%，仍低于 20%</tspan><tspan x="60" dy="35.5">的投资目标。</tspan></text><rect x="549" y="394.03999999999996" width="463" height="202.84" rx="6" fill="#f1f7f5" stroke="#dce2e8"/><circle cx="580" cy="422.03999999999996" r="18" fill="#317e6a"/><text x="580" y="429.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="428.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">读取 world 的评分</tspan></text><text x="571" y="474.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">grades.json / final_score 给逐</tspan><tspan x="571" dy="35.5">项判定；三项 rubric 全通过，才计</tspan><tspan x="571" dy="35.5">任务成功。</tspan></text><path d="M507 495.46h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="634.88" width="974" height="104" fill="#fff" stroke="#dce2e8"/><path d="M38 634.88v104" stroke="#a96238" stroke-width="5"/><text x="55" y="660.88" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">假如只有 2/3 项通过，属于部分正确但任务仍失败。这是从评分规则推导的例子；</tspan><tspan x="55" dy="35.5">本文未重跑完整 world。</tspan></text><path d="M38 755.88h974" stroke="#dce2e8"/><text x="38" y="780.88" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据官方 task apex-2299b89dcaf64a4da4f3d03f8aac7215 重绘。</tspan></text></g></svg>
