<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="913" viewBox="0 0 1050 913" role="img" aria-labelledby="title"><title id="title">Evo-Bench：冻结快照评测，不阻塞后续研究</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="913" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">Evo-Bench：冻结快照评测，不阻塞后续研究</tspan></text><rect x="38" y="115.69999999999999" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="143.7" r="18" fill="#245e99"/><text x="69" y="150.7" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="149.7" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">开发模型修改 harness</tspan></text><text x="60" y="196.04" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">只改允许的运行代码，不更新执行模</tspan><tspan x="60" dy="35.5">型参数。</tspan></text><rect x="549" y="115.69999999999999" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="143.7" r="18" fill="#245e99"/><text x="580" y="150.7" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="149.7" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">run_train_eval 复制代码</tspan></text><text x="571" y="196.04" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">服务冻结完整快照，启动一次验证评</tspan><tspan x="571" dy="35.5">测。</tspan></text><path d="M507 199.37h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 199.37h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="321.03999999999996" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="349.03999999999996" r="18" fill="#245e99"/><text x="69" y="356.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="355.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">快照异步运行</tspan></text><text x="60" y="401.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">旧快照评测时仍可继续研究；同一时</tspan><tspan x="60" dy="35.5">间只有一项活动评测。</tspan></text><rect x="549" y="321.03999999999996" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="349.03999999999996" r="18" fill="#245e99"/><text x="580" y="356.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="355.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">await_eval 取反馈</tspan></text><text x="571" y="401.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">读取分数、失败记录与逐项评分细则</tspan><tspan x="571" dy="35.5">（rubric）反馈。</tspan></text><path d="M507 404.71h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 404.71h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="526.38" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="554.38" r="18" fill="#245e99"/><text x="69" y="561.38" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">5</text><text x="107" y="560.38" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">继续修改并控制预算</tspan></text><text x="60" y="606.72" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">最多 20 轮评测、1,000 次决策、48</tspan><tspan x="60" dy="35.5">小时。</tspan></text><rect x="549" y="526.38" width="463" height="167.34" rx="6" fill="#f1f7f5" stroke="#dce2e8"/><circle cx="580" cy="554.38" r="18" fill="#317e6a"/><text x="580" y="561.38" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">6</text><text x="618" y="560.38" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">最终提交冻结版本</tspan></text><text x="571" y="606.72" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">最终在 448 个隐藏任务上测试。</tspan></text><path d="M507 610.05h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="731.72" width="974" height="104" fill="#fff" stroke="#dce2e8"/><path d="M38 731.72v104" stroke="#a96238" stroke-width="5"/><text x="55" y="757.72" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">构建时的 12 个辅助 harness 用于挑任务，不是一次搜索的 12 个候选。开发模型</tspan><tspan x="55" dy="35.5">能查验证答案与细则，执行模型不能。</tspan></text><path d="M38 852.72h974" stroke="#dce2e8"/><text x="38" y="877.72" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 v2 执行协议与官方异步评测 API 重绘。</tspan></text></g></svg>
