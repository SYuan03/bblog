<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">Table 3–5：筛选回合的效果大，单加候选或状态并未提高基线</title>
<desc id="desc">左侧同一百分比横轴给出所有回合完整路径74.6、匹配回合完整路径83.6、所有回合局部提示69.5、完整SMRC86.5。右侧匹配回合完整路径83.6、只加候选82.0、只加摘要83.4、组合86.5。底部随机相同回合数72.3、所有不匹配回合75.0，且相同回合数并非相同token或梯度质量。</desc>
<rect width="900" height="390" fill="#fff"/>
