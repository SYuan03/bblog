<text x="24" y="327" class="small">Table 4：随机选择相同回合数 72.3%；所有不匹配回合 75.0%</text>
<text x="24" y="351" class="small">* 匹配回合给新提示，其余仍给普通完整路径；Table 14 未匹配 token 数或梯度总量。</text>
