<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc"><title id="title">路由与上下文的拆分消融</title><desc id="desc">Qwen3 ALFWorld Averageat4：所有普通74.6，只匹配83.6，所有回合匹配局部提示69.5，完整86.5；只增加候选82，只增加摘要83.4。</desc><rect width="1000" height="455" fill="#fff"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" fill="#24292f"><text x="28" y="40" font-size="26" font-weight="700">只减少回合数不够；单加候选或摘要也没有提升</text><text x="28" y="71" font-size="18" fill="#536171">Qwen3-1.7B · ALFWorld · Average@4（512 条完整执行的平均成功率）</text><g stroke="#dce2e8"><path d="M380 104V325M880 104V325M630 104V325"/></g><g fill="#f1f4f7"><rect x="380" y="113" width="500" height="24"/><rect x="380" y="163" width="500" height="24"/><rect x="380" y="213" width="500" height="24"/><rect x="380" y="263" width="500" height="24"/></g><g fill="#245e99"><rect x="380" y="113" width="373" height="24"/><rect x="380" y="163" width="418" height="24"/><rect x="380" y="213" width="347.5" height="24"/><rect x="380" y="263" width="432.5" height="24"/></g><g font-size="19"><text x="28" y="132">所有回合 + 普通完整路径</text><text x="28" y="182">仅匹配回合 + 普通完整路径</text><text x="28" y="232">所有回合 + 匹配回合才补局部提示</text><text x="28" y="282" font-weight="700">仅匹配回合 + 完整新提示</text><text x="900" y="132">74.6%</text><text x="900" y="182">83.6%</text><text x="900" y="232">69.5%</text><text x="900" y="282" font-weight="700">86.5%</text></g><g font-size="16" fill="#536171"><text x="376" y="320">0</text><text x="620" y="320">50</text><text x="855" y="320">100%</text></g><rect x="28" y="344" width="944" height="66" rx="8" fill="#f4f7fa" stroke="#d3dde7"/><text x="46" y="370" font-size="18">仅匹配回合：普通路径 83.6% → 单加候选 82.0% / 单加摘要 83.4% / 三字段 86.5%</text><text x="46" y="397" font-size="17" fill="#536171">随机相同回合数 72.3%，但并非匹配 token 数或梯度总量的严格控制。</text><text x="28" y="442" font-size="16" fill="#536171">根据 Table 3–5、14 重绘。完整新提示 = 完整路径 + 实际当前状态摘要 + 当前可执行候选。</text></g></svg>
