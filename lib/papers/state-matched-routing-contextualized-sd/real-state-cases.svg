<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc"><title id="title">论文的生菜、位置不匹配与购物选项案例</title><desc id="desc">生菜已入冰箱，下一步改为找第二个对象；位置不匹配则跳过蒸馏；购物已选颜色但缺尺码9，教师候选click9。</desc><rect width="1000" height="490" fill="#fff"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" fill="#24292f"><text x="28" y="40" font-size="26" font-weight="700">真实审核记录：动作文本相近，当前任务进度却不同</text><g fill="#f4f7fa" stroke="#d3dde7"><rect x="28" y="66" width="944" height="112" rx="8"/><rect x="28" y="197" width="944" height="105" rx="8"/><rect x="28" y="321" width="944" height="112" rx="8"/></g><text x="46" y="100" font-size="21" font-weight="700">ALFWorld：lettuce 3 已在冰箱中</text><text x="46" y="136" font-size="18">历史匹配：open fridge 1</text><text x="390" y="136" font-size="18" fill="#245e99">状态匹配：go to countertop 2</text><text x="46" y="163" font-size="17" fill="#536171">第一件放置已完成 → 转向第二个对象；不是重复打开已用过的容器。</text><text x="46" y="231" font-size="21" font-weight="700">ALFWorld：当前在 fridge 1，参考起点在 diningtable 2</text><text x="46" y="267" font-size="18">参考初始动作不能从当前前提直接使用 → abstain：蒸馏权重为 0，任务奖励仍训练。</text><text x="46" y="355" font-size="21" font-weight="700">WebShop：商品 B07S7HDC88；颜色 blue 137 已选，还缺尺码 9</text><text x="46" y="391" font-size="18">教师提示：完整成功路径 + 当前选项摘要 + click[9]</text><text x="46" y="418" font-size="17" fill="#536171">学生没有直接收到这个候选；当多个必需选项可选时，规则允许候选集合。</text><text x="28" y="468" font-size="17" fill="#536171">根据 Table 12–13 重绘。代表性 matcher 记录，不补造完整 task ID、未公开执行前文或模型输出。</text></g></svg>
