<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">匹配只决定蒸馏损失，任务奖励始终保留</title><desc id="desc">从实际交互重建状态，寻找同题最新兼容位置；匹配时给教师路径、摘要、候选，对同一学生回答评分。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="#245e99"/></marker></defs><rect width="1000" height="470" fill="#fff"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" fill="#24292f"><text x="28" y="40" font-size="26" font-weight="700">SMRC-SD：先确认下一步适用，再重评学生回答</text><g fill="#f4f7fa" stroke="#d3dde7"><rect x="28" y="66" width="286" height="134" rx="8"/><rect x="357" y="66" width="295" height="134" rx="8"/><rect x="695" y="66" width="277" height="134" rx="8"/></g><text x="45" y="99" font-size="21" font-weight="700">学生普通交互 → 实际状态</text><text x="45" y="133" font-size="18">位置、持有物体、属性、进度</text><text x="45" y="167" font-size="18">只用普通观察和动作记录</text><text x="374" y="99" font-size="21" font-weight="700">同题成功动作序列</text><text x="374" y="133" font-size="18">逐步骤重建执行前状态</text><text x="374" y="167" font-size="18">选最新兼容且下一步可执行的位置</text><text x="712" y="99" font-size="21" font-weight="700">匹配？决定回合权重 w</text><text x="712" y="133" font-size="18">是：w = 1，构造教师提示</text><text x="712" y="167" font-size="18">否：w = 0，只跳过蒸馏</text><path d="M318 133H350M656 133H688" stroke="#245e99" stroke-width="2.5" marker-end="url(#a)"/><g fill="#f4f7fa" stroke="#d3dde7"><rect x="28" y="235" width="460" height="170" rx="8"/><rect x="531" y="235" width="441" height="170" rx="8"/></g><text x="45" y="270" font-size="21" font-weight="700">两分支：相同当前参数，相同学生回答</text><text x="45" y="306" font-size="18">学生：普通问题与实际交互前文</text><text x="45" y="341" font-size="18">教师额外看：完整路径 + 当前摘要 + 候选</text><text x="45" y="376" font-size="18">教师停止梯度，不另生成或替换学生动作</text><text x="548" y="270" font-size="21" font-weight="700">更新：GRPO + 0.01 × L_SD</text><text x="548" y="306" font-size="18">L_SD 分子：w × 普通回答 token 的损失</text><text x="548" y="341" font-size="18">分母：所有原回答 token，包括未匹配回合</text><text x="548" y="376" font-size="18">推理文字也参与；不是只训练动作标签</text><path d="M492 320H524" stroke="#245e99" stroke-width="2.5" marker-end="url(#a)"/><text x="28" y="446" font-size="17" fill="#536171">Figure 2、Eq. 15、Appendix A 重绘；测试移除所有训练专用提示，但仍在原环境里执行动作。</text></g></svg>
