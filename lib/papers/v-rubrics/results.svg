<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">V-Rubrics result deltas</title>
  <desc id="d">Rubric GRPO improves the knowledge overall average from 66.25 to 68.04 and the visual overall average from 61.94 to 62.45 relative to answer-only GRPO, with several individual metrics declining.</desc>
  <rect width="1200" height="620" fill="#fbfbf8"/>
  <text x="70" y="58" font-family="Arial,sans-serif" font-size="18" fill="#69737c">QWEN3-VL-8B · SAME SFT START · 50K RL EXAMPLES</text>
  <text x="70" y="105" font-family="Georgia,serif" font-size="36" fill="#172028">Rubrics help, but the increment over answer-only GRPO is modest</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="160" width="500" height="226" fill="#f1f4f3" stroke="#d0d7d9"/>
    <text x="96" y="200" font-size="18" font-weight="700" fill="#172028">General + knowledge overall</text>
    <text x="96" y="249" font-size="16" fill="#69737c">SFT</text><rect x="190" y="226" width="283" height="28" fill="#aab3b8"/><text x="487" y="248" font-size="17" fill="#34414a">64.93</text>
    <text x="96" y="299" font-size="16" fill="#69737c">Answer GRPO</text><rect x="190" y="276" width="347" height="28" fill="#7b909c"/><text x="548" y="298" font-size="17" fill="#34414a">66.25</text>
    <text x="96" y="349" font-size="16" fill="#2f6f98">Rubric GRPO</text><rect x="190" y="326" width="435" height="28" fill="#2f6f98"/><text x="638" y="348" font-size="19" font-weight="700" fill="#2f6f98">68.04</text>

    <rect x="630" y="160" width="500" height="226" fill="#f1f4f3" stroke="#d0d7d9"/>
    <text x="656" y="200" font-size="18" font-weight="700" fill="#172028">Visual reasoning overall</text>
    <text x="656" y="249" font-size="16" fill="#69737c">SFT</text><rect x="758" y="226" width="254" height="28" fill="#aab3b8"/><text x="1024" y="248" font-size="17" fill="#34414a">58.45</text>
    <text x="656" y="299" font-size="16" fill="#69737c">Answer GRPO</text><rect x="758" y="276" width="380" height="28" fill="#7b909c"/><text x="1048" y="298" font-size="17" fill="#34414a">61.94</text>
    <text x="656" y="349" font-size="16" fill="#2f6f98">Rubric GRPO</text><rect x="758" y="326" width="398" height="28" fill="#2f6f98"/><text x="1051" y="348" font-size="19" font-weight="700" fill="#2f6f98">62.45</text>

    <text x="70" y="438" font-size="18" font-weight="700" fill="#172028">Increment over answer-only GRPO</text>
    <text x="70" y="482" font-size="28" font-weight="700" fill="#2f7d6b">+1.79 points</text><text x="274" y="482" font-size="16" fill="#34414a">general + knowledge</text>
    <text x="630" y="482" font-size="28" font-weight="700" fill="#2f7d6b">+0.51 points</text><text x="820" y="482" font-size="16" fill="#34414a">visual reasoning</text>
    <text x="70" y="538" font-size="15" fill="#a84b47">Negative deltas remain on MMBench-Dev, MathVerse V/O, and CharXiv reasoning.</text>
    <text x="70" y="570" font-size="14" fill="#69737c">Source: paper Tables 1–3. Values are unweighted averages of the displayed metrics.</text>
  </g>
</svg>
