<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
  <title id="t">V-Rubrics 结果差值</title>
  <desc id="d">相对只看答案的 GRPO，评分项 GRPO 把通用与知识类平均分从 66.25 提高到 68.04，把视觉推理类平均分从 61.94 提高到 62.45，但若干单项指标下降。</desc>
  <rect width="1200" height="620" fill="#fbfbf8"/>
  <text x="70" y="58" font-family="Arial,sans-serif" font-size="18" fill="#69737c">QWEN3-VL-8B · 相同 SFT 起点 · 50K 强化学习样本</text>
  <text x="70" y="105" font-family="Georgia,serif" font-size="36" fill="#172028">评分项奖励有效，但相对只看答案的增量不大</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="160" width="500" height="226" fill="#f1f4f3" stroke="#d0d7d9"/>
    <text x="96" y="200" font-size="18" font-weight="700" fill="#172028">通用与知识类平均分</text>
    <text x="96" y="249" font-size="16" fill="#69737c">SFT</text><rect x="190" y="226" width="283" height="28" fill="#aab3b8"/><text x="487" y="248" font-size="17" fill="#34414a">64.93</text>
    <text x="96" y="299" font-size="16" fill="#69737c">只看答案</text><rect x="190" y="276" width="347" height="28" fill="#7b909c"/><text x="548" y="298" font-size="17" fill="#34414a">66.25</text>
    <text x="96" y="349" font-size="16" fill="#2f6f98">评分项 GRPO</text><rect x="190" y="326" width="435" height="28" fill="#2f6f98"/><text x="638" y="348" font-size="19" font-weight="700" fill="#2f6f98">68.04</text>

    <rect x="630" y="160" width="500" height="226" fill="#f1f4f3" stroke="#d0d7d9"/>
    <text x="656" y="200" font-size="18" font-weight="700" fill="#172028">视觉推理类平均分</text>
    <text x="656" y="249" font-size="16" fill="#69737c">SFT</text><rect x="758" y="226" width="254" height="28" fill="#aab3b8"/><text x="1024" y="248" font-size="17" fill="#34414a">58.45</text>
    <text x="656" y="299" font-size="16" fill="#69737c">只看答案</text><rect x="758" y="276" width="380" height="28" fill="#7b909c"/><text x="1048" y="298" font-size="17" fill="#34414a">61.94</text>
    <text x="656" y="349" font-size="16" fill="#2f6f98">评分项 GRPO</text><rect x="758" y="326" width="398" height="28" fill="#2f6f98"/><text x="1051" y="348" font-size="19" font-weight="700" fill="#2f6f98">62.45</text>

    <text x="70" y="438" font-size="18" font-weight="700" fill="#172028">相对只看答案的 GRPO</text>
    <text x="70" y="482" font-size="28" font-weight="700" fill="#2f7d6b">+1.79</text><text x="274" y="482" font-size="16" fill="#34414a">通用与知识类，单位为百分点</text>
    <text x="630" y="482" font-size="28" font-weight="700" fill="#2f7d6b">+0.51</text><text x="820" y="482" font-size="16" fill="#34414a">视觉推理类，单位为百分点</text>
    <text x="70" y="538" font-size="15" fill="#a84b47">MMBench-Dev、MathVerse V/O 和 CharXiv 推理项仍然下降。</text>
    <text x="70" y="570" font-size="14" fill="#69737c">来源：论文表 1-3。数值为图中各指标的简单平均。</text>
  </g>
</svg>
