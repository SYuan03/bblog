<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020" role="img" aria-labelledby="title desc">
<title id="title">V-Rubrics：公开 AI2D 潮汐题与六条评分项</title><desc id="desc">真实数据行2501正确选项是第四项大潮。六条权重总计26。假设只满足选择项，评分项分为5除26，最终等权奖励为0.5962。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.title{font-size:33px;font-weight:750}.head{font-size:28px;font-weight:700}.body{font-size:25px;fill:#46545d}.small{font-size:23px;fill:#56646d}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:28px;font-weight:650}</style>
<rect width="1000" height="1020" fill="#fff"/>
<text x="40" y="53" class="title">真实潮汐题：答对选项，可能仍缺五项解释</text>
<text x="40" y="97" class="body">AI2D original_id=2501：What is represented in this image?</text>
<text x="40" y="139" class="body">正确选项 (3) spring tide（大潮）；从 0 编号，是第四项。</text>
<text x="40" y="177" class="small">固定模型 8 次回答全错，因此这条数据被标成困难题。</text>
<rect x="40" y="210" width="920" height="56" fill="#f1f4f6"/>
<text x="64" y="247" class="head">六条独立检查</text><text x="820" y="247" class="head" text-anchor="middle">类型 / 权重</text>
<g class="body"><text x="64" y="311">识别太阳、地球、月球</text><text x="64" y="370">指出三者共线</text><text x="64" y="429">识别海洋潮汐隆起</text><text x="64" y="488">解释引力叠加</text><text x="64" y="547">选择大潮</text><text x="64" y="606">区分小潮需要 90° 夹角</text></g>
<g class="num" text-anchor="middle"><text x="820" y="311">VF / 5</text><text x="820" y="370">VF / 5</text><text x="820" y="429">VF / 4</text><text x="820" y="488">RC / 4</text><text x="820" y="547">IF / 5</text><text x="820" y="606">RC / 3</text></g>
<path d="M40 330H960M40 389H960M40 448H960M40 507H960M40 566H960M40 625H960" stroke="#d2dade"/>
<text x="40" y="669" class="small">VF：图中事实；RC：推理关系；IF：任务要求。权重总和为 26。</text>
<rect x="40" y="702" width="920" height="185" fill="#f1f5f8" stroke="#c4d3dd"/>
<text x="64" y="746" class="head" fill="#245f87">假设只答 spring tide，只认可“选择大潮”这一项</text>
<text x="64" y="791" class="num">Rrub = 5 / 26 = 0.1923</text>
<text x="64" y="835" class="num">R = 0.5 × 答案分 1 + 0.5 × Rrub = 0.5962</text>
<text x="64" y="873" class="small">按公开数据和公式重算，不是作者发布的训练奖励日志。</text>
<text x="40" y="935" class="body">Gemini 看图生成标准；Qwen 判分只看回答与单项标准。</text>
<text x="40" y="976" class="small">来源：公开数据 UID chart_02501_3c2e6864、§3 与 reward 实现。</text>
<text x="40" y="1007" class="small">该假设不代表 Qwen 的实测判分输出。</text>
</svg>
