<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">V-Rubrics construction and reward flow</title>
  <desc id="d">Visual question-answering examples are filtered, assigned difficulty from eight rollouts, annotated by Gemini 3 Pro, and judged item by item to create answer and prefix-localized rubric credit.</desc>
  <rect width="1200" height="675" fill="#f7f4ec"/>
  <text x="70" y="68" font-family="Arial,sans-serif" font-size="18" fill="#69737c">VISUAL RL · DATASET, JUDGE, CREDIT ASSIGNMENT</text>
  <text x="70" y="120" font-family="Georgia,serif" font-size="43" fill="#172028">V-Rubrics turns one answer into several checks</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="196" width="190" height="238" fill="#e8eef2" stroke="#9aaab3"/>
    <text x="92" y="232" font-size="19" font-weight="700" fill="#2f6f98">VQA source</text>
    <text x="92" y="274" font-size="15" fill="#34414a">image</text><text x="92" y="306" font-size="15" fill="#34414a">question</text><text x="92" y="338" font-size="15" fill="#34414a">reference answer</text>
    <text x="92" y="394" font-size="14" fill="#69737c">17 sources</text>
    <path d="M270 315H330" stroke="#54758a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="340" y="196" width="236" height="238" fill="#fff" stroke="#8999a2"/>
    <text x="362" y="232" font-size="19" font-weight="700" fill="#172028">Build 50K</text>
    <text x="362" y="274" font-size="15" fill="#34414a">rule filters</text>
    <text x="362" y="306" font-size="15" fill="#34414a">8 SFT rollouts</text>
    <text x="362" y="338" font-size="15" fill="#34414a">0/8 hard · 1–5 medium</text>
    <text x="362" y="370" font-size="15" fill="#34414a">6–7 simple · 8 discard</text>
    <text x="362" y="408" font-size="14" fill="#69737c">50,248 examples</text>
    <path d="M586 315H646" stroke="#54758a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="656" y="196" width="218" height="238" fill="#f5eee8" stroke="#c59b7c"/>
    <text x="678" y="232" font-size="19" font-weight="700" fill="#b86538">Gemini-3-Pro</text>
    <text x="678" y="274" font-size="15" fill="#34414a">VF visual facts</text>
    <text x="678" y="306" font-size="15" fill="#34414a">RC reasoning</text>
    <text x="678" y="338" font-size="15" fill="#34414a">IF instruction</text>
    <text x="678" y="388" font-size="14" fill="#69737c">352,938 rubric items</text>
    <path d="M884 315H944" stroke="#54758a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="954" y="196" width="176" height="238" fill="#e8f1ed" stroke="#7ba494"/>
    <text x="976" y="232" font-size="19" font-weight="700" fill="#2f7d6b">GRPO</text>
    <text x="976" y="274" font-size="15" fill="#34414a">answer reward</text>
    <text x="976" y="306" font-size="15" fill="#34414a">item rewards</text>
    <text x="976" y="338" font-size="15" fill="#34414a">prefix masks</text>
    <text x="976" y="388" font-size="14" fill="#69737c">Qwen3-VL judge</text>

    <rect x="70" y="494" width="1060" height="104" fill="#fff" stroke="#d1d7da"/>
    <text x="94" y="531" font-size="17" font-weight="700" fill="#172028">Evidence boundary</text>
    <text x="94" y="563" font-size="15" fill="#34414a">The rubric judge receives the model response and textual criterion, not the raw image.</text>
    <text x="94" y="586" font-size="15" fill="#a84b47">All rubric annotations are machine-generated; the paper reports no item-level human audit.</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#54758a"/></marker></defs>
</svg>
