<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">V-Rubrics 数据构建与奖励流程</title>
  <desc id="d">视觉问答样本先经过过滤，再根据八次回答的正确数划分难度。Gemini 3 Pro 为样本生成评分项，判分模型逐项判断，并把训练权重分配到相关回答前缀。</desc>
  <rect width="1200" height="675" fill="#f7f4ec"/>
  <text x="70" y="68" font-family="Arial,sans-serif" font-size="18" fill="#69737c">视觉强化学习 · 数据集、判分与训练权重归因</text>
  <text x="70" y="120" font-family="Georgia,serif" font-size="43" fill="#172028">V-Rubrics 把一条回答拆成多项检查</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="196" width="190" height="238" fill="#e8eef2" stroke="#9aaab3"/>
    <text x="92" y="232" font-size="19" font-weight="700" fill="#2f6f98">视觉问答来源</text>
    <text x="92" y="274" font-size="15" fill="#34414a">图像</text><text x="92" y="306" font-size="15" fill="#34414a">问题</text><text x="92" y="338" font-size="15" fill="#34414a">参考答案</text>
    <text x="92" y="394" font-size="14" fill="#69737c">17 个来源</text>
    <path d="M270 315H330" stroke="#54758a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="340" y="196" width="236" height="238" fill="#fff" stroke="#8999a2"/>
    <text x="362" y="232" font-size="19" font-weight="700" fill="#172028">构建 50K 数据</text>
    <text x="362" y="274" font-size="15" fill="#34414a">规则过滤</text>
    <text x="362" y="306" font-size="15" fill="#34414a">监督微调模型生成 8 次</text>
    <text x="362" y="338" font-size="15" fill="#34414a">0/8 困难 · 1–5 中等</text>
    <text x="362" y="370" font-size="15" fill="#34414a">6–7 简单 · 8/8 丢弃</text>
    <text x="362" y="408" font-size="14" fill="#69737c">50,248 个样本</text>
    <path d="M586 315H646" stroke="#54758a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="656" y="196" width="218" height="238" fill="#f5eee8" stroke="#c59b7c"/>
    <text x="678" y="232" font-size="19" font-weight="700" fill="#b86538">Gemini-3-Pro</text>
    <text x="678" y="274" font-size="15" fill="#34414a">VF 视觉事实</text>
    <text x="678" y="306" font-size="15" fill="#34414a">RC 推理一致性</text>
    <text x="678" y="338" font-size="15" fill="#34414a">IF 指令遵循</text>
    <text x="678" y="388" font-size="14" fill="#69737c">352,938 条评分项</text>
    <path d="M884 315H944" stroke="#54758a" stroke-width="3" marker-end="url(#a)"/>
    <rect x="954" y="196" width="176" height="238" fill="#e8f1ed" stroke="#7ba494"/>
    <text x="976" y="232" font-size="19" font-weight="700" fill="#2f7d6b">组内相对训练</text>
    <text x="976" y="274" font-size="15" fill="#34414a">答案奖励</text>
    <text x="976" y="306" font-size="15" fill="#34414a">逐项奖励</text>
    <text x="976" y="338" font-size="15" fill="#34414a">前缀遮罩</text>
    <text x="976" y="388" font-size="14" fill="#69737c">Qwen3-VL 判分</text>

    <rect x="70" y="494" width="1060" height="104" fill="#fff" stroke="#d1d7da"/>
    <text x="94" y="531" font-size="17" font-weight="700" fill="#172028">证据边界</text>
    <text x="94" y="563" font-size="15" fill="#34414a">评分项判分模型只接收模型回答和文字标准，不读取原图。</text>
    <text x="94" y="586" font-size="15" fill="#a84b47">所有评分项均由模型自动生成；论文没有报告逐项人工审计。</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#54758a"/></marker></defs>
</svg>
