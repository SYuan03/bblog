<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="785" viewBox="0 0 1000 785" role="img" aria-labelledby="title desc">
<title id="title">V-Rubrics 平均结果与比较边界</title><desc id="desc">Qwen3-VL-8B通用知识均分从66.25提升到68.04，视觉推理61.94到62.45。一些单项下降，批量大小不同，不能将增益归因单组件。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.title{font-size:33px;font-weight:750}.head{font-size:27px;font-weight:700}.body{font-size:25px;fill:#46545d}.small{font-size:23px;fill:#56646d}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:29px;font-weight:650}</style>
<rect width="1000" height="785" fill="#fff"/>
<text x="40" y="53" class="title">逐项奖励有收益，相对答案奖励的增量并不大</text>
<text x="40" y="95" class="body">Qwen3-VL-8B；相同 SFT 起点，50K 强化学习样本。</text>
<rect x="40" y="127" width="920" height="64" fill="#f1f4f6"/>
<g class="head"><text x="64" y="170">训练方式</text><text x="500" y="170" text-anchor="middle">通用与知识均分</text><text x="810" y="170" text-anchor="middle">视觉推理均分</text></g>
<g class="body"><text x="64" y="243">SFT</text><text x="64" y="314">只看答案的 GRPO</text><text x="64" y="385">评分项 GRPO</text></g>
<g class="num" text-anchor="middle"><text x="500" y="243">64.93</text><text x="810" y="243">58.45</text><text x="500" y="314">66.25</text><text x="810" y="314">61.94</text><text x="500" y="385" fill="#245f87">68.04</text><text x="810" y="385" fill="#245f87">62.45</text></g>
<path d="M40 269H960M40 340H960M40 412H960" stroke="#d2dade"/>
<rect x="40" y="445" width="920" height="98" fill="#f1f5f8" stroke="#c4d3dd"/>
<text x="64" y="487" class="head" fill="#245f87">相对只看答案：通用与知识总体 +1.79 pp，推理 +0.51 pp。</text>
<text x="64" y="527" class="small">这里按论文各项指标等权平均；pp 为百分点。</text>
<text x="40" y="592" class="head">哪些结果限制结论</text>
<text x="40" y="635" class="body">MMBench-Dev、MathVerse V/O 与 CharXiv 推理项仍下降。</text>
<text x="40" y="677" class="body">评分项 / 答案奖励训练的 batch 为 192 / 480，控制条件不同。</text>
<text x="40" y="719" class="small">前缀与归一化的 +0.30 是联合消融，不能单独归给某一项。</text>
<text x="40" y="766" class="small">根据 Tables 1–2 重绘；未报告多个训练随机种子误差条。</text>
</svg>
