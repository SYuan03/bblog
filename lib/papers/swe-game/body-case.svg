<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="816" viewBox="0 0 1050 816" role="img" aria-labelledby="title"><title id="title">Beacon Relay：动作怎样变成可观察的玩法</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="816" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">Beacon Relay：动作怎样变成可观察的玩法</tspan></text><text x="38" y="116.69999999999999" fill="#465363" font-size="25" font-weight="400"><tspan x="38" dy="0">论文 Appendix B.2 的真实游戏设计文档；并非虚构隐藏测试路线。</tspan></text><rect x="38" y="153.2" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="181.2" r="18" fill="#245e99"/><text x="69" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">接触台座上的电池 cell</tspan></text><text x="60" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">玩家拾取后开始 fuse 倒计时。三关</tspan><tspan x="60" dy="35.5">分别为 13 / 12 / 11 秒，电池颜</tspan><tspan x="60" dy="35.5">色由绿变黄，再变红。</tspan></text><rect x="549" y="153.2" width="463" height="202.84" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="181.2" r="18" fill="#245e99"/><text x="580" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">带电池从上方踩中敌人</tspan></text><text x="571" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">倒计时返还 2.5 秒，同时刷新空中</tspan><tspan x="571" dy="35.5">跳跃。若从侧面碰撞敌人，损失</tspan><tspan x="571" dy="35.5">shield 护盾。</tspan></text><path d="M507 254.62h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 254.62h16v115.42H21v127.42h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="394.03999999999996" width="463" height="202.84" rx="6" fill="#f1f7f5" stroke="#dce2e8"/><circle cx="69" cy="422.03999999999996" r="18" fill="#317e6a"/><text x="69" y="429.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="428.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">带电池与 beacon 信标重叠</tspan></text><text x="60" y="474.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">只有成功存入，relay 进度才增加；</tspan><tspan x="60" dy="35.5">点亮一段信标，fuse 停止。</tspan></text><rect x="549" y="394.03999999999996" width="463" height="202.84" rx="6" fill="#fbf3f2" stroke="#dce2e8"/><circle cx="580" cy="422.03999999999996" r="18" fill="#a64b47"/><text x="580" y="429.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="428.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">检查动作是否造成状态变化</tspan></text><text x="571" y="474.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">探针读取电池、倒计时和进度；同长</tspan><tspan x="571" dy="35.5">度无输入对照若也达标，这条路线记</tspan><tspan x="571" dy="35.5">0。</tspan></text><path d="M507 495.46h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="634.88" width="974" height="104" fill="#fff" stroke="#dce2e8"/><path d="M38 634.88v104" stroke="#a96238" stroke-width="5"/><text x="55" y="660.88" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">三关共 11 个电池；认证输入路线通常 6–9 分钟、60 Hz。具体题目的隐藏输入路</tspan><tspan x="55" dy="35.5">线与断言代码未公开。</tspan></text><path d="M38 755.88h974" stroke="#dce2e8"/><text x="38" y="780.88" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 Figure 6、Appendix B.2 与公开评测协议重绘。</tspan></text></g></svg>
