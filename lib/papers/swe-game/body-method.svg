<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="913" viewBox="0 0 1050 913" role="img" aria-labelledby="title"><title id="title">SWE-Game：输入路线与无输入对照怎样给判定</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="913" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">SWE-Game：输入路线与无输入对照怎样给判定</tspan></text><rect x="38" y="115.69999999999999" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="143.7" r="18" fill="#245e99"/><text x="69" y="150.7" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="149.7" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">从头启动候选项目</tspan></text><text x="60" y="196.04" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">检查公开提交接口、登记场景与项目</tspan><tspan x="60" dy="35.5">是否可用。</tspan></text><rect x="549" y="115.69999999999999" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="143.7" r="18" fill="#245e99"/><text x="580" y="150.7" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="149.7" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">重放认证输入</tspan></text><text x="571" y="196.04" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">按参考路线的动作与时序输入，不直</tspan><tspan x="571" dy="35.5">接改写游戏进度。</tspan></text><path d="M507 199.37h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 199.37h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="321.03999999999996" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="349.03999999999996" r="18" fill="#245e99"/><text x="69" y="356.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="355.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">探针读取实时状态</tspan></text><text x="60" y="401.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">观察碰撞、对象出现 / 消失、倒计时</tspan><tspan x="60" dy="35.5">与进度等。</tspan></text><rect x="549" y="321.03999999999996" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="580" cy="349.03999999999996" r="18" fill="#245e99"/><text x="580" y="356.03999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="355.03999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">检查目标与功能要求</tspan></text><text x="571" y="401.37999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">既看中间目标，也看最终目标；只显</tspan><tspan x="571" dy="35.5">示“胜利”不够。</tspan></text><path d="M507 404.71h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><path d="M1016 404.71h16v97.67H21v109.67h9" fill="none" stroke="#8da8c1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="38" y="526.38" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="554.38" r="18" fill="#245e99"/><text x="69" y="561.38" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">5</text><text x="107" y="560.38" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">同长度无输入对照</tspan></text><text x="60" y="606.72" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">不按键、不移动，也运行同样长度，</tspan><tspan x="60" dy="35.5">检查是否自动过关。</tspan></text><rect x="549" y="526.38" width="463" height="167.34" rx="6" fill="#f1f7f5" stroke="#dce2e8"/><circle cx="580" cy="554.38" r="18" fill="#317e6a"/><text x="580" y="561.38" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">6</text><text x="618" y="560.38" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">由玩家造成才计分</tspan></text><text x="571" y="606.72" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">若无输入也达标，该输入路线记 0。</tspan></text><path d="M507 610.05h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="731.72" width="974" height="104" fill="#fff" stroke="#dce2e8"/><path d="M38 731.72v104" stroke="#a96238" stroke-width="5"/><text x="55" y="757.72" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">解释性失败：按时间自动增加进度并显示胜利。这个反例来自公开协议推导，不是观</tspan><tspan x="55" dy="35.5">测日志；题目具体断言代码未公开。</tspan></text><path d="M38 852.72h974" stroke="#dce2e8"/><text x="38" y="877.72" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 Figure 2、§3.4 与 Appendix H 重绘。</tspan></text></g></svg>
