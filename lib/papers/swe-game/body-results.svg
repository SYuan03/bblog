<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="672" viewBox="0 0 1050 672" role="img" aria-labelledby="title"><title id="title">从头构建任务的最佳总分仍低于 60</title><rect width="1050" height="672" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="66" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">从头构建任务的最佳总分仍低于 60</tspan></text><text x="38" y="116.69999999999999" fill="#465363" font-size="25" font-weight="400"><tspan x="38" dy="0">Table 3 各模式的 Opus5 最佳配置，分数范围 0–100。</tspan></text><rect x="38" y="152.2" width="435" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="52" y="179.2" fill="#24292f" font-size="25" font-weight="700"><tspan x="52" dy="0">任务模式</tspan></text><rect x="473" y="152.2" width="200" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="487" y="179.2" fill="#24292f" font-size="25" font-weight="700"><tspan x="487" dy="0">最佳分数</tspan></text><rect x="673" y="152.2" width="339" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="687" y="179.2" fill="#24292f" font-size="25" font-weight="700"><tspan x="687" dy="0">读数含义</tspan></text><rect x="38" y="208.7" width="435" height="51.5" fill="#f4f8fb" stroke="#dce2e8"/><text x="52" y="235.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">Brief-to-Game</tspan></text><rect x="473" y="208.7" width="200" height="51.5" fill="#f4f8fb" stroke="#dce2e8"/><text x="487" y="235.7" fill="#465363" font-size="25" font-weight="400"><tspan x="487" dy="0">50.38</tspan></text><rect x="673" y="208.7" width="339" height="51.5" fill="#f4f8fb" stroke="#dce2e8"/><text x="687" y="235.7" fill="#465363" font-size="25" font-weight="400"><tspan x="687" dy="0">简要描述 → 完整游戏</tspan></text><rect x="38" y="260.2" width="435" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="287.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">GDD-to-Game</tspan></text><rect x="473" y="260.2" width="200" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="487" y="287.2" fill="#465363" font-size="25" font-weight="400"><tspan x="487" dy="0">59.68</tspan></text><rect x="673" y="260.2" width="339" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="687" y="287.2" fill="#465363" font-size="25" font-weight="400"><tspan x="687" dy="0">详细设计文档 → 游戏</tspan></text><rect x="38" y="311.7" width="435" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="52" y="338.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">Skeleton-to-Game</tspan></text><rect x="473" y="311.7" width="200" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="487" y="338.7" fill="#465363" font-size="25" font-weight="400"><tspan x="487" dy="0">54.06</tspan></text><rect x="673" y="311.7" width="339" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="687" y="338.7" fill="#465363" font-size="25" font-weight="400"><tspan x="687" dy="0">完成给定骨架</tspan></text><rect x="38" y="363.2" width="435" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="390.2" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">Game Repair</tspan></text><rect x="473" y="363.2" width="200" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="487" y="390.2" fill="#465363" font-size="25" font-weight="400"><tspan x="487" dy="0">83.46</tspan></text><rect x="673" y="363.2" width="339" height="51.5" fill="#ffffff" stroke="#dce2e8"/><text x="687" y="390.2" fill="#465363" font-size="25" font-weight="400"><tspan x="687" dy="0">已有游戏的修复</tspan></text><rect x="38" y="414.7" width="435" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="52" y="441.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">Game Porting</tspan></text><rect x="473" y="414.7" width="200" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="487" y="441.7" fill="#465363" font-size="25" font-weight="400"><tspan x="487" dy="0">72.40</tspan></text><rect x="673" y="414.7" width="339" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="687" y="441.7" fill="#465363" font-size="25" font-weight="400"><tspan x="687" dy="0">跨引擎原生移植</tspan></text><rect x="38" y="490.2" width="974" height="105" fill="#fff" stroke="#dce2e8"/><path d="M38 490.2v105" stroke="#a96238" stroke-width="5"/><text x="55" y="517.2" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">Skeleton 的 Scaffold 为 94.62，但 Content 为 36.93、Mechanics 为</tspan><tspan x="55" dy="35.5">36.22。接口接上了，不表示内容和玩法已完整。不同模式按各自规则计分。</tspan></text><path d="M38 611.2h974" stroke="#dce2e8"/><text x="38" y="636.2" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 SWE-Game Table 3 重绘。</tspan></text></g></svg>
