  <g font-family="Arial, PingFang SC, sans-serif">
    <text x="92" y="92" fill="#7b858d" font-size="22" letter-spacing="3">PAPER DEEP DIVE · 2026-09-28</text>
    <text x="92" y="205" fill="#171c21" font-family="Georgia, Songti SC, serif" font-size="72" font-weight="600">LEGO-Anything</text>
    <text x="92" y="282" fill="#171c21" font-family="Georgia, Songti SC, serif" font-size="50">Coding Agents for</text>
    <text x="92" y="344" fill="#171c21" font-family="Georgia, Songti SC, serif" font-size="50">3D Scene Reconstruction</text>
    <text x="94" y="425" fill="#3e4851" font-size="27">一张 RGB 图片 → Blender 程序 → 可编辑、可执行、可查询的场景</text>
    <g transform="translate(95 526)">
      <rect width="585" height="194" fill="#1d252b"/>
      <text x="28" y="45" fill="#93a2aa" font-family="monospace" font-size="21">scene.py</text>
      <text x="28" y="85" fill="#eaf0f2" font-family="monospace" font-size="22">camera = infer(reference)</text>
      <text x="28" y="122" fill="#75b7db" font-family="monospace" font-size="22">build(scene, objects, lights)</text>
      <text x="28" y="159" fill="#7ed1af" font-family="monospace" font-size="22">render → inspect → revise</text>
    </g>
    <text x="92" y="820" fill="#7b858d" font-size="22">LEGO-Bench · LEGO-Plugin · LEGO-World</text>
  </g>
