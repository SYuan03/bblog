<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="728" viewBox="0 0 1050 728" role="img" aria-labelledby="title"><title id="title">House bedroom：最后一次编辑可能比中途更差</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8da8c1"/></marker></defs><rect width="1050" height="728" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="67" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">House bedroom：最后一次编辑可能比中途更差</tspan></text><text x="38" y="116.69999999999999" fill="#465363" font-size="25" font-weight="400"><tspan x="38" dy="0">按四模型共有任务的平均退化最大选出；非随机案例，代码 diff 未公开。</tspan></text><rect x="38" y="153.2" width="463" height="167.34" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="181.2" r="18" fill="#245e99"/><text x="69" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><text x="107" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">GPT-6-astra · step 02</tspan></text><text x="60" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">最好中间版本：Q = 33.90%。</tspan></text><rect x="549" y="153.2" width="463" height="167.34" rx="6" fill="#fbf3f2" stroke="#dce2e8"/><circle cx="580" cy="181.2" r="18" fill="#a64b47"/><text x="580" y="188.2" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><text x="618" y="187.2" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">GPT-6-astra · step 04</tspan></text><text x="571" y="233.54" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">最终版本：Q = 4.35%，低于中途最</tspan><tspan x="571" dy="35.5">好值。</tspan></text><path d="M507 236.87h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="358.53999999999996" width="463" height="150" rx="6" fill="#f7f9fb" stroke="#dce2e8"/><circle cx="69" cy="386.53999999999996" r="18" fill="#245e99"/><text x="69" y="393.53999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><text x="107" y="392.53999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="107" dy="0">GPT-5.6-terra · step 04</tspan></text><text x="60" y="438.87999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="60" dy="0">最好中间版本：Q = 36.93%。</tspan></text><rect x="549" y="358.53999999999996" width="463" height="150" rx="6" fill="#fbf3f2" stroke="#dce2e8"/><circle cx="580" cy="386.53999999999996" r="18" fill="#a64b47"/><text x="580" y="393.53999999999996" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><text x="618" y="392.53999999999996" fill="#24292f" font-size="27" font-weight="700"><tspan x="618" dy="0">GPT-5.6-terra · step 19</tspan></text><text x="571" y="438.87999999999994" fill="#465363" font-size="25" font-weight="400"><tspan x="571" dy="0">最终版本：Q = 2.10%，明显退化。</tspan></text><path d="M507 433.53999999999996h34" stroke="#8da8c1" stroke-width="3" marker-end="url(#arrow)"/><rect x="38" y="546.54" width="974" height="104" fill="#fff" stroke="#dce2e8"/><path d="M38 546.54v104" stroke="#a96238" stroke-width="5"/><text x="55" y="572.54" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">Q=(R+A)/2。整体上 GPT-5.6-sol 的 29.6% 修改降低 Q，最后版本比中途最好平</tspan><tspan x="55" dy="35.5">均低 3.2 个百分点；不能补造造成退化的代码 diff。</tspan></text><path d="M38 667.54h974" stroke="#dce2e8"/><text x="38" y="692.54" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 Figure 5、Appendix B.2、Figures 11–12 重绘。</tspan></text></g></svg>
