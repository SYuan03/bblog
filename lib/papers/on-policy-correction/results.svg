<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Qwen 与 Gemini 在 baseline 和 evolved harness 下的任务成功率</title>
  <desc id="desc">Qwen baseline 29.2，evolved harness 78.0，evolved harness 加完整模仿 63.1，baseline 加完整模仿 35.5，evolved harness 加 on-policy correction 79.7；Gemini 在 evolved harness 下为 93.6。</desc>
  <rect width="1400" height="760" fill="#fff"/>
  <style>.t{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20252b}.s{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#68737e}.l{font:650 19px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#2b333b}.v{font:750 20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#20252b}.axis{stroke:#ccd3d9;stroke-width:1}.tick{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#7a858f}.note{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#53606b}</style>
  <text x="56" y="64" class="t">同一弱模型：harness evolution 有效，整轨迹 imitation 反而回退</text>
  <text x="56" y="98" class="s">七项 enterprise tasks 的 test success 平均值；误差为三次运行的 SEM</text>
  <g transform="translate(350 138)">
    <line x1="0" y1="0" x2="0" y2="500" class="axis"/><line x1="190" y1="0" x2="190" y2="500" class="axis"/><line x1="380" y1="0" x2="380" y2="500" class="axis"/><line x1="570" y1="0" x2="570" y2="500" class="axis"/><line x1="760" y1="0" x2="760" y2="500" class="axis"/>
    <text x="0" y="525" class="tick" text-anchor="middle">0</text><text x="190" y="525" class="tick" text-anchor="middle">25</text><text x="380" y="525" class="tick" text-anchor="middle">50</text><text x="570" y="525" class="tick" text-anchor="middle">75</text><text x="760" y="525" class="tick" text-anchor="middle">100%</text>
    <g transform="translate(0 28)"><text x="-24" y="28" class="l" text-anchor="end">Qwen · h0</text><rect width="222" height="42" fill="#aab4bd"/><text x="238" y="28" class="v">29.2 ±0.61</text></g>
    <g transform="translate(0 104)"><text x="-24" y="28" class="l" text-anchor="end">Qwen · h*</text><rect width="593" height="42" fill="#2d669f"/><text x="609" y="28" class="v">78.0 ±0.97</text></g>
    <g transform="translate(0 180)"><text x="-24" y="28" class="l" text-anchor="end">Qwen · h* + imitation</text><rect width="480" height="42" fill="#bd5b4f"/><text x="496" y="28" class="v">63.1 ±0.81</text></g>
    <g transform="translate(0 256)"><text x="-24" y="28" class="l" text-anchor="end">Qwen · h0 + imitation</text><rect width="270" height="42" fill="#d99b57"/><text x="286" y="28" class="v">35.5 ±1.06</text></g>
    <g transform="translate(0 332)"><text x="-24" y="28" class="l" text-anchor="end">Qwen · h* + correction</text><rect width="606" height="42" fill="#2b7863"/><text x="622" y="28" class="v">79.7 ±0.67</text></g>
    <g transform="translate(0 408)"><text x="-24" y="28" class="l" text-anchor="end">Gemini expert · h*</text><rect width="711" height="42" fill="#6e5aa8"/><text x="727" y="28" class="v">93.6 ±0.46</text></g>
  </g>
  <rect x="56" y="686" width="1288" height="1" fill="#d7dde2"/><text x="56" y="720" class="note">h0：baseline harness；h*：为 Qwen 演化后的 harness。根据论文 Table 1 重绘。</text>
</svg>
