<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">完整模仿与 on-policy correction 在七个任务上的变化</title>
  <desc id="desc">相对 Qwen 在 evolved harness 下的 baseline，完整模仿七项全部下降，而 on-policy correction 五项上升、两项接近持平。</desc>
  <rect width="1400" height="760" fill="#fff"/>
  <style>.t{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20252b}.s{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#68737e}.l{font:650 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#2b333b}.v{font:700 16px ui-monospace,SFMono-Regular,Menlo,monospace}.axis{stroke:#9aa5ae;stroke-width:2}.grid{stroke:#e0e4e8;stroke-width:1}.note{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#53606b}</style>
  <text x="56" y="62" class="t">完整模仿七项全退；局部 correction 五项提高、两项在噪声内</text>
  <text x="56" y="96" class="s">相对 Qwen + evolved harness baseline 的百分点变化</text>
  <g transform="translate(260 142)">
    <line x1="600" y1="0" x2="600" y2="504" class="axis"/><line x1="120" y1="0" x2="120" y2="504" class="grid"/><line x1="360" y1="0" x2="360" y2="504" class="grid"/><line x1="720" y1="0" x2="720" y2="504" class="grid"/>
    <text x="120" y="530" class="s" text-anchor="middle">−30</text><text x="360" y="530" class="s" text-anchor="middle">−15</text><text x="600" y="530" class="s" text-anchor="middle">0</text><text x="720" y="530" class="s" text-anchor="middle">+7.5</text>
    <g transform="translate(0 12)"><text x="-22" y="27" class="l" text-anchor="end">Attendance</text><rect x="122" y="4" width="478" height="18" fill="#bd5b4f"/><rect x="594" y="27" width="6" height="18" fill="#2b7863"/><text x="112" y="19" class="v" fill="#9e433c" text-anchor="end">−29.9</text><text x="610" y="42" class="v" fill="#246a58">−0.4</text></g>
    <g transform="translate(0 82)"><text x="-22" y="27" class="l" text-anchor="end">Budget</text><rect x="430" y="4" width="170" height="18" fill="#bd5b4f"/><rect x="590" y="27" width="10" height="18" fill="#2b7863"/><text x="420" y="19" class="v" fill="#9e433c" text-anchor="end">−10.6</text><text x="610" y="42" class="v" fill="#246a58">−0.6</text></g>
    <g transform="translate(0 152)"><text x="-22" y="27" class="l" text-anchor="end">Stock</text><rect x="374" y="4" width="226" height="18" fill="#bd5b4f"/><rect x="600" y="27" width="35" height="18" fill="#2b7863"/><text x="364" y="19" class="v" fill="#9e433c" text-anchor="end">−14.1</text><text x="645" y="42" class="v" fill="#246a58">+2.2</text></g>
    <g transform="translate(0 222)"><text x="-22" y="27" class="l" text-anchor="end">Anomaly</text><rect x="533" y="4" width="67" height="18" fill="#bd5b4f"/><rect x="600" y="27" width="27" height="18" fill="#2b7863"/><text x="523" y="19" class="v" fill="#9e433c" text-anchor="end">−4.2</text><text x="637" y="42" class="v" fill="#246a58">+1.7</text></g>
    <g transform="translate(0 292)"><text x="-22" y="27" class="l" text-anchor="end">Playwright</text><rect x="344" y="4" width="256" height="18" fill="#bd5b4f"/><rect x="600" y="27" width="19" height="18" fill="#2b7863"/><text x="334" y="19" class="v" fill="#9e433c" text-anchor="end">−16.0</text><text x="629" y="42" class="v" fill="#246a58">+1.2</text></g>
    <g transform="translate(0 362)"><text x="-22" y="27" class="l" text-anchor="end">Website</text><rect x="275" y="4" width="325" height="18" fill="#bd5b4f"/><rect x="600" y="27" width="90" height="18" fill="#2b7863"/><text x="265" y="19" class="v" fill="#9e433c" text-anchor="end">−20.3</text><text x="700" y="42" class="v" fill="#246a58">+5.6</text></g>
    <g transform="translate(0 432)"><text x="-22" y="27" class="l" text-anchor="end">Refactor</text><rect x="454" y="4" width="146" height="18" fill="#bd5b4f"/><rect x="600" y="27" width="35" height="18" fill="#2b7863"/><text x="444" y="19" class="v" fill="#9e433c" text-anchor="end">−9.1</text><text x="645" y="42" class="v" fill="#246a58">+2.2</text></g>
  </g>
  <g transform="translate(975 190)"><rect width="350" height="198" fill="#f5f6f7" stroke="#d7dde2"/><rect x="28" y="30" width="28" height="14" fill="#bd5b4f"/><text x="72" y="43" class="l">Full imitation</text><rect x="28" y="76" width="28" height="14" fill="#2b7863"/><text x="72" y="89" class="l">On-policy correction</text><text x="28" y="136" class="note">论文只报告均值 ± SEM，</text><text x="28" y="163" class="note">未给 task-level 显著性检验。</text></g>
  <text x="56" y="724" class="note">根据论文 Table 1 重绘。百分点变化均以同一 Qwen base 在 h* 下的 78.0% 为比较条件。</text>
</svg>
