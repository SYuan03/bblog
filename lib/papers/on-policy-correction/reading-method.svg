<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1177" viewBox="0 0 600 1177" role="img" aria-labelledby="title desc"><title id="title">修第一个错误turn，保留学生其余执行内容</title><desc id="desc">根据 Appendix B 绘制 部署仍保留演化后的 harness h*</desc><rect width="600" height="1177" fill="#fff"/><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:32px;font-weight:750}.label{font-size:28px;font-weight:750}.main{font-size:28px}.small{font-size:24px}.value{font-size:32px;font-weight:750}</style><text x="24" y="66" class="title" fill="#20252d" text-anchor="start">修第一个错误turn，</text>
<text x="24" y="108" class="title" fill="#20252d" text-anchor="start">保留学生其余执行内容</text>
<text x="24" y="152" class="small" fill="#596575" text-anchor="start">根据 Appendix B 绘制</text>
<text x="24" y="190" class="small" fill="#596575" text-anchor="start">部署仍保留演化后的 harness h*</text>
<path d="M24 200H576" stroke="#d7dee7" stroke-width="2"/>
<rect x="24" y="223" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="262" class="label" fill="#365f85" text-anchor="start">1 · 学生先在 h* 下执行</text>
<text x="43" y="306" class="main" fill="#20252d" text-anchor="start">从 Qwen 的失败 rollout 出发。</text>
<text x="43" y="345" class="main" fill="#20252d" text-anchor="start">自动定位第一个错误 turn；</text>
<text x="43" y="384" class="main" fill="#20252d" text-anchor="start">turn 是一次回复与工具调用。</text>
<path d="M300 440v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="476" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="515" class="label" fill="#365f85" text-anchor="start">2 · 专家只修这一轮</text>
<text x="43" y="559" class="main" fill="#20252d" text-anchor="start">Gemini 读取任务、已有前文</text>
<text x="43" y="598" class="main" fill="#20252d" text-anchor="start">与失败检查点；生成一句策略</text>
<text x="43" y="637" class="main" fill="#20252d" text-anchor="start">及修正后的工具调用。</text>
<path d="M300 693v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="729" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="768" class="label" fill="#365f85" text-anchor="start">3 · 从三个候选里选一个</text>
<text x="43" y="812" class="main" fill="#20252d" text-anchor="start">另一质量评分者选择修正。</text>
<text x="43" y="851" class="main" fill="#20252d" text-anchor="start">替换这个turn，其余内容不变。</text>
<text x="43" y="890" class="main" fill="#20252d" text-anchor="start">加少量学生成功记录，再做SFT。</text>
<text x="24" y="981" class="main" fill="#20252d" text-anchor="start">并非重新生成整条成功轨迹。</text>
<text x="24" y="1019" class="main" fill="#20252d" text-anchor="start">论文未公开重新执行的比例；</text>
<text x="24" y="1057" class="main" fill="#20252d" text-anchor="start">“看起来合理”不等于重跑后通过。</text>
<text x="24" y="1105" class="small" fill="#596575" text-anchor="start">约400条修正+约50条成功记录，</text>
<text x="24" y="1143" class="small" fill="#596575" text-anchor="start">总量称约500；约数差额未解释。</text></svg>
