<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1251" viewBox="0 0 600 1251" role="img" aria-labelledby="title desc"><title id="title">规则学会了，执行方式仍可能变坏</title><desc id="desc">根据 Appendix D 的两条真实案例 作者未公开完整日志与 checker code</desc><rect width="600" height="1251" fill="#fff"/><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:32px;font-weight:750}.label{font-size:28px;font-weight:750}.main{font-size:28px}.small{font-size:24px}.value{font-size:32px;font-weight:750}</style><text x="24" y="66" class="title" fill="#20252d" text-anchor="start">规则学会了，</text>
<text x="24" y="108" class="title" fill="#20252d" text-anchor="start">执行方式仍可能变坏</text>
<text x="24" y="152" class="small" fill="#596575" text-anchor="start">根据 Appendix D 的两条真实案例</text>
<text x="24" y="190" class="small" fill="#596575" text-anchor="start">作者未公开完整日志与 checker code</text>
<path d="M24 200H576" stroke="#d7dee7" stroke-width="2"/>
<rect x="24" y="223" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="262" class="label" fill="#365f85" text-anchor="start">Payroll audit · 原始 Qwen</text>
<text x="43" y="306" class="main" fill="#20252d" text-anchor="start">按照计算 → 验证一次 → 提交。</text>
<text x="43" y="345" class="main" fill="#20252d" text-anchor="start">同一例三次都得到1.0，</text>
<text x="43" y="384" class="main" fill="#20252d" text-anchor="start">14到20步结束。</text>
<path d="M300 440v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="476" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="515" class="label" fill="#8c4646" text-anchor="start">完整模仿后的 Qwen</text>
<text x="43" y="559" class="main" fill="#20252d" text-anchor="start">部门汇总正确，却不结束。</text>
<text x="43" y="598" class="main" fill="#20252d" text-anchor="start">同一视图请求29次、提示重读约20次；</text>
<text x="43" y="637" class="main" fill="#20252d" text-anchor="start">78步没调用结束工具，得0。</text>
<path d="M24 690H576" stroke="#d7dee7" stroke-width="2"/>
<rect x="24" y="713" width="552" height="153" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="752" class="label" fill="#365f85" text-anchor="start">WebArena · 问 Approved 数量</text>
<text x="43" y="796" class="main" fill="#20252d" text-anchor="start">原始 Gemma 先筛选已批准状态，</text>
<text x="43" y="835" class="main" fill="#20252d" text-anchor="start">然后返回正确总数346。</text>
<path d="M300 891v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="927" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="966" class="label" fill="#8c4646" text-anchor="start">完整模仿后的 Gemma</text>
<text x="43" y="1010" class="main" fill="#20252d" text-anchor="start">进入网格就读“351 records found”，</text>
<text x="43" y="1049" class="main" fill="#20252d" text-anchor="start">没做Approved筛选，提前返回351。</text>
<text x="43" y="1088" class="main" fill="#20252d" text-anchor="start">错误不在计数运算，而在漏了一步。</text>
<text x="24" y="1179" class="small" fill="#596575" text-anchor="start">两个例子支持执行节奏发生变化，</text>
<text x="24" y="1217" class="small" fill="#596575" text-anchor="start">但不是随机抽取的全部错误分布。</text></svg>
