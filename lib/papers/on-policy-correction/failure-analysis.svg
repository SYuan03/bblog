<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">完整模仿改变了规划失败，而局部 correction 保持 planning fit</title>
  <desc id="desc">在 evolved harness 下，完整模仿使 planning failures 从 1.1% 增至 14.6%，局部 correction 为 1.8%；knowledge failures 分别为 46.2、44.5、43.2%。</desc>
  <rect width="1400" height="720" fill="#fff"/>
  <style>.t{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20252b}.s{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#68737e}.h{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#2b333b}.l{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#53606b}.v{font:750 19px ui-monospace,SFMono-Regular,Menlo,monospace}.axis{stroke:#d4dae0;stroke-width:1}.note{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#53606b}</style>
  <text x="56" y="62" class="t">知识学到了，规划节奏却坏了</text><text x="56" y="96" class="s">LLM classifier 对 hard-failure rollouts 的归因占比；三种 Qwen 条件都使用 evolved harness h*</text>
  <g transform="translate(70 150)"><text x="0" y="0" class="h">Planning failures</text><line x1="0" y1="390" x2="560" y2="390" class="axis"/>
    <g transform="translate(65 0)"><rect x="0" y="361" width="105" height="29" fill="#2d669f"/><text x="52" y="347" class="v" text-anchor="middle" fill="#2d669f">1.1%</text><text x="52" y="423" class="l" text-anchor="middle">base</text></g>
    <g transform="translate(230 0)"><rect x="0" y="1" width="105" height="389" fill="#bd5b4f"/><text x="52" y="-13" class="v" text-anchor="middle" fill="#a3443d">14.6%</text><text x="52" y="423" class="l" text-anchor="middle">imitation</text></g>
    <g transform="translate(395 0)"><rect x="0" y="342" width="105" height="48" fill="#2b7863"/><text x="52" y="328" class="v" text-anchor="middle" fill="#2b7863">1.8%</text><text x="52" y="423" class="l" text-anchor="middle">correction</text></g>
  </g>
  <g transform="translate(760 150)"><text x="0" y="0" class="h">Implicit-knowledge failures</text><line x1="0" y1="390" x2="560" y2="390" class="axis"/>
    <g transform="translate(65 0)"><rect x="0" y="20" width="105" height="370" fill="#2d669f"/><text x="52" y="6" class="v" text-anchor="middle" fill="#2d669f">46.2%</text><text x="52" y="423" class="l" text-anchor="middle">base</text></g>
    <g transform="translate(230 0)"><rect x="0" y="34" width="105" height="356" fill="#bd5b4f"/><text x="52" y="20" class="v" text-anchor="middle" fill="#a3443d">44.5%</text><text x="52" y="423" class="l" text-anchor="middle">imitation</text></g>
    <g transform="translate(395 0)"><rect x="0" y="44" width="105" height="346" fill="#2b7863"/><text x="52" y="30" class="v" text-anchor="middle" fill="#2b7863">43.2%</text><text x="52" y="423" class="l" text-anchor="middle">correction</text></g>
  </g>
  <rect x="56" y="642" width="1288" height="1" fill="#d7dde2"/><text x="56" y="677" class="note">根据论文 Table 3 重绘。这里是“各条件 hard failures 中的占比”，不是全部 rollouts 的失败率，也不是人工标注。</text>
</svg>
