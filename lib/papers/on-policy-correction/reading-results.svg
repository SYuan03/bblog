<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1191" viewBox="0 0 600 1191" role="img" aria-labelledby="title desc"><title id="title">强教师的完整模仿让同一harness下成绩退化</title><desc id="desc">根据 Table 1 重绘 · Qwen 七类任务无权平均，三次 mean ± SEM</desc><rect width="600" height="1191" fill="#fff"/><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:32px;font-weight:750}.label{font-size:28px;font-weight:750}.main{font-size:28px}.small{font-size:24px}.value{font-size:32px;font-weight:750}</style><text x="24" y="66" class="title" fill="#20252d" text-anchor="start">强教师的完整模仿</text>
<text x="24" y="108" class="title" fill="#20252d" text-anchor="start">让同一harness下成绩退化</text>
<text x="24" y="152" class="small" fill="#596575" text-anchor="start">根据 Table 1 重绘 · Qwen</text>
<text x="24" y="190" class="small" fill="#596575" text-anchor="start">七类任务无权平均，三次 mean ± SEM</text>
<path d="M24 200H576" stroke="#d7dee7" stroke-width="2"/>
<text x="24" y="261" class="label" fill="#20252d" text-anchor="start">同一模型家族的平均成功率</text>
<text x="24" y="302" class="main" fill="#20252d" text-anchor="start">基础 harness h0</text>
<text x="576" y="302" class="value" fill="#7e8997" text-anchor="end">29.2 ± 0.61</text>
<rect x="24" y="320" width="552" height="12" fill="#e6ebf1"/><rect x="24" y="320" width="161.184" height="12" fill="#7e8997"/>
<text x="24" y="386" class="main" fill="#20252d" text-anchor="start">演化 harness h*</text>
<text x="576" y="386" class="value" fill="#365f85" text-anchor="end">78.0 ± 0.97</text>
<rect x="24" y="404" width="552" height="12" fill="#e6ebf1"/><rect x="24" y="404" width="430.56" height="12" fill="#365f85"/>
<text x="24" y="470" class="main" fill="#20252d" text-anchor="start">h* + 完整模仿</text>
<text x="576" y="470" class="value" fill="#8c4646" text-anchor="end">63.1 ± 0.81</text>
<rect x="24" y="488" width="552" height="12" fill="#e6ebf1"/><rect x="24" y="488" width="348.31200000000007" height="12" fill="#8c4646"/>
<text x="24" y="554" class="main" fill="#20252d" text-anchor="start">h* + 局部修正</text>
<text x="576" y="554" class="value" fill="#357067" text-anchor="end">79.7 ± 0.67</text>
<rect x="24" y="572" width="552" height="12" fill="#e6ebf1"/><rect x="24" y="572" width="439.944" height="12" fill="#357067"/>
<rect x="24" y="614" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="653" class="label" fill="#365f85" text-anchor="start">负结果：七项全部下降</text>
<text x="43" y="697" class="main" fill="#20252d" text-anchor="start">完整模仿相对原 Qwen + h*，</text>
<text x="43" y="736" class="main" fill="#20252d" text-anchor="start">各任务低4.2到29.9个百分点。</text>
<text x="43" y="775" class="main" fill="#20252d" text-anchor="start">成功教师轨迹不保证兼容学生节奏。</text>
<path d="M300 831v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="867" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="906" class="label" fill="#365f85" text-anchor="start">机制诊断的边界</text>
<text x="43" y="950" class="main" fill="#20252d" text-anchor="start">零分轨迹中 planning failures：</text>
<text x="43" y="989" class="main" fill="#20252d" text-anchor="start">完整模仿14.6%，局部修正1.8%。</text>
<text x="43" y="1028" class="main" fill="#20252d" text-anchor="start">分类由LLM完成，未给人工一致性。</text>
<text x="24" y="1119" class="small" fill="#596575" text-anchor="start">局部修正没有移除h*；</text>
<text x="24" y="1157" class="small" fill="#596575" text-anchor="start">也未证明能跨到另一工具接口。</text></svg>
