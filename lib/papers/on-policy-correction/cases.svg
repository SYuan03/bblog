<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">完整模仿后，学生模型的两种执行失败</title>
  <desc id="desc">Payroll case 中模型算对结果却循环查看 29 次并在 78 步内未提交；WebArena case 中模型跳过筛选，把 351 条全部评论当成 346 条 Approved 评论。</desc>
  <rect width="1400" height="760" fill="#fff"/>
  <style>.t{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20252b}.s{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#68737e}.h{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20252b}.tag{font:750 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}.p{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#495660}.n{font:750 29px ui-monospace,SFMono-Regular,Menlo,monospace}.line{stroke:#cfd6dc;stroke-width:2}.note{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#53606b}</style>
  <text x="56" y="62" class="t">计算规则学会了，检查与提交的步骤却可能出错</text><text x="56" y="96" class="s">根据 Appendix D 两条叙述性失败例重绘：左边算对却不提交，右边漏筛选就提交；不是原始逐步日志</text>
  <g transform="translate(56 140)"><rect width="620" height="500" fill="#f7f9fa" stroke="#d5dce1"/><text x="30" y="42" class="tag" fill="#2d669f">CASE 1 · PAYROLL AUDIT · QWEN</text><text x="30" y="84" class="h">算对部门汇总，却没有提交</text>
    <line x1="74" y1="132" x2="74" y2="426" class="line"/>
    <circle cx="74" cy="151" r="14" fill="#2b7863"/><text x="108" y="157" class="p">演化后的 harness 要求：计算 → 验证一次 → 提交</text>
    <circle cx="74" cy="235" r="14" fill="#2b7863"/><text x="108" y="229" class="p">完整模仿后的 Qwen 仍算出正确部门汇总</text><text x="108" y="256" class="p">作者描述评分器记录了正确结果</text>
    <circle cx="74" cy="326" r="14" fill="#bd5b4f"/><text x="108" y="320" class="p">同一视图查看 29 次，任务提示约重读 20 次</text><text x="108" y="347" class="p">反复检查，始终没有结束任务</text>
    <circle cx="74" cy="418" r="14" fill="#bd5b4f"/><text x="108" y="412" class="n" fill="#a3443d">78 步 → 0 分</text><text x="108" y="445" class="p">未调用 finish 提交，二元成功分仍为 0</text>
  </g>
  <g transform="translate(724 140)"><rect width="620" height="500" fill="#f7f9fa" stroke="#d5dce1"/><text x="30" y="42" class="tag" fill="#6e5aa8">CASE 2 · WEBARENA · GEMMA</text><text x="30" y="84" class="h">把全部评论数当成 Approved 数</text>
    <line x1="74" y1="132" x2="74" y2="426" class="line"/>
    <circle cx="74" cy="151" r="14" fill="#2b7863"/><text x="108" y="145" class="p">定位 status（审核状态）列，筛选 Approved</text><text x="108" y="172" class="p">然后读取筛选后的总数，按规定格式提交</text>
    <circle cx="74" cy="248" r="14" fill="#bd5b4f"/><text x="108" y="242" class="p">完整模仿后的 Gemma 更简短、更早作答</text><text x="108" y="269" class="p">却跳过了“先筛选再计数”</text>
    <circle cx="74" cy="344" r="14" fill="#bd5b4f"/><text x="108" y="338" class="n" fill="#a3443d">351</text><text x="194" y="338" class="p">未筛选表格的 “records found”</text><text x="108" y="369" class="p">把全部记录数直接提交</text>
    <circle cx="74" cy="426" r="14" fill="#2b7863"/><text x="108" y="420" class="n" fill="#2b7863">正确数 = 346</text><text x="108" y="451" class="p">只有筛选 Approved 后才得到这个数量</text>
  </g>
  <text x="56" y="704" class="note">来源：Appendix D；未公开原始任务、逐步日志或评分脚本。局部修正训练数据也未披露重新执行比例，不等于环境验收通过。</text>
</svg>
