<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 326" width="900" height="326" role="img" aria-label="基于官方汽车修复日志重绘控制机制，具体输入阈值和成功分母"><title>基于官方汽车修复日志重绘控制机制，具体输入阈值和成功分母</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2676c9"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="18" y="29" fill="#172535" font-size="22" font-weight="bold" text-anchor="start">修汽车：插入一个会在过障碍后关闭的控制路径</text><rect x="18" y="66" width="200" height="140" fill="#edf3f7" stroke="#bac9d5"/><text x="30" y="97" fill="#2676c9" font-size="20" font-weight="bold" text-anchor="start">读状态</text><text x="30" y="134" fill="#172535" font-size="17" font-weight="normal" text-anchor="start">车身位置 / 速度</text><text x="30" y="171" fill="#172535" font-size="17" font-weight="normal" text-anchor="start">绿色车轮位置</text><path d="M218,135 L236,135" stroke="#2676c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="238" y="66" width="200" height="140" fill="#edf3f7" stroke="#bac9d5"/><text x="250" y="97" fill="#2676c9" font-size="20" font-weight="bold" text-anchor="start">后退蓄距离</text><text x="250" y="134" fill="#172535" font-size="17" font-weight="normal" text-anchor="start">从静止先向右</text><text x="250" y="171" fill="#172535" font-size="17" font-weight="normal" text-anchor="start">到车身 x ≈ 3.8</text><path d="M438,135 L456,135" stroke="#2676c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="458" y="66" width="200" height="140" fill="#edf3f7" stroke="#bac9d5"/><text x="470" y="97" fill="#2676c9" font-size="20" font-weight="bold" text-anchor="start">加速向左</text><text x="470" y="134" fill="#172535" font-size="17" font-weight="normal" text-anchor="start">持续全力驱动</text><text x="470" y="171" fill="#172535" font-size="17" font-weight="normal" text-anchor="start">越过红条</text><path d="M658,135 L676,135" stroke="#2676c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="678" y="66" width="200" height="140" fill="#edf3f7" stroke="#bac9d5"/><text x="690" y="97" fill="#2676c9" font-size="20" font-weight="bold" text-anchor="start">关闭新路径</text><text x="690" y="134" fill="#172535" font-size="17" font-weight="normal" text-anchor="start">绿轮中心 x &lt; 0.95</text><text x="690" y="171" fill="#172535" font-size="17" font-weight="normal" text-anchor="start">交回已有策略</text><text x="18" y="243" fill="#172535" font-size="18" font-weight="normal" text-anchor="start">输入：权重 + 场景 + 一段失败轨迹。一次回复，无执行工具或新反馈。</text><text x="18" y="278" fill="#287455" font-size="18" font-weight="normal" text-anchor="start">6073 / 171664 = 3.54% 参数改变；独立测试1024 / 1024成功。</text><text x="18" y="308" fill="#526575" font-size="17" font-weight="normal" text-anchor="start">这是单个 Kinetix 关卡；位置阈值来自作者公开的修复日志。</text></g></svg>