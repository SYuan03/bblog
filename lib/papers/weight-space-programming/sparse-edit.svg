<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 373" width="900" height="373" role="img" aria-label="Qwen两层MLP的稀疏方向干预公式，实际强度6，选中列方向分量反转并放大"><title>Qwen两层MLP的稀疏方向干预公式，实际强度6，选中列方向分量反转并放大</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2676c9"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="18" y="28" fill="#172535" font-size="22" font-weight="bold" text-anchor="start">Qwen 的实际修改：仅选中的 MLP 输出列</text><rect x="18" y="56" width="160" height="158" fill="#edf3f7" stroke="#bac9d5"/><text x="32" y="85" fill="#2676c9" font-size="20" font-weight="bold" text-anchor="start">MLP 激活 a</text><text x="32" y="119" fill="#172535" font-size="18" font-weight="normal" text-anchor="start">3584 维</text><text x="32" y="150" fill="#172535" font-size="17" font-weight="normal" text-anchor="start">每一维对应</text><text x="32" y="176" fill="#172535" font-size="17" font-weight="normal" text-anchor="start">一个中间神经元</text><path d="M178,131 L212,131" stroke="#2676c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="217" y="56" width="294" height="158" fill="#edf3f7" stroke="#bac9d5"/><text x="231" y="82" fill="#2676c9" font-size="20" font-weight="bold" text-anchor="start">W：1024 × 3584</text><rect x="230" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="240" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="250" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="260" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="270" y="98" width="7" height="75" fill="#c56532" stroke="none"/><rect x="280" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="290" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="300" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="310" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="320" y="98" width="7" height="75" fill="#c56532" stroke="none"/><rect x="330" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="340" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="350" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="360" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="370" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="380" y="98" width="7" height="75" fill="#c56532" stroke="none"/><rect x="390" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="400" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="410" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="420" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="430" y="98" width="7" height="75" fill="#c56532" stroke="none"/><rect x="440" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="450" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="460" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><rect x="470" y="98" width="7" height="75" fill="#d6e3ef" stroke="none"/><text x="231" y="197" fill="#526575" font-size="16" font-weight="normal" text-anchor="start">橙列示意每层选中的64列</text><path d="M511,131 L545,131" stroke="#2676c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="550" y="56" width="330" height="158" fill="#edf3f7" stroke="#bac9d5"/><text x="565" y="85" fill="#2676c9" font-size="20" font-weight="bold" text-anchor="start">写回残差：W a</text><text x="565" y="118" fill="#172535" font-size="17" font-weight="normal" text-anchor="start">1024 维循环相关方向 u</text><text x="565" y="150" fill="#172535" font-size="17" font-weight="normal" text-anchor="start">只修改这些列沿 u 的分量</text><text x="565" y="182" fill="#172535" font-size="17" font-weight="normal" text-anchor="start">层号15、19（从0计数）</text><rect x="18" y="236" width="862" height="63" fill="#edf3f7" stroke="#bac9d5"/><text x="32" y="261" fill="#2676c9" font-size="22" font-weight="normal" text-anchor="start">W′ = W₀ − 6 · u [mask₆₄ ⊙ (uᵀW₀)]</text><text x="32" y="285" fill="#172535" font-size="17" font-weight="normal" text-anchor="start">u 为单位向量；未选中列保持原值；系数6来自最终日志。</text><text x="18" y="329" fill="#c56532" font-size="18" font-weight="normal" text-anchor="start">选中列沿 u 的分量 c → −5c；这不是系数1的正交投影。</text><text x="18" y="356" fill="#526575" font-size="17" font-weight="normal" text-anchor="start">触及131,072位置；BF16量化后130,188个数值实际改变。</text></g></svg>