<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 337" width="900" height="337" role="img" aria-label="作者用Codex调用Astra，由自建沙箱与前向服务执行模型回复；反馈返回Astra"><title>作者用Codex调用Astra，由自建沙箱与前向服务执行模型回复；反馈返回Astra</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2676c9"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="18" y="28" fill="#172535" font-size="22" font-weight="bold" text-anchor="start">谁调用、谁执行、谁被修改</text><rect x="18" y="60" width="200" height="105" fill="#edf3f7" stroke="#bac9d5"/><text x="32" y="88" fill="#2676c9" font-size="20" font-weight="bold" text-anchor="start">作者准备</text><text x="32" y="118" fill="#172535" font-size="18" font-weight="normal" text-anchor="start">目标权重 + 任务</text><text x="32" y="146" fill="#526575" font-size="16" font-weight="normal" text-anchor="start">练习数据与预算</text><path d="M218,113 L236,113" stroke="#2676c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="238" y="60" width="200" height="105" fill="#edf3f7" stroke="#bac9d5"/><text x="252" y="88" fill="#2676c9" font-size="20" font-weight="bold" text-anchor="start">Astra</text><text x="252" y="118" fill="#172535" font-size="18" font-weight="normal" text-anchor="start">读数值、提出假设</text><text x="252" y="146" fill="#526575" font-size="16" font-weight="normal" text-anchor="start">输出 Python / 请求</text><path d="M438,113 L456,113" stroke="#2676c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="458" y="60" width="200" height="105" fill="#edf3f7" stroke="#bac9d5"/><text x="472" y="88" fill="#2676c9" font-size="20" font-weight="bold" text-anchor="start">作者沙箱</text><text x="472" y="118" fill="#172535" font-size="18" font-weight="normal" text-anchor="start">CPU 数组运算</text><text x="472" y="146" fill="#526575" font-size="16" font-weight="normal" text-anchor="start">写出候选权重</text><path d="M658,113 L676,113" stroke="#2676c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="678" y="60" width="200" height="105" fill="#edf3f7" stroke="#bac9d5"/><text x="692" y="88" fill="#2676c9" font-size="20" font-weight="bold" text-anchor="start">专门前向服务</text><text x="692" y="118" fill="#172535" font-size="18" font-weight="normal" text-anchor="start">运行目标网络</text><text x="692" y="146" fill="#526575" font-size="16" font-weight="normal" text-anchor="start">返回结果或内部量</text><path d="M788,174 L788,207" stroke="#a2b4c0" stroke-width="2" fill="none"/><path d="M788,207 L340,207" stroke="#2676c9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="417" y="231" fill="#2676c9" font-size="17" font-weight="normal" text-anchor="start">下一轮反馈：Astra 继续诊断和修改</text><rect x="18" y="253" width="860" height="66" fill="#fbf3ed" stroke="#bac9d5"/><text x="33" y="279" fill="#172535" font-size="18" font-weight="normal" text-anchor="start">Codex CLI 负责调用 Astra；内置终端、文件编辑、网页等工具关闭。</text><text x="33" y="305" fill="#526575" font-size="17" font-weight="normal" text-anchor="start">目标网络独立存在。修改的是它的张量，不是 Astra 自己的权重。</text></g></svg>