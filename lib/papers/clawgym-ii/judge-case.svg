<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A real ClawGym-Bench task and its hidden judge</title>
  <desc id="desc">The evaluated agent sees the remediation-team prompt and workspace files, produces four output files, while a hidden Python checker computes fifteen binary metrics and GPT-5.4 scores two rubrics. The task score is 0.7 code plus 0.3 rubric.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#285d9b"/></marker><style>.t{font-family:Arial,"PingFang SC",sans-serif;fill:#20252b}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.h{font-size:48px;font-weight:700}.s{font-size:19px;fill:#66717b}.k{font-size:15px;font-weight:700;letter-spacing:1.4px;fill:#285d9b}.box{fill:#fff;stroke:#cfd4da;stroke-width:2}.blue{fill:#eef4fb;stroke:#285d9b;stroke-width:3}.red{fill:#fff0ef;stroke:#a0443d;stroke-width:3}.green{fill:#edf7f2;stroke:#2b7562;stroke-width:3}.bt{font-size:22px;font-weight:700}.bd{font-size:16px;fill:#59636e}.ln{stroke:#285d9b;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="72" y="72" class="t k">OFFICIAL BENCH CASE · benchmark_data.jsonl LINE 1</text>
  <text x="72" y="132" class="t h">真实周报任务：从文件输出到隐藏检查与连续得分</text>
  <text x="72" y="173" class="t s">任务来自合成池，经难度筛选与人工／模型复核入选；本文构造输出并运行原检查器，不是模型执行日志。</text>

  <rect x="70" y="230" width="405" height="505" rx="8" class="blue"/>
  <text x="98" y="274" class="t bt">Agent 看得到</text>
  <text x="98" y="314" class="t bd">user prompt</text><text x="118" y="340" class="t bd">运行 summarizer 与 pytest；生成周报和公告</text>
  <text x="98" y="382" class="t bd">workspace inputs</text>
  <text x="118" y="408" class="t m" font-size="15">data/tasks.csv</text><text x="118" y="434" class="t m" font-size="15">data/updates.jsonl</text><text x="118" y="460" class="t m" font-size="15">input/draft_announcement.txt</text><text x="118" y="486" class="t m" font-size="15">tools/summarize.py · tests/*.py</text>
  <line x1="98" y1="516" x2="448" y2="516" stroke="#aac1d8"/>
  <text x="98" y="552" class="t bd">必须交付到 build/</text>
  <text x="118" y="580" class="t m" font-size="15">summary.json · test_results.txt</text><text x="118" y="608" class="t m" font-size="15">status_report.md</text><text x="118" y="636" class="t m" font-size="15">announcement_rewrite.txt</text>
  <text x="98" y="680" class="t bd">提示里明说：公告 &lt;120 words，含</text><text x="118" y="706" class="t m" font-size="15">thank you · let's coordinate · 4 statuses</text>

  <path d="M475 486 H552" class="ln"/>
  <rect x="552" y="230" width="452" height="505" rx="8" class="red"/>
  <text x="580" y="274" class="t bt">Agent 看不到</text>
  <text x="580" y="314" class="t m" font-size="15">reward/test.py</text>
  <text x="580" y="345" class="t bd">Agent 结束后才注入；读取最终 workspace。</text>
  <text x="580" y="390" class="t bt" font-size="19">15 个 code metrics，等权平均</text>
  <text x="600" y="424" class="t bd">文件存在、统计重算、提交日志显示通过</text><text x="600" y="452" class="t bd">标题、状态数、单行 JSON、更新4→3→2</text><text x="600" y="480" class="t bd">受阻／进行中列表、公告约束</text>
  <text x="580" y="526" class="t m" font-size="18">s_code = Σ bᵢ / 15</text>
  <line x1="580" y1="553" x2="976" y2="553" stroke="#deb3af"/>
  <text x="580" y="590" class="t bt" font-size="19">2 个 rubric，GPT-5.4 判分</text>
  <text x="600" y="624" class="t bd">constructive &amp; collaborative tone</text><text x="600" y="652" class="t bd">actionability of reply request</text>
  <text x="580" y="696" class="t m" font-size="18">s_rubric = (q₁ + q₂) / 2</text>

  <path d="M1004 486 H1081" class="ln"/>
  <rect x="1081" y="230" width="449" height="505" rx="8" class="green"/>
  <text x="1109" y="274" class="t bt">论文配置怎样聚合</text>
  <text x="1109" y="329" class="t m" font-size="23">s_task = 0.7 · s_code</text>
  <text x="1210" y="365" class="t m" font-size="23">+ 0.3 · s_rubric</text>
  <line x1="1109" y1="402" x2="1500" y2="402" stroke="#acd0c1"/>
  <text x="1109" y="445" class="t bt" font-size="19">颠倒三条更新，只丢一项</text>
  <text x="1129" y="478" class="t bd">程序14/15；假设两条模型评分仍为1：</text>
  <text x="1129" y="506" class="t m" font-size="17">0.7 × 14/15 + 0.3 = 0.9533</text>
  <text x="1109" y="554" class="t bt" font-size="19">公开实现与论文配置不同</text>
  <text x="1129" y="587" class="t bd">CLI 默认权重0.5／0.5，需显式改为</text><text x="1129" y="613" class="t bd">0.7／0.3；整题缺分不进入平均分母。</text><text x="1129" y="639" class="t bd">公告缺失时，长度分和另外三项全为0。</text>
  <text x="1109" y="688" class="t bd">未调用模型评分；计算的总分有条件。</text><text x="1109" y="716" class="t bd">公开平均连续得分，非“全过才成功”。</text>
  <text x="72" y="793" class="t s" font-size="16">证据边界：仓库 c8cbd1d。论文 Appendix A 包括其他修改文件与可选执行记录，公开评分提示只传任务、评分目标文件和规则。</text>
  <text x="72" y="844" class="t s" font-size="15">来源：benchmark_data.jsonl 第一行、reward.py、judge.py、runner.py；测试日志只做文本匹配，不独立重跑 pytest。</text>
</svg>
