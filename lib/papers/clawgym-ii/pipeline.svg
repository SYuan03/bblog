<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ClawGym II black-box reinforcement learning pipeline</title>
  <desc id="desc">A task and workspace enter a sandbox running OpenClaw or Claude Code. A serving proxy records exact tokens and rollout log probabilities. Calls are reconstructed into a prefix tree, a hidden verifier scores the final workspace, and PPO or GRPO updates the shared policy.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#285d9b"/></marker>
    <style>
      .t{font-family:Arial,"PingFang SC",sans-serif;fill:#20252b}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.h{font-size:48px;font-weight:700}.s{font-size:21px;fill:#66717b}.k{font-size:15px;font-weight:700;letter-spacing:1.5px;fill:#285d9b}.box{fill:#fff;stroke:#cfd4da;stroke-width:2}.boxb{fill:#eef4fb;stroke:#285d9b;stroke-width:3}.boxg{fill:#edf7f2;stroke:#2b7562;stroke-width:3}.boxo{fill:#fff3ec;stroke:#ad5735;stroke-width:3}.bt{font-size:24px;font-weight:700}.bd{font-size:17px;fill:#4f5964}.ln{stroke:#285d9b;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8f5ee"/>
  <text x="74" y="72" class="t k">根据论文 FIGURE 1 与 §3 重绘</text>
  <text x="74" y="132" class="t h">Harness 不动，训练系统在模型边界接线</text>
  <text x="74" y="172" class="t s">黑盒的是 OpenClaw / Claude Code 的 control flow；policy 权重仍然可训练。</text>

  <rect x="70" y="248" width="230" height="250" rx="8" class="box"/>
  <text x="95" y="290" class="t bt">① Task</text>
  <text x="95" y="329" class="t bd">user instruction</text>
  <text x="95" y="360" class="t bd">initial workspace W₀</text>
  <text x="95" y="391" class="t bd">task-specific verifier</text>
  <line x1="95" y1="420" x2="275" y2="420" stroke="#cfd4da"/>
  <text x="95" y="455" class="t m" font-size="17">q = (u, W₀)</text>

  <path d="M300 373 H365" class="ln"/>
  <rect x="365" y="220" width="315" height="310" rx="8" class="boxb"/>
  <text x="392" y="266" class="t bt">② Ephemeral sandbox</text>
  <rect x="399" y="299" width="247" height="78" rx="5" fill="#fff" stroke="#9cb9d6"/>
  <text x="422" y="333" class="t bt" font-size="21">Native harness</text>
  <text x="422" y="360" class="t bd">OpenClaw / Claude Code</text>
  <rect x="399" y="396" width="113" height="76" rx="5" fill="#fff" stroke="#9cb9d6"/>
  <text x="418" y="430" class="t bt" font-size="19">Tools</text>
  <text x="418" y="455" class="t bd">CLI · files</text>
  <rect x="533" y="396" width="113" height="76" rx="5" fill="#fff" stroke="#9cb9d6"/>
  <text x="551" y="430" class="t bt" font-size="19">MCP</text>
  <text x="551" y="455" class="t bd">web · APIs</text>
  <text x="392" y="505" class="t bd">每条 rollout 独立创建，结束后销毁</text>

  <path d="M680 373 H742" class="ln"/>
  <rect x="742" y="248" width="252" height="250" rx="8" class="boxo"/>
  <text x="768" y="290" class="t bt">③ Serving proxy</text>
  <text x="768" y="329" class="t bd">exact input tokens</text>
  <text x="768" y="360" class="t bd">generated tokens</text>
  <text x="768" y="391" class="t bd">rollout log-prob</text>
  <text x="768" y="422" class="t bd">task metadata</text>
  <line x1="768" y1="447" x2="967" y2="447" stroke="#dcb59f"/>
  <text x="768" y="475" class="t m" font-size="15">model API boundary</text>

  <path d="M994 373 H1056" class="ln"/>
  <rect x="1056" y="220" width="250" height="310" rx="8" class="box"/>
  <text x="1082" y="266" class="t bt">④ Prefix tree</text>
  <circle cx="1123" cy="321" r="11" fill="#285d9b"/><circle cx="1179" cy="366" r="11" fill="#285d9b"/><circle cx="1240" cy="410" r="11" fill="#2b7562"/><circle cx="1179" cy="454" r="11" fill="#a0443d"/>
  <path d="M1123 332 L1179 355 M1189 374 L1231 402 M1188 374 L1180 443" stroke="#6c7680" stroke-width="4" fill="none"/>
  <text x="1082" y="488" class="t bd">shared prefix 只计一次</text>

  <path d="M1306 373 H1362" class="ln"/>
  <rect x="1362" y="248" width="170" height="250" rx="8" class="boxg"/>
  <text x="1385" y="290" class="t bt">⑤ Update</text>
  <text x="1385" y="332" class="t bd">GRPO</text>
  <text x="1385" y="363" class="t bd">PPO + value</text>
  <text x="1385" y="410" class="t m" font-size="16">πθ ← reward</text>
  <path d="M1446 499 V614 H866 V507" class="ln"/>
  <text x="1122" y="646" class="t bd">新参数同步到 inference engine</text>

  <rect x="70" y="626" width="512" height="166" rx="8" fill="#fff" stroke="#2b7562" stroke-width="3"/>
  <text x="98" y="671" class="t bt">Verifier 在 rollout 结束后读取最终 workspace</text>
  <text x="98" y="710" class="t bd">code checker：确定性检查输出文件与计算结果</text>
  <text x="98" y="744" class="t bd">rubric judge：只看任务、指定输出、rubric 与可选 transcript</text>
  <text x="98" y="778" class="t m" font-size="17">reward → all retained branches in one rollout</text>
  <path d="M365 531 V709 H582" class="ln"/>

  <rect x="642" y="686" width="890" height="106" rx="8" fill="#20252b"/>
  <text x="670" y="726" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#fff">两条一致性约束</text>
  <text x="670" y="762" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#dce3ea">token-in-token-out 保留 rollout 原始 token；token-level importance correction 缓解 inference / training 概率差。</text>
  <text x="74" y="856" class="t s" font-size="15">Source: ClawGym II, Figure 1 and Sections 3.1–3.2. This is an explanatory redraw; the paper uses arXiv’s non-exclusive distribution license.</text>
</svg>
