<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1630" viewBox="0 0 600 1630" role="img" aria-labelledby="title desc">
<title id="title">实际运行周报检查器：顺序颠倒怎样失分</title>
<desc id="desc">ClawGym-Bench 固定版本第一条合成任务。本文构造输出并运行原检查器，最新更新应按任务4、3、2排列，反序只丢1项。程序检查15项、模型评分两条；论文权重0.7和0.3，公开默认0.5和0.5。公告缺失不获得长度分，测试日志却仅做文字匹配。未调用模型评分器。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial,sans-serif;fill:#20252b}.h{font-size:32px;font-weight:750}.label{font-size:28px;font-weight:700;fill:#365f85}.main{font-size:27px}.small{font-size:23px;fill:#596575}.box{fill:#f5f7f9;stroke:#d7dee7;stroke-width:2}.arrow{fill:none;stroke:#365f85;stroke-width:3}</style>
<rect width="600" height="1630" fill="#fff"/>
<text x="24" y="62" class="h">一份周报怎样得到分数？</text>
<text x="24" y="106" class="small">公开任务第一条 · 仓库 c8cbd1d</text>
<path d="M24 126H576" stroke="#d7dee7" stroke-width="2"/>
<rect x="24" y="150" width="552" height="215" class="box"/>
<text x="43" y="191" class="label">1 · Agent 读取已有文件</text>
<text x="43" y="236" class="main">CSV 共7题：待办2、进行中2、</text>
<text x="43" y="276" class="main">完成2、受阻1；还可读更新记录、</text>
<text x="43" y="316" class="main">公告草稿、摘要程序与公开测试。</text>
<path d="M300 380v24m-8-8 8 8 8-8" class="arrow"/>
<rect x="24" y="423" width="552" height="215" class="box"/>
<text x="43" y="464" class="label">2 · 生成四个交付文件</text>
<text x="43" y="509" class="main">build/ 内写统计、测试日志、</text>
<text x="43" y="549" class="main">周报与公告。最新更新应为：</text>
<text x="43" y="589" class="main">任务4（4/15）→3→2（4/14）。</text>
<path d="M300 653v24m-8-8 8 8 8-8" class="arrow"/>
<rect x="24" y="696" width="552" height="215" class="box"/>
<text x="43" y="737" class="label">3 · 结束后执行隐藏评分</text>
<text x="43" y="782" class="main">原 Python 检查器返回15项0/1。</text>
<text x="43" y="822" class="main">论文另用 GPT-5.4 评两条规则：</text>
<text x="43" y="862" class="main">语气友善、回复要求明确。</text>
<path d="M300 926v24m-8-8 8 8 8-8" class="arrow"/>
<rect x="24" y="969" width="552" height="235" class="box"/>
<text x="43" y="1010" class="label">4 · 本文只颠倒更新顺序</text>
<text x="43" y="1055" class="main">程序检查从15/15变为14/15。</text>
<text x="43" y="1095" class="main">若两条模型评分仍为1，论文配置：</text>
<text x="43" y="1135" class="main">0.7 × 14/15 + 0.3 = 0.9533。</text>
<text x="43" y="1177" class="small">未调用评分模型；总分是条件计算。</text>
<rect x="24" y="1240" width="552" height="265" class="box"/>
<text x="43" y="1281" class="label">实测发现的评分边界</text>
<text x="43" y="1326" class="main">公告不存在：四项全0，非长度满分。</text>
<text x="43" y="1366" class="main">日志只写 passed：通过项仍为1。</text>
<text x="43" y="1406" class="main">原样复制多行 JSON：失去一项。</text>
<text x="43" y="1446" class="main">公开默认权重0.5/0.5，与论文不同。</text>
<text x="24" y="1553" class="small">来源：实际发布的任务与评分代码。</text>
<text x="24" y="1591" class="small">输出由本文构造，不是作者模型日志。</text>
</svg>
