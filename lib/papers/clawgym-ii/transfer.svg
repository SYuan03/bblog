<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">White-box versus black-box transfer in ClawGym II</title>
  <desc id="desc">WhiteBox-30A3B scores 59.90 in the white-box AgentLoop but 50.33 in OpenClaw. The model trained directly with OpenClaw scores 62.62 in OpenClaw, showing a harness-specific gap.</desc>
  <defs><style>.t{font-family:Arial,"PingFang SC",sans-serif;fill:#20252b}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.h{font-size:49px;font-weight:700}.s{font-size:20px;fill:#66717b}.k{font-size:15px;font-weight:700;letter-spacing:1.5px;fill:#285d9b}.panel{fill:#fff;stroke:#cfd4da;stroke-width:2}.lab{font-size:19px;font-weight:700}.num{font-size:22px;font-weight:800}</style></defs>
  <rect width="1600" height="900" fill="#f8f5ee"/>
  <text x="76" y="72" class="t k">WHITE-BOX TRANSFER · TABLE 2 REDRAW</text>
  <text x="76" y="132" class="t h">通用 agent 能力会迁移，harness-specific 行为不会自动补齐</text>
  <text x="76" y="174" class="t s">同一 ClawGym-Bench，在 white-box AgentLoop 与 OpenClaw 下分别评测。</text>
  <rect x="76" y="236" width="696" height="490" rx="8" class="panel"/>
  <text x="112" y="288" class="t lab">评测 harness：White-Box AgentLoop</text>
  <line x1="334" y1="350" x2="710" y2="350" stroke="#d9dde2" stroke-width="28"/><line x1="334" y1="350" x2="490.8" y2="350" stroke="#b8c2cc" stroke-width="28"/><text x="112" y="358" class="t s">Qwen3-30A3B</text><text x="512" y="358" class="t m num">41.69</text>
  <line x1="334" y1="448" x2="710" y2="448" stroke="#d9dde2" stroke-width="28"/><line x1="334" y1="448" x2="527.1" y2="448" stroke="#ad5735" stroke-width="28"/><text x="112" y="456" class="t s">ClawII-OC</text><text x="548" y="456" class="t m num">51.37</text>
  <line x1="334" y1="546" x2="710" y2="546" stroke="#d9dde2" stroke-width="28"/><line x1="334" y1="546" x2="559.2" y2="546" stroke="#2b7562" stroke-width="28"/><text x="112" y="554" class="t s">WhiteBox</text><text x="580" y="554" class="t m num">59.90</text>
  <text x="112" y="638" class="t s">直接在同一 loop 训练的 WhiteBox 最强。</text>

  <rect x="828" y="236" width="696" height="490" rx="8" class="panel"/>
  <text x="864" y="288" class="t lab">评测 harness：OpenClaw</text>
  <line x1="1086" y1="350" x2="1462" y2="350" stroke="#d9dde2" stroke-width="28"/><line x1="1086" y1="350" x2="1255.6" y2="350" stroke="#b8c2cc" stroke-width="28"/><text x="864" y="358" class="t s">Qwen3-30A3B</text><text x="1276" y="358" class="t m num">45.11</text>
  <line x1="1086" y1="448" x2="1462" y2="448" stroke="#d9dde2" stroke-width="28"/><line x1="1086" y1="448" x2="1321.5" y2="448" stroke="#285d9b" stroke-width="28"/><text x="864" y="456" class="t s">ClawII-OC</text><text x="1342" y="456" class="t m num">62.62</text>
  <line x1="1086" y1="546" x2="1462" y2="546" stroke="#d9dde2" stroke-width="28"/><line x1="1086" y1="546" x2="1275.2" y2="546" stroke="#2b7562" stroke-width="28"/><text x="864" y="554" class="t s">WhiteBox</text><text x="1296" y="554" class="t m num">50.33</text>
  <text x="864" y="638" class="t s">WhiteBox 比 base 高 5.22，却比 ClawII-OC 低 12.29。</text>
  <rect x="76" y="770" width="1448" height="72" rx="6" fill="#20252b"/>
  <text x="106" y="814" font-family="Arial,'PingFang SC',sans-serif" font-size="19" fill="#fff">对研究设计最重要的结论：只在简化 agent loop 里做 RL，不能代替在目标 harness 里训练。</text>
  <text x="76" y="876" class="t s" font-size="15">Source: ClawGym II, Table 2. Horizontal lengths are proportional within each panel; exact scores are printed.</text>
</svg>
