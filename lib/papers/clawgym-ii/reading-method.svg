<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1481" viewBox="0 0 600 1481" role="img" aria-labelledby="title desc"><title id="title">保留原执行程序，恢复可训练的调用结构</title><desc id="desc">根据 Figure 1、§3.1–3.3 重绘 工具调用与上下文管理保持原样</desc><rect width="600" height="1481" fill="#fff"/><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:32px;font-weight:750}.label{font-size:28px;font-weight:750}.main{font-size:28px}.small{font-size:24px}.value{font-size:32px;font-weight:750}</style><text x="24" y="66" class="title" fill="#20252d" text-anchor="start">保留原执行程序，</text>
<text x="24" y="108" class="title" fill="#20252d" text-anchor="start">恢复可训练的调用结构</text>
<text x="24" y="152" class="small" fill="#596575" text-anchor="start">根据 Figure 1、§3.1–3.3 重绘</text>
<text x="24" y="190" class="small" fill="#596575" text-anchor="start">工具调用与上下文管理保持原样</text>
<path d="M24 200H576" stroke="#d7dee7" stroke-width="2"/>
<rect x="24" y="223" width="552" height="153" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="262" class="label" fill="#365f85" text-anchor="start">1 · 原生 harness 执行任务</text>
<text x="43" y="306" class="main" fill="#20252d" text-anchor="start">OpenClaw 或 Claude Code</text>
<text x="43" y="345" class="main" fill="#20252d" text-anchor="start">仍负责工具、重试和历史压缩。</text>
<path d="M300 401v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="437" width="552" height="153" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="476" class="label" fill="#365f85" text-anchor="start">2 · Proxy 记录模型侧数据</text>
<text x="43" y="520" class="main" fill="#20252d" text-anchor="start">保存输入/输出 token、</text>
<text x="43" y="559" class="main" fill="#20252d" text-anchor="start">生成时对数概率与任务标识。</text>
<path d="M300 615v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="651" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="690" class="label" fill="#365f85" text-anchor="start">3 · 恢复共享前缀与分支</text>
<text x="43" y="734" class="main" fill="#20252d" text-anchor="start">按最长历史前缀接起调用。</text>
<text x="43" y="773" class="main" fill="#20252d" text-anchor="start">每个压缩段保留最长有效延续；</text>
<text x="43" y="812" class="main" fill="#20252d" text-anchor="start">共享历史只训练一次。</text>
<path d="M300 868v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="904" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="943" class="label" fill="#365f85" text-anchor="start">4 · 对最终目录评分</text>
<text x="43" y="987" class="main" fill="#20252d" text-anchor="start">原任务 verifier 评最终工作区。</text>
<text x="43" y="1026" class="main" fill="#20252d" text-anchor="start">辅助压缩或子 Agent 生成</text>
<text x="43" y="1065" class="main" fill="#20252d" text-anchor="start">不直接接受主任务分数。</text>
<path d="M300 1121v20m-8-8 8 8 8-8" fill="none" stroke="#365f85" stroke-width="3"/>
<rect x="24" y="1157" width="552" height="192" fill="#f5f7fa" stroke="#d7dee7" stroke-width="2"/>
<text x="43" y="1196" class="label" fill="#365f85" text-anchor="start">5 · 沿保留分支更新模型</text>
<text x="43" y="1240" class="main" fill="#20252d" text-anchor="start">GRPO 按同题、同 harness 分组。</text>
<text x="43" y="1279" class="main" fill="#20252d" text-anchor="start">PPO 每条分支接收终局分数。</text>
<text x="43" y="1318" class="main" fill="#20252d" text-anchor="start">使用当时 token，不重新分词。</text>
<text x="24" y="1409" class="small" fill="#596575" text-anchor="start">阈值未公开：分支过多的上限、</text>
<text x="24" y="1447" class="small" fill="#596575" text-anchor="start">逐 token 概率修正的截断值。</text></svg>
