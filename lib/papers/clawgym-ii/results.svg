<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ClawGym II main 30A3B results</title>
  <desc id="desc">Four horizontal comparisons show ClawGym-Bench and PinchBench results under OpenClaw and Claude Code. OpenClaw starts from the cold-start model, while Claude Code starts from the Qwen3 base model.</desc>
  <defs><style>.t{font-family:Arial,"PingFang SC",sans-serif;fill:#20252b}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.h{font-size:48px;font-weight:700}.s{font-size:19px;fill:#66717b}.k{font-size:15px;font-weight:700;letter-spacing:1.5px;fill:#285d9b}.lab{font-size:20px;font-weight:700}.num{font-size:26px;font-weight:800}.tick{font-size:14px;fill:#7b848d}.base{fill:#b8c2cc}.cold{fill:#ad5735}.rl{fill:#285d9b}</style></defs>
  <rect width="1600" height="900" fill="#f8f5ee"/>
  <text x="76" y="72" class="t k">30A3B MAIN RESULTS · TABLE 1 REDRAW</text>
  <text x="76" y="132" class="t h">四个增益都成立，但 OpenClaw 的起点是 cold-start model</text>
  <text x="76" y="173" class="t s">横轴为 benchmark score（论文称 Pass@1）。每个条目比较同一 harness 下的初始化模型与 RL 后模型。</text>
  <g transform="translate(90 235)">
    <text x="0" y="24" class="t lab">OpenClaw · ClawGym-Bench</text>
    <rect x="390" y="0" width="610" height="34" rx="3" fill="#e2e6ea"/><rect x="390" y="0" width="526.4" height="34" rx="3" class="cold"/><text x="930" y="26" class="t m num" font-size="21">52.64</text>
    <rect x="390" y="50" width="610" height="34" rx="3" fill="#e2e6ea"/><rect x="390" y="50" width="626.2" height="34" rx="3" class="rl"/><text x="1030" y="76" class="t m num" font-size="21">62.62</text><text x="1180" y="76" class="t num" fill="#2b7562">+9.98</text>
    <text x="260" y="26" class="t tick">ClawII-Cold</text><text x="286" y="76" class="t tick">ClawII-OC</text>
  </g>
  <g transform="translate(90 390)">
    <text x="0" y="24" class="t lab">OpenClaw · PinchBench</text>
    <rect x="390" y="0" width="610" height="34" rx="3" fill="#e2e6ea"/><rect x="390" y="0" width="756.1" height="34" rx="3" class="cold"/><text x="1160" y="26" class="t m num" font-size="21">75.61</text>
    <rect x="390" y="50" width="610" height="34" rx="3" fill="#e2e6ea"/><rect x="390" y="50" width="873.2" height="34" rx="3" class="rl"/><text x="1278" y="76" class="t m num" font-size="21">87.32</text><text x="1400" y="76" class="t num" fill="#2b7562">+11.71</text>
    <text x="260" y="26" class="t tick">ClawII-Cold</text><text x="286" y="76" class="t tick">ClawII-OC</text>
  </g>
  <g transform="translate(90 545)">
    <text x="0" y="24" class="t lab">Claude Code · ClawGym-Bench</text>
    <rect x="390" y="0" width="610" height="34" rx="3" fill="#e2e6ea"/><rect x="390" y="0" width="370.6" height="34" rx="3" class="base"/><text x="775" y="26" class="t m num" font-size="21">37.06</text>
    <rect x="390" y="50" width="610" height="34" rx="3" fill="#e2e6ea"/><rect x="390" y="50" width="518.7" height="34" rx="3" class="rl"/><text x="923" y="76" class="t m num" font-size="21">51.87</text><text x="1075" y="76" class="t num" fill="#2b7562">+14.81</text>
    <text x="282" y="26" class="t tick">Qwen3 base</text><text x="286" y="76" class="t tick">ClawII-CC</text>
  </g>
  <g transform="translate(90 700)">
    <text x="0" y="24" class="t lab">Claude Code · PinchBench</text>
    <rect x="390" y="0" width="610" height="34" rx="3" fill="#e2e6ea"/><rect x="390" y="0" width="541.4" height="34" rx="3" class="base"/><text x="945" y="26" class="t m num" font-size="21">54.14</text>
    <rect x="390" y="50" width="610" height="34" rx="3" fill="#e2e6ea"/><rect x="390" y="50" width="714.2" height="34" rx="3" class="rl"/><text x="1118" y="76" class="t m num" font-size="21">71.42</text><text x="1270" y="76" class="t num" fill="#2b7562">+17.28</text>
    <text x="282" y="26" class="t tick">Qwen3 base</text><text x="286" y="76" class="t tick">ClawII-CC</text>
  </g>
  <text x="76" y="864" class="t s" font-size="15">Source: ClawGym II, Table 1. Bars are scaled to a 0–100 score axis; exact values are printed.</text>
</svg>
