<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="814" viewBox="0 0 1050 814" role="img" aria-labelledby="title"><title id="title">π-Distill 与 OPSD：两分支共享参数，采样来源不同</title><rect width="1050" height="814" fill="#fff"/><g font-family="Arial,'PingFang SC','Noto Sans CJK SC',sans-serif"><text x="38" y="66" fill="#24292f" font-size="35" font-weight="700"><tspan x="38" dy="0">π-Distill 与 OPSD：两分支共享参数，采样来源不同</tspan></text><text x="38" y="116.69999999999999" fill="#465363" font-size="25" font-weight="400"><tspan x="38" dy="0">PI 是成功工具操作记录，仅带 PI 的 teacher 输入能看到。</tspan></text><rect x="38" y="152.2" width="215" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="52" y="179.2" fill="#24292f" font-size="25" font-weight="700"><tspan x="52" dy="0">阶段</tspan></text><rect x="253" y="152.2" width="390" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="267" y="179.2" fill="#24292f" font-size="25" font-weight="700"><tspan x="267" dy="0">π-Distill</tspan></text><rect x="643" y="152.2" width="369" height="56.5" fill="#edf2f6" stroke="#dce2e8"/><text x="657" y="179.2" fill="#24292f" font-size="25" font-weight="700"><tspan x="657" dy="0">本论文 OPSD</tspan></text><rect x="38" y="208.7" width="215" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="52" y="235.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">谁先执行任务</tspan></text><rect x="253" y="208.7" width="390" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="267" y="235.7" fill="#465363" font-size="25" font-weight="400"><tspan x="267" dy="0">teacher：当前历史 s + PI</tspan></text><rect x="643" y="208.7" width="369" height="87" fill="#f4f8fb" stroke="#dce2e8"/><text x="657" y="235.7" fill="#465363" font-size="25" font-weight="400"><tspan x="657" dy="0">student：当前历史 s，无</tspan><tspan x="657" dy="35.5">PI</tspan></text><rect x="38" y="295.7" width="215" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="322.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">新轨迹 o 来自</tspan><tspan x="52" dy="35.5">谁</tspan></text><rect x="253" y="295.7" width="390" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="267" y="322.7" fill="#465363" font-size="25" font-weight="400"><tspan x="267" dy="0">teacher 与环境交互</tspan></text><rect x="643" y="295.7" width="369" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="657" y="322.7" fill="#465363" font-size="25" font-weight="400"><tspan x="657" dy="0">student 与环境交互</tspan></text><rect x="38" y="382.7" width="215" height="87" fill="#f8fafb" stroke="#dce2e8"/><text x="52" y="409.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">优化目标</tspan></text><rect x="253" y="382.7" width="390" height="87" fill="#f8fafb" stroke="#dce2e8"/><text x="267" y="409.7" fill="#465363" font-size="25" font-weight="400"><tspan x="267" dy="0">αJteacher + (1−α)</tspan><tspan x="267" dy="35.5">Jstudent</tspan></text><rect x="643" y="382.7" width="369" height="87" fill="#f8fafb" stroke="#dce2e8"/><text x="657" y="409.7" fill="#465363" font-size="25" font-weight="400"><tspan x="657" dy="0">环境奖励 − βKL(student</tspan><tspan x="657" dy="35.5">‖teacher)</tspan></text><rect x="38" y="469.7" width="215" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="52" y="496.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">student 采样校</tspan><tspan x="52" dy="35.5">正</tspan></text><rect x="253" y="469.7" width="390" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="267" y="496.7" fill="#465363" font-size="25" font-weight="400"><tspan x="267" dy="0">student / teacher 概率比校</tspan><tspan x="267" dy="35.5">正</tspan></text><rect x="643" y="469.7" width="369" height="87" fill="#ffffff" stroke="#dce2e8"/><text x="657" y="496.7" fill="#465363" font-size="25" font-weight="400"><tspan x="657" dy="0">来自 student 自身，</tspan><tspan x="657" dy="35.5">on-policy</tspan></text><rect x="38" y="556.7" width="215" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="52" y="583.7" fill="#24292f" font-size="25" font-weight="600"><tspan x="52" dy="0">模型参数</tspan></text><rect x="253" y="556.7" width="390" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="267" y="583.7" fill="#465363" font-size="25" font-weight="400"><tspan x="267" dy="0">两种输入共享当前 θ</tspan></text><rect x="643" y="556.7" width="369" height="51.5" fill="#f8fafb" stroke="#dce2e8"/><text x="657" y="583.7" fill="#465363" font-size="25" font-weight="400"><tspan x="657" dy="0">两种输入共享当前 θ</tspan></text><rect x="38" y="632.2" width="974" height="105" fill="#fff" stroke="#dce2e8"/><path d="M38 632.2v105" stroke="#a96238" stroke-width="5"/><text x="55" y="659.2" fill="#465363" font-size="25" font-weight="400"><tspan x="55" dy="0">停止梯度只阻止当前项反传，不是永久冻结 teacher。α=1 只优化 teacher 目标，</tspan><tspan x="55" dy="35.5">但共享权重仍会影响 student。</tspan></text><path d="M38 753.2h974" stroke="#dce2e8"/><text x="38" y="778.2" fill="#617184" font-size="21" font-weight="400"><tspan x="38" dy="0">根据 v3 Figure 1、§3.1–3.2 与 Eqs. 2–5 重绘。</tspan></text></g></svg>
