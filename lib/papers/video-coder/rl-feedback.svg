<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 313" role="img" aria-label="八条轨迹执行验收、最终视频打分、组合奖励与策略更新"><title>八条轨迹执行验收、最终视频打分、组合奖励与策略更新</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#326e9c"/></marker></defs><rect width="900" height="313" fill="white"/><g font-family="PingFang SC,Arial,sans-serif"><text x="18" y="28" font-size="22" fill="#172535">一次 RL 尝试：只在有合格草稿后生成并评价最终视频</text><rect x="18" y="62" width="198" height="110" fill="#eef4f7" stroke="#c8d2d7"/><text x="28" y="91" font-size="18" fill="#326e9c">同一题 8 条轨迹</text><text x="28" y="124" font-size="17" fill="#172535">编码 / 工具 / 修复</text><text x="28" y="153" font-size="16" fill="#172535">得到最终脚本</text><path d="M217,116L234,116" fill="none" stroke="#326e9c" stroke-width="2" marker-end="url(#a)"/><rect x="238" y="62" width="198" height="110" fill="#eef4f7" stroke="#c8d2d7"/><text x="248" y="91" font-size="18" fill="#326e9c">harness 验收</text><text x="248" y="124" font-size="17" fill="#172535">干净目录重新执行</text><text x="248" y="153" font-size="16" fill="#172535">执行奖励 0 或 1</text><path d="M437,116L454,116" fill="none" stroke="#326e9c" stroke-width="2" marker-end="url(#a)"/><rect x="458" y="62" width="198" height="110" fill="#eef4f7" stroke="#c8d2d7"/><text x="468" y="91" font-size="18" fill="#326e9c">固定视频生成器</text><text x="468" y="124" font-size="17" fill="#172535">候选草稿 + 文字</text><text x="468" y="153" font-size="16" fill="#172535">产生候选最终视频</text><path d="M657,116L674,116" fill="none" stroke="#326e9c" stroke-width="2" marker-end="url(#a)"/><rect x="678" y="62" width="198" height="110" fill="#eef4f7" stroke="#c8d2d7"/><text x="688" y="91" font-size="18" fill="#326e9c">看视频的 judge</text><text x="688" y="124" font-size="17" fill="#172535">文字 + 参考 + 候选</text><text x="688" y="153" font-size="16" fill="#172535">四项分数 / 理由</text><rect x="18" y="202" width="862" height="93" fill="#f2f6ef" stroke="#c8d2d7"/><text x="30" y="232" font-size="21" fill="#2f745c">每条轨迹：R = 0.5 Rvideo + exp(−steps / T) Rexe</text><text x="30" y="262" font-size="19" fill="#172535">8 条轨迹比较奖励 → 组内优势 → 更新编码模型的生成动作</text><text x="30" y="286" font-size="17" fill="#172535">judge 忽略纹理、颜色和美观；代码可执行也不证明运动符合真实物理。</text></g></svg>