<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Latent On-Policy Self-Distillation</title><desc id="desc">Learnable experience vectors guide a fixed teacher; the student trains on its own trajectories. Margin regulates composer training.</desc><rect width="1600" height="900" fill="#fff"/><path d="M90 115H1510M90 785H1510" stroke="#c8d4df" stroke-width="2"/><g fill="#26323c" font-family="Arial,'PingFang SC',sans-serif"><text x="90" y="85" font-size="24" fill="#617487">PAPER READING · arXiv:2608.13040 · 2026-08-13</text><text x="90" y="250" font-size="74" font-weight="700">Latent On-Policy</text><text x="90" y="341" font-size="74" font-weight="700">Self-Distillation</text><text x="90" y="422" font-size="34">学习教师的经验输入，约束它不迎合学生</text><text x="90" y="696" font-size="28">3 records → 96 vectors</text><text x="90" y="746" font-size="24" fill="#617487">Qwen3-4B · EnvScaler mean partial score: 48.6 → 63.7</text><rect x="955" y="194" width="555" height="164" fill="#eef5f2" stroke="#9ebfaf"/><text x="982" y="241" font-size="29" font-weight="700">FROZEN TEACHER</text><text x="982" y="288" font-size="25">Experience vectors are trainable</text><text x="982" y="328" font-size="25">Scores the student's actual tokens</text><rect x="955" y="479" width="555" height="164" fill="#eff4f9" stroke="#aac0d5"/><text x="982" y="528" font-size="29" font-weight="700">TRAINABLE STUDENT</text><text x="982" y="574" font-size="25">Acts without retrieved experience</text><text x="982" y="614" font-size="25">Tools remain available at inference</text><text x="982" y="410" font-size="26" fill="#345e83">Token distributions + margin → training</text><text x="90" y="830" font-size="23" fill="#617487">兴趣 7/10，仅代表博客作者本人兴趣 · 真实案例与原始图表</text></g></svg>
