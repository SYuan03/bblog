<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="670" viewBox="0 0 1080 670" role="img" aria-labelledby="title desc"><title id="title">LOPD：学生执行，经验压缩后指导教师评分</title><desc id="desc">学生只接收任务和真实前文。三条成功记录各压成32个连续向量给固定教师。KL更新学生和压缩模块，结果约束只直接更新压缩模块。</desc><defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#24292f;font-size:24px}.title{font-size:32px;font-weight:700}.sub{font-size:22px;fill:#536171}.label{font-size:25px;font-weight:700}.blue{fill:#245e99}.box{fill:#fff;stroke:#dce2e8;stroke-width:2}.wire{fill:none;stroke:#245e99;stroke-width:3;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#245e99"/></marker></defs><rect width="1080" height="670" fill="#fff"/><text x="36" y="48" class="title">经验变成教师输入；执行记录仍来自学生</text><text x="36" y="87" class="sub">§3、Figure 2、Algorithm 1 的事实重绘 · 不是模型执行日志</text><rect x="36" y="127" width="300" height="135" class="box"/><text x="56" y="164" class="label">学生 θ：实际调用工具</text><text x="56" y="202">任务 + 当前真实前文</text><text x="56" y="239" class="sub">不读取额外经验向量</text><rect x="390" y="127" width="300" height="135" class="box"/><text x="410" y="164" class="label">环境：执行并判分</text><text x="410" y="202">API 返回 → 后续前文</text><text x="410" y="239" class="sub">完整记录获得奖励 r</text><path d="M336 194H383" class="wire"/><rect x="744" y="127" width="300" height="135" class="box"/><text x="764" y="164" class="label">教师：重评相同前文</text><text x="764" y="202">额外接收 96×d 向量</text><text x="764" y="239" class="sub">初始主模型参数固定</text><path d="M690 194H737" class="wire"/><rect x="36" y="338" width="300" height="142" class="box"/><text x="56" y="375" class="label">训练集成功记录</text><text x="56" y="414">相似度检索 3 条</text><text x="56" y="452" class="sub">任务 + 紧凑动作 / 返回</text><rect x="390" y="338" width="300" height="142" class="box"/><text x="410" y="375" class="label">Composer φ：可训练</text><text x="410" y="414">编码 LoRA + QFormer</text><text x="410" y="452" class="sub">每条 32 个查询 → 32×d</text><path d="M336 408H383" class="wire"/><path d="M690 408H894V270" class="wire"/><text x="722" y="448" class="sub">输入 embedding 替换</text><path d="M894 262V292H186V270" class="wire"/><text x="386" y="320" class="blue">教师 top-20 + tail 的 KL → 更新 θ 和 φ</text><rect x="36" y="526" width="1008" height="99" fill="#f4f7fa" stroke="#dce2e8"/><text x="58" y="563">结果约束 A=2r−1：成功记录提高教师采样概率，失败记录降低</text><text x="58" y="602" class="sub">直接梯度只回到 φ；教师前向保留计算图。部署时只保留 θ，仍可调用任务工具。</text></svg>
