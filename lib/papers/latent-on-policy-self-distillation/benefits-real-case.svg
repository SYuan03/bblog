<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc"><title id="title">LOPD真实保险方案任务：共享操作顺序，不共享实体参数</title><desc id="desc">论文Figure6当前任务env174与另一题rank2检索结果的比较。当前健康保费310.25，参考为210；向量投影不是可读计划，没有公布该例完整判分。</desc><defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#24292f;font-size:24px}.title{font-size:32px;font-weight:700}.sub{font-size:22px;fill:#536171}.head{font-size:26px;font-weight:700}.box{fill:#fff;stroke:#dce2e8;stroke-width:2}</style></defs><rect width="1080" height="640" fill="#fff"/><text x="36" y="49" class="title">真实案例：操作相似，编号和参数却不同</text><text x="36" y="87" class="sub">Figure 6 · env_174_rl-task_29 · 以下是任务与检索摘要，不是完整 rollout</text><rect x="36" y="125" width="490" height="317" class="box"/><text x="57" y="167" class="head">当前任务：学生需要亲自执行</text><text x="57" y="213">添加 PLAN-HI-03，保费 310.25</text><text x="57" y="254">修改 PLAN-DN-01，保费 37.0</text><text x="57" y="295">E1001：HI-01 → HI-03</text><text x="57" y="336">E1002：DN-01 → LF-01</text><text x="57" y="377">E1005：撤回；E1004：改 HI-02</text><text x="57" y="417" class="sub">当前环境未执行这些操作</text><rect x="554" y="125" width="490" height="317" class="box"/><text x="575" y="167" class="head">另一题的成功参考 · rank 2</text><text x="575" y="213">查询登记期 EP-FALL-2024</text><text x="575" y="254">添加 BP-HEALTH-010，保费 210</text><text x="575" y="295">修改 BP-DENTAL-004，保费 27.5</text><text x="575" y="336">变更 E-ALC-001 / E-MIG-007</text><text x="575" y="377">撤回 E-YNA-822</text><text x="575" y="417" class="sub">检索相似度 0.886 ≠ 成功率</text><rect x="36" y="480" width="1008" height="116" fill="#f4f7fa" stroke="#dce2e8"/><text x="58" y="518">参考只给教师，压成向量；共享“查询 → 添加 → 修改 → 切换 → 撤回”</text><text x="58" y="558" class="sub">不能照抄参考实体。投影向量得到混杂词语，无法证明学会了正确流程或排除复制。</text><text x="58" y="585" class="sub">公开资料未提供该样本的学生完整输出、检查清单或逐项 PASS / FAIL。</text></svg>
