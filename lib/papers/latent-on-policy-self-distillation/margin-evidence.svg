<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc"><title id="title">LOPD关键消融：联合训练需要防退化约束</title><desc id="desc">固定composer奖励0.573，联合训练m=0为0.551，margin0.05为0.637；重复调用减少但交互步骤增多，全部使用0到1奖励。</desc><defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#24292f;font-size:24px}.title{font-size:32px;font-weight:700}.sub{font-size:22px;fill:#536171}.label{font-size:25px;font-weight:700}</style></defs><rect width="1080" height="640" fill="#fff"/><text x="36" y="49" class="title">多训练一个模块，本身并没有带来提升</text><text x="36" y="87" class="sub">Figure 3 / Table 3 · Qwen3-4B、EnvScaler · 奖励 0–1 · 横轴从 0 起</text><text x="36" y="153">固定 composer φ₀</text><rect x="342" y="129" width="535" height="33" fill="#dde3e8"/><rect x="342" y="129" width="459" height="33" fill="#8e9bab"/><text x="900" y="155">0.573</text><text x="36" y="221">联合训练，m=0</text><rect x="342" y="197" width="535" height="33" fill="#dde3e8"/><rect x="342" y="197" width="442" height="33" fill="#a96238"/><text x="900" y="223">0.551</text><text x="36" y="289">联合训练，m=0.05</text><rect x="342" y="265" width="535" height="33" fill="#dde3e8"/><rect x="342" y="265" width="510" height="33" fill="#245e99"/><text x="900" y="291">0.637</text><text x="36" y="351" class="sub">m 增至 0.10 / 0.20：0.626 / 0.613。并非约束越强越好。</text><path d="M36 380H1044" stroke="#dce2e8"/><text x="36" y="424" class="label">行为改变有正反两面</text><text x="36" y="471">未训练 → 最终学生</text><text x="420" y="471">交互步数 11.12 → 17.04</text><text x="36" y="514">重复调用 8.89 → 5.25</text><text x="420" y="514">每步调用 3.50 → 1.11</text><text x="36" y="567" class="sub">“原模型 + composer”的重复调用 4.49，比最终学生 5.25 更少；</text><text x="36" y="604" class="sub">每次调用奖励 0.053，也高于最终学生 0.050。不能概括成所有行为统计都改善。</text></svg>
