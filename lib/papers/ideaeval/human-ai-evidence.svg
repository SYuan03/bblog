<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="旧75对和新40对Judge准确率与始终选择人类的多数类基线"><title>旧75对和新40对Judge准确率与始终选择人类的多数类基线</title><rect width="900" height="360" fill="white"/><g font-family="PingFang SC,Arial,sans-serif"><text x="18" y="28" font-size="23" fill="#172535">两个 human–AI 集合，必须分别看基线</text><text x="18" y="70" font-size="19" fill="#172535">原博客：75 对，18 AI 胜 / 57 人类胜</text><text x="18" y="115" font-size="17" fill="#172535">Judge</text><rect x="155" y="95" width="266.40000000000003" height="27" fill="#326e9c"/><text x="710" y="116" font-size="19" fill="#172535">37/75 = 49.3%</text><text x="18" y="158" font-size="17" fill="#172535">始终选人类</text><rect x="155" y="138" width="410.4" height="27" fill="#9daeb9"/><text x="710" y="159" font-size="19" fill="#172535">57/75 = 76.0%</text><text x="18" y="200" font-size="19" fill="#172535">公开新版：40 对，15 AI 胜 / 25 人类胜</text><text x="18" y="245" font-size="17" fill="#172535">Judge</text><rect x="155" y="225" width="364.5" height="27" fill="#326e9c"/><text x="710" y="246" font-size="19" fill="#172535">27/40 = 67.5%</text><text x="18" y="288" font-size="17" fill="#172535">始终选人类</text><rect x="155" y="268" width="337.5" height="27" fill="#9daeb9"/><text x="710" y="289" font-size="19" fill="#172535">25/40 = 62.5%</text><text x="18" y="339" font-size="15" fill="#172535">旧 37/75 按作者分组百分数重建；新版 27/40 来自 results_160.json。非同集前后对照。</text></g></svg>