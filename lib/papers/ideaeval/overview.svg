<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" aria-label="IdeaEval overview: arXiv papers are grouped into cohorts that share a research question and a cutoff date t. Each cohort's papers become human proposals; an ideation baseline writes an AI proposal from the same direction using only literature before t. A pairwise judge compares the AI proposal with every human proposal and reports a win rate; the judge itself is checked on labeled calibration pairs.">
<style>
:root{--ink:#292d26;--mute:#8b8f84;--line:#cdd0c4;--acc:#b94228;--paper:#fbfaf5}
text{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;fill:var(--ink);font-size:14px}
.m{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10.5px;fill:var(--mute)}
.cap{font-size:10.5px;letter-spacing:.18em;fill:var(--mute)}
.i{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-style:italic}
.box{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.doc{fill:var(--paper);stroke:var(--ink);stroke-width:1.1}
.ln{fill:none;stroke:var(--line);stroke-width:1.2}
.dash{fill:none;stroke:var(--mute);stroke-width:1.1;stroke-dasharray:3 4}
.ah{fill:none;stroke:var(--line);stroke-width:1.2}
.ahd{fill:none;stroke:var(--mute);stroke-width:1.1}
.tag{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:10.5px;fill:var(--acc)}
</style>
<title>IdeaEval overview</title>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ah" d="M2 1L9 5L2 9"/></marker>
  <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ahd" d="M2 1L9 5L2 9"/></marker>
</defs>

<!-- corpus -->
<rect class="box" x="20" y="126" width="130" height="48" rx="7"/>
<text x="85" y="155" text-anchor="middle">arXiv corpus</text>
<text class="m" x="85" y="194" text-anchor="middle">35,505 papers</text>
<text class="m" x="85" y="208" text-anchor="middle">Sep 2025 – Jan 2026</text>
<path class="ln" d="M150 150H196" marker-end="url(#a)"/>

<!-- cohorts -->
<rect class="box" x="200" y="126" width="130" height="48" rx="7"/>
<text x="265" y="155" text-anchor="middle">Cohort</text>
<text class="m" x="265" y="194" text-anchor="middle">one research question</text>
<text class="m" x="265" y="208" text-anchor="middle">31-day window, cutoff <tspan class="i" style="font-size:12px;fill:var(--ink)">t</tspan></text>

<!-- branch to human proposals -->
<path class="ln" d="M330 150C360 150 360 70 386 70" marker-end="url(#a)"/>
<rect class="box" x="390" y="46" width="150" height="48" rx="7"/>
<text x="465" y="75" text-anchor="middle">paper2proposal</text>
<text class="m" x="465" y="112" text-anchor="middle">results → TBD</text>
<path class="ln" d="M540 70H580" marker-end="url(#a)"/>
<path class="doc" d="M590 54h14l6 6v20h-20z"/><path class="doc" d="M596 60h14l6 6v20h-20z"/>
<text x="628" y="75">human proposals</text>

<!-- branch to ideation baseline -->
<path class="ln" d="M330 150C360 150 360 230 386 230" marker-end="url(#a)"/>
<rect class="box" x="390" y="206" width="150" height="48" rx="7"/>
<text x="465" y="235" text-anchor="middle">Ideation baseline</text>
<text class="m" x="465" y="272" text-anchor="middle">Claude Code / Codex,</text>
<text class="m" x="465" y="286" text-anchor="middle">search limited to before t</text>
<path class="ln" d="M540 230H580" marker-end="url(#a)"/>
<path class="doc" d="M593 220h14l6 6v20h-20z"/>
<text x="628" y="235">AI proposal</text>

<!-- judge -->
<path class="ln" d="M745 70C780 70 770 140 796 146" marker-end="url(#a)"/>
<path class="ln" d="M712 230C780 230 770 160 796 154" marker-end="url(#a)"/>
<rect class="box" x="800" y="126" width="100" height="48" rx="7"/>
<text x="850" y="155" text-anchor="middle">Judge</text>
<text class="m" x="850" y="194" text-anchor="middle">AI vs. each human</text>
<text class="m" x="850" y="208" text-anchor="middle">→ win rate</text>

<!-- calibration -->
<text class="m" x="850" y="26" text-anchor="middle">calibration pairs</text>
<text class="m" x="850" y="40" text-anchor="middle">(citations, hand labels)</text>
<path class="dash" d="M850 48V120" marker-end="url(#ad)"/>
<text class="m" x="858" y="90">accuracy</text>

<!-- directory tags -->
<text class="tag" x="20" y="118">benchmark/</text>
<text class="tag" x="390" y="38">benchmark/paper2proposal/</text>
<text class="tag" x="390" y="198">baselines/</text>
<text class="tag" x="850" y="228" text-anchor="middle">evaluator/</text>
</svg>
