<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 328" role="img" aria-label="公开160对比较中的净正确数变化，收益集中在人工构造的重复先例SetC"><title>公开160对比较中的净正确数变化，收益集中在人工构造的重复先例SetC</title><rect width="900" height="328" fill="white"/><g font-family="PingFang SC,Arial,sans-serif"><text x="18" y="28" font-size="23" fill="#172535">文献工具多判对 11 对，Set C 贡献了 14 对</text><text x="18" y="60" font-size="17" fill="#172535">同一新版 160 对：Agentic + LR 对比单次 proposal-only，均用 Opus 4.6。</text><text x="18" y="109" font-size="18" fill="#172535">Set A</text><path d="M300,87v31" stroke="#88979f"/><rect x="300" y="90" width="40" height="25" fill="#326e9c"/><text x="618" y="111" font-size="18" fill="#172535">+2 对  (36/40 vs 34/40)</text><text x="18" y="149" font-size="18" fill="#172535">Set B</text><path d="M300,127v31" stroke="#88979f"/><rect x="260" y="130" width="40" height="25" fill="#b95434"/><text x="618" y="151" font-size="18" fill="#172535">-2 对  (31/40 vs 33/40)</text><text x="18" y="189" font-size="18" fill="#172535">Set C</text><path d="M300,167v31" stroke="#88979f"/><rect x="300" y="170" width="280" height="25" fill="#326e9c"/><text x="618" y="191" font-size="18" fill="#172535">+14 对  (38/40 vs 24/40)</text><text x="18" y="229" font-size="18" fill="#172535">humanAI</text><path d="M300,207v31" stroke="#88979f"/><rect x="240" y="210" width="60" height="25" fill="#b95434"/><text x="618" y="231" font-size="18" fill="#172535">-3 对  (27/40 vs 30/40)</text><text x="18" y="275" font-size="18" fill="#172535">Set C 人为放入了重复先例；工具收益不能直接外推到综合科研判断。</text><text x="18" y="307" font-size="15" fill="#172535">总计 132/160 vs 121/160；新增文献、工具与多次模型调用同时变化，非纯文献消融。</text></g></svg>