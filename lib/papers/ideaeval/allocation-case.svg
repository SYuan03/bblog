<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 357" role="img" aria-label="SGA提案的数值反例：比例方案5和2目标2.8，合法替代6和1目标2.5"><title>SGA提案的数值反例：比例方案5和2目标2.8，合法替代6和1目标2.5</title><rect width="900" height="357" fill="white"/><g font-family="PingFang SC,Arial,sans-serif"><text x="18" y="28" font-size="23" fill="#172535">同样 7 个预算：线性目标下，比例分配不是最优解</text><text x="18" y="61" font-size="17" fill="#172535">本文算例：N = 10，两个 head 的 σ² = (4, 1)，每个至少保留 1 个 token。</text><text x="18" y="127" font-size="20" fill="#b95434">提案公式</text><rect x="170" y="105" width="34" height="32" fill="#326e9c"/><rect x="208" y="105" width="34" height="32" fill="#326e9c"/><rect x="246" y="105" width="34" height="32" fill="#326e9c"/><rect x="284" y="105" width="34" height="32" fill="#326e9c"/><rect x="322" y="105" width="34" height="32" fill="#326e9c"/><text x="170" y="162" font-size="17" fill="#172535">Head 1: 5 tokens</text><rect x="450" y="105" width="34" height="32" fill="#9daeb9"/><rect x="488" y="105" width="34" height="32" fill="#9daeb9"/><text x="450" y="162" font-size="17" fill="#172535">Head 2: 2 tokens</text><text x="760" y="125" font-size="20" fill="#b95434">目标 = 2.8</text><text x="760" y="156" font-size="16" fill="#172535">越低越好</text><text x="18" y="233" font-size="20" fill="#2f745c">合法替代</text><rect x="170" y="211" width="34" height="32" fill="#326e9c"/><rect x="208" y="211" width="34" height="32" fill="#326e9c"/><rect x="246" y="211" width="34" height="32" fill="#326e9c"/><rect x="284" y="211" width="34" height="32" fill="#326e9c"/><rect x="322" y="211" width="34" height="32" fill="#326e9c"/><rect x="360" y="211" width="34" height="32" fill="#326e9c"/><text x="170" y="268" font-size="17" fill="#172535">Head 1: 6 tokens</text><rect x="450" y="211" width="34" height="32" fill="#9daeb9"/><text x="450" y="268" font-size="17" fill="#172535">Head 2: 1 tokens</text><text x="760" y="231" font-size="20" fill="#2f745c">目标 = 2.5</text><text x="760" y="262" font-size="16" fill="#172535">越低越好</text><text x="18" y="306" font-size="18" fill="#172535">把 1 个 token 从 Head 2 移给 Head 1：目标减少 (4 − 1) / 10 = 0.3。</text><text x="18" y="337" font-size="16" fill="#172535">反驳“该公式最优”；没有运行模型，也没有测出 KV 压缩后的真实精度。</text></g></svg>