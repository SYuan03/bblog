<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 329" role="img" aria-label="两个说明性rollout在相同步数具有不同观察历史，不能直接视为同一状态的反事实动作"><title>两个说明性rollout在相同步数具有不同观察历史，不能直接视为同一状态的反事实动作</title><rect width="900" height="329" fill="white"/><g font-family="PingFang SC,Arial,sans-serif"><text x="18" y="28" font-size="23" fill="#172535">相同第 k 步，不保证面对相同的观察历史</text><text x="18" y="98" font-size="20" fill="#326e9c">Rollout 1</text><rect x="160" y="73" width="335" height="63" fill="#edf3f6"/><text x="176" y="110" font-size="18" fill="#172535">搜索失败，尚无目标网页</text><text x="513" y="109" font-size="27" fill="#172535">→</text><rect x="555" y="73" width="320" height="63" fill="#edf3f6"/><text x="572" y="110" font-size="18" fill="#172535">搜索新关键词</text><text x="18" y="196" font-size="20" fill="#b95434">Rollout 2</text><rect x="160" y="171" width="335" height="63" fill="#edf3f6"/><text x="176" y="208" font-size="18" fill="#172535">已找到目标网页与结果</text><text x="513" y="207" font-size="27" fill="#172535">→</text><rect x="555" y="171" width="320" height="63" fill="#edf3f6"/><text x="572" y="208" font-size="18" fill="#172535">提交已有答案</text><text x="18" y="270" font-size="16" fill="#172535">本文说明性状态；原提案称 associative counterfactuals，承认不是严格因果对比。</text><text x="18" y="305" font-size="18" fill="#172535">跨历史 log-probability 的相对大小本身不能识别某个动作造成的增量回报。</text></g></svg>