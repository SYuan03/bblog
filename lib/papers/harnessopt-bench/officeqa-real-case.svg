<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc">
<title id="title">OfficeQA UID0185：查表与回归，最终只按数字判分</title><desc id="desc">真实开发任务要求查48个月数据并回归预测1995月均值。隐藏标准答案4990256，相对误差最多1%。5040158通过，5040159失败。官方检查不审计中间过程。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#24292f}.title{font-size:32px;font-weight:720}.head{font-size:28px;font-weight:700}.body{font-size:25px;fill:#465562}.small{font-size:23px;fill:#536171}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:29px;font-weight:600}</style>
<rect width="1000" height="810" fill="#fff"/>
<text x="40" y="53" class="title">UID0185：需要查表与回归，verifier 只检查最终答案</text>
<rect x="40" y="88" width="920" height="166" fill="#f3f6f9" stroke="#d2dce5"/>
<text x="64" y="132" class="head">Agent 可见：题面 + 697 份公报文本</text>
<text x="64" y="176" class="body">取 48 个月 → 四个年度总和 → 回归预测 1995 → 除以 12。</text>
<text x="64" y="219" class="body">交付 /app/answer.txt；标准答案和依据文件定位不在题面里。</text>
<path d="M500 255V283" stroke="#245e99" stroke-width="3"/>
<path d="M490 275L500 285L510 275" fill="none" stroke="#245e99" stroke-width="3"/>
<rect x="40" y="286" width="920" height="165" fill="#f5f7f9" stroke="#d2dce5"/>
<text x="64" y="330" class="head">隐藏检查：读取 config.json 的答案与容许误差</text>
<text x="64" y="375" class="num">|预测 − 4990256| / 4990256 ≤ 0.01</text>
<text x="64" y="417" class="body">没有答案文件或文件为空 → 0；纯数字匹配通过 → 1。</text>
<rect x="40" y="484" width="446" height="184" fill="#f2f7f4" stroke="#c6dacd"/>
<text x="64" y="527" class="head">PASS：5040158</text>
<text x="64" y="572" class="body">相差 49,902</text>
<text x="64" y="616" class="body">≤ 容许的 49,902.56</text>
<rect x="514" y="484" width="446" height="184" fill="#fbf5f4" stroke="#dfcecb"/>
<text x="538" y="527" class="head">FAIL：5040159</text>
<text x="538" y="572" class="body">相差 49,903</text>
<text x="538" y="616" class="body">略超过 1% 阈值</text>
<text x="40" y="716" class="small">输入是本文构造；PASS/FAIL 已直接运行该版本官方 reward.py 核对。</text>
<text x="40" y="752" class="small">任务和答案来自 Harbor 37db108…；未证明与论文原始任务打包字节相同。</text>
<text x="40" y="786" class="small">verifier 不审计取数或回归过程；这不是论文模型执行日志。</text>
</svg>
