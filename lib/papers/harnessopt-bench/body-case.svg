<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc">
<title id="title">HarnessOpt OfficeQA 预算案例：调用次数与题次</title><desc id="desc">验证98题四遍总392题次，一次全量API消耗25%，中位8调用82%题目额度。100和200上限冲突不能省略，55/100不是55/111。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.title{font-size:33px;font-weight:750}.head{font-size:28px;font-weight:700}.body{font-size:25px;fill:#46545d}.small{font-size:23px;fill:#56646d}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:30px;font-weight:650}</style>
<rect width="1000" height="810" fill="#fff"/>
<text x="40" y="53" class="title">一次 API 请求，可以花掉四分之一的验证题次</text>
<text x="40" y="97" class="body">OfficeQA：开发 49 题、验证 98 题、隐藏测试 99 题。</text>
<rect x="40" y="130" width="920" height="169" fill="#f1f5f8" stroke="#c4d3dd"/>
<text x="64" y="174" class="head" fill="#245f87">1 次 API → 执行全部 98 道验证题</text>
<text x="64" y="221" class="num">验证额度 = 98 × 4 = 392 题次</text>
<text x="64" y="267" class="num">本次消耗 = 98 / 392 = 25%</text>
<rect x="40" y="329" width="920" height="168" fill="#f7f8f8" stroke="#ccd4d9"/>
<text x="64" y="373" class="head">论文记录：调用少，题目额度仍消耗很多</text>
<text x="64" y="416" class="body">API 调用中位数为 8，题目额度消耗中位数为 82%。</text>
<text x="64" y="458" class="body">55/100 个预算统计单元耗尽题次，不是 55/111 个有分数实验。</text>
<rect x="40" y="527" width="920" height="169" fill="#fbf3f2" stroke="#d8bfbb"/>
<text x="64" y="571" class="head" fill="#85413b">原文上限冲突：100 还是 200 次 API？</text>
<text x="64" y="614" class="body">§3.1 写每分区 100 次；§5.3 写 200 次，并将 8 次记为 4%。</text>
<text x="64" y="656" class="body">作者没有解释差异，本文保留冲突，不替他们选一个数。</text>
<text x="40" y="752" class="small">根据 Table 3、§5.3 与 Figure 15 预算记录整理并复算。</text>
<text x="40" y="786" class="small">当前 release 使用每区 100 次；不能据此反推论文原始运行上限。</text>
</svg>
