<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="885" viewBox="0 0 1000 885" role="img" aria-labelledby="title desc">
<title id="title">HarnessOpt 模型与外层工具的配对变化</title><desc id="desc">平均gain差换模型0.142换外层工具0.079不是方差占比。二十配对十一比九，十一超过描述性分辨阈值。两轮优化和各任务三评不同，GAIA零起点不能混排。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#20262b}.title{font-size:33px;font-weight:750}.head{font-size:28px;font-weight:700}.body{font-size:25px;fill:#46545d}.small{font-size:23px;fill:#56646d}.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:29px;font-weight:650}</style>
<rect width="1000" height="885" fill="#fff"/>
<text x="40" y="53" class="title">换模型平均差别更大，但外层工具没有统一排名</text>
<text x="40" y="97" class="body">固定其他条件，比较配对 gain 差；不是方差解释占比。</text>
<text x="40" y="174" class="body">换优化模型</text><rect x="292" y="143" width="520" height="40" fill="#e1e7eb"/><rect x="292" y="143" width="492.267" height="40" fill="#39765f"/><text x="839" y="174" class="num">0.142</text>
<text x="40" y="243" class="body">换外层工具</text><rect x="292" y="212" width="520" height="40" fill="#e1e7eb"/><rect x="292" y="212" width="273.867" height="40" fill="#658399"/><text x="839" y="243" class="num">0.079</text>
<text x="292" y="292" class="small">同一 0–0.15 gain 刻度；平均差别约 1.8 倍。</text>
<rect x="40" y="325" width="920" height="151" fill="#f1f5f8" stroke="#c4d3dd"/>
<text x="64" y="369" class="head" fill="#245f87">20 组工具配对：OpenCode 11 : 原生工具 9</text>
<text x="64" y="413" class="body">只有 11 组差异超过对应任务的描述性分辨阈值。</text>
<text x="64" y="454" class="small">不同模型或任务上胜负会反转；不能给外层工具一个全局排名。</text>
<rect x="40" y="507" width="920" height="183" fill="#f7f8f8" stroke="#ccd4d9"/>
<text x="64" y="551" class="head">resolution band：描述性分辨阈值，不是置信区间</text>
<text x="64" y="594" class="num">OfficeQA ±0.045 / BrowseComp ±0.066</text>
<text x="64" y="637" class="num">Terminal ±0.054 / GAIA ±0.035</text>
<text x="64" y="674" class="small">这些阈值不构成显著性检验；两轮优化范围也不是置信区间。</text>
<text x="40" y="738" class="body">每配置独立优化两轮；初始和最终版本各做题三次。</text>
<text x="40" y="780" class="body">GAIA 从 0 分占位程序开始，gain 等于最终原分，不能无条件混排。</text>
<text x="40" y="836" class="small">根据 Figure 2、Table 4、Figure 12 与 §§4–5 重绘。</text>
<text x="40" y="869" class="small">描述统计保持原研究条件；本文未独立重跑评测。</text>
</svg>
