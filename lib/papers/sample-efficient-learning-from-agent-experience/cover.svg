<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Sample-Efficient Learning from Agent Experience</title><desc id="desc">Recorded agent experience conditions a fixed teacher to generate new decisions without executing them. A student learns those decisions without the extra experience.</desc><defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#202a33}.title{font-size:62px;font-weight:700}.label{font-size:30px}.meta{font-size:25px;fill:#526171}.node{font-size:28px;font-weight:700}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#245e99"/></marker></defs><rect width="1600" height="900" fill="#fafbfd"/><path d="M84 80H1516M84 818H1516" stroke="#b9c8d7" stroke-width="2"/><text x="84" y="140" class="meta">EXPERIENCE DISTILLATION · PAPER NOTES</text><text x="84" y="255" class="title">Sample-Efficient Learning</text><text x="84" y="334" class="title">from Agent Experience</text><text x="84" y="420" class="label">从真实试错记录，生成新的决策目标</text><text x="84" y="475" class="meta">固定教师多看经验；学生不看额外经验</text><text x="84" y="526" class="meta">新教师动作不执行，旧返回只对应旧动作</text><text x="84" y="715" class="label">749 道软件题：单次通过率 5.3% → 51.4%</text><text x="84" y="765" class="meta">arXiv:2607.21051v1 · 2026-07-23 · 个人兴趣 8/10</text><rect x="1110" y="194" width="406" height="106" fill="#edf3fa" stroke="#245e99" stroke-width="2"/><text x="1150" y="237" class="node">Recorded experience</text><text x="1150" y="276" class="meta">旧动作 + 真实返回与验收</text><path d="M1313 309V361" fill="none" stroke="#245e99" stroke-width="3" marker-end="url(#arrow)"/><rect x="1110" y="372" width="406" height="106" fill="#edf3fa" stroke="#245e99" stroke-width="2"/><text x="1150" y="416" class="node">New teacher decisions</text><text x="1150" y="455" class="meta">重新生成；不再执行</text><path d="M1313 487V539" fill="none" stroke="#245e99" stroke-width="3" marker-end="url(#arrow)"/><rect x="1110" y="550" width="406" height="106" fill="#fff" stroke="#b9c8d7" stroke-width="2"/><text x="1150" y="594" class="node">Student learns targets</text><text x="1150" y="633" class="meta">只更新学生参数</text></svg>
