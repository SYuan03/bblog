<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc"><title id="title">Experience Distillation：训练内巩固、未见题和成本分开</title><desc id="desc">749任务训练内pass1由5.3到51.4，494新任务由4.62到8.84。环境成本比较以完整trial为单位，不能当总compute，额外生成最高172Mtoken。</desc><defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#24292f;font-size:24px}.title{font-size:32px;font-weight:700}.sub{font-size:22px;fill:#536171}.head{font-size:26px;font-weight:700}.value{font-size:41px;font-weight:700;fill:#245e99}</style></defs><rect width="1080" height="650" fill="#fff"/><text x="36" y="50" class="title">同题经验留进参数，不等于同样强的跨题泛化</text><text x="36" y="90" class="sub">Table 1 / 4、Figure 1 / 3 · 百分比是软件 pass@1，不是游戏归一化分</text><rect x="36" y="126" width="490" height="216" fill="#fff" stroke="#dce2e8"/><text x="57" y="168" class="head">749 道经验收集 / 训练内任务</text><text x="57" y="226" class="value">5.3% → 51.4%</text><text x="57" y="272">SFT 8.0%，ICL 参考 76.4%</text><text x="57" y="315" class="sub">(51.4−5.3)/(76.4−5.3)=64.8% G</text><rect x="554" y="126" width="490" height="216" fill="#fff" stroke="#dce2e8"/><text x="575" y="168" class="head">494 道未见软件任务</text><text x="575" y="226" class="value">4.62% → 8.84%</text><text x="575" y="272">278 未见仓库，216 旧仓库新类型</text><text x="575" y="315" class="sub">pass@5：20.39% → 26.13%</text><path d="M36 378H1044" stroke="#dce2e8"/><text x="36" y="420" class="head">9.6× / 57.2×：少的只是完整环境 trials</text><text x="36" y="462">RL 比较用“最好观察成绩 + 完整运行预算”，不是达到同分的最小成本。</text><text x="36" y="503">软件 PPO 17.7 vs EPD 51.4；游戏 GRPO 29.9 vs EPD 43.8。</text><rect x="36" y="546" width="1008" height="76" fill="#f4f7fa"/><text x="56" y="578">固定经验 61.7M token；额外教师生成最高 2.79× ≈ 172M token。</text><text x="56" y="609" class="sub">不新增环境执行仍有模型生成 / 训练成本；没有完整 GPU 时间账单。</text></svg>
