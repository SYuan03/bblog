<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="t d"><title id="t">MapStore2：清除事件为什么没刷新查询</title><desc id="d">打开关闭高级过滤面板后点击x，按钮必须发出null重置，事件管线须保留geometry更新后触发新查询。第五次被拒绝，第六次补齐查询刷新才接受。</desc><defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#24292f;font-size:18px}.h{font-size:20px;font-weight:700}.small{font-size:16px;fill:#526171}.wire{fill:none;stroke:#245e99;stroke-width:2;marker-end:url(#arr)}</style><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#245e99"/></marker></defs><rect width="900" height="320" fill="#fff"/>
<text x="16" y="28" class="h">选中地图要素 → 打开 / 关闭高级过滤面板 → 点 x，过滤仍在</text><path d="M16 43H884" stroke="#dce2e8"/>
<rect x="16" y="65" width="245" height="117" fill="#fff" stroke="#dce2e8"/><text x="31" y="92" class="h">1 · 按钮能发出清除</text><text x="31" y="123">旧值尚存，控件已停用</text><text x="31" y="156" class="small">原 x 点击处理不执行动作</text>
<rect x="328" y="65" width="245" height="117" fill="#eaf2fa" stroke="#245e99"/><text x="343" y="92" class="h">2 · 明确重置状态</text><text x="343" y="123">value: null</text><text x="343" y="156" class="small">deactivated: true</text>
<rect x="640" y="65" width="244" height="117" fill="#fff" stroke="#dce2e8"/><text x="655" y="92" class="h">3 · 查询接收 null 更新</text><text x="655" y="123">允许 geometry 类型通过</text><text x="655" y="156" class="small">发出 UPDATE_QUERY，刷新表格</text>
<path d="M267 125H321M579 125H633" class="wire"/>
<text x="16" y="220">第 1–4 次尝试不同位置或组合，均拒绝；后一次继承工作树，但可修改或撤回旧编辑。</text><text x="16" y="254">第 5 次：组件发出 null → 旧条件 !!update.value 丢掉更新 → 拒绝</text><text x="16" y="286">第 6 次：保留组件重置 + 查询入口允许 geometry 的 null → 接受</text><text x="16" y="311" class="small">按 C.3 / Table 15 / 原文三组件关系独立整理；三段是分析，不是三条独立官方断言。</text>
</svg>
