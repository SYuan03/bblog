<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="670" viewBox="0 0 1080 670" role="img" aria-labelledby="title desc"><title id="title">MapStore2：六次尝试才打通按钮、状态与查询刷新</title><desc id="desc">高级过滤面板关闭后x不清除筛选。第五次实现null状态重置，第六次允许geometry类型通过查询过滤。前五次被拒绝，最后外部验收接受；教师目标含失败假设。</desc><defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#24292f;font-size:24px}.title{font-size:32px;font-weight:700}.sub{font-size:22px;fill:#536171}.head{font-size:25px;font-weight:700}.wire{fill:none;stroke:#245e99;stroke-width:3;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#245e99"/></marker></defs><rect width="1080" height="670" fill="#fff"/><text x="36" y="49" class="title">x 看起来还在，点了却没恢复未过滤结果</text><text x="36" y="89" class="sub">Appendix C.3 / Tables 15–16 · 真实任务、论文补丁事实重绘</text><rect x="36" y="126" width="1008" height="65" fill="#f4f7fa"/><text x="57" y="167">结果表选中地图要素 → 打开 / 关闭高级面板 → 点 x → 过滤仍在</text><rect x="36" y="226" width="303" height="142" fill="#fff" stroke="#dce2e8"/><text x="57" y="264" class="head">1 · x 必须能触发重置</text><text x="57" y="307">保留旧值，筛选已停用</text><text x="57" y="344" class="sub">原点击处理不执行操作</text><rect x="388" y="226" width="303" height="142" fill="#fff" stroke="#dce2e8"/><text x="409" y="264" class="head">2 · 明确 null 状态</text><text x="409" y="307">value: null</text><text x="409" y="344" class="sub">deactivated: true</text><rect x="740" y="226" width="304" height="142" fill="#fff" stroke="#dce2e8"/><text x="761" y="264" class="head">3 · 进入 query epic</text><text x="761" y="307">geometry 类型允许 null</text><text x="761" y="344" class="sub">发起新查询，刷新结果表</text><path d="M343 296H380M695 296H732" class="wire"/><text x="36" y="422" class="head">第 1–4 次：改取消流程、按钮、面板状态或组合改动，均被拒绝</text><text x="36" y="465">第 5 次：组件端发出 null，但 !!update.value 丢掉它 → 拒绝</text><text x="36" y="507">第 6 次：保留第 5 次改动，允许 geometry 更新刷新 → 接受</text><rect x="36" y="550" width="1008" height="86" fill="#f4f7fa"/><text x="56" y="585">EPD 在原仓库、不带历史评测：10/10 通过作者验收；完整 GUI 测试未跑通。</text><text x="56" y="620" class="sub">教师目标 1 / 4 包含成功知识，2 / 3 重提被否定假设。新目标不全是独立验证的要求。</text></svg>
