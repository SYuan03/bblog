<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="t d"><title id="t">教师新决策与真实旧记录怎样交错打包</title><desc id="d">教师读整题经验，学生不读。新决策只作训练目标，旧动作连接它在真实环境中的旧返回；新决策不执行。</desc><defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#24292f;font-size:18px}.h{font-size:21px;font-weight:700}.small{font-size:16px;fill:#526171}.blue{fill:#245e99}.wire{fill:none;stroke:#245e99;stroke-width:2;marker-end:url(#arr)}</style><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#245e99"/></marker></defs><rect width="900" height="320" fill="#fff"/>
<text x="16" y="28" class="h">同一模型出发：教师看完整经验，学生学习新决策</text><path d="M16 43H884" stroke="#dce2e8"/>
<text x="16" y="70">教师：打包前文 + 整理后的整题经验 + 深入推理要求</text><text x="16" y="99">学生：打包前文；额外整题经验与推理要求不进入输入</text>
<rect x="16" y="137" width="103" height="68" fill="#f1f3f5"/><text x="50" y="161" class="h">o₀</text><text x="30" y="190" class="small">真实观察</text>
<rect x="143" y="137" width="153" height="68" fill="#eaf2fa" stroke="#245e99"/><text x="197" y="161" class="h blue">a′₀</text><text x="161" y="190" class="small">新教师决策</text>
<rect x="320" y="137" width="122" height="68" fill="#f1f3f5"/><text x="364" y="161" class="h">a₀</text><text x="341" y="190" class="small">真实旧决策</text>
<rect x="466" y="137" width="111" height="68" fill="#f1f3f5"/><text x="506" y="161" class="h">o₁</text><text x="489" y="190" class="small">真实返回</text>
<rect x="601" y="137" width="153" height="68" fill="#eaf2fa" stroke="#245e99"/><text x="655" y="161" class="h blue">a′₁</text><text x="619" y="190" class="small">新教师决策</text>
<text x="798" y="177" class="h">a₁，o₂…</text>
<path d="M123 172H137M300 172H314M446 172H460M581 172H595M758 172H789" class="wire"/>
<path d="M382 210V228H521V210" fill="none" stroke="#526171" stroke-width="1.5"/><text x="332" y="252" class="small">o₁ 由旧 a₀ 返回；新 a′₀ 没有执行</text>
<text x="16" y="281">仅蓝色 a′ 的分析与最终动作计算损失。后续前文包含更早 a′，属于近似打包。</text><text x="16" y="308" class="small">按 §3.3、Eq. 3–4 独立整理；不是一条新执行轨迹，提示标记在示意中省略。</text>
