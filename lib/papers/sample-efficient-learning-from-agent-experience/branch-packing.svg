<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc"><title id="title">Experience Distillation：教师新决策与真实旧记录的打包</title><desc id="desc">教师从真实前文生成新决策a撇，停止而不执行，随后附上旧动作a及其真实返回o。loss只监督新决策。后续前文包含早期教师决策，属于近似。</desc><defs><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#24292f;font-size:24px}.title{font-size:32px;font-weight:700}.sub{font-size:22px;fill:#536171}.bold{font-size:27px;font-weight:700}.wire{fill:none;stroke:#245e99;stroke-width:3;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#245e99"/></marker></defs><rect width="1080" height="650" fill="#fff"/><text x="36" y="50" class="title">新写的训练目标，没有对应的新环境返回</text><text x="36" y="90" class="sub">§3.2–3.3 / Eq. 2–4 · 图为机制重绘，不是新执行日志</text><rect x="36" y="128" width="460" height="139" fill="#f4f7fa" stroke="#dce2e8"/><text x="56" y="167" class="bold">教师：相同初始模型 + 额外经验</text><text x="56" y="209">读整理后的整题历史、当前前文</text><text x="56" y="247" class="sub">新写一次完整分析 + 工具动作，立即停止</text><rect x="554" y="128" width="490" height="139" fill="#fff" stroke="#dce2e8"/><text x="576" y="167" class="bold">学生：不读整题额外历史</text><text x="576" y="209">只模仿教师新写出的 token</text><text x="576" y="247" class="sub">旧动作、旧返回只是前文，不计算 loss</text><path d="M496 196H547" class="wire"/><text x="36" y="321" class="bold">单序列打包：每个分支后接回真实旧记录</text><rect x="36" y="353" width="130" height="92" fill="#f1f3f5"/><text x="69" y="388" class="bold">o₀</text><text x="50" y="427" class="sub">初始观察</text><rect x="199" y="353" width="168" height="92" fill="#eaf2fa" stroke="#245e99"/><text x="257" y="388" class="bold">a′₀</text><text x="220" y="427" class="sub">新教师决策</text><rect x="400" y="353" width="130" height="92" fill="#f1f3f5"/><text x="440" y="388" class="bold">a₀</text><text x="420" y="427" class="sub">旧动作</text><rect x="563" y="353" width="130" height="92" fill="#f1f3f5"/><text x="603" y="388" class="bold">o₁</text><text x="581" y="427" class="sub">旧返回</text><rect x="726" y="353" width="168" height="92" fill="#eaf2fa" stroke="#245e99"/><text x="783" y="388" class="bold">a′₁</text><text x="747" y="427" class="sub">新教师决策</text><text x="937" y="402" class="bold">a₁…</text><path d="M170 399H192M371 399H393M534 399H556M697 399H719M898 399H923" class="wire"/><path d="M465 447V479H628V447" fill="none" stroke="#536171" stroke-width="2"/><text x="413" y="514" class="sub">o₁ 来自旧 a₀，不来自 a′₀</text><rect x="36" y="548" width="1008" height="70" fill="#f4f7fa"/><text x="55" y="577">a′ 未执行、未独立验证。后续前文含以前的 a′，不是完全独立分支的严格实现。</text><text x="55" y="607" class="sub">打包提升处理密度；新增教师生成和训练仍要花计算成本。</text></svg>
