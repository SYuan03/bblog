<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">少用环境样本不等于总计算免费</title><desc id="d">环境预算用完整trial，强化学习最高成绩配完整运行成本。固定61.7M经验增加教师序列到16条，生成2.79倍约172Mtoken，增益保留64.8。</desc><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#24292f;font-size:18px}.h{font-size:20px;font-weight:700}.small{font-size:16px;fill:#526171}.v{fill:#245e99;font-weight:700}</style><rect width="900" height="300" fill="#fff"/>
<text x="16" y="28" class="h">两本账：完整环境执行，与新增教师生成</text><path d="M16 44H884" stroke="#dce2e8"/>
<text x="16" y="76">Figure 1</text><text x="166" y="76">软件：EPD 51.4%，PPO 17.7%</text><text x="580" y="76" class="v">9.6 倍更少完整 trials</text>
<text x="166" y="110">游戏：EPD 43.8，GRPO 最高 29.9</text><text x="580" y="110" class="v">57.2 倍更少完整 trials</text>
<text x="166" y="139" class="small">RL 配对最高已观察成绩与完整运行预算；不是达到同分的最低成本。</text><path d="M16 157H884" stroke="#dce2e8"/>
<text x="16" y="188">Figure 3</text><text x="166" y="188">固定经验 61.7M token，不再新增环境执行：</text>
<text x="166" y="222">每次 trial 生成 1 →16 条打包序列；生成量 0.17 →2.79 倍</text>
<text x="166" y="253">ICL 增益保留率 31.8% →64.8%；最大生成量约</text><text x="685" y="253" class="v">172M token</text>
<text x="16" y="286" class="small">按 Figure 1 / 3 数据独立整理；172M 是 61.7M×2.79 的本文验算，未给完整 GPU 成本。</text>
</svg>
