<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">雾水与远山</title>
  <desc id="desc">一幅青灰色的极简山水插画，远山、薄雾和水面之间有一轮朱红小日。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf2ec" />
      <stop offset="0.48" stop-color="#dce8e1" />
      <stop offset="1" stop-color="#c8d9d3" />
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfd5d0" stop-opacity="0.2" />
      <stop offset="1" stop-color="#729895" stop-opacity="0.64" />
    </linearGradient>
    <linearGradient id="mountainBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76938d" stop-opacity="0.4" />
      <stop offset="1" stop-color="#9cb2ac" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="mountainFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#335c5b" stop-opacity="0.78" />
      <stop offset="1" stop-color="#577b77" stop-opacity="0.34" />
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#d65347" stop-opacity="0.2" />
      <stop offset="1" stop-color="#d65347" stop-opacity="0" />
    </radialGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="11" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 0.055" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply" />
    </filter>
    <filter id="blur36"><feGaussianBlur stdDeviation="36" /></filter>
    <filter id="blur12"><feGaussianBlur stdDeviation="12" /></filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#paper)" />
  <g filter="url(#grain)">
    <circle cx="828" cy="350" r="176" fill="url(#sunGlow)" filter="url(#blur36)" />
    <circle cx="828" cy="350" r="43" fill="#c9564c" />

    <path d="M-40 650C120 570 217 531 329 568c87 29 118 82 207 51 94-33 142-163 244-157 101 6 132 128 229 133 82 4 139-62 231-49v274H-40Z" fill="url(#mountainBack)" />
    <path d="M-38 751c113-20 177-156 302-154 113 2 143 128 254 132 133 5 179-210 328-204 94 4 132 96 213 117 63 16 111-8 181-38v263H-38Z" fill="url(#mountainFront)" />

    <path d="M0 735c193 38 360 19 529-4 242-33 433-15 671 52v417H0Z" fill="url(#water)" />
    <path d="M0 781c197 23 356 14 526-8 243-31 452-9 674 48" fill="none" stroke="#eff5ef" stroke-opacity="0.66" stroke-width="16" filter="url(#blur12)" />
    <g fill="none" stroke="#f5f7f2" stroke-linecap="round" opacity="0.62">
      <path d="M131 868c145 18 294 12 437-9" stroke-width="8" />
      <path d="M515 925c187-17 350-10 505 16" stroke-width="6" />
      <path d="M202 1002c122 11 227 8 339-5" stroke-width="5" />
      <path d="M707 1054c108-8 218-1 309 14" stroke-width="4" />
    </g>

    <g fill="none" stroke="#274b49" stroke-linecap="round" opacity="0.77">
      <path d="M188 1032c17-102 13-196-4-286" stroke-width="7" />
      <path d="M185 825c-43-29-70-65-84-109" stroke-width="5" />
      <path d="M187 866c51-28 84-66 103-112" stroke-width="5" />
      <path d="M181 916c-39-16-70-39-96-73" stroke-width="4" />
      <path d="M190 957c39-13 72-36 98-68" stroke-width="4" />
    </g>
  </g>
</svg>
