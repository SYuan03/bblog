info:
  title: ChrisDing's bblog
  subtitle: 如果大海能够唤回曾经滴爱，我会
  author: SYuan03
  url: https://bblog.031105.xyz

defaults:
  favicon: /MyImgs/icon1.svg
  logo: /MyImgs/icon1.svg
  avatar: /MyImgs/avatar1.jpg

colors:
  primary: "#A31F34"
  default_mode: light

global:
  content_max_width: 1000px
  sidebar_width: 210px
  hover:
    shadow: true
    scale: false
  scroll_progress:
    bar: false
    percentage: true
  website_counter:
    url: https://cn.vercount.one/js
    enable: true
    site_pv: true
    site_uv: true
    post_pv: true
  single_page: true
  preloader:
    enable: false
  side_tools:
    gear_rotation: true
    auto_expand: false
  open_graph:
    enable: true
    image: /MyImgs/home-bg-light.webp
    description: 如果大海能够唤回曾经滴爱，我会
  google_analytics:
    enable: false

fontawesome:
  thin: false
  light: false
  duotone: false
  sharp_solid: true

home_banner:
  enable: true
  style: fixed
  image:
    light: /MyImgs/wallhaven-5gx3e1.webp
    dark: /MyImgs/home-bg-dark.webp
  title: Welcome to my bblog !
  subtitle:
    text:
      - 画凌烟，上甘泉，自古功名属少年!
    hitokoto:
      enable: false
      show_author: false
      api: https://v1.hitokoto.cn
    typing_speed: 100
    backing_speed: 80
    starting_delay: 500
    backing_delay: 1500
    loop: true
    smart_backspace: true
  text_color:
    light: "#fff"
    dark: "#d1d1b6"
  text_style:
    title_size: 3.8rem
    subtitle_size: 2.1rem
    line_height: 1.5
  social_links:
    enable: true
    style: default
    links:
      - icon: github
        url: https://github.com/SYuan03
      - icon: email
        url: tu3344606@gmail.com
      - icon: twitter
        url:
      - icon: telegram
        url:
      - icon: /images/custom-icon.svg
        url:
    qrs: []

navbar:
  auto_hide: false
  color:
    left: "#f78736"
    right: "#367df7"
    transparency: 35
  width:
    home: 1200px
    pages: 1000px
  links:
    Home:
      path: /
      icon: fa-regular fa-house
    Archives:
      path: /archives
      icon: fa-regular fa-archive
    Categories:
      path: /categories
      icon: fa-regular fa-folder
    About:
      icon: fa-regular fa-user
      submenus:
        我: /about
        GitHub: https://github.com/SYuan03
    Shuoshuo:
      path: /shuoshuo
      icon: fa-regular fa-bullhorn
  search:
    enable: true
    preload: false

home:
  sidebar:
    enable: true
    position: left
    first_item: menu
    show_on_mobile: true
  article_date_format: auto
  excerpt_length: 220
  categories:
    enable: true
    limit: 5
  tags:
    enable: true
    limit: 5

articles:
  style:
    font_size: 16px
    line_height: 1.7
    image_border_radius: 14px
    image_alignment: center
    image_caption: false
    link_icon: true
    delete_mask: false
    title_alignment: left
    headings_top_spacing:
      h1: 3.2rem
      h2: 2.6rem
      h3: 2.1rem
      h4: 1.8rem
      h5: 1.5rem
      h6: 1.3rem
  word_count:
    enable: true
    count: true
    min2read: true
  author_label:
    enable: true
    auto: false
    list: []
  code_block:
    copy: true
    style: mac
    highlight_theme:
      light: github
      dark: github-dark
  toc:
    enable: true
    max_depth: 4
    number: true
    expand: true
    init_open: true
  copyright:
    enable: true
    default: cc_by_nc_sa
  lazyload: true
  pangu_js: true
  recommendation:
    enable: false

comment:
  enable: false

footer:
  runtime: true
  start: 2023/04/14 20:57:49
  statistics: true
  icon: '<i class="fa-solid fa-heart fa-beat" style="--fa-animation-duration: 0.5s; color: #f54545"></i>'

inject:
  enable: true
  head:
    - '<link rel="stylesheet" href="/styles/legacy-content.css">'
  footer: []

plugins:
  feed:
    enable: true
  aplayer:
    enable: false
  mermaid:
    enable: false
    version: 11.4.1
    theme:
      light: default
      dark: dark

page_templates:
  friends_column: 2
  tags_style: blur
  masonry:
    batch_size: 12
    initial_batch_size: 24

cdn:
  enable: false
  provider: npmmirror

developer:
  enable: false

# Keep the historical /shuoshuo page backed by Artitalk. An empty essays list
# prevents Redefine's built-in shuoshuo template from assuming local entries.
essays: []
